<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeGraph Explorer</title>
  <style>
    :root{color-scheme:dark;--bg:#091018;--panel:#111c28;--line:#294056;--text:#e8f0f7;--muted:#91a6b8;--accent:#4fd1c5;--warn:#ffca66;--selected:#ff7a90}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.muted{color:var(--muted)}main{display:grid;grid-template-columns:320px 1fr 360px;height:calc(100vh - 65px)}aside,.details{padding:16px;overflow:auto;background:var(--panel)}aside{border-right:1px solid var(--line)}.details{border-left:1px solid var(--line)}label{display:block;margin:12px 0 5px;color:var(--muted)}input,select,button{width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;background:#0b1520;color:var(--text)}button{cursor:pointer;background:#183047;margin-top:8px}button:hover{border-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.results button{text-align:left;background:transparent}.filters{max-height:205px;overflow:auto;border:1px solid var(--line);padding:6px}.filters label{margin:4px;display:flex;gap:7px;align-items:center;font-size:12px}.filters input{width:auto}.canvas{position:relative;overflow:hidden}.notice,.warning{position:absolute;z-index:2;left:12px;right:12px;padding:9px;border-radius:5px}.notice{top:12px;background:#10293a}.warning{top:54px;background:#4a3617;color:var(--warn)}svg{width:100%;height:100%}.node{cursor:pointer}.node circle{stroke:#8aabc4;stroke-width:2}.node.selected circle{stroke:var(--selected);stroke-width:5}.node text{fill:var(--text);font-size:11px;pointer-events:none}.edge{cursor:pointer;stroke:#68849a;stroke-width:2}.edge.selected{stroke:var(--selected);stroke-width:5}.edge-label{fill:#a9bdcc;font-size:9px;cursor:pointer}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:12px;margin:2px;font-size:11px}pre{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;background:#09131d;padding:10px;border-radius:5px}h2{font-size:15px;margin-top:18px}.status{font-size:12px}.empty{padding:35% 20px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header><h1>CodeGraph Explorer</h1><span id="meta" class="muted">Loading accepted indexes…</span></header>
<main>
  <aside>
    <label for="query">Canonical ID, exact name, or name/title substring</label>
    <input id="query" placeholder="Search accepted nodes">
    <label for="nodeType">Object type</label><select id="nodeType"><option value="">All approved types</option></select>
    <button id="search">Search</button><div id="results" class="results"></div>
    <h2>Traversal controls</h2>
    <div class="row"><div><label for="direction">Direction</label><select id="direction"><option>both</option><option>incoming</option><option>outgoing</option></select></div><div><label for="depth">Depth</label><select id="depth"><option>1</option><option>2</option><option>3</option></select></div></div>
    <label>Relationship filters (none = all)</label><div id="filters" class="filters"></div>
    <button id="apply">Reset to selected node</button>
    <div class="row"><button id="expand">Expand selected node</button><button id="clear">Clear current view</button></div>
    <p id="active" class="status muted"></p>
  </aside>
  <section class="canvas"><div class="notice">Structural reachability, not runtime consumption.</div><div id="warning" class="warning" hidden></div><svg id="graph" role="img" aria-label="Targeted directed CodeGraph neighborhood"></svg><div id="empty" class="empty">Search for and select a node to begin.</div></section>
  <section class="details"><h2>Selection details</h2><pre id="details">No node or edge selected.</pre><h2>Legend</h2><div id="legend"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), colors={api_artifact:'#2979a8',product:'#8b5cf6',plan:'#d97706',consumer_org:'#16a085',application:'#2563eb',credential:'#7c8794',subscription:'#db2777',catalog_config:'#64748b',catalog_property:'#65a30d'};
let meta,current={nodes:[],edges:[]},rootId=null,selectedNode=null,selectedEdge=null;
const api=async path=>{const response=await fetch(path);const value=await response.json();if(!response.ok)throw Error(value.error||response.statusText);return value};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function params(id,depthOverride){const p=new URLSearchParams({id,direction:$('direction').value,depth:String(depthOverride||$('depth').value)});document.querySelectorAll('#filters input:checked').forEach(x=>p.append('relationship',x.value));return p}
async function search(){const p=new URLSearchParams({q:$('query').value});if($('nodeType').value)p.set('type',$('nodeType').value);const data=await api('/api/search?'+p);$('results').innerHTML=data.results.map(n=>`<button data-id="${esc(n.canonical_object_id)}"><b>${esc(n.label)}</b><br><span class="muted">${esc(n.object_type)} · ${esc(n.canonical_object_id)}</span></button>`).join('')||'<p class="muted">No matches.</p>';document.querySelectorAll('#results button').forEach(b=>b.onclick=()=>selectRoot(b.dataset.id));}
async function selectRoot(id){rootId=id;selectedNode=id;selectedEdge=null;await load(id);await showNode(id)}
async function load(id){const data=await api('/api/neighborhood?'+params(id));current={nodes:data.nodes,edges:data.edges};$('warning').hidden=!data.visualization_limit_message;$('warning').textContent=data.visualization_limit_message||'';$('active').textContent=`Selected ${id} · ${data.direction} · depth ${data.depth} · ${data.returned_node_count} nodes / ${data.returned_edge_count} edges`;render()}
async function expand(){if(!selectedNode)return;const data=await api('/api/neighborhood?'+params(selectedNode,1));const nodes=new Map(current.nodes.map(n=>[n.canonical_object_id,n]));data.nodes.forEach(n=>nodes.set(n.canonical_object_id,n));const edges=new Map(current.edges.map(e=>[e.relationship_id,e]));data.edges.forEach(e=>edges.set(e.relationship_id,e));if(nodes.size>meta.visualization_node_limit||edges.size>meta.visualization_edge_limit){$('warning').hidden=false;$('warning').textContent=`Visualization limit reached (${meta.visualization_node_limit} nodes / ${meta.visualization_edge_limit} edges). Reset and reduce scope.`;return}current={nodes:[...nodes.values()].sort((a,b)=>a.canonical_object_id.localeCompare(b.canonical_object_id)),edges:[...edges.values()].sort((a,b)=>a.relationship_id.localeCompare(b.relationship_id))};render()}
function clearView(){current={nodes:[],edges:[]};rootId=selectedNode=selectedEdge=null;$('warning').hidden=true;$('active').textContent='';$('details').textContent='No node or edge selected.';render()}
async function showNode(id){selectedNode=id;selectedEdge=null;$('details').textContent=JSON.stringify(await api('/api/node?id='+encodeURIComponent(id)),null,2);render()}
async function showEdge(id){selectedEdge=id;$('details').textContent=JSON.stringify(await api('/api/edge?id='+encodeURIComponent(id)),null,2);render()}
function render(){const svg=$('graph'),empty=$('empty');svg.innerHTML='<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#68849a"/></marker></defs>';empty.hidden=current.nodes.length>0;if(!current.nodes.length)return;const w=svg.clientWidth||800,h=svg.clientHeight||600,cx=w/2,cy=h/2,r=Math.min(w,h)*.36,sorted=[...current.nodes].sort((a,b)=>a.canonical_object_id.localeCompare(b.canonical_object_id)),pos=new Map();sorted.forEach((n,i)=>{if(n.canonical_object_id===rootId)pos.set(n.canonical_object_id,[cx,cy]);else{const others=sorted.filter(x=>x.canonical_object_id!==rootId),j=others.findIndex(x=>x.canonical_object_id===n.canonical_object_id),a=2*Math.PI*j/Math.max(1,others.length)-Math.PI/2;pos.set(n.canonical_object_id,[cx+r*Math.cos(a),cy+r*Math.sin(a)])}});current.edges.forEach(e=>{const a=pos.get(e.source_canonical_id),b=pos.get(e.target_canonical_id);if(!a||!b)return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a[0]);line.setAttribute('y1',a[1]);line.setAttribute('x2',b[0]);line.setAttribute('y2',b[1]);line.setAttribute('marker-end','url(#arrow)');line.setAttribute('class','edge'+(selectedEdge===e.relationship_id?' selected':''));line.onclick=()=>showEdge(e.relationship_id);svg.appendChild(line);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(a[0]+b[0])/2);t.setAttribute('y',(a[1]+b[1])/2);t.setAttribute('class','edge-label');t.textContent=e.relationship_type;t.onclick=()=>showEdge(e.relationship_id);svg.appendChild(t)});sorted.forEach(n=>{const [x,y]=pos.get(n.canonical_object_id),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','node'+(selectedNode===n.canonical_object_id?' selected':''));g.setAttribute('transform',`translate(${x},${y})`);g.onclick=()=>showNode(n.canonical_object_id);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','24');c.setAttribute('fill',colors[n.object_type]||'#64748b');g.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('text-anchor','middle');t.setAttribute('y','39');t.textContent=(n.label||n.canonical_object_id).slice(0,24);g.appendChild(t);svg.appendChild(g)})}
async function init(){meta=await api('/api/meta');$('meta').textContent=`${meta.graph_node_count.toLocaleString()} nodes · ${meta.graph_edge_count.toLocaleString()} edges · cap ${meta.visualization_node_limit}/${meta.visualization_edge_limit}`;$('nodeType').innerHTML+=[...meta.approved_node_types].map(x=>`<option>${x}</option>`).join('');$('filters').innerHTML=meta.approved_relationship_types.map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('');$('legend').innerHTML=Object.entries(colors).map(([k,v])=>`<span class="pill" style="border-color:${v}">${k}</span>`).join('')}
$('search').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};$('apply').onclick=()=>rootId&&load(rootId);$('expand').onclick=expand;$('clear').onclick=clearView;window.onresize=render;init().catch(e=>$('details').textContent=e.message);
</script>
</body>
</html>
