swagger: "2.0"
info:
  title: CTFAL-SubmitTerminationRequest
  x-ibm-name: ctfal-submitterminationrequest
  version: 1.0.3
  description: This API submits employee termintaion request to Qiwa DB from Qiwa
    platform
host: $(catalog.host)
schemes:
- https
basePath: /qiwa/v2
produces:
- application/json
consumes:
- application/json
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  properties:
    target-url:
      value: http://ctfl-absentservices-http-ace.apps.stg.qiwa-nonprod.local/employee/termination/submit
      description: The URL of the target service
      encoded: false
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
          : \"EXSTR001\",\r\n    \"channelId\" : \"Qiwa\",\r\n\t\"SessionId\" : \"1\",\r\n
          \   \"requestName\" : \"SubmitTerminationRequestRq\",\r\n    \"responseName\":
          \"SubmitTerminationRequestRs\",\r\n    \"debugFlag\" : \"1\",\r\n     \"errorMap\"
          :{\r\n                              \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"},\r\n                              \"E0000024\"  : {\"code\" :409,
          \"msg\":\"Nodata\"},\r\n                              \"E0000098\"  : {\"code\"
          :409, \"msg\":\"No Laborer information found\"},\r\n                              \"E0000946\"
          \ : {\"code\" :409, \"msg\":\"Sorry , Employee is already terminated, no
          further action is allowed\"},\r\n                              \"E0001300\"
          \ : {\"code\" :409, \"msg\":\"IDNumber / BorderNo is mandatory\"},\r\n                              \"E0001265\"
          \ : {\"code\" :409, \"msg\":\"Request can’t be processed as establishment
          is not a valid Isteqdam Company\"},\r\n                              \"E0000693\"
          \ : {\"code\" :409, \"msg\":\"The laborer does not belong to this Establishment\"},\r\n
          \                             \"E0001203\"  : {\"code\" :409, \"msg\":\"userid
          optional for unified portal\"},\r\n                              \"E0000999\"
          \ : {\"code\" :409, \"msg\":\"Sorry, you cant submit Absence request  as
          the employee have pending employee transfer request waiting for the notice
          period, and you can reduce the notice period to be 1 day.\"},\r\n\"NIC00253\":
          {\r\n    \"code\": 409,\r\n    \"msg\": \"Runtime_Exception\"\r\n},\r\n\"E0001801\":
          {\r\n    \"code\": 409,\r\n    \"msg\": \"Employee no longer belongs to
          the establishment\"\r\n},\r\n\"E0000004\": {\r\n    \"code\": 400,\r\n    \"msg\":
          \"Missing\"\r\n},\r\n\"E0000042\": {\r\n    \"code\": 409,\r\n    \"msg\":
          \"InvalidData\"\r\n},\r\n\"E0000028\": {\r\n    \"code\": 409,\r\n    \"msg\":
          \"InvalidEstablishment\"\r\n},\r\n\"E0000684\": {\r\n    \"code\": 409,\r\n
          \   \"msg\": \"NoEstablishmentInfo\"\r\n},\r\n\"E0000034\": {\r\n    \"code\":
          409,\r\n    \"msg\": \"DBError\"\r\n},\r\n\"E0001570\": {\r\n    \"code\":
          409,\r\n    \"msg\": \"Absence Request can’t be submitted for the same user.\"\r\n}\r\n\r\n
          \                             }\r\n    };\r\n\r\n\r\n\r\napim.setvariable('cfg',cfg);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "\nvar apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\nvar channel
          = 0;\nif (apim.getvariable('message.headers.X-Channel-Id')!= null && apim.getvariable('message.headers.X-Channel-Id')!=0){\n
          \   channel= apim.getvariable('message.headers.X-Channel-Id');\n}\nelse{\n
          \   channel= cfg.channelId;\n}\n\n\nvar appcReq = {\n    [cfg.requestName]:{\n
          \       \"Header\" : {\n            \"TransactionId\" : millisecondsvalue,\n
          \           \"ChannelId\": channel,\n            \"SessionId\": cfg.SessionId,
          //apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n\t\t\t\"MWRequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode\n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\" :
          OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-ctfl-absentservices)/employee/termination/submit
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;



          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: ((($header("Response-Status") = 'SUCCESS')))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg'); \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
        - condition: ((($header("Response-Status") = 'Error' or ($header("Response-Status")
            = 'ERROR'))))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');     \n\nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\n\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');     \n\nvar error = {\n  \"errorCode\":
                message['Error'].Code,\n  \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n
                \   \"ar-SA\": 'System Error'\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.errorCode]){\n       httperror = cfg.errorMap[error.errorCode].code;\n
                \      \n       //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 500;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nif
                (error.errorCode == 'E0000024'){\n    \n    var resp = {\n        \"errorCode\":
                error.errorCode,\n        \"errorMessage\": error.errorMessage,\n
                \       \"Body\": message[cfg.responseName].Body\n    };\n    session.output.write(resp);\n}\nelse{\n
                \   session.output.write(error);    \n}\napim.output('application/json');"
    catch:
    - errors: []
      execute:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions: []
    finally: []
  type: rest
  phase: realized
  enforced: true
  testable: true
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  application-authentication:
    certificate: false
  buffering: true
  catalogs: {}
definitions:
  submitTerminationRequestRq:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      idNumber:
        type: string
      laborOfficeId:
        type: integer
      sequenceNumber:
        type: integer
      employeeDetails:
        type: object
        properties:
          employeeList:
            type: array
            items:
              $ref: '#/definitions/Employee'
  Employee:
    type: object
    properties:
      employeeFirstName:
        type: string
      employeeSecondName:
        type: string
      employeeThirdName:
        type: string
      employeeLastName:
        type: string
      idNumber:
        type: integer
      nationality:
        type: string
      jobName:
        type: string
      gender:
        type: string
      wpExpirationDate:
        type: string
      borderNo:
        type: string
      terminationReasonId:
        type: integer
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      headers:
        $ref: '#/definitions/Headers'
      requestId:
        type: integer
        example: 123456
      ResponseStatus:
        type: string
        example: Employee termination request submitted successfully
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      HH:MM:SS.sssfor gregorian dates only
    example: "2021-12-31 22:00:00.000"
paths:
  /CTFAL/employee/termination/submit:
    post:
      tags:
      - submit termination  request
      description: service submits termination request for employee
      operationId: SubmitTerminationRequest
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
      parameters:
      - name: X-IBM-Client-Id
        in: header
        description: Client id issued by security server
        required: true
        type: string
      - name: X-IBM-Client-Secret
        in: header
        description: Client secret issued by security server
        required: true
        type: string
      - name: X-Request-Id
        in: header
        description: X-Request-Id returned in the response header
        required: false
        type: string
      - name: X-Channel-Id
        in: header
        required: false
        description: channelId
        type: string
      - name: requestBody
        in: body
        required: true
        schema:
          $ref: '#/definitions/submitTerminationRequestRq'
      consumes:
      - application/json
      produces:
      - application/json
