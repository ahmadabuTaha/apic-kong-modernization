swagger: "2.0"
info:
  title: NIC_GetForeignerInformation
  description: This API exposes nic to get foreigner information services from Qiwa
    platform
  x-ibm-name: nic-getforeignerinformation
  version: 3.0.0
schemes:
- https
basePath: /nic/v3
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /foreigner/{foreignerId}/info:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/foreignerId'
    get:
      tags:
      - Foreigner Information
      description: Service to Get Foreigner Information
      operationId: getForeignerInformation
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      birthDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      gender:
        type: string
        example: MALE
      maritalStatus:
        $ref: '#/definitions/CodeModel'
      name:
        $ref: '#/definitions/NameModel'
      laborOfficeId:
        $ref: '#/definitions/IntegerNumberModel'
      sequenceNumber:
        $ref: '#/definitions/IntegerNumberModel'
      nationality:
        $ref: '#/definitions/CodeModel'
      hrsdNationality:
        $ref: '#/definitions/NameCodeModel'
      occupation:
        $ref: '#/definitions/CodeModel'
      hrsdOccupation:
        $ref: '#/definitions/NameCodeModel'
      relationship:
        $ref: '#/definitions/CodeModel'
      religion:
        $ref: '#/definitions/CodeModel'
      hrsdReligion:
        $ref: '#/definitions/NameCodeModel'
      residency:
        $ref: '#/definitions/ResidencyModel'
      sponsor:
        $ref: '#/definitions/SponsorModel'
      status:
        $ref: '#/definitions/StatusModel'
      travel:
        $ref: '#/definitions/TravelModel'
      visa:
        $ref: '#/definitions/VisaModel'
  TravelModel:
    type: object
    properties:
      entryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      lastEntryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      lastExitDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      passportExpiryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      passportNumber:
        type: string
        example: P640048
      travelStatus:
        type: string
        example: Inside Kingdom
  VisaModel:
    type: object
    properties:
      isFinalExitVisaIssued:
        type: boolean
        example: false
      visaExpiryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      visaType:
        type: string
        example: SINGLE
  CodeModel:
    type: object
    properties:
      code:
        type: integer
        example: 1
      name:
        type: string
        example: Ashok
  NameCodeModel:
    type: object
    properties:
      code:
        type: integer
        example: 1
      name:
        $ref: '#/definitions/LocaleDataModel'
  StatusModel:
    type: object
    properties:
      fingerPrintStatus:
        type: boolean
        example: true
      personStatus:
        $ref: '#/definitions/CodeModel'
  NameModel:
    type: object
    properties:
      firstName:
        $ref: '#/definitions/LocaleDataModel'
      secondName:
        $ref: '#/definitions/LocaleDataModel'
      thirdName:
        $ref: '#/definitions/LocaleDataModel'
      lastName:
        $ref: '#/definitions/LocaleDataModel'
      fullName:
        $ref: '#/definitions/LocaleDataModel'
  ResidencyModel:
    type: object
    properties:
      idNo:
        type: string
        example: "2314567890"
      idType:
        type: string
        example: Head of Household
      expiryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      issueDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      issuePlace:
        type: string
        example: Company Science Information
  SponsorModel:
    type: object
    properties:
      idNo:
        type: string
        example: "1234567890"
      name:
        type: string
        example: ashok
      occupation:
        type: string
        example: تصميم وبرمجة البرمجيات الخاصة
      status:
        type: string
        example: مفعل
      type:
        $ref: '#/definitions/CodeModel'
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25T00:00:00.000Z"
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri and gregorian
    properties:
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: string
    properties:
      en-US:
        type: string
      ar-SA:
        type: string
parameters:
  foreignerId:
    in: path
    name: foreignerId
    description: foreigner dentification number  or border number
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
