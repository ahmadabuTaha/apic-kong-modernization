swagger: "2.0"
info:
  title: MOMRA_GetShopLicenseDetails
  description: This API exposes MOMRA to get shop license details from Qiwa platform
  x-ibm-name: momra-getshoplicensedetails
  version: 1.0.0
schemes:
- https
basePath: /momra/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /shoplicense/details:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/unifiedNumber'
    - $ref: '#/parameters/lookupType'
    - $ref: '#/parameters/lookupId'
    get:
      tags:
      - Shoplicense Detail
      description: Service to Get shop license details
      operationId: getshoplicensedetails
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      ownerInfo:
        $ref: '#/definitions/OwnerInfoModel'
      licenseInfoList:
        type: array
        items:
          $ref: '#/definitions/LicenseInfoListModel'
  OwnerInfoModel:
    type: object
    properties:
      ownerName:
        $ref: '#/definitions/LocaleDataModel'
        type: string
        example: "1909185441"
  LicenseInfoListModel:
    type: object
    properties:
      licenseInfo:
        $ref: '#/definitions/LocaleDataModel'
      unifiedLicenseNumber:
        type: string
        example: "3909185441"
      amanah:
        $ref: '#/definitions/NameCodeModel'
      baladiaName:
        $ref: '#/definitions/LocaleDataModel'
        example: نطاق خدمة أمانة عسير
      issueDate:
        $ref: '#/definitions/HijriDateModel'
      expiryDate:
        $ref: '#/definitions/HijriDateModel'
      licenseStatus:
        type: string
        example: سارية
      activitiesList:
        type: array
        items:
          $ref: '#/definitions/ActivitiesListModel'
      commercialName:
        $ref: '#/definitions/LocaleDataModel'
      shopArea:
        type: string
        example: "0"
      doorsCount:
        $ref: '#/definitions/IntegerNumberModel'
      shopAddress:
        $ref: '#/definitions/LocaleDataModel'
      locationCoordinates:
        $ref: '#/definitions/LocationCoordinatesModel'
  ActivitiesListModel:
    type: object
    properties:
      activityIsicCode:
        type: string
        example: "452041"
      activityIsicDesc:
        type: string
        example: تبديل الزيوت
      activityAmanahDesc:
        type: string
        example: بنشر وغيار زيت
      activityArea:
        type: string
        example: "0"
      boardsList:
        type: array
        items:
          $ref: '#/definitions/BoardsListModel'
  BoardsListModel:
    type: object
    properties:
      boardType:
        type: string
        example: إرشادية
      boardArea:
        type: string
        example: "6"
  LocationCoordinatesModel:
    type: object
    properties:
      longitude:
        type: string
        example: "211"
      latitude:
        type: string
        example: "234"
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
parameters:
  unifiedNumber:
    in: query
    name: unifiedNumber
    description: Personal Identifier
    required: false
    type: integer
  lookupType:
    in: query
    name: lookupType
    description: Lookup type
    required: true
    type: string
    enum:
    - CR_NUM
    - CHARITY_ID
    - GOV_ENTITY_ID
    - GULF_ID
    - NATIONAL_ID
    - SEVEN_HUNDRED_NUM
  lookupId:
    in: query
    name: lookupId
    description: Lookup id
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
