swagger: "2.0"
info:
  title: Qiwa_UI_GetUnifiedInvoicesList
  x-ibm-name: qiwa-ui-getunifiedinvoiceslist
  version: 1.0.0
  description: This service is used to get the list of Unified Invoices related to
    a certain unified number.
