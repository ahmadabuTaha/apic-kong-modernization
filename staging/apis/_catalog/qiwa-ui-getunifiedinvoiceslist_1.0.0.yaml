basePath: /qiwa/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: convertParmToInt
        source: "var apim = require('apim');\r\nvar reqPar = apim.getvariable('request.parameters');\r\nvar
          UnifiedNumber = parseInt(reqPar.unifiedNumber);\r\nvar InvoiceId = reqPar.invoiceId;\r\nvar
          InvoiceTypeId = parseInt(reqPar.invoiceTypeId);\r\nvar SupplyDateFrom =
          reqPar.supplyDateFrom;\r\nvar SupplyDateTo = reqPar.supplyDateTo;\r\nvar
          PageIndex = parseInt(reqPar.pageIndex);\r\nvar PageSize = parseInt(reqPar.pageSize);\r\n\r\nvar
          Body = {\r\n            \"UnifiedNumber\": UnifiedNumber,\r\n            \"InvoiceId\":
          InvoiceId,\r\n            \"InvoiceTypeId\": InvoiceTypeId,\r\n            \"SupplyDateFrom\":
          SupplyDateFrom,\r\n            \"SupplyDateTo\": SupplyDateTo,\r\n            \"PageIndex\":
          PageIndex,\r\n            \"PageSize\": PageSize\r\n        }\r\n        \r\nsession.output.write(Body);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"GUIL0001\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"GetUnifiedInvoicesListRq\",\n
          \   \"responseName\": \"GetUnifiedInvoicesListRs\",\n    \"errorMap\" :{\n
          \       \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n
          \   \n};\n\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: |-
          var apim = require('apim');
          var millisecondsvalue = ""+(new Date()).getTime();
          var dt = new Date();
          var cfg = apim.getvariable('cfg');
          var OperatorId=apim.getvariable('message.headers.Operator-Id');
          var appcReq = {
          [cfg.requestName]:{
          "Header" : {
          "TransactionId" : millisecondsvalue,
          "ChannelId": cfg.channelId,
          "SessionId": apim.getvariable('message.headers.X-Request-Id'),
          "RequestTime" : formatDate(dt),
          "ServiceCode": cfg.serviceCode



          },
          "Body" : apim.getvariable('message.body')


          }
          };



          if (typeof OperatorId !== 'undefined')
          appcReq[cfg.requestName].Header.UserInfo = {
          "IDNumber" : OperatorId
          };
          session.output.write(appcReq);
          apim.output('application/json');




          function formatDate(d)
          {
          //get the month
          var month = d.getMonth();
          //get the day
          //convert day to string
          var day = d.getDate().toString();
          //get the year
          var year = d.getFullYear();
          var hour = d.getHours().toString();
          var minitue = d.getMinutes().toString();
          var second = d.getSeconds().toString();
          var millisecond = d.getMilliseconds().toString();
          //pull the last two digits of the year
          year = year.toString();

          //increment month by 1 since it is 0 indexed
          //converts month to a string
          month = (month + 1).toString();



          //if month is 1-9 pad right with a 0 for two digits
          if (month.length === 1)
          month = "0" + month;



          //if day is between 1-9 pad right with a 0 for two digits
          if (day.length === 1)
          day = "0" + day;



          if (hour.length === 1)
          hour = "0" + hour;



          if (minitue.length === 1)
          minitue = "0" + minitue;



          if (second.length === 1)
          second = "0" + second;

          if (millisecond.length == 1)
          millisecond = "00" + millisecond;

          if (millisecond.length == 2)
          millisecond = "0" + millisecond;




          //return the string "MMddyy"
          return year+"-"+month+"-"+day+" "+hour + ":" + minitue + ":" + second+"."+millisecond;
          }
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-uim-unifiedinvoices)/invoicesmanagement/getunifiedinvoiceslist
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
