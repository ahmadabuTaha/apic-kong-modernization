      templateContentName:
        type: string
        example: Qiwa Invoice
      messageSubject:
        type: string
        example: Invoice
      messageFromEmail:
        type: string
        example: noreply@qiwa.info
      messageFromName:
        type: string
        example: قوى
      messageToEmail:
        type: string
        example: maram@qiwa.info
      ownerIdNo:
        type: string
        example: "987654321"
      messageCC:
        type: string
        example: maram@qiwa.info
      messageBcc:
        type: string
        example: maram@qiwa.info
      merge:
        type: boolean
        example: true
      merge_language:
        type: string
        example: handlebars
      totalRecordsCount:
        type: integer
        example: 1
    required:
    - invoiceID
    - invoiceTypeID
    - total
    - supplyDate
    - unifiedNumber
    - paymentBrand
    - paymentStatusID
    - templateKey
    - templateName
    - templateContent
    - templateContentName
    - messageSubject
    - messageFromEmail
