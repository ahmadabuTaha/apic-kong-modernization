swagger: "2.0"
info:
  title: wpscertificatehistory
  x-ibm-name: wpscertificatehistory
  version: 1.0.0
  description: service retrieves WPS Compliance certificates based on LaborOfficeId
    and SequenceNumber along with additional filters like RequestorId, CertificateId
    and Status.
schemes:
- https
basePath: /gosi/v2
produces:
- application/json
consumes:
- application/json
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    flow: application
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
    x-ibm-oauth-provider: takamol-native-oauth-porvider
  clientIdHeader:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\nvar cfg={\n    \"serviceCode\" : \"WPSCH001\",\n
          \   \"channelId\" : \"Qiwa\",\n    \"requestName\" : \"WPSCertificateHistoryRq\",\n
          \   \"responseName\": \"WPSCertificateHistoryRs\",\n    \"errorMap\" :{\n
          \       \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"},\n
          \       \"GOSI0147\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI0149\"
          : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000047\" : {\"code\"
          :409, \"msg\":\"Conflict\"},\n        \"GOSI9992\" : {\"code\" :500, \"msg\":\"Internal
          Server Error\"},\n        \"GOSI9999\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
          \       \"E0000024\" : {\"code\" :409, \"msg\":\"Conflict\"}\n    }\n    \n};\n\n\n\napim.setvariable('cfg',cfg);\napim.output('application/json');\n\n\n\n"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\n\nvar channel
          = 0;\nif (apim.getvariable('message.headers.X-Channel-Id')!= null && apim.getvariable('message.headers.X-Channel-Id')!=0){\n
          \   channel= apim.getvariable('message.headers.X-Channel-Id');\n}\nelse{\n
          \   channel= cfg.channelId;\n}\n\nvar appcReq = {\n    [cfg.requestName]:{\n
          \       \"Header\" : {\n            \"TransactionId\" : millisecondsvalue,\n
          \           \"ChannelId\": channel,\n            \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\n
          \           \"RequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode\n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\" :
          OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: POST
        target-url: $(ace-wps-wagesprotectionsystem)/qiwawps/WPSCertificateHistory
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        stop-on-error:
        - ConnectionError
        - OperationError
        - SOAPError
    - gatewayscript:
        version: 2.0.0
        title: Build_Headers
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;



          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Success
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
        - condition: (($header("Response-Status") = 'Error' or $header("Response-Status")
            = 'ERROR'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg');\n\nvar cfg={\n    \"serviceCode\" :
                \"WPSCH001\",\n    \"channelId\" : \"Integration\",\n    \"requestName\"
                : \"WPSCertificateHistoryRq\",\n    \"responseName\": \"WPSCertificateHistoryRs\",\n
                \   \"errorMap\" :{\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"},\n        \"GOSI0147\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
                \       \"GOSI0149\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000047\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI9992\" : {\"code\"
                :500, \"msg\":\"Internal Server Error\"},\n        \"GOSI9999\" :
                {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000024\" : {\"code\"
                :409, \"msg\":\"Conflict\"}\n    }\n    \n};\n\n\nvar error = {\n
                \ \"errorCode\": message[cfg.responseName].Header.ResponseStatus.Code,\n
                \ \"errorMessage\": {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Else
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg');  \nvar cfg={\n    \"serviceCode\" :
                \"WPSCH001\",\n    \"channelId\" : \"Integration\",\n    \"requestName\"
                : \"createComplianceCertificateRq\",\n    \"responseName\": \"createComplianceCertificateRs\",\n
                \   \"errorMap\" :{\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"},\n        \"GOSI0147\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
                \       \"GOSI0149\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000047\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI9992\" : {\"code\"
                :500, \"msg\":\"Internal Server Error\"},\n        \"GOSI9999\" :
                {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000024\" : {\"code\"
                :409, \"msg\":\"Conflict\"}\n    }\n    \n};\n\nvar error = {\n  \"errorCode\":
                message['Error'].Code,\n  \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n
                \   \"ar-SA\": 'حدث خطأ بالنظام'\n  }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.errorCode]){\n       httperror = cfg.errorMap[error.errorCode].code;\n
                \      \n       //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 500;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
  properties:
    target-url:
      value: http://wps-wagesprotectionsystem-http-ace.apps.stg.qiwa-nonprod.local/qiwawps/WPSCertificateHistory
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  buffering: true
  application-authentication:
    certificate: false
parameters:
  X-IBM-Client-Id:
    name: X-IBM-Client-Id
    in: header
    type: string
    description: Client id issued by security server
    required: true
  X-IBM-Client-Secret:
    name: X-IBM-Client-Secret
    in: header
    type: string
    description: Client secret issued by security server
    required: true
  X-Request-Id:
    name: X-Request-Id
    in: header
    type: string
    description: X-Request-Id returned in the response header
  requestBody:
    name: requestBody
    in: body
    required: true
    schema:
      $ref: '#/definitions/WPSCertificateHistoryRq'
definitions:
  WPSCertificateHistoryRq:
    type: object
    properties:
      LaborOfficeId:
        type: integer
      EstablishmentSequenceNumber:
        type: integer
      RequestId:
        type: integer
      RequesterId:
        type: string
      RequesterName:
        type: string
      CertificateId:
        type: string
      Status:
        type: string
      CreatedDate:
        $ref: '#/definitions/GregorianDateModel'
      ModifiedDate:
        $ref: '#/definitions/GregorianDateModel'
      SortBy:
        type: integer
      SortByColumn:
        type: string
      PageSize:
        type: integer
      PageIndex:
        type: integer
    additionalProperties: false
  ResponseModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
      WPSCertificateHistoryRs:
        $ref: '#/definitions/WPSCertificateHistoryRs'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    example:
      en-US: English Value
      ar-SA: Arabic Value
    additionalProperties:
      type: string
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      HH:MM:SS.sssfor gregorian dates only
    example: "2021-12-31T22:00:00.000Z"
  WPSCertificateHistoryRs:
    type: object
    properties:
      TotalRecords:
        type: integer
      CompletionFlag:
        type: string
      TotalRecordsSent:
        type: integer
      ComplianceCertificateDetails:
        type: array
        items:
          $ref: '#/definitions/ComplianceCertificateDetails'
    additionalProperties: false
  ComplianceCertificateDetails:
    type: object
    properties:
      RequestId:
        type: integer
      EstablishmentId:
        type: integer
      EstablishmentSequenceNumber:
        type: string
      Name:
        type: string
      DateOfIssue:
        type: string
      DateOfExpiry:
        type: string
      CertificateId:
        type: string
      SubjectToWPS:
        type: integer
      CreatedDate:
        type: string
      LaborOfficeId:
        type: integer
      CreatedBy:
        type: string
      CompanyId:
        type: string
      UnifiedEstablishmentNumber:
        type: string
      OperatorId:
        type: string
      ChannelId:
        type: string
      UserId:
        type: string
      RequesterId:
        type: string
      RequesterName:
        type: string
      Status:
        type: string
      ModifiedDate:
        type: string
      LicenseNumber:
        type: string
    additionalProperties: false
paths:
  /WPSCertificateHistory:
    post:
      tags:
      - retrieves WPS Compliance Certificates
      description: service retrieves WPS Compliance certificates based on LaborOfficeId
        and SequenceNumber along with additional filters like RequestorId, CertificateId
        and Status.
      operationId: wpscompliancecertificate
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: X-IBM-Client-Id
        in: header
        description: Client id issued by security server
        required: true
        type: string
      - name: X-IBM-Client-Secret
        in: header
        description: Client secret issued by security server
        required: true
        type: string
      - name: X-Request-Id
        in: header
        description: X-Request-Id returned in the response header
        required: false
        type: string
      - name: X-Channel-Id
        in: header
        description: X-Channel-Id
        required: false
        type: string
      - in: body
        name: requestBody
        required: true
        schema:
          $ref: '#/definitions/WPSCertificateHistoryRq'
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
