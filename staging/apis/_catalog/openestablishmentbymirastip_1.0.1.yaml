      ID:
        type: number
        example: "3661"
      Name:
        type: string
        example: IDName
  CRParties_Type:
    type: object
    properties:
      Party:
        type: array
        items:
          $ref: '#/definitions/Party_Type'
  CodeName_Type:
    type: object
    properties:
      ID:
        type: string
        example: "36767761"
      Name:
        type: string
        example: IDName
  Party_Type:
    type: object
