      PartyID:
        type: string
        example: "1235778899"
      BirthDate:
        type: string
        example: "1992-08-17"
      PartyIDType:
        type: string
        example: "12"
      MobileNumber:
        type: string
        example: +966-7365428
      Email:
        type: number
        example: 123477@qiwa.com.sa
  CRActivities_Type:
    type: object
    properties:
      Activity:
        type: array
        items:
          $ref: '#/definitions/IDName_Type'
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      EstablishmentIds:
        type: string
        example: "1223456"
      RequestNumber:
        type: string
        example: 1-1223456-2023
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
