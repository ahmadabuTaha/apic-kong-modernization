swagger: "2.0"
info:
  title: Qiwa_SC_ValidateRequest
  x-ibm-name: validatescrequest
  version: 1.0.1
  description: This service is used to validate a salary certificate request.
schemes:
- https
basePath: /sc
security:
- OAuth2.0:
  - IntegrationScope
  clientId: []
  clientSecret: []
securityDefinitions:
  clientId:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error:
        - OperationError
        - SOAPError
        - ConnectionError
        target-url: $(ace-salc-salary-certificate)/sc/valscreq
    - gatewayscript:
        version: 2.0.0
        title: Set Headers
        source: "var apim = require('apim');\r\nvar Response = apim.getvariable('message.body');\r\nvar
          statusCode = Response.ValidateSCRequestRs.Header.ResponseStatus.Code ;\r\n\r\n\r\nif(statusCode
          == 'ESBSCHEMA'){\r\n    var code = 400\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '99999999'){\r\n    var code = 500\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '00000000'){\r\n    var code = 200\r\n    apim.setvariable('message.status.code',code,'set');\r\n}else{\r\n
          \     var code = 409\r\n    apim.setvariable('message.status.code',code,'set');\r\n}"
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.headers.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{"errorCode": "E00500", "errorMessage": "Internal Server Error"}'
            type: string
    finally: []
  properties:
    target-url:
      value: $(ace-salc-salary-certificate)/sc/valscreq
      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  application-authentication:
    certificate: false
  catalogs: {}
  buffering: true
