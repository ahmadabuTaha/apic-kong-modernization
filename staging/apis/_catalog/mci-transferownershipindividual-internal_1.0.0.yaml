swagger: "2.0"
info:
  title: MCI_TransferOwnershipIndividual-Internal
  x-ibm-name: mci-transferownershipindividual-internal
  version: 1.0.0
  description: This service is used to transfer the ownership of an individual establishment
    or change establishment type
schemes:
- https
basePath: /internal/estabmanagement
security:
- clientId: []
  clientSecret: []
securityDefinitions:
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientId:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-cmpm-transfer-ownership)/internal/estabmanagement/transferownership/mcitransferownershipindividual
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blocklist
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        persistent-connection: true
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
paths:
  /transferownership/mcitransferownershipindividual:
    post:
      operationId: MCI_TransferOwnershipIndividual
      responses:
        "200":
          description: The operation was successful.
      consumes:
      - application/xml
      produces:
      - application/xml
      description: This service is used to transfer the ownership of an individual
        establishment or change establishment type
