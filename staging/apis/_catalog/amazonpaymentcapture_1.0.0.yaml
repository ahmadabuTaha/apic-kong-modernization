swagger: "2.0"
info:
  title: AmazonPaymentCapture
  x-ibm-name: amazonpaymentcapture
  version: 1.0.0
  description: AmazonPaymentCapture
schemes:
- https
basePath: /amazon
security:
- clientId: []
  clientSecret: []
securityDefinitions:
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientId:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-amzp-amazon)/amazon/amazonpaymentcapture
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
definitions:
  AmazonPaymentCapturerRq_MessageType:
    type: object
    properties:
      AmazonPaymentCapturerRq:
        $ref: '#/definitions/AmazonPaymentCapturerRq_Type'
  AmazonPaymentCapturerRs_MessageType:
    type: object
    properties:
      AmazonPaymentCapturerRs:
        $ref: '#/definitions/AmazonPaymentCapturerRs_Type'
  AmazonPaymentCapturerRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/AmazonPaymentCapturerRq_BodyType'
  AmazonPaymentCapturerRq_BodyType:
    type: object
    properties:
