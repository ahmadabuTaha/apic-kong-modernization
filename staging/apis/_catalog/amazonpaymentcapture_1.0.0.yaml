paths:
  /amazonpaymentcapture:
    post:
      operationId: AmazonPaymentCapture
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/AmazonPaymentCapturerRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: AmazonPaymentCapturer
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/AmazonPaymentCapturerRq_MessageType'
        description: The scope of this service is to Capture Funds Through Amazon
          Payment
        required: true
