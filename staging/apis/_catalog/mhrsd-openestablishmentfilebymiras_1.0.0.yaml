      location:
        $ref: '#/definitions/NameCodeModel'
      crName:
        type: string
        example: details of reason
      issueDate:
        $ref: '#/definitions/HijriDateModel'
      expiryDate:
        $ref: '#/definitions/HijriDateModel'
      nationality:
        $ref: '#/definitions/NameCodeModel'
      zipCode:
        type: string
        example: details of reason
      poBox:
        type: string
        example: date not sure it should be hijri or gergorian
      city:
        $ref: '#/definitions/NameCodeModel'
      street:
        type: string
        example: ""
      building:
        type: integer
        example: 1
      crOfficeNumber:
        type: string
        example: 1
      fiscalYear:
        $ref: '#/definitions/NameCodeModel'
      crParties:
        type: array
        items:
          $ref: '#/definitions/crParties'
      crRepresentative:
        $ref: '#/definitions/crRepresentative'
      crActivities:
        type: array
        items:
          $ref: '#/definitions/NameCodeModel'
  crParties:
    type: object
    description: This object will be used across the model
    properties:
      name:
        type: integer
        example: 1
      relationType:
        $ref: '#/definitions/NameCodeModel'
      nationality:
        $ref: '#/definitions/NameCodeModel'
      partyId:
        type: integer
        example: 1
      BirthDate:
        $ref: '#/definitions/GregorianDateModel'
  crRepresentative:
    type: object
    description: This object will be used across the model
    properties:
      name:
        type: integer
        example: 1
      nationality:
        $ref: '#/definitions/NameCodeModel'
      partyId:
        type: integer
        example: 1
      PartyIDType:
        type: string
        example: ""
      Mobile:
        type: integer
        example: 1
      Email:
        type: string
        example: ""
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format dd/mm/yyyy
      for hijri and gregorian
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
