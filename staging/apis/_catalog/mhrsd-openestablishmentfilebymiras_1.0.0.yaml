swagger: "2.0"
info:
  title: MHRSDOpenEstablishmentFileByMiras
  description: This service is used by the consumer to open an establishment file
    from HRSD through Takamol Internal/External Integration.
  x-ibm-name: mhrsd-openestablishmentfilebymiras
  version: 1.0.0
schemes:
- https
basePath: /mhrsd/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /openestablishmentfilebymiras:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    post:
      tags:
      - establishment file
      description: Service to open establishment file
      operationId: openEstablishmentFileByMiras
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestModel'
        description: open establishment file request body
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "201":
          $ref: '#/responses/Response201'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      fileNumber:
        type: integer
        example: 1
  RequestModel:
    type: object
    properties:
      crNumber:
        type: string
        example: "1010610273"
      idNo:
        type: integer
        example: 0
      isMain:
        type: boolean
        example: 0
      mainCr:
        type: integer
        example: 1130108517
      businessType:
