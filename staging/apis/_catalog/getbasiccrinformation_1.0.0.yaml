        example: activityID
      activityDescriptionAr:
        type: string
        example: activityDescriptionAr
      activityDescriptionEn:
        type: string
        example: activityDescriptionEn
      isPreLicenseIssued:
        type: boolean
        example: "true"
      isPostLicenseIssued:
        type: boolean
        example: "true"
  contactInformation_Type:
    type: object
    properties:
      phoneNo:
        type: string
        example: phoneNo
      mobileNo:
        type: string
        example: mobileNo
      email:
        type: string
        example: email
      websiteURL:
        type: string
        example: websiteURL
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
