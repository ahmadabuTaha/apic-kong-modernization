        type: string
        example: activitiesTypeID
      activitiesTypeDescriptionAr:
        type: string
        example: activitiesTypeDescriptionAr
      activitiesTypeDescriptionEn:
        type: string
        example: activitiesTypeDescriptionEn
  activityList_Type:
