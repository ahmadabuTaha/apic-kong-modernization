swagger: "2.0"
info:
  title: AmazonWebHookNotification
  x-ibm-name: amazonwebhooknotification
  version: 1.0.0
schemes:
- https
basePath: /amazon
security:
- {}
securityDefinitions:
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  properties:
    target-url:
      value: http://icp-proxy.qiwa.info:30775/amazon/amazonwebhook
      description: URL of the proxy policy
      encoded: false
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: keep
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-sch-amzp-amazon)/amazon/amazonwebhook
  application-authentication:
    certificate: false
  buffering: true
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
paths:
  /amazonwebhook:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
      parameters:
      - name: AmazonWebHookNotification Request
        in: body
        required: false
        schema:
          type: object
