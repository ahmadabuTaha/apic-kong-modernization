    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\n\napim.output('application/json');\n\nvar
          message = apim.getvariable('message.body');\nvar cfg = apim.getvariable('cfg');\nvar
          Header = message[cfg.responseName].Header;\nvar TransactionId = Header.TransactionId;\nvar
          ChannelId = Header.ChannelId;\nvar RequestTime = Header.RequestTime;\nvar
          SessionId = Header.SessionId; \nvar MWRequestTime = Header.MWRequestTime;\nvar
          MWResponseTime = Header.MWResponseTime;\nvar status = Header.ResponseStatus.Status;\nvar
          code = Header.ResponseStatus.Code;\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\nif
          (RequestTime !== 'undefined')\n apim.setvariable('message.headers.RequestTime',RequestTime,'add');\nif
          (SessionId !== 'undefined')\n apim.setvariable('message.headers.X-Request-Id',SessionId,'add');\nif
          (MWRequestTime !== 'undefined')\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\nif
          (MWResponseTime !== 'undefined')\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\n\napim.setvariable('message.headers.Response-Status',status,'add');\napim.setvariable('message.headers.Response-Code',code,'add');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS' or $header("Response-Code")
            = 'TIP00045'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\r\n\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\n\r\nsession.output.write(body);\r\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');          \r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
    finally: []
