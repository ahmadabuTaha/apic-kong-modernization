swagger: "2.0"
info:
  title: GetActivityLicenseMatrix
  version: 1.0.0
  description: The scope of this service is used to get the activity license matrix
    in addition to return the linked licenses with the 700 number.
  x-ibm-name: getactivitylicensematrix
paths:
  /getactivitylicensematrix:
    post:
      operationId: GetActivityLicenseMatrix
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/GetActivityLicenseMatrixRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: Get Activity License Matrix
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/GetActivityLicenseMatrixRq_MessageType'
        description: GetActivityLicenseMatrixRq
        required: true
basePath: /estabmanagement
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
definitions:
  GetActivityLicenseMatrixRq_MessageType:
    type: object
    properties:
      GetActivityLicenseMatrixRq:
        $ref: '#/definitions/GetActivityLicenseMatrixRq_Type'
  GetActivityLicenseMatrixRs_MessageType:
    type: object
    properties:
      GetActivityLicenseMatrixRs:
        $ref: '#/definitions/GetActivityLicenseMatrixRs_Type'
  GetActivityLicenseMatrixRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/GetActivityLicenseMatrixRq_BodyType'
  GetActivityLicenseMatrixRq_BodyType:
    type: object
    properties:
      Isic4ActivityId:
        type: integer
        description: ISIC4 activity id (mandatory).
      crNationalNumber:
        type: string
        description: CR National Number / National Unified Number (optional).
    required:
    - Isic4ActivityId
  UserServicesList_Type:
    type: object
    properties:
      UserServiceItem:
        type: array
        items:
          $ref: '#/definitions/UserServiceItem_Type'
  UserServiceItem_Type:
    type: object
    properties:
      UserServiceId:
        type: integer
      ServiceStatus:
        type: integer
    required:
    - UserServiceId
    - ServiceStatus
  GetActivityLicenseMatrixRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/GetActivityLicenseMatrixRs_BodyType'
  GetActivityLicenseMatrixRs_BodyType:
    type: object
    properties:
      ISICDetails:
        $ref: '#/definitions/ISICDetails_Type'
      BaladyLicensesList:
        $ref: '#/definitions/BaladyLicensesList_Type'
      OperationalLicensesList:
        $ref: '#/definitions/LicensesList_Type'
  ISICDetails_Type:
    type: object
    properties:
      IsRequiredBaladyLicense:
        type: integer
        description: 1/0 indicator.
      IsRequiredOperationalLicense:
        type: integer
        description: 1/0 indicator.
      LicenseSourceId:
        type: integer
        description: Returned only if Channel is ESB.
      OperationLicenseSource:
        $ref: '#/definitions/IDName_Type'
      Activity:
        $ref: '#/definitions/IDName_Type'
      GracePeriodDays:
        type: integer
    required:
    - IsRequiredBaladyLicense
    - IsRequiredOperationalLicense
    - LicenseSourceId
    - OperationLicenseSource
    - Activity
    - GracePeriodDays
  BaladyLicensesList_Type:
    type: object
    properties:
      LicensesItem:
        type: array
        items:
          $ref: '#/definitions/BaladyLicensesItem_Type'
  LicensesList_Type:
    type: object
    properties:
      LicensesItem:
        type: array
        items:
          $ref: '#/definitions/LicensesItem_Type'
  BaladyLicensesItem_Type:
    type: object
    properties:
      LicenseNumber:
        type: string
      LicenseIssue:
        $ref: '#/definitions/Date_Type'
      LicenseExpiry:
        $ref: '#/definitions/Date_Type'
      LicenseStatus:
        $ref: '#/definitions/IDName_Type'
      LicenseName:
        type: string
        description: Returned only if Channel is ESB.
      Amanah:
        $ref: '#/definitions/CodeName_Type'
      BaladiaName:
        type: string
      CommercialName:
        type: string
      ActivitiesStructure:
        type: array
        items:
          $ref: '#/definitions/Activity_Type'
        minItems: 1
        description: Returned only if Channel is ESB.
      LocationCoordinates:
        $ref: '#/definitions/Location_Type'
      ShopArea:
        type: integer
      DoorsCount:
        type: integer
    required:
    - LicenseNumber
    - LicenseIssue
    - LicenseExpiry
    - LicenseStatus
  IDName_Type:
    type: object
    properties:
      ID:
        type: integer
      NameAr:
        type: string
      NameEn:
        type: string
    required:
    - ID
    - NameAr
  Date_Type:
    type: object
    properties:
      Hijri:
        type: string
      Gregorian:
        type: string
        format: date
    required:
    - Hijri
    - Gregorian
  LicensesItem_Type:
    type: object
    properties:
      LicenseNumber:
        type: string
      LicenseIssue:
        $ref: '#/definitions/Date_Type'
      LicenseExpiry:
        $ref: '#/definitions/Date_Type'
      LicenseStatus:
        $ref: '#/definitions/IDName_Type'
      LicenseName:
        type: string
      Activities:
        type: string
    required:
    - LicenseNumber
    - LicenseIssue
    - LicenseExpiry
    - LicenseStatus
  CodeName_Type:
    type: object
    properties:
      Code:
        type: string
      Name:
        type: string
    required:
    - Code
    - Name
  Board_Type:
    type: object
    properties:
      BoardType:
        type: string
      BoardArea:
        type: integer
    required:
    - BoardType
    - BoardArea
  Boards_Type:
    type: object
    properties:
      Board:
        type: array
        items:
          $ref: '#/definitions/Board_Type'
        minItems: 1
    required:
    - Board
  Location_Type:
    type: object
    properties:
      Longitude:
        type: string
      Latitude:
        type: string
    required:
    - Longitude
    - Latitude
  Activity_Type:
    type: object
    properties:
      ActivityISICCode:
        type: string
      ActivityISICDescription:
        type: string
      ActivityAmanahDescription:
        type: string
      ActivityArea:
        type: integer
      Boards:
        $ref: '#/definitions/Boards_Type'
    required:
    - ActivityISICCode
    - ActivityISICDescription
    - ActivityAmanahDescription
    - ActivityArea
    - Boards
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  UDF_Type:
    type: object
    properties:
      KeyValueArr:
        type: array
        items:
          $ref: '#/definitions/KeyValueArr_Type'
  KeyValueArr_Type:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  Tmstmp_Type:
    type: object
  UserInfo_Type:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: integer
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Code
    - Status
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-cmpm-dashboard-profile)/estabmanagement/getactivitylicensematrix
        follow-redirects: false
        inject-proxy-headers: true
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
schemes:
- https
