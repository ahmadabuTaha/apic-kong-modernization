          - gatewayscript:
              version: 2.0.0
              title: FinalErrorMapping
              source: "var apim = require('apim');\r\nvar FinalRes = apim.getvariable('ErrorResponse');\r\nvar
                TransId = apim.getvariable('TransactionID1');\r\n//apim.setvariable('TransactionID1',millisecondsvalue);\r\napim.setvariable('message.headers.TransactionID',TransId);\r\n\r\nif
                (FinalRes.errorCode) {\r\n    apim.setvariable('message.status.code',
                409);\r\n} else {\r\n    apim.setvariable('message.status.code', 200);\r\n}\r\n\r\n\r\nsession.output.write(FinalRes);\r\napim.output('application/json');"
