swagger: "2.0"
info:
  title: QAAS_TransLegacyEmpContractV2
  description: |
    This service is used to convert non unified to unified contracts by taking all the necessary information and await laborer approval.
  x-ibm-name: qaas_translegacyempcontractv2
  version: 1.0.0
schemes:
- https
basePath: /external/v2
securityDefinitions:
  OAuth2.0:
    type: oauth2
    x-ibm-oauth-provider: externaliamprovider
    flow: application
    tokenUrl: $(keycloak-token)/realms/TIP/protocol/openid-connect/token
    scopes:
      contract:scope: allow access to contract APIs
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
security:
- OAuth2.0:
  - contract:scope
  clientIdHeader: []
paths:
  /qaas/translegacyempcontract:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    post:
      tags:
      - QaaSTransLegacyEmpContract
      description: |
        This service is used to convert non unified to unified contracts by taking all the necessary information and await laborer approval.
      operationId: QaaSTransLegacyEmpContract
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        description: Request body
        required: true
        schema:
          $ref: '#/definitions/RequestBody'
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  RequestBody:
    type: object
    properties:
      establishmentDetails:
        $ref: '#/definitions/EstablishmentType'
      updateRequesterDetails:
        $ref: '#/definitions/RequesterType'
      laborerDetails:
        $ref: '#/definitions/LaborerType'
      contractDetails:
        $ref: '#/definitions/ContractType'
  EstablishmentType:
    type: object
    properties:
      nationalUnifiedNumber:
        type: integer
      laborOfficeId:
        type: integer
      sequenceNumber:
        type: integer
      establishmentEmail:
        type: string
      phoneNumber:
        type: string
      mobileNumber:
        type: string
      nationalAddress:
        type: string
  RequesterType:
    type: object
    properties:
      updateRequesterName:
        type: string
      updateRequesterIdNo:
        type: integer
      updateRequesterRoleEn:
        type: string
      updateRequesterRoleAr:
        type: string
  LaborerType:
    type: object
    properties:
      passportNumber:
        type: string
      laborerNationalAddress:
        type: string
  ContractType:
    type: object
    properties:
      contractId:
        type: integer
      jobTitle:
        $ref: '#/definitions/JobTitleType'
      workLocationId:
        type: integer
      executionLocationId:
        type: integer
      salary:
        type: number
        format: double
      salaryDueDay:
        type: integer
      renewalStatusId:
        type: integer
      renewalPeriod:
        type: integer
      allowances:
        type: array
        items:
          $ref: '#/definitions/AllowancesItemType'
      inKindBenefits:
        type: array
        items:
          $ref: '#/definitions/InKindBenefitsItemType'
      commission:
        type: array
        items:
          $ref: '#/definitions/CommissionItemType'
      additionalTerms:
        type: array
        items:
          $ref: '#/definitions/AdditionalTermsItemType'
  JobTitleType:
    type: object
    properties:
      jobTitleAr:
        type: string
      jobTitleEng:
        type: string
  AllowancesItemType:
    type: object
    properties:
      allowanceType:
        type: integer
      nameAr:
        type: string
      nameEn:
        type: string
      amount:
        type: number
        format: double
  InKindBenefitsItemType:
    type: object
    properties:
      nameEn:
        type: string
      nameAr:
        type: string
      descriptionEn:
        type: string
      descriptionAr:
        type: string
      frequency:
        type: integer
      dueDate:
        type: string
        format: date-time
  CommissionItemType:
    type: object
    properties:
      commissionBaseEn:
        type: string
      commissionBaseAr:
        type: string
      percentage:
        type: integer
      frequency:
        type: integer
  AdditionalTermsItemType:
    type: object
    properties:
      nameEn:
        type: string
      nameAr:
        type: string
  ResponseModel:
    type: object
    properties:
      apiStatus:
        type: string
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
responses:
