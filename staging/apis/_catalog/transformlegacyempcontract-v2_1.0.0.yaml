swagger: "2.0"
info:
  title: TransformLegacyEmpContract V2
  version: 1.0.0
  description: 'This service is used to convert non unified to unified contracts by
    taking all the necessary information and await laborer approval '
  x-ibm-name: transformlegacyempcontract-v2
paths:
