      operationId: TransformLegacyEmploymentContract
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/TransformLegacyEmploymentContractRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: 'TransformLegacyEmploymentContract '
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/TransformLegacyEmploymentContractRq_MessageType'
        description: 'TransformLegacyEmploymentContract '
        required: true
basePath: /contractmanagement/v2
