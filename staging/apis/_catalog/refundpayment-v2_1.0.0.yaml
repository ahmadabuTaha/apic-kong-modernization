    properties:
      RefundPaymentRs:
        $ref: '#/definitions/RefundPaymentRs_Type'
  RefundPaymentRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/RefundPaymentRq_BodyType'
  RefundPaymentRq_BodyType:
    type: object
    properties:
      PaymentReference:
        type: string
        default: 93039FFA33B042600000000000X10000
      RefundType:
        type: string
        default: F
      RefundAmount:
        type: integer
        default: "20"
      Currency:
        type: string
        default: EUR
    required:
    - PaymentReference
    - RefundType
  RefundPaymentRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
