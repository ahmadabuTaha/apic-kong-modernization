swagger: "2.0"
info:
  title: MOE_GetGraduateStudentQualifications
  description: This API exposes MOE to Get Graduate Student Qualifications service
    from Qiwa platform
  x-ibm-name: moe-getgraduatestudentqualifications
  version: 2.0.0
schemes:
- https
basePath: /moe/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /graduate-student/{studentId}/qualifications:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/studentId'
    get:
      tags:
      - Graduate Student Qualification
      description: Service to Get Graduate Student Qualifications
      operationId: getGraduateStudentQualifications
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      qualificationsDetails:
        $ref: '#/definitions/QualificationDetailModel'
      abroadQualifications:
        $ref: '#/definitions/AbroadQualificationModel'
      localHighQualifications:
        $ref: '#/definitions/LocalHighQualificationModel'
    required:
    - qualificationsDetails
    - abroadQualifications
    - localHighQualifications
  QualificationDetailModel:
    type: object
    properties:
      nationalityName:
        type: string
      emailAddress:
        type: string
        example: 421035764@qu.edu.sa
      personName:
        $ref: '#/definitions/PersonNameModel'
    required:
    - personName
  PersonNameModel:
    type: object
    properties:
      fullName:
        $ref: '#/definitions/LocaleDataModel'
  AbroadQualificationModel:
    type: object
    properties:
      responseStatus:
        $ref: '#/definitions/IntegerNumberModel'
      errorDescription:
        type: string
      qualificationsList:
        type: array
        items:
          $ref: '#/definitions/AbroadQualificationListModel'
    required:
    - responseStatus
  AbroadQualificationListModel:
    type: object
    properties:
      instituteName:
        $ref: '#/definitions/LocaleDataModel'
      collegeName:
        $ref: '#/definitions/LocaleDataModel'
      sectionName:
        type: string
        example: Section Name
      majorName:
        $ref: '#/definitions/LocaleDataModel'
      certificateName:
        $ref: '#/definitions/LocaleDataModel'
      minorName:
        type: string
      saudiSpecialty:
        type: string
      studyPeriod:
        $ref: '#/definitions/IntegerNumberModel'
      studyModeName:
        $ref: '#/definitions/LocaleDataModel'
      gpaTypeName:
        type: string
        example: نظام المعدل التراكمي المكون من خمس نقاط
      gpa:
        $ref: '#/definitions/NumberModel'
      ratingName:
        type: string
        example: نظام المعدل التراكمي المكون من خمس نقاط
      graduationYear:
        $ref: '#/definitions/IntegerNumberModel'
      equationDecision:
        type: string
      equationdegreeName:
        type: string
      equationDecisionText:
        type: string
      degreeName:
        $ref: '#/definitions/DegreeNameModel'
      graduationDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      countryOfStudy:
        $ref: '#/definitions/LocaleDataModel'
  InstituteNameModel:
    type: object
    properties:
      instituteNameAr:
        $ref: '#/definitions/LocaleDataModel'
      instituteNameEn:
        $ref: '#/definitions/LocaleDataModel'
  DegreeNameModel:
    type: object
    properties:
      en-US:
        type: string
      ar-SA:
        type: string
      degree:
        type: string
  CountryOfStudyModel:
    type: object
    properties:
      countryOfStudy:
        $ref: '#/definitions/LocaleDataModel'
  LocalHighQualificationModel:
    type: object
    properties:
      responseStatus:
        $ref: '#/definitions/IntegerNumberModel'
      errorDescription:
        type: string
      qualificationsList:
        type: array
        items:
          $ref: '#/definitions/LocalHighQualificationListModel'
    required:
    - responseStatus
  LocalHighQualificationListModel:
    type: object
    properties:
      instituteName:
        type: string
      collegeName:
        type: string
      sectionName:
        type: string
        example: Section Name
      majorName:
        type: string
      minorName:
        type: string
      saudiSpecialty:
        type: string
      studyPeriod:
        $ref: '#/definitions/IntegerNumberModel'
      studyModeName:
        type: string
      gpaTypeName:
        type: string
        example: نظام المعدل التراكمي المكون من خمس نقاط
      gpa:
        $ref: '#/definitions/NumberModel'
      ratingName:
        type: string
        example: مقبول
      graduationDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      degree:
        type: string
      degreeName:
        type: string
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri and gregorian
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    properties:
      en-US:
        type: string
      ar-SA:
        type: string
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  NumberModel:
    type: object
    description: This object use for numbers
    additionalProperties:
      type: number
      example: 2000
  StrStudentQualificationsRs_BodyType:
    type: object
    properties:
      QualificationsDetailsResponse:
        $ref: '#/definitions/StrQualificationsDetailsResponse'
      AbroadQualiffcationResponse:
        $ref: '#/definitions/StrAbroadQualiffcationResponse'
      LocalHighQualificationsResponse:
        $ref: '#/definitions/StrLocalHighQualificationsResponse'
    required:
    - QualificationsDetailsResponse
    - AbroadQualiffcationResponse
    - LocalHighQualificationsResponse
  StrQualificationsDetailsResponse:
    type: object
    properties:
      PersonDetails:
        $ref: '#/definitions/StrPersonDetails'
    required:
    - PersonDetails
  StrPersonDetails:
    type: object
    properties:
      NationalityName:
        type: string
      EmailAddress:
        type: string
      PersonName:
        $ref: '#/definitions/StrPersonName'
    required:
    - PersonName
  StrPersonName:
    type: object
    properties:
      FullNameAr:
        type: string
      FullNameEn:
        type: string
    required:
    - FullNameAr
    - FullNameEn
  StrAbroadQualiffcationResponse:
    type: object
    properties:
      ResponseStatus:
        type: string
      ErrorDescrption:
        type: string
      AbroadQualificationList:
        $ref: '#/definitions/StrAbroadQualificationList_Type'
    required:
    - ResponseStatus
  StrAbroadQualificationList_Type:
    type: object
    properties:
      AbroadQualification:
        type: array
        items:
          $ref: '#/definitions/StrAbroadQualification'
  StrAbroadQualification:
    type: object
    properties:
      InstituteName:
        $ref: '#/definitions/StrInstituteName'
      CollegeNameAr:
        type: string
      CollegeNameEn:
        type: string
      SectionName:
        type: string
      MajorNameAr:
        type: string
      MajorNameEn:
        type: string
      CertificateTitleAr:
        type: string
      CertificateTitleEn:
        type: string
      MinorName:
        type: string
      SaudiSpeciality:
        type: string
      StudyPeriod:
        type: string
      StudyModeNameAr:
        type: string
      StudyModeNameEn:
        type: string
      GPATypeName:
        type: string
      GPA:
        type: string
      RatingName:
        type: string
      GradutionYear:
        type: string
      EquationDecision:
        type: string
      EquationdegreeName:
        type: string
      EquationDecisionText:
        type: string
      DegreeName:
        $ref: '#/definitions/StrDegreeName'
      GraduationDate:
        $ref: '#/definitions/StrGraduationDate'
      CountryOfStudy:
        $ref: '#/definitions/StrCountryOfStudy'
    required:
    - InstituteName
  StrInstituteName:
    type: object
    properties:
      InstituteNameAr:
        type: string
      InstituteNameEn:
        type: string
    required:
    - InstituteNameAr
    - InstituteNameEn
  StrDegreeName:
    type: object
    properties:
      DegreeNameAr:
        type: string
      DegreeNameEn:
        type: string
      Degree:
        type: string
  StrGraduationDate:
    type: object
    properties:
      GregorianDate:
        type: string
      HijriDate:
        type: string
  StrCountryOfStudy:
    type: object
    properties:
      countryOfStudyAr:
        type: string
      countryOfStudyEn:
        type: string
  StrLocalHighQualificationsResponse:
    type: object
    properties:
      ResponseStatus:
        type: string
      ErrorDescrption:
        type: string
      LocalHighQualificationsList:
        $ref: '#/definitions/StrLocalHighQualifications_Type'
    required:
    - ResponseStatus
  StrLocalHighQualifications_Type:
    type: object
    properties:
      LocalHighQualifications:
        type: array
        items:
          $ref: '#/definitions/StrLocalHighQualifications'
  StrLocalHighQualifications:
    type: object
    properties:
      InstituteName:
        type: string
      CollegeName:
        type: string
      SectionName:
        type: string
      MajorName:
        type: string
      MinorName:
        type: string
      SaudiSpeciality:
        type: string
      StudyPeriod:
        type: string
      StudyModeName:
        type: string
      GPATypeName:
        type: string
      GPA:
        type: string
      RatingName:
        type: string
      GraduationDate:
        $ref: '#/definitions/StrGraduationDate'
      Degree:
        type: string
      DegreeName:
        type: string
    required:
    - InstituteName
parameters:
  studentId:
    in: path
    name: studentId
    description: Student Identifier
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
