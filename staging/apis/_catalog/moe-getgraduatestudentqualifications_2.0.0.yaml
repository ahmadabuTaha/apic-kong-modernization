                - set: majorName.ar-SA
                  from: MajorNameAr
                - set: majorName.en-US
                  from: MajorNameEn
                - set: certificateName.ar-SA
                  from: CertificateTitleAr
                - set: certificateName.en-US
                  from: CertificateTitleEn
                - set: minorName
                  from: MinorName
                - set: studyPeriod
                  from: StudyPeriod
                - set: studyModeName.ar-SA
                  from: StudyModeNameAr
                - set: studyModeName.en-US
                  from: StudyModeNameEn
                - set: gpaTypeName
                  from: GPATypeName
                - set: gpa
                  from: GPA
                - set: ratingName
                  from: RatingName
                - set: graduationYear
                  from: GradutionYear
                - set: equationDecision
                  from: EquationDecision
                - set: equationdegreeName
                  from: EquationdegreeName
                - set: equationDecisionText
                  from: EquationDecisionText
                - set: degreeName.ar-SA
                  from: DegreeName.DegreeNameAr
                - set: degreeName.en-US
                  from: DegreeName.DegreeNameEn
                - set: degreeName.degree
                  from: DegreeName.Degree
                - set: graduationDate.gregorianDate
                  from: GraduationDate.GregorianDate
                - set: graduationDate.hijriDate
                  from: GraduationDate.HijriDate
                - set: countryOfStudy.en-US
                  from: CountryOfStudy.countryOfStudyEn
                - set: countryOfStudy.ar-SA
                  from: CountryOfStudy.countryOfStudyAr
              - set: .localHighQualifications.responseStatus
                from: .LocalHighQualificationsResponse.ResponseStatus
              - set: .localHighQualifications.errorDescription
                from: .LocalHighQualificationsResponse.ErrorDescrption
              - create: .localHighQualifications.qualificationsList
                foreach: .LocalHighQualificationsResponse.LocalHighQualificationsList.LocalHighQualifications
                from: .LocalHighQualificationsResponse.LocalHighQualificationsList.LocalHighQualifications
                actions:
                - set: instituteName
                  from: InstituteName
                - set: collegeName
                  from: CollegeName
