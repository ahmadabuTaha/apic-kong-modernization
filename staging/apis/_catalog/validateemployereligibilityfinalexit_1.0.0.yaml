    - gatewayscript:
        version: 2.0.0
        title: ConstructReq
        source: "var apim = require('apim')\nvar Payload = apim.getvariable('request.body');
          \n\nvar TransactionId = JSON.stringify(Math.floor(Math.random() * 10000000000000000000));\n\nvar
          request = {\n    \"ValidateEmployerEligibilityFinalExitRq\": {\n        \"Header\":
          {\n            \"TransactionId\": TransactionId,\n            \"ChannelId\":
          \"ESB\",\n            \"SessionId\": \"212\",\n            \"RequestTime\":
          \"2019-10-10 00:00:00.555\",\n            \"MWRequestTime\": \"2019-10-10
          00:00:00.555\",\n            \"ServiceCode\": \"VEEFE002\",\n            \"DebugFlag\":
          \"1\",\n             \"UserInfo\": {\n                 \"UserId\": \"465740\",\n
          \       \"IDNumber\": \"1024812248\"\n            }\n        },\n        \"Body\":
          {\n        \t  \"IDNumber\" : Payload.IDNumber,\n            \"NationalUnifiedNumber\"
          : Payload.NationalUnifiedNumber\n        }\n    }\n}\n\n\napim.setvariable('message.body',request)\napim.output('application/json')"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-tc-tcvalidates)/qiwa/valempeligfinalexit
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim')\nvar backendRes = apim.getvariable('message.body');
          \n var ContractExpiryDate1 =\nbackendRes.ValidateEmployerEligibilityFinalExitRs.Body.ContractExpiryDate;\n\nvar
          ContractExpiryDate = JSON.stringify(ContractExpiryDate1);\n\n\nif(ContractExpiryDate
          == '{}'){\n   var  ContractExpiryDate = null;\n}else{\n    var  ContractExpiryDate
          = ContractExpiryDate1\n}\nvar response = {\n                 \"ReasonCode\":
          backendRes.ValidateEmployerEligibilityFinalExitRs.Header.ResponseStatus.Code,\n
          \                 \"ArReasonMessage\": backendRes.ValidateEmployerEligibilityFinalExitRs.Header.ResponseStatus.ArabicMsg,\n
          \                    \"EnReasonMessage\": backendRes.ValidateEmployerEligibilityFinalExitRs.Header.ResponseStatus.EnglishMsg,\n
          \                    \"ContractExpiryDate\": ContractExpiryDate\n}\n\n\napim.setvariable('message.body',response)\napim.output('application/json')"
