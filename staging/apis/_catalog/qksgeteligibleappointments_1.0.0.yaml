swagger: "2.0"
info:
  title: QKSGetEligibleAppointments
  version: 1.0.0
  description: |
    This service retrieves eligible appointments.
  x-ibm-name: qksgeteligibleappointments
basePath: /qiwalo
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
