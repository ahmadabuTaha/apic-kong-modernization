    - AppointmentDate
    - StartTime
    - EndTime
    - VisitorName
    - VisitorEmail
    - AppointmentStatus
    - BranchService
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
