    required:
    - Header
    - Body
  QKSGetEligibleAppointmentsRs_BodyType:
    type: object
    properties:
      AgentId:
        type: integer
      Appointments:
        $ref: '#/definitions/Appointments_Type'
    required:
    - AgentId
    - Appointments
  Appointments_Type:
    type: object
    properties:
      AppointmentItem:
        type: array
        items:
          $ref: '#/definitions/AppointmentItem_Type'
    required:
