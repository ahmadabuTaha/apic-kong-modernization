      Body:
        $ref: '#/definitions/QKSGetEligibleAppointmentsRq_BodyType'
    required:
    - Header
    - Body
  QKSGetEligibleAppointmentsRq_BodyType:
    type: object
    properties:
      appointmentDate:
        type: string
        format: date
    required:
    - appointmentDate
  QKSGetEligibleAppointmentsRs_Type:
    type: object
    properties:
