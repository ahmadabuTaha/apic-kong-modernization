paths:
  /qksgeteligibleapp:
    post:
      operationId: QKSGetEligibleAppointments
      summary: Get Eligible Appointments
      description: Retrieves eligible appointments based on appointment date.
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        description: QKSGetEligibleAppointmentsRq
        required: true
        schema:
          $ref: '#/definitions/QKSGetEligibleAppointmentsRq_MessageType'
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/QKSGetEligibleAppointmentsRs_MessageType'
definitions:
  QKSGetEligibleAppointmentsRq_MessageType:
    type: object
    properties:
      QKSGetEligibleAppointmentsRq:
        $ref: '#/definitions/QKSGetEligibleAppointmentsRq_Type'
  QKSGetEligibleAppointmentsRs_MessageType:
    type: object
    properties:
      QKSGetEligibleAppointmentsRs:
        $ref: '#/definitions/QKSGetEligibleAppointmentsRs_Type'
  QKSGetEligibleAppointmentsRq_Type:
    type: object
    properties:
