        title: dynamicTransformation
        source: "var apim = require('apim');\n\n\n//--------------------------------\n\nvar
          currentDate = new Date();\nvar millisecondsvalue = \"\"+currentDate.getTime();\n
          apim.setvariable('myTransactionId',millisecondsvalue,'add');\nvar today
          = new Date();\nvar date = today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();\nvar
          time = today.getHours() + \":\" + today.getMinutes() + \":\" + today.getSeconds();\nvar
          dateTime = date+' '+time;\napim.setvariable('myRequestTime',dateTime,'add');\n\n//--------------------------------\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n    {\n        month = \"0\" +
          month;\n    }\n\n    //if day is between 1-9 pad right with a 0 for two
          digits\n    if (day.length === 1)\n    {\n        day = \"0\" + day;\n    }\n
          \   if (hour.length === 1)\n    {\n        hour = \"0\" + hour;\n    }\n
          \   if (minitue.length === 1)\n    {\n        minitue = \"0\" + minitue;\n
          \   }\n    if (second.length === 1)\n    {\n        second = \"0\" + second;\n
          \   }\n    if (millisecond.length == 1)\n    {\n        millisecond = \"00\"
          + millisecond;\n    }if (millisecond.length == 2)\n    {\n        millisecond
          = \"0\" + millisecond;\n    }\n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}\n\nvar d = new Date();\n\n\n//---------------------------------\n\nvar
          obj = apim.getvariable('message.body');\n  \n\nvar TransactionId = ''+apim.getvariable('myTransactionId');\nvar
          ChannelId =\t''+apim.getvariable('message.headers.Channel-Id');\nvar SessionId
          = '212';\nvar RequestTime = formatDate(d);\nvar MWRequestTime = formatDate(d);\nvar
          ServiceCode = apim.getvariable('ServiceCode');\nvar UserId = '';\nvar IDNumber
          = '';\nvar Body = '';\n\n var parent;   \n\n    function printValues(obj)
          {\n\n        for(var k in obj) {\n\n            if(obj[k] instanceof Object)
          {\n\n                parent = k;\n\n                printValues(obj[k]);\n\n
          \           } else {\n\n            \n             \n                 if(parent
          == ''){\n                  \n                  }else{\n\n                 if(Number.isFinite(obj[k])){\n\n
          \                  Body = Body+'\"'+k+'\":'+ obj[k]+',';\n\n                 }else{\n\n
          \                  Body = Body+'\"'+k+'\":\"'+ obj[k]+'\",';\n\n                 }\n
          \                \n          }\n\n              \n\n              if(k =='UserId'){\n\n
          \             UserId = obj[k];\n\n              }else if(k =='IDNumber'){\n\n
          \              IDNumber = obj[k];\n\n              }\n\n  \n\n            };\n\n
          \       }\n\n    };\n\n    \n\n    \n\n    printValues(obj);\n\n    if(Body.endsWith(\",\")){\n\n
          \    Body = Body.substring(0 , Body.length - 1); \n\n \n    }\n\n    var
          output = JSON.stringify(obj);\n    var requestTag = apim.getvariable('requestTag');\n
          \   var message = '{\"'+requestTag+'\": {\"Header\": {\"TransactionId\":
          \"'+TransactionId+'\",\"ChannelId\": \"'+ChannelId+'\",\"SessionId\": \"'+SessionId+'\",\"RequestTime\":
          \"'+RequestTime+'\",\"MWRequestTime\": \"'+MWRequestTime+'\",\"ServiceCode\":
          \"'+ServiceCode+'\",\"DebugFlag\": \"1\"},\"Body\": {'+Body+'}}}';\n\n\nsession.output.write(message);\napim.output('application/json');"
    - invoke:
