swagger: "2.0"
info:
  title: Qiwa_ValidateCertificateNumber
  x-ibm-name: qiwa-validatecertificatenumber
  version: 2.0.1
  description: This API validates and retrieves the certificate details  from Qiwa
    platform
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\n//var cfg = apim.getvariable('cfg');\n\nvar
          OperatorId                  = apim.getvariable('message.headers.Operator-Id');\nvar
          activityId                  = apim.getvariable('request.parameters.activityId');\n\nvar
          cfg = {\n    \"serviceCode\" : \"EXQVCN01\",\n    \"channelId\" : \"Integration\",\n
          \   \"requestName\" : \"validateCertificateRq\",\n    \"responseName\":
          \"validateCertificateRs\",\n    \"errorMap\" :{\n        \"ESBSCHEMA\" :
          {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n};\n\nvar appcReq =
          {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : \"123\",\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          cfg.SessionId,\n            \"RequestTime\" : formatDate(dt),\n            \"MWRequestTime\"
          : formatDate(dt),\n            \"ServiceCode\": cfg.serviceCode\n        },\n
          \    \"Body\" : {\n            \"ActivityId\": activityId\n        }\n            \n
          \       \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n    appcReq[cfg.requestName].Header.UserInfo
          = {\n        \"IDNumber\" : OperatorId\n    };\nsession.output.write(appcReq);\napim.setvariable('cfg',
          cfg);\napim.output('application/json');\n\n\nfunction formatDate(d)\n{\n
          \   //get the month\n    var month = d.getMonth();\n    //get the day\n
          \   //convert day to string\n    var day = d.getDate().toString();\n    //get
          the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
          values: []
        timeout: 60
        verb: POST
        cache-response: no-cache
        stop-on-error: []
        target-url: $(target-url)
        persistent-connection: true
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;



          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg'); \nvar cfg={\n  \n    \n    \"responseName\":
                \"validateCertificateRs\",\n   \n    \n};\nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg');     \nvar cfg={\n  \n    \n    \"responseName\":
                \"validateCertificateRs\",\n     \"errorMap\" :{\n        \"ESBSCHEMA\"
                : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n   \n    \n};\n\n\nvar
                error = {\n  \"errorCode\": message[cfg.responseName].Header.ResponseStatus.Code,\n
                \ \"errorMessage\": {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\n\n\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
  properties:
    target-url:
      value: http://wps-wagesprotectionsystem-http-ace.apps.stg.qiwa-nonprod.local/qiwawps/compliance-certificate/validate
      description: The URL of the target service
      encoded: false
  cors:
    enabled: true
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
parameters:
  certificateNumber:
    in: path
    name: certificateNumber
    description: certificate number to validate
    required: true
    type: integer
    format: int32
  laborOfficeId:
    in: query
    name: laborOfficeId
    description: laborOfficeId
    required: true
    type: number
    format: float
  establishmentSequenceNumber:
    in: query
    name: establishmentSequenceNumber
    description: establishmentSequenceNumber
    required: true
    type: number
    format: float
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      headers:
        $ref: '#/definitions/Headers'
      certificateNumber:
        type: string
        example: 123456
      establishmentName:
        type: string
        example: 123456
      issueDate:
        type: string
        description: This date object will be used across the model with format yyyy-MM-dd
          for gregorian dates only
        example: "2017-12-31"
      expiryDate:
        type: string
        description: This date object will be used across the model with format yyyy-MM-dd
          for gregorian dates only
        example: "2017-12-31"
    required:
    - certificateNumber
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
paths:
  /compliance-certificate/{certificateNumber}/validate/:
    parameters:
    - name: certificateNumber
      in: path
      required: true
      description: certificate number to validate
      type: integer
      format: int32
    - name: laborOfficeId
      in: query
      required: true
      description: establishment sequence number
      type: number
      format: float
    - name: sequenceNumber
      in: query
      required: true
      description: establishment sequence number
      type: number
      format: float
    - name: X-IBM-Client-Id
      in: header
      required: true
      description: Client id issued by security server
      type: string
    - name: X-IBM-Client-Secret
      in: header
      required: true
      description: Client secret issued by security server
      type: string
    - name: X-Request-Id
      in: header
      required: false
      description: X-Request-Id returned in the response header
      type: string
    get:
      tags:
      - Validate Certificatre
      description: Service to validate and retrieve the certificate details from qiwa
        platfrom
      operationId: validateCertificateNumber
      produces:
      - application/json
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
