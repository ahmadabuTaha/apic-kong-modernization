swagger: "2.0"
info:
  title: Async Data History Revised
  x-ibm-name: async-data-history-revised
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientID: []
  clientSecret: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: ""
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |-
          var apim = require('apim');

          apim.setvariable('message.headers.Authorization','Basic bW9sX3VzcjpNMGxAZzBzaQ==');
          apim.setvariable('message.headers.Content-Type','application/json');
          apim.setvariable('message.headers.Accept','*/*');
          apim.setvariable('message.headers.Accept-Encoding','gzip, deflate, br');


          var message = apim.getvariable('message.body');
          var vID = message['GetLbrHistDataRq'].LaborId;

          var body = {
              ContributorHistoryEngagement(ID: vID ){
              BASICWAGE
              COMMERCIALREGISTRATIONNUMBER
              COMMISSION
              CONTRACTLASTMODIFIE
              CONTRACTTYPE
              EDUCATION
              EMAILID
              ENDDATE
              ENGAGEMENTLASTMODIFIE
              ENGAGEMENTSTATUS
              ESTABLISHMENTNAMEARB
              ESTABLISHMENTNAMEENG
              HOUSINGBENEFIT
              ID
              JOBTITLEARB
              JOBTITLEENG
              JOININGDATE
              LEAVINGDATE
              MOBILENUMBER
              MOLESTID
              MOLESTOFFICEID
              MOLOFFICEID
              MOLUNIID
              NATIONALUNIFIEDNO
              NOTICEPERIOD
              OCCUPATIONCODE
              OTHERALLOWANCE
              REASONFORLEAVING
              REGISTRATIONNUMBER
              SOCIALINSURANCENUMBER
              SPECIALIZATIONCODE
              STARTDATE
              STATUS
              WORKCITY
              WORKCOUNTRY
              WORKTYPE
                  }
          };

          session.output.write(body);
          //apim.setvariable('message.body',apim.getvariable('message.body'));

          apim.output('application/json');
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(dp-gosi-contract)/denodo-graphql-service/graphql/GOSI_MOL
        follow-redirects: false
        inject-proxy-headers: true
        username: mol_usr
        password: M0l@g0si
    catch: []
  properties: {}
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
paths:
  /getasynchistorydata:
    post:
      responses:
        "200":
          schema:
            type: string
          description: success
