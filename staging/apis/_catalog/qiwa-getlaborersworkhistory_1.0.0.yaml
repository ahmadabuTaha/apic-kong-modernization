      type: string
    - name: X-IBM-Client-Secret
      in: header
      required: true
      description: Client secret issued by security server
      type: string
    - name: X-Request-Id
      in: header
      required: false
      description: X-Request-Id returned in the response header
      type: string
    get:
      tags:
      - laborerworkhistory
      description: Service to retrieve the Laborer Work History details from qiwa
        platfrom
      operationId: GetLaborersWorkHistory
      produces:
