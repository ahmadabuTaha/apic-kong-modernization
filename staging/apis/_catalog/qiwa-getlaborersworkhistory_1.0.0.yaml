  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
