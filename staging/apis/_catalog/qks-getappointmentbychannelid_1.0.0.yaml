  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |2

          var url = context.get('target-url');

          var path = context.get('request.querystring');

          var callingUrl = url + '?' +path;

          context.set('callingUrl',callingUrl);
    - invoke:
        title: invoke
        version: 2.0.0
        verb: GET
        target-url: $(ace-kiosk)$(target-url)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blocklist
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        persistent-connection: true
    catch: []
    finally: []
  properties:
    target-url:
      value: /qks_proactive_management/v1/appointmentByChannelId
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
