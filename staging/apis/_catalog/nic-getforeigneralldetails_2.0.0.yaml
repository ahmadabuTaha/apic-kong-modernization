swagger: "2.0"
info:
  title: NIC_GetForeignerAlldetails
  x-ibm-name: nic-getforeigneralldetails
  version: 2.0.0
  description: This API exposes nic to get  foreigner information services from Qiwa
    platform
schemes:
- https
basePath: /nic/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
