swagger: "2.0"
info:
  title: QAAS_GetContractOccupationsList
  description: This service is used to Get Contract Occupations List.
  x-ibm-name: qaas_getcontractoccupationslist
  version: 1.0.0
schemes:
- https
basePath: /external/v1
securityDefinitions:
  OAuth2.0:
    type: oauth2
    x-ibm-oauth-provider: externaliamprovider
    flow: application
    tokenUrl: $(keycloak-token)/realms/TIP/protocol/openid-connect/token
    scopes:
      contract:scope: allow access to contract APIs
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
security:
- OAuth2.0:
  - contract:scope
  clientIdHeader: []
paths:
  /qaas/contract/getcnrctoccupation:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    get:
      tags:
      - QiwaAsAService
      description: This service is used to Get Contract Occupations List.
      operationId: qaasgetcontocc
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      occupationsList:
        $ref: '#/definitions/OccupationsList_Type'
      totalRecordsCount:
        type: integer
  OccupationsList_Type:
    type: array
    items:
      type: object
      description: This response object returned by the get operation
      properties:
        occupation:
          $ref: '#/definitions/Occupation_Type'
  Occupation_Type:
    type: object
    properties:
      occupationId:
        type: integer
      occupationNameEn:
        type: string
      occupationNameAr:
        type: string
      isForSaudiOnly:
        type: integer
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  laborerType:
    in: query
    name: laborerType
    description: |
      Type of laborer.   1 = Saudi,   2 = Foreigner.   Optional if ChannelId is "Qiwa" or "API", otherwise Mandatory.
    required: false
    type: integer
    enum:
    - 1
    - 2
  occupationId:
    in: query
    name: occupationId
    description: occupationId
    required: false
    type: integer
  occupationNameEn:
    in: query
    name: occupationNameEn
    description: occupationNameEn
    required: false
    type: string
  occupationNameAr:
    in: query
    name: occupationNameAr
    description: occupationNameAr
    required: false
    type: string
  pageSize:
    in: query
    name: pageSize
    description: pageSize
    required: true
    type: integer
    minimum: 1
    maximum: 100
  pageIndex:
    in: query
    name: pageIndex
    description: pageIndex
    required: true
    type: integer
    minimum: 1
  NationalUnifiedNumber:
    in: query
    name: unifiedNationalNumber
    description: unifiedNationalNumber
    required: true
    type: integer
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
        description: Id url encoded
  Response204:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        inputs:
          laborerType:
            schema:
              type: integer
              format: int32
            variable: request.parameters.laborerType
          occupationId:
            schema:
              type: integer
              format: int32
            variable: request.parameters.occupationId
          occupationNameEn:
            schema:
              type: string
            variable: request.parameters.occupationNameEn
          occupationNameAr:
            schema:
              type: string
            variable: request.parameters.occupationNameAr
          pageSize:
            schema:
              type: integer
              format: int32
            variable: request.parameters.pageSize
          pageIndex:
            schema:
              type: integer
              format: int32
            variable: request.parameters.pageIndex
        outputs:
          "":
            schema:
              type: object
              properties:
                LaborerType:
                  type: number
                OccupationId:
                  type: number
                OccupationNameEn:
                  type: string
                OccupationNameAr:
                  type: string
                PageSize:
                  type: number
                PageIndex:
                  type: number
            variable: message.body
            content: application/json
        actions:
        - set: .LaborerType
          from: laborerType
        - set: .OccupationId
          from: occupationId
        - set: .OccupationNameEn
          from: occupationNameEn
        - set: .OccupationNameAr
          from: occupationNameAr
        - set: .PageSize
          from: pageSize
        - set: .PageIndex
          from: pageIndex
        version: 2.0.0
        title: map
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n \nvar cfg={\n    \"serviceCode\" :
          \"GCFL0001\",\n    \"channelId\" : \"Qiwa\",\n    \"requestName\" : \"GetContractOccupationsListRq\",\n
          \   \"responseName\": \"GetContractOccupationsListRs\",\n    \"errorMap\"
          :{\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\n
          \   }\n};\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar AppcRequest
          = apim.getvariable('message.body');\r\n//delete AppcRequest.NationalUnifiedNumber;\r\nvar
          appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n\t\t\t
          \     \"DebugFlag\": 1\r\n\r\n        },\r\n        \"Body\" : AppcRequest\r\n
          \   }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\napim.setvariable('payload',appcReq);
          \   \r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: MainBE
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-cntmv2-getcon-details)/contractmanagement/getcontocclist
        follow-redirects: false
        inject-proxy-headers: true
        output: MainBERs
    - gatewayscript:
        version: 2.0.0
        title: PrepareReqForLogging
        source: "var apim=require('apim');\r\nvar appconnectrequest = apim.getvariable('payload');\r\nvar
          APIRes = apim.getvariable('MainBERs.body');\r\nvar appname = apim.getvariable('client.app.name');\r\nvar
          param = apim.getvariable('request.parameters.NationalUnifiedNumber');\r\nvar
          UDFPayload = {\r\n                \"KeyValueArr\": [\r\n                    {\r\n
          \                       \"key\": \"Product\",\r\n                        \"value\":
          \"QiwaAsService\"\r\n                    },\r\n                    {\r\n
          \                       \"key\": \"Client\",\r\n                        \"value\":
          appname\r\n                    }\r\n                ]\r\n            };\t
          \r\n\r\nappconnectrequest.GetContractOccupationsListRq.Header.UDF = UDFPayload;\r\nappconnectrequest.GetContractOccupationsListRq.Body
          = {\r\n    \"NationalUnifiedNumber\": param\r\n};\r\nvar jsonData= {\r\n\t\"LogAPIData\":
          {\r\n\t\t\"GetContractOccupationsListRq\": appconnectrequest.GetContractOccupationsListRq,\r\n\t\t\"GetContractOccupationsListRs\":
          APIRes.GetContractOccupationsListRs\r\n\t}\r\n}\r\nsession.output.write(jsonData);\r\napim.output('application/json');"
    - invoke:
        version: 2.3.0
        title: LoggingBE
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        websocket-upgrade: false
        graphql-send-type: detect
        target-url: $(ace-tip-internal)/external/logwrapperapidata
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');
          apim.output('application/json');
          var message = apim.getvariable('MainBERs.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
          apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
          apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');
          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: |-
                var apim = require('apim');
                var message = apim.getvariable('MainBERs.body');
                var cfg = apim.getvariable('cfg');
                var body = message[cfg.responseName].Body;
                session.output.write(body);
                apim.output('application/json');
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n \nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       //var
                errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n       //var
                details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 409;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n
                \nsession.output.write(error);\napim.output('application/json');          "
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
