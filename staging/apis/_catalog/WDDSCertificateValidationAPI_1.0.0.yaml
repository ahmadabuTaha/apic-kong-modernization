swagger: "2.0"
info:
  title: WDDS Certificate Validation API
  description: |
    Certificate validation endpoint of the Disbursement of Wage Deduction Service (WDDS), consumed by Knowledge Center to verify a "Disbursement of Wage Deduction" certificate.
    The caller supplies the certificate ID together with the establishment identifier (labor office ID + sequence number) and the certificate type.
    Authentication is service-to-service via a static API key.
  version: 1.0.0
  x-ibm-name: WDDSCertificateValidationAPI
  contact:
    name: WDDSCertificateValidationAPI
security:
- ClientSecret: []
  OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  ClientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientIdHeader:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
basePath: /qiwa
tags:
- name: CertificateValidation
  description: Certificate validation for Knowledge Center
paths:
  /api/certificate/validate:
    post:
      tags:
      - Certificate Validation
      summary: Validate certificate
      description: |
        Validates a certificate by certificate ID and establishment details. Returns certificate data when valid.
      operationId: validateCertificate
      parameters:
      - name: X-API-Key
        in: header
        required: true
        description: Shared static API key issued to Knowledge Center
        type: string
      - name: Accept-Language
        in: header
        required: false
        description: |
          Controls the language of the certificationType label in the response.
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/CertificateValidationRequest'
      responses:
        "200":
          description: Certificate is valid
          schema:
            $ref: '#/definitions/CertificateValidationResponseMessage'
        "400":
          description: |
            Bad request. Validation failed or certificate type / establishment does not match.
          schema:
            $ref: '#/definitions/CertificateValidationErrorResponse'
        "401":
          description: API key missing or invalid.
          schema:
            $ref: '#/definitions/CertificateValidationErrorResponse'
        "404":
          description: No certificate found.
          schema:
            $ref: '#/definitions/CertificateValidationErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/CertificateValidationErrorResponse'
definitions:
  CertificateValidationRequest:
    type: object
    required:
    - certificateType
    - certificateId
    - laborOfficeId
    - sequenceNumber
    properties:
      certificateType:
        type: integer
        format: int32
        description: WDDS certificate type. Must be 8.
        example: 8
      certificateId:
        type: string
        pattern: ^\d{6}-\d{8}$
        example: 042317-08841902
      laborOfficeId:
        type: string
        example: "9"
      sequenceNumber:
        type: string
        example: "1234"
  CertificateValidationResponseMessage:
    type: object
    properties:
      data:
        $ref: '#/definitions/CertificateValidationResponse'
  CertificateValidationResponse:
    type: object
    properties:
      certificationType:
        type: string
        example: Disbursement of Wage Deduction Certificate
      certificateId:
        type: string
        example: 042317-08841902
      establishmentNumber:
        type: string
        example: 9-1234
      establishmentName:
        type: string
        example: Takamol Holding
      certificateIssueDate:
        type: string
        format: date
        example: "2026-05-14"
      disbursementPeriod:
        type: integer
        format: int32
        example: 2025
  CertificateValidationErrorResponse:
    type: object
    properties:
      httpCode:
        type: integer
        format: int32
        example: 404
      messageDescription:
        type: string
        example: Certificate not found
      messageDetails:
        type: string
        example: Certificate with ID 042317-08841902 not found
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: false
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |
          var apikey = context.get('message.headers.ApiKeyAuth');
          context.set(
            'message.headers.X-API-Key',
            'cqh0NJRx8MVyUX6ixBfzk3CwbkuPZjTNodJrTx+UwRo='
          );
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: |
          https://disbursement-wage-deduction-api.qiwa.info/api/certificate/validate
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
schemes:
- https
