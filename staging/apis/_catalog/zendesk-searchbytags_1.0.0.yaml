swagger: "2.0"
info:
  title: Zendesk_SearchByTags
  x-ibm-name: zendesk-searchbytags
  version: 1.0.0
  description: This API will be consume by Robo Agent to get zendesk ticket by the
    tags
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth:
  - IntegrationScope
  clientID: []
  clientSecret: []
securityDefinitions:
  OAuth:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: ""
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |-
          var apim = require('apim');

          var query = apim.getvariable('request.parameters.query');

          if (!query){
              query = 1;
          }

          var baseurl = apim.getvariable('target-url');
          var url = baseurl +'?query=' + query;

          apim.setvariable('target-url',url);
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: GET
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-zen-zendesk)$(target-url)
        follow-redirects: false
        inject-proxy-headers: true
    catch: []
    finally: []
  properties:
    target-url:
      value: /zendesk/ticketing/v1/search
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
paths:
  /search:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    parameters:
    - name: query
      in: query
      required: true
      type: string
