  GetExternalContractListRq_BodyType:
    type: object
    properties:
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      CandidateId:
        type: string
      StatusList:
        type: array
        items:
          type: object
          properties:
            StatusId:
              type: integer
        required:
        - StatusId
      PageSize:
        type: integer
      PageIndex:
        type: integer
    required:
    - PageSize
    - PageIndex
  GetExternalContractListRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/GetExternalContractListRs_BodyType'
  GetExternalContractListRs_BodyType:
    type: object
    properties:
      ContractsList:
        type: array
        items:
          type: object
          properties:
            ContractId:
              type: integer
            CandidateName:
              type: string
            CandidateId:
              type: string
            ContractType:
              $ref: '#/definitions/CodeName_Type'
            CreatedBy:
              type: string
            CreationDate:
              type: string
              format: date-time
            ExpiryDate:
              type: string
              format: date-time
            Occupation:
              $ref: '#/definitions/CodeName_Type'
            Establishment:
              $ref: '#/definitions/Establishment_Type'
            WorkLocation:
              $ref: '#/definitions/CodeName_Type'
            StartDate:
              type: string
              format: date
            EndDate:
              type: string
              format: date
            Salary:
              type: number
              format: float
            LastUpdated:
              type: string
              format: date
            StatusId:
              $ref: '#/definitions/CodeName_Type'
        required:
        - ContractId
        - CandidateName
        - CandidateId
        - ContractTypeId
        - CreatedBy
        - CreationDate
        - ExpiryDate
        - OccupationId
        - Establishment
        - WorkLocationId
        - StartDate
        - EndDate
        - Salary
        - LastUpdated
        - StatusId
      TotalRecordsCount:
        type: integer
    required:
    - ContractsList
    - TotalRecordsCount
  CodeName_Type:
    type: object
    properties:
      Id:
        type: integer
      NameEn:
        type: string
      NameAr:
        type: string
    required:
