swagger: "2.0"
info:
  title: Qiwa_GetExternalContractList
  version: 1.0.0
  description: This service is used to retrieve list of contracts based on given establishment
    info or candidate
  x-ibm-name: qiwa_getexternalcontractlist
schemes:
- https
basePath: /workinsaudi
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /getexternalcontractlist:
    post:
      operationId: GetExternalContractList
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/GetExternalContractListRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: This service is used to retrieve list of contracts based on given
        establishment info or candidate
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/GetExternalContractListRq_MessageType'
        description: GetExternalContractList
        required: true
definitions:
  GetExternalContractListRq_MessageType:
    type: object
    properties:
      GetExternalContractListRq:
        $ref: '#/definitions/GetExternalContractListRq_Type'
  GetExternalContractListRs_MessageType:
    type: object
    properties:
      GetExternalContractListRs:
