                \                       \"value\": \"SPL\"\r\n                    },\r\n
                \                   {\r\n                        \"key\": \"Client\",\r\n
                \                       \"value\": appname\r\n                    }\r\n
                \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
                : {\r\n            \"language\": apim.getvariable('request.parameters.language'),\r\n
                \           \"format\": apim.getvariable('request.parameters.format'),\r\n
                \           \"encode\": apim.getvariable('request.parameters.encode'),\r\n
                \           \"lat\": apim.getvariable('request.parameters.lat'),\r\n
                \           \"long\": apim.getvariable('request.parameters.long')\r\n
                \       }\r\n            \r\n    }\r\n};\r\n\r\nif (typeof OperatorId
                !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo =
                {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\napim.setvariable('payload',appcReq);
                \    \r\n//session.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
                formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
                \   //get the day\r\n    //convert day to string\r\n    var day =
                d.getDate().toString();\r\n    //get the year\r\n    var year = d.getFullYear();\r\n
                \   var hour = d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
                \   var second = d.getSeconds().toString();\r\n    var millisecond
                = d.getMilliseconds().toString();\r\n    //pull the last two digits
                of the year\r\n    year = year.toString();\r\n    \r\n    //increment
                month by 1 since it is 0 indexed\r\n    //converts month to a string\r\n
                \   month = (month + 1).toString();\r\n\r\n    //if month is 1-9 pad
                right with a 0 for two digits\r\n    if (month.length === 1)\r\n        month
                = \"0\" + month;\r\n\r\n    //if day is between 1-9 pad right with
                a 0 for two digits\r\n    if (day.length === 1)\r\n        day = \"0\"
                + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\" +
                hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
                + minitue;\r\n\r\n    if (second.length === 1)\r\n        second =
                \"0\" + second;\r\n        \r\n    if (millisecond.length == 1)\r\n
                \       millisecond = \"00\" + millisecond;\r\n        \r\n    if
                (millisecond.length == 2)\r\n        millisecond = \"0\" + millisecond;\r\n
                \   \r\n    \r\n\r\n    //return the string \"MMddyy\"\r\n    return
                year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\" +
                second+\".\"+millisecond;\r\n}"
          - gatewayscript:
              version: 2.0.0
