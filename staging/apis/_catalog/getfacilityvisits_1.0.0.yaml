  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  UserId:
    in: header
    name: UserId
    description: UserI d
    required: false
    type: integer
    format: int32
  establishmentNumber:
    in: query
    name: establishmentNumber
    description: establishmentNumber
    required: false
    type: integer
    format: int32
  visitId:
    in: query
    name: visitId
    description: visitId
    required: false
    type: integer
    format: int32
  requestNumber:
    in: query
    name: requestNumber
    description: requestNumber
    required: false
    type: integer
    format: int32
  pageIndex:
    in: query
    name: pageIndex
    description: pageIndex
    required: false
    type: integer
    format: int32
  pageSize:
    name: pageSize
    in: query
    type: integer
    description: pageSize
    format: int32
  timeOffset:
    name: timeOffset
    in: query
    type: integer
    description: timeOffset
    format: int32
  lang:
    name: lang
    in: query
    type: integer
    description: lang
    format: int32
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      totalVisitCount:
        type: integer
        example: 1
      visits:
        type: array
        items:
          $ref: '#/definitions/visitsArray'
  visitsArray:
    type: object
    properties:
      visitId:
        type: string
        example: "1"
      activityId:
        type: string
        example: "1"
      activityName:
        type: string
        example: test activity
      typeId:
        type: integer
        example: "1"
      typeName:
        type: string
        example: test type
      locationCode:
        type: string
        example: "001"
      locationName:
        type: string
        example: test loc
      formId:
        type: string
        example: "1"
      formName:
        type: string
        example: test form
      inspectorId:
        type: string
        example: "1"
      inspectorCode:
        type: string
        example: "001"
      startDate:
        type: string
        example: 11-10-2023
      requestNumber:
        type: string
        example: "1"
      visitNumber:
        type: string
        example: "1"
      status:
        type: string
        example: test status
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
paths:
