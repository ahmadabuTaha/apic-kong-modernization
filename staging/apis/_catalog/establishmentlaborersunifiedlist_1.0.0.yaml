        title: ReqMapping
        source: "var apim = require('apim');\r\nvar reqPar = apim.getvariable('request.parameters');\r\nvar
          unifiedNationalNumber = reqPar.unifiedNationalNumber;\r\n//var pageSize
          = parseInt(reqPar.pageSize);\r\n//var pageIndex = parseInt(reqPar.pageIndex);\r\nvar
          pageSize = reqPar.pageSize;\r\nvar pageIndex = reqPar.pageIndex;\r\nvar
          Body = {\r\n            \"unifiedNationalNumber\": unifiedNationalNumber,\r\n
          \           \"pageSize\": pageSize,\r\n            \"pageIndex\": pageIndex\r\n
          \       }\r\n        \r\nsession.output.write(Body);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
          : \"MGVV0001\",\r\n    \"channelId\" : \"Qiwa\",\r\n    \"requestName\"
          : \"establishmentLaborersUnifiedListRq\",\r\n    \"responseName\": \"establishmentLaborersUnifiedListRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n\r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\n//var millisecondsvalue1 = apim.getvariable('session.globalTransactionID');\r\n\r\nvar
          appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"ExternalServices\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : apim.getvariable('message.body')\r\n            \r\n    }\r\n};\r\n\r\nif
          (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-tip-external)/external/establishmentlaborersunifiedlist
        follow-redirects: false
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\napim.output('application/json');\r\n\r\nvar
          message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\n\r\nvar
          response = message[cfg.responseName];\r\nvar Header = response.Header;\r\n\r\n//
          Header values\r\nvar TransactionId = Header.TransactionId;\r\nvar ChannelId
          = Header.ChannelId;\r\nvar RequestTime = Header.RequestTime;\r\nvar SessionId
          = Header.SessionId;\r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar
          MWResponseTime = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\nvar
          code = Header.ResponseStatus.Code;\r\n\r\n// Extract x-mofa-request-trace-id
          from UDF.KeyValueArr\r\nvar traceId = \"\";\r\nvar requestId = \"\";\r\n\r\nif
          (Header.UDF && Header.UDF.KeyValueArr) {\r\n\r\n    // Handle array response\r\n
          \   if (Array.isArray(Header.UDF.KeyValueArr)) {\r\n\r\n        for (var
          i = 0; i < Header.UDF.KeyValueArr.length; i++) {\r\n\r\n            var
          item = Header.UDF.KeyValueArr[i];\r\n\r\n            if (item.key === \"x-mofa-request-trace-id\")
          {\r\n                traceId = item.value;\r\n            }\r\n            if
          (item.key === \"x-mofa-request-id\") {\r\n                requestId = item.value;\r\n
          \           }            \r\n        }\r\n    }\r\n\r\n    // Handle single
          object response (safety check)\r\n    else {\r\n\r\n        if (Header.UDF.KeyValueArr.key
          === \"x-mofa-request-trace-id\") {\r\n            traceId = Header.UDF.KeyValueArr.value;\r\n
          \       }\r\n\r\n        if (Header.UDF.KeyValueArr.key === \"x-mofa-request-id\")
          {\r\n            requestId = Header.UDF.KeyValueArr.value;\r\n        }\r\n
          \   }\r\n}\r\n\r\n// Existing headers\r\napim.setvariable('message.headers.Transaction-Id',
          TransactionId, 'add');\r\napim.setvariable('message.headers.Channel-Id',
          ChannelId, 'add');\r\n\r\nif (RequestTime)\r\n    apim.setvariable('message.headers.RequestTime',
          RequestTime, 'add');\r\n\r\nif (SessionId)\r\n    apim.setvariable('message.headers.X-Request-Id',
          SessionId, 'add');\r\n\r\nif (MWRequestTime)\r\n    apim.setvariable('message.headers.MWRequestTime',
          MWRequestTime, 'add');\r\n\r\nif (MWResponseTime)\r\n    apim.setvariable('message.headers.MWResponseTime',
          MWResponseTime, 'add');\r\n\r\napim.setvariable('message.headers.Response-Status',
          status, 'add');\r\napim.setvariable('message.headers.Response-Code', code,
          'add');\r\napim.setvariable('message.headers.x-user-transaction-id', TransactionId,
          'add');\r\n\r\n// New header\r\nif (traceId)\r\n    apim.setvariable('message.headers.x-mofa-request-trace-id',
          traceId, 'add');\r\nif (requestId)\r\n    apim.setvariable('message.headers.x-mofa-request-id',
          requestId, 'add');    "
    - switch:
        version: 2.1.0
