              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\nsession.output.write(body);\r\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar responseStatus = message[cfg.responseName].Header.ResponseStatus;\r\nvar
                errorCode = responseStatus.Code;\r\nvar error = {\r\n    \"errorCode\":
                errorCode,\r\n    \"errorMessage\": {\r\n        \"en-US\": responseStatus.EnglishMsg,\r\n
                \       \"ar-SA\": responseStatus.ArabicMsg\r\n    }\r\n};\r\nvar
                httperror = 0;\r\n// Handle mapped errors\r\nif (cfg.errorMap && cfg.errorMap[errorCode])
                {\r\n    httperror = cfg.errorMap[errorCode].code;\r\n\r\n    // Custom
                response for ESBSCHEMA\r\n    if (errorCode === \"ESBSCHEMA\") {\r\n\r\n
                \       error = {\r\n            \"errorCode\": \"ESBSCHEMA\",\r\n
                \           \"errorMessage\": {\r\n                \"en-US\": \"Schema
                Validation Error\",\r\n                \"ar-SA\": \"حدث خطأ بالنظام\"\r\n
                \           }\r\n        };\r\n    }\r\n}\r\n\r\n// Default HTTP error\r\nif
                (httperror === 0) {\r\n    httperror = 409;\r\n}\r\napim.setvariable('message.status.code',
                httperror, 'set');\r\nsession.output.write(error);\r\napim.output('application/json');"
