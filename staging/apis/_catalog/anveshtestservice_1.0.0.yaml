swagger: "2.0"
info:
  title: TestRateLimit
  x-ibm-name: anveshtestservice
  version: 1.0.0
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: false
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\nvar body = apim.getvariable('request.body');\r\n\r\nif
          (body) {\r\n    var parsed = JSON.parse(body);\r\n\r\n    if (parsed.idNumber)
          {\r\n        apim.setvariable('ratelimit', parsed.idNumber.toString());\r\n
          \   }\r\n}"
    - ratelimit:
        version: 2.4.0
        title: ratelimit
        rate-limit-by: custom
        custom-key: $(ratelimit)
        rate: 5
        per: minute
        source: plan-default
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
basePath: /testcase
paths:
  /ratelimit:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    delete:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    head:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    patch:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    options:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
schemes:
- https
