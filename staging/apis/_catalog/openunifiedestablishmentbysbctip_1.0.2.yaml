swagger: "2.0"
info:
  title: OpenUnifiedEstablishmentBySBCTIP
  x-ibm-name: openunifiedestablishmentbysbctip
  version: 1.0.2
  description: This service is used to open a new unified establishment by SBC.
schemes:
- https
basePath: /qiwa/esb
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - parse:
        version: 2.1.0
        title: parse
        parse-settings-reference:
          default: apic-default-parsesettings
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\napim.setvariable('Tid',apim.getvariable('message.body.TransactionId'));\r\nconst
          isObjectEmpty = (objectName) => {\r\n  for (let prop in objectName) {\r\n
          \   if (objectName.hasOwnProperty(prop)) {\r\n      return false;\r\n    }\r\n
          \ }\r\n  return true;\r\n};\r\nvar request= apim.getvariable('message.body');\r\nvar
          LicensesLength,Activity,Capital,Management,Partner\r\nif(isObjectEmpty(request.CRInformation.LicenseList)
          != true){\r\nvar LicensesLength = Object.keys(request.CRInformation.LicenseList.License).length;\r\nif(isObjectEmpty(request.CRInformation)
          != true){\r\nvar LicensesLength = Object.keys(request.CRInformation.LicenseList.License).length;\r\nif(isObjectEmpty(request.CRInformation.CompanyCharacterIdList)
          != true ){\r\n\tif((request.CRInformation.CompanyCharacterIdList) == ''
          ){\r\nvar CharacterLength = Object.keys(request.CRInformation.CompanyCharacterIdList.CharacterId).length;\r\n}\r\n}\r\n}\r\n}\r\nif(isObjectEmpty(request.ActivityIdList)
          != true){\r\nvar Activity = Object.keys(request.ActivityIdList.ActivityId).length;\r\n}\r\nif(isObjectEmpty(request.CapitalDetails)
          != true){\r\nvar Capital = Object.keys(request.CapitalDetails.StockList.Stock).length;\r\n}\r\nif(isObjectEmpty(request.ManagementInformation)
          != true){\r\nvar Management = Object.keys(request.ManagementInformation.ManagerList.Manager).length;\r\n}\r\nif(isObjectEmpty(request.PartnerList)!=
          true){\r\nvar Partner = Object.keys(request.PartnerList.Partner).length;\r\n}\r\nif(LicensesLength
          == 1 ){\r\nvar OrginalLicense = request.CRInformation.LicenseList.License;\r\nvar
          newLicense = OrginalLicense[0];\r\nrequest.CRInformation.LicenseList.License
          = newLicense;\r\n}\r\nif(CharacterLength == 1 ){\r\nvar OrginalCharacter
          = request.CRInformation.CompanyCharacterIdList.CharacterId;\r\nvar newCharacter
          = OrginalCharacter[0];\r\nrequest.CRInformation.CompanyCharacterIdList.CharacterId
          = newCharacter;\r\n}\r\nif(Activity == 1 ){\r\nvar OrginalActivity = request.ActivityIdList.ActivityId;\r\nvar
          newActivity = OrginalActivity[0];\r\nrequest.ActivityIdList.ActivityId =
          newActivity;\r\n}\r\nif(Capital == 1 ){\r\nvar OrginalCapital = request.CapitalDetails.StockList.Stock;\r\nvar
          newCapital = OrginalCapital[0];\r\nrequest.CapitalDetails.StockList.Stock
          = newCapital;\r\n}\r\nif(Management == 1 ){\r\nvar OrginalManagement = request.ManagementInformation.ManagerList.Manager;\r\nvar
          newManagement = OrginalManagement[0];\r\nrequest.ManagementInformation.ManagerList.Manager
          = newManagement;\r\n}\r\nif(Partner == 1 ){\r\nvar OrginalPartner = request.PartnerList.Partner;\r\nvar
          newPartner = OrginalPartner[0];\r\nrequest.PartnerList.Partner = newPartner;\r\n}\r\n
          \r\n\r\nsession.output.write(request);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar appname = apim.getvariable('client.app.name');\r\nvar
          request = apim.getvariable('request.body');\r\nif (appname == 'hrsd-sbc')\r\n{\r\n
          \ var channelId = 'Omalaei';\r\n  \r\n    } else {\r\n        \r\n          var
          channelId = 'SBC';\r\n    }\r\nvar cfg={\r\n    \"serviceCode\" : \"OUESBC01\",\r\n
          \   \"channelId\" : channelId,\r\n    \"requestName\" : \"OpenUnifiedEstablishmentBySBCRq\",\r\n
          \   \"responseName\": \"OpenUnifiedEstablishmentBySBCRs\",\r\n    \"errorMap\"
          :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\r\n
          \   }\r\n    \r\n};\r\n\r\napim.setvariable('cfg',cfg);\r\nvar request=
          apim.getvariable('message.body');\r\n\r\ndelete request[\"TransactionId\"];\r\nsession.output.write(request);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nfunction
          CreateGuid() {  \r\n   function _p8(s) {  \r\n      var p = (Math.random().toString(16)+\"000000000\").substr(2,8);
          \ \r\n      return s ? \"-\" + p.substr(0,4) + \"-\" + p.substr(4,4) : p
          ;  \r\n   }  \r\n   return _p8() + _p8(true) + _p8(true) + _p8();  \r\n}
          \ \r\nvar guid = CreateGuid();\r\n\r\nif (cfg.channelId == 'SBC')\r\n{\r\n\r\nvar
          UDFVALUE = apim.getvariable('Tid');\r\n  \r\n    } else {\r\n        \r\n
          \         var UDFVALUE = guid;\r\n    }\r\n\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n
          \       \"Header\" : {\r\n            \"TransactionId\" :apim.getvariable('Tid'),\r\n
          \           \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {},\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          {\r\n                    \"key\": \"ReferenceNo\",\r\n                    \"value\":
          UDFVALUE\r\n                }\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : apim.getvariable('message.body')\r\n            \r\n    }\r\n};\r\n\r\nif
          (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-cmpm-open-file-with-cr)/estabmanagement/OpenUniEstBySBC
