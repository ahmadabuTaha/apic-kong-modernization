swagger: "2.0"
info:
  title: Validate JWT
  x-ibm-name: validate-jwt
  version: 3.0.0
schemes:
- https
basePath: /validate-jwt
security: []
securityDefinitions: {}
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: Get JWK
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: GET
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(api-qiwa-info-jwks)
        output: resp1
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |-
          var apim = require('apim');
          var resp1 = JSON.stringify(apim.getvariable('resp1.body'));
          apim.setvariable('jwk-key',resp1);
    - jwt-validate:
        version: 2.0.0
        title: jwt-validate
        jwt: request.headers.authorization
        output-claims: decoded.claims
        iss-claim: ""
        aud-claim: ""
        jws-jwk: jwk-key
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |-
          var apim = require('apim');
          var claims = JSON.stringify(apim.getvariable('decoded.claims'));
          var encodedClaims = new Buffer(claims).toString('base64');
          apim.setvariable('message.headers.payload',encodedClaims);
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
paths:
  /:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    post:
      responses:
        "200":
          description: success
