info:
  title: AddUpdateEstablishmentAddress
  x-ibm-name: addupdateestablishmentaddress
  version: 1.0.0
  description: |+
    This service specifies an Establishment address or updates the establishment address if it is already existed.
    This service will take :
    - The LaborOfficeId
    - The EstablishmentSequanceNumber
    - The EstablishmentId
    - The Address the contains (City, District, Street, BuildingNumber, POBox, ZIPCode, Latitude, Longitude, AddressDescription)



