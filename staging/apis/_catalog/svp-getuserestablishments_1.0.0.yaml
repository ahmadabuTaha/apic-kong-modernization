definitions:
  ResponseModel:
    type: object
    description: users information
    properties:
      userEstablishmentsList:
        properties:
          userEstablishmentsItem:
            type: array
            items:
              properties:
                authorizationType:
                  $ref: '#/definitions/AuthorizationTypeModel'
                establishment:
                  $ref: '#/definitions/EstablishmentModel'
                idNumber:
                  type: integer
                  example: "2125826541"
                UnifiedNumber:
                  type: string
                  example: "123456789"
                IsMainBranch:
                  type: boolean
  AuthorizationTypeModel:
    type: object
    properties:
      code:
        type: integer
        example: 55112
      name:
        type: string
        example: مسفر سلطان عايض الدوسري
      namelocal:
        type: string
        example: مسفر سلطان عايض الدوسري
  EstablishmentModel:
    type: object
    properties:
      name:
        type: string
        example: عايض
      laborOfficeId:
        type: integer
        example: 852
      sequenceNumber:
        type: integer
        example: 552626
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
parameters:
