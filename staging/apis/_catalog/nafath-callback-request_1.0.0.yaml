swagger: "2.0"
info:
  title: NafathCallBackRequest
  x-ibm-name: nafath-callback-request
  version: 1.0.0
  description: nafath-callback-request
schemes:
- https
basePath: /Nafath/Callback
security:
- ClientSecret: []
  OAuth2.0:
  - IntegrationScope
  clientID: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  ClientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    in: header
    x-key-type: client_id
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-nfth-nafath)/nafath/v1/callback
        persistent-connection: true
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.headers.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{     "errorCode": "E000500",     "errorMessage": "Internal server
              error"              }'
            type: string
    finally: []
  properties:
    target-url:
      value: http://nfth-nafath-http-ace.apps.stg.qiwa-nonprod.local/nafath/v1/callback
      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: header
    enabled: true
  application-authentication:
    certificate: false
  buffering: true
  catalogs: {}
tags:
- name: NafathCallback
  description: To get status
definitions:
  sendNAFATHStatusRequest:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        example: COMPLETED
      response:
        type: string
      transId:
        type: string
        example: "12"
  sendNAFATHStatusResponse:
    $ref: '#/definitions/sendNAFATHStatusResponseData'
  sendNAFATHStatusResponseData:
    type: object
    properties:
      code:
        type: string
        example: I000000
      description:
        type: string
        example: Success
  Status:
    type: string
    example: WAITING
    enum:
    - WAITING
    - EXPIRED
    - REJECTED
    - COMPLETED
    description: ' "WAITING": request still in progress.  "EXPIRED": request timed
      out  "REJECTED": request has been rejected by user.  "COMPLETED": user authenticated
      successfully '
paths:
  /status:
    post:
      description: This API initiates a new request within Nafath app for the tarsended
        User
      summary: Send Login Request
      tags:
      - NAFATH Login Request
      operationId: sendNAFATHStatusRequest
      deprecated: false
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - name: Request-ID
        in: header
        required: false
        type: string
        description: Request Unique Identifier
      - name: requestBody
        in: body
        required: true
        schema:
          $ref: '#/definitions/sendNAFATHStatusRequest'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sendNAFATHStatusResponse'
          headers: {}
