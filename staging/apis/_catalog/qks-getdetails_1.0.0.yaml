swagger: "2.0"
info:
  title: QKS GetDetails
  x-ibm-name: qks-getdetails
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://apic-gw-gateway-apic.apps.stg.qiwa-nonprod.local/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-kiosk)/qks_cache_managment/getDetails
        follow-redirects: false
        inject-proxy-headers: true
    catch: []
    finally: []
  properties:
    target-url:
      value: http://kiosk-http-ace.apps.stg.qiwa-nonprod.local/qks_cache_managment/getDetails
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
paths:
  /qksGetDetails:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
security:
- OAuth2.0:
  - IntegrationScope
  clientSecret: []
  clientID: []
