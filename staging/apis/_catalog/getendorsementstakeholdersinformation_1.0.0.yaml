      description: Update Refunded
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/GetEndorsementStakeholdersInformationRq_MessageType'
        description: The scope of this service is to retrieve endorsement details
          depending on search criteria provided.
        required: true
