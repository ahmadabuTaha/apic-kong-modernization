swagger: "2.0"
info:
  title: QAAS_EnableDisableSevhunVerifyOtp
  description: |
    This service is used to Enable or Disable the 700 by verifying otp received from user.
  x-ibm-name: qaas_enabledisablesevhunverifyotp
  version: 1.0.1
schemes:
- https
basePath: /external/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /qaas/enabledisablesevhun/verifyotp:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    post:
      tags:
      - qaas
      description: |
        This service is used to Enable or Disable the 700.
      operationId: verifySevhunOtp
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestBody'
        description: Request body
        required: true
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  RequestBody:
    type: object
    description: Response object returned by the get operation
    properties:
      idNumber:
        type: integer
        example: 1234567890
      serviceProviderId:
        type: string
        example: AlrajhiBankClient
      enabledNationalUnifiedNumber:
        type: array
        items:
          type: integer
          example: 7003700810
      disabledNationalUnifiedNumber:
        type: array
        items:
          type: integer
          example: 7003700809
      otp:
        type: string
        example: "0000"
    required:
    - idNumber
    - serviceProviderId
    - otp
  ResponseModel:
    type: object
    description: Response object returned by the get operation
    properties:
      status:
        type: string
        example: OTP verified successfully
      availableAttempts:
        type: integer
        example: 0
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      status: You can't generate new OTP code, use the current one
      traceId: 91b6e9062976a33a8a64d5b6d675903d
      availableAttempts: 0
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
        description: Id url encoded
  Response204:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response400:
    description: |
      The request was rejected by the server due to malformed syntax. Bad Request.
  Response401:
    description: |
      The request could not be completed due to lack of valid credentials. Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: |
      The request could not be completed because it is not authorized. Authorization.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: |
      The client did not produce a request within the time that the server was prepared to wait.
  Response409:
    description: |
      The request could not be completed due to a conflict with the current state of the resource. Usually business validation errors will be returned in the body.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: |
      The request was sent too many times in a given amount of time.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: |
      The server encountered an unexpected condition which prevented it from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: |
      The server does not support the functionality required and does not recognize the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: |
      The server encountered an unexpected condition which prevented it from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: |
      Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: payload
    error-content: payload
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"NDI00001\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
          : \"EnableDisableSevhunOTPVerifyRq\",\r\n    \"responseName\": \"EnableDisableSevhunOTPVerifyRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: RequestModification
        source: "var apim = require('apim');\r\n\r\nvar body = apim.getvariable('message.body');\r\n\r\nif
          (!body) return;\r\n\r\n/* ---------- Helper Function ---------- */\r\n\r\nfunction
          normalizeArrayField(body, fieldName) {\r\n\r\n    var field = body[fieldName];\r\n\r\n
          \   if (Array.isArray(field)) {\r\n\r\n        if (field.length === 0) {\r\n
          \           delete body[fieldName];\r\n        }\r\n        else if (field.length
          === 1) {\r\n            body[fieldName] = field[0];\r\n        }\r\n    }\r\n}\r\n\r\n/*
          ---------- New Structure Handling ---------- */\r\n\r\nif (Array.isArray(body.nationalUnifiedNumbers))
          {\r\n\r\n    var enabledArr = [];\r\n    var disabledArr = [];\r\n\r\n    body.nationalUnifiedNumbers.forEach(function(item){\r\n\r\n
          \       if (item.enabledNationalUnifiedNumber !== undefined) {\r\n            enabledArr.push(item.enabledNationalUnifiedNumber);\r\n
          \       }\r\n\r\n        if (item.disabledNationalUnifiedNumber !== undefined)
          {\r\n            disabledArr.push(item.disabledNationalUnifiedNumber);\r\n
          \       }\r\n\r\n    });\r\n\r\n    body.enabledNationalUnifiedNumber =
          enabledArr;\r\n    body.disabledNationalUnifiedNumber = disabledArr;\r\n\r\n
          \   delete body.nationalUnifiedNumbers;\r\n}\r\n\r\n/* ---------- Old Structure
          Normalization ---------- */\r\n\r\nnormalizeArrayField(body, \"enabledNationalUnifiedNumber\");\r\nnormalizeArrayField(body,
          \"disabledNationalUnifiedNumber\");\r\n\r\n/* ---------- Update Context
          ---------- */\r\n\r\napim.setvariable('message.body', body);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n
          \       \"Header\" : {\r\n            \"TransactionId\" : millisecondsvalue,\r\n
          \           \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')        \r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"QiwaAsService\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }      \r\n        },\r\n        \"Body\"
          : apim.getvariable('message.body')\r\n\r\n    }\r\n};\r\n\r\nif (typeof
          OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n\r\n
          \   //increment month by 1 since it is 0 indexed\r\n    //converts month
          to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if month
          is 1-9 pad right with a 0 for two digits\r\n    if (month.length === 1)\r\n
          \       month = \"0\" + month;\r\n\r\n    //if day is between 1-9 pad right
          with a 0 for two digits\r\n    if (day.length === 1)\r\n        day = \"0\"
          + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\" + hour;\r\n\r\n
          \   if (minitue.length === 1)\r\n        minitue = \"0\" + minitue;\r\n\r\n
          \   if (second.length === 1)\r\n        second = \"0\" + second;\r\n\r\n
          \   if (millisecond.length == 1)\r\n        millisecond = \"00\" + millisecond;\r\n\r\n
          \   if (millisecond.length == 2)\r\n        millisecond = \"0\" + millisecond;\r\n\r\n\r\n\r\n
          \   //return the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\"
          \"+hour + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-tip-qiwaasas)/enableDisableSevhun/verifyotp
        follow-redirects: false
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');
          apim.output('application/json');
          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
          apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
          apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');
          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.1.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\n\r\nsession.output.write(body);\r\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');          \r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
  buffering: true
