        maxLength: 128
      Name:
        type: string
      Surname:
        type: string
      Street:
        type: string
        maxLength: 50
        description: Street address of customer
      City:
        type: string
        maxLength: 50
      State:
        type: string
        maxLength: 3
      Country:
        type: string
        pattern: ^[A-Z]{2}$
        description: Alpha-2 country code
      PostCode:
        type: string
        maxLength: 50
    required:
    - Email
    - Name
    - Surname
    - Street
    - City
    - State
    - Country
    - PostCode
