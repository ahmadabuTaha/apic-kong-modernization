swagger: "2.0"
info:
  title: Monthly Report List
  x-ibm-name: monthly-report-list
  version: 1.0.0
  description: Swagger file for Monthly Report List
  termsOfService: ""
  contact:
    email: wajiha.altaf@royalcyber.com
schemes:
- https
basePath: /MonthlyReport
security:
- OAuth2.0:
  - IntegrationScope
securityDefinitions:
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: service_config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"EXCAV001\",\n
          \   \"channelId\" : \"Integration\",\n\t\"SessionId\" : \"212\",\n    \"requestName\"
          : \"MonthlyReportRq\",\n    \"responseName\": \"MonthlyReportRs\",\n    \"errorMap\"
          :{\n                              \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\n                          }\n    \n};\n\n\n\napim.setvariable('cfg',cfg);\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: build_headers
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\n\nvar appcReq
          = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          cfg.SessionId, //apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n\t\t\t\"MWRequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode\n\t\t\n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\" :
          OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: POST
        target-url: $(ace-prow-monthlyestreport)/external/GetMonthlyReportsList
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blocklist
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        stop-on-error:
        - OperationError
        - SOAPError
        - ConnectionError
        persistent-connection: true
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (message.body.MonthlyReportRs.Header.ResponseStatus.Code="00000000")
          execute:
          - map:
              version: 2.0.0
              title: map
              inputs:
                input:
                  schema:
                    type: object
                    properties:
                      MonthlyReportRs:
                        type: object
                        name: MonthlyReportRs
                        properties:
                          Body:
                            type: object
                            name: Body
                            properties:
                              MMYY:
                                type: array
                                name: MMYY
                  variable: message.body
                  content: application/json
              outputs:
                output:
                  schema:
                    type: object
                    properties:
                      MMYY:
                        type: array
                        name: MMYY
                  variable: message.body
                  content: application/json
              actions:
              - set: output.MMYY
                from: input.MonthlyReportRs.Body.MMYY
        - condition: (message.body.MonthlyReportRs.Header.ResponseStatus.Status="ERROR")
          execute: []
        - otherwise: []
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.headers.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{     "errorCode": "E000500",     "errorMessage": "Internal server
              error"              }'
            type: string
    finally: []
  properties:
    target-url:
      value: http://prow-monthlyestreport-http-ace.apps.stg.qiwa-nonprod.local/external/GetMonthlyReportsList
      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: header
    enabled: true
  buffering: true
  application-authentication:
    certificate: false
  catalogs: {}
tags:
- name: MonthlyReport
  description: To get monthy info for reporting purposes
