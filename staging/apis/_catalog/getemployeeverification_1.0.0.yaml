swagger: "2.0"
info:
  title: GetEmployeeVerification
  x-ibm-name: getemployeeverification
  version: 1.0.0
  description: This API exposes used to verify the existence of an employee in an
    establishment from “QIWA” through the Takamol integration platform
schemes:
- https
basePath: /employeeservices/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
