              type: integer
            variable: request.parameters.idNumber
          birthdate:
            schema:
              type: string
            variable: request.parameters.birthdate
          identifierType:
            schema:
              type: integer
            variable: request.parameters.identifierType
          identifier:
            schema:
              type: integer
            variable: request.parameters.identifier
