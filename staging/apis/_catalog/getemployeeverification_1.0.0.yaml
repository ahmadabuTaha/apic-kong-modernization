                idNumber:
                  type: number
                  name: idNumber
                birthDate:
                  type: string
                  name: birthDate
                identifierType:
                  type: string
                  name: identifierType
                identifier:
                  type: string
                  name: identifier
              example: "{\r\n            \"idNumber\": 1092437423,\r\n            \"birthDate\":
                \"1416-04-17\",\r\n            \"identifierType\": \"1\",\r\n            \"identifier\":
                \"1010506825\"\r\n        }"
            variable: message.body
            content: application/json
