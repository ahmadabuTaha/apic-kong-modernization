        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-employee)/external/getemployeeverification
    - gatewayscript:
        version: 2.0.0
