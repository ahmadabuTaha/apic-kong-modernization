          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\nvar
                apiRef = apim.getvariable('session.globalTransactionID');\nbody.transactionId
                = apiRef;\nsession.output.write(body);\napim.output('application/json');"
        - condition: (($header("Response-Code") = 'TIP00064'))
