    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /updateeconomicactivity:
    post:
      operationId: UpdateEconomicActivity
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/UpdateEconomicActivityRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: This service is used by the consumer to retrieve the economic activities.
      parameters:
      - name: X-Request-Id
        in: header
        description: X-Request-Id returned in the response header
        required: false
        type: string
      - name: X-IBM-Client-Secret
        in: header
        description: Client secret issued by security server
        required: true
        type: string
      - name: X-IBM-Client-Id
        in: header
        description: Client id issued by security server
        required: true
        type: string
      - name: body
        in: body
        schema:
          $ref: '#/definitions/UpdateEconomicActivityRq_MessageType'
        description: UpdateEconomicActivityRq
        required: true
