swagger: "2.0"
info:
  title: UpdateEconomicActivity
  version: 1.0.0
  description: This service is used by the consumer to update the Economic Activity
    details.
  x-ibm-name: updateeconomicactivity
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
