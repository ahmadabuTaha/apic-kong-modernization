swagger: "2.0"
info:
  title: GAS_GetISICActivities
  description: This service is used by the consumer to Get ISIC Activities from GAS
    through Takamol Internal/External Integration.
  x-ibm-name: gas-getisicactivities
  version: 1.0.0
schemes:
- https
basePath: /gas/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /activities/{chapterNumber}:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/chapterNumber'
    get:
      tags:
      - Isic Activities
      description: Service to get isic activities
      operationId: getIsicActivities
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      serviceError:
        $ref: '#/definitions/serviceErrorModel'
      isicActivityDetails:
        $ref: '#/definitions/isicActivityDetailsModel'
  serviceErrorModel:
    type: object
    properties:
      sourceAgency:
        type: string
        example: source agency
      errorType:
        type: string
        example: type of error
      raisedBy:
        type: string
        example: raised by
      code:
        $ref: '#/definitions/IntegerNumberModel'
      errorText:
        type: string
        example: error message
      insert:
        type: string
        example: insert
  isicActivityDetailsModel:
    type: object
    properties:
      chapterList:
        type: object
        properties:
          chapterInfo:
            $ref: '#/definitions/ChapterInfoModel'
  ChapterInfoModel:
    type: object
    properties:
      chapterKey:
        $ref: '#/definitions/IntegerNumberModel'
      chapterNumber:
        $ref: '#/definitions/IntegerNumberModel'
      chapterCodeEn:
        $ref: '#/definitions/LocaleDataModel'
      chapterCodeAr:
        $ref: '#/definitions/LocaleDataModel'
      chapterDescriptionEn:
        $ref: '#/definitions/LocaleDataModel'
      chapterDescriptionAr:
        $ref: '#/definitions/LocaleDataModel'
      chapterLevel:
        type: string
        example: level of chapter
      activitiesList:
        $ref: '#/definitions/ActivitiesListModel'
  ActivitiesListModel:
    type: object
    properties:
      activityInfo:
        type: array
        items:
          properties:
            activityKey:
              $ref: '#/definitions/IntegerNumberModel'
            activityCode:
              $ref: '#/definitions/IntegerNumberModel'
            activityDescriptionEn:
              $ref: '#/definitions/LocaleDataModel'
            activityDescriptionAr:
              $ref: '#/definitions/LocaleDataModel'
            activityLevel:
              type: string
              example: level of activity
            activityLicenseNeedFlag:
              $ref: '#/definitions/IntegerNumberModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: string
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: string
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
parameters:
  chapterNumber:
    in: path
    name: chapterNumber
    description: chapterNumber
    required: true
    type: integer
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response204:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          chapterNumber:
            schema:
              type: integer
            variable: request.parameters.chapterNumber
            content: application/json
        outputs:
          "":
            schema:
              description: ""
              type: object
              properties:
                chapterNumber:
                  type: number
                  name: chapterNumber
              example: "{\r\n       \"chapterNumber\": 1  \r\n    }"
            variable: message.body
            content: application/json
        actions:
        - set: .chapterNumber
          from: chapterNumber
        options:
          mapEnablePostProcessingJSON: true
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapReferenceLimit: 1
          includeEmptyXMLElements: false
          namespaceInheritance: false
          inlineNamespaces: false
          mapResolveApicVariables: false
          mapOptimizeSchemaDefinition: true
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"EXGIA0001\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"getIsicActivitiesRq\",\n
          \   \"responseName\": \"getIsicActivitiesRs\",\n    \"errorMap\" :{\n        \"ESBSCHEMA\"
          : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n    \n};\n\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-gas)/external/getisicactivities
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\napim.output('application/json');\r\nvar
          message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          Header = message[cfg.responseName].Header;\r\nvar TransactionId = Header.TransactionId;\r\nvar
          ChannelId = Header.ChannelId;\r\nvar RequestTime = Header.RequestTime;\r\nvar
          SessionId = Header.SessionId; \r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar
          MWResponseTime = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\nvar
          code = Header.ResponseStatus.Code;\r\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\r\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\r\nif
          (RequestTime !== 'undefined')\r\napim.setvariable('message.headers.RequestTime',RequestTime,'add');\r\nif
          (SessionId !== 'undefined')\r\napim.setvariable('message.headers.X-Request-Id',SessionId,'add');\r\nif
          (MWRequestTime !== 'undefined')\r\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\r\nif
          (MWResponseTime !== 'undefined')\r\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\r\napim.setvariable('message.headers.Response-Status',status,'add');\r\napim.setvariable('message.headers.Response-Code',code,'add');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    description: ""
                    type: object
                    properties:
                      ChaptersList:
                        type: object
                        properties:
                          xmlns:
                            type: string
                            name: xmlns
                          ChapterInfo:
                            type: object
                            properties:
                              ChapterKey:
                                type: string
                                name: ChapterKey
                              ChapterNo:
                                type: string
                                name: ChapterNo
                              ChapterCodeEn:
                                type: string
                                name: ChapterCodeEn
                              ChapterCodeAr:
                                type: string
                                name: ChapterCodeAr
                              ChapterDescriptionEn:
                                type: string
                                name: ChapterDescriptionEn
                              ChapterDescriptionAr:
                                type: string
                                name: ChapterDescriptionAr
                              ChapterLevel:
                                type: string
                                name: ChapterLevel
                              ActivitiesList:
                                type: object
                                properties:
                                  ActivityInfo:
                                    type: array
                                    items:
                                      properties:
                                        ActivityKey:
                                          type: string
                                          name: ActivityKey
                                        ActivityCode:
                                          type: string
                                          name: ActivityCode
                                        ActivityDescriptionEn:
                                          type: string
                                          name: ActivityDescriptionEn
                                        ActivityDescriptionAr:
                                          type: string
                                          name: ActivityDescriptionAr
                                        ActivityLevel:
                                          type: string
                                          name: ActivityLevel
                                      type: object
                                    name: ActivityInfo
                                name: ActivitiesList
                            name: ChapterInfo
                        name: ChaptersList
                    example: "{\r\n            \"ChaptersList\": {\r\n                \"xmlns\":
                      \"http://yefi.gov.sa/gas/ISICActivitiesSchema/xml/schemas/version4.0\",\r\n
                      \               \"ChapterInfo\": {\r\n                    \"ChapterKey\":
                      \"45861\",\r\n                    \"ChapterNo\": \"1\",\r\n
                      \                   \"ChapterCodeEn\": \"A\",\r\n                    \"ChapterCodeAr\":
                      \"أ\",\r\n                    \"ChapterDescriptionEn\": \"Agriculture,
                      Forestry and Fishing\",\r\n                    \"ChapterDescriptionAr\":
                      \"الزراعة والحراجة وصيد الأسماك\",\r\n                    \"ChapterLevel\":
                      \"1\",\r\n                    \"ActivitiesList\": {\r\n                        \"ActivityInfo\":
                      [\r\n                            {\r\n                                \"ActivityKey\":
                      \"48042\",\r\n                                \"ActivityCode\":
                      \"011101\",\r\n                                \"ActivityDescriptionEn\":
                      \"Grain cultivation includes (wheat, barley, yellow and white
                      corn etc.)\",\r\n                                \"ActivityDescriptionAr\":
                      \"زراعة الحبوب  ، يشمل ( القمح والشعير وحبوب الذرة الصفراء والبيضاء
                      ..الخ )\",\r\n                                \"ActivityLevel\":
                      \"6\"\r\n                            }\r\n\t\t\t\t\t\t\t]\r\n\t\t\t\t\t\t\t}\r\n\t\t\t\t\t\t\t}\r\n\t\t\t\t\t\t\t}\r\n\t\t\t\t\t\t\t}"
                  variable: message.body
                  content: application/json
              outputs:
                "":
                  schema:
                    $ref: '#/definitions/ResponseModel'
                  variable: message.body
                  content: application/json
              actions:
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterKey
                from: .ChaptersList.ChapterInfo.ChapterKey
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterNumber
                from: .ChaptersList.ChapterInfo.ChapterNo
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterCodeEn
                from: .ChaptersList.ChapterInfo.ChapterCodeEn
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterCodeAr
                from: .ChaptersList.ChapterInfo.ChapterCodeAr
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterDescriptionEn
                from: .ChaptersList.ChapterInfo.ChapterDescriptionEn
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterDescriptionAr
                from: .ChaptersList.ChapterInfo.ChapterDescriptionAr
              - set: .isicActivityDetails.chapterList.chapterInfo.chapterLevel
                from: .ChaptersList.ChapterInfo.ChapterLevel
              - set: .isicActivityDetails.chapterList.chapterInfo.activitiesList
                from: .ChaptersList.ChapterInfo.ActivitiesList
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                namespaceInheritance: false
                inlineNamespaces: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
