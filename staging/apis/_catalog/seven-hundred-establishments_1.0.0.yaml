swagger: "2.0"
info:
  title: Seven Hundred Dashboard – Establishment Cards
  x-ibm-name: seven-hundred-establishments
  version: 1.0.0
  description: |
    Returns a paginated list of establishment cards under a given Nitaqat EntityNumber.
    Called lazily when the user expands an entity card (not on initial page load).
  contact:
    email: a.imtiaz-c@takamol.sa
schemes:
- https
basePath: /seven-hundred-dashboard
consumes:
- application/json
produces:
- application/json
security:
- OAuth2.0:
  - IntegrationScope
  clientID: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  properties:
    target-url:
      value: http://prow-700dashboard-http-ace.apps.stg.qiwa-nonprod.local/sevenhundreddashboard
      description: ACE backend base URL for 700 Dashboard service
      encoded: false
  type: rest
  phase: realized
  enforced: true
  testable: true
  buffering: true
  application-authentication:
    certificate: false
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-prow-sevenhundredestablishments)/seven-hundred-dashboard/establishments
        follow-redirects: false
        inject-proxy-headers: true
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
tags:
- name: Establishment Cards
  description: Paginated establishment cards under a Nitaqat entity
definitions:
  RequestHeader:
    type: object
    required:
    - TransactionId
    - ChannelId
    - SessionId
    - ServiceCode
    properties:
      TransactionId:
        type: string
        description: Unique transaction identifier
        example: "1234436"
      ChannelId:
        type: string
        description: Calling channel
        default: Qiwa
      SessionId:
        type: string
        example: "212"
      RequestTime:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00.000Z"
      MWRequestTime:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00.000Z"
      ServiceCode:
        type: string
        description: Must be QW700003
        default: QW700003
      UserInfo:
        type: object
        properties:
          UserId:
            type: string
            example: "123456"
          IDNumber:
            type: string
            example: "1098765432"
  ResponseStatus:
    type: object
    properties:
      Status:
        type: string
        example: Success
      Code:
        type: string
        example: "00000000"
      ArabicMsg:
        type: string
        example: تمت العملية بنجاح
      EnglishMsg:
        type: string
        example: Success
  ResponseHeader:
    type: object
    properties:
      TransactionId:
        type: string
        example: "1234436"
      ChannelId:
        type: string
        default: Qiwa
      SessionId:
        type: string
        example: "212"
      RequestTime:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00.000Z"
      MWRequestTime:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00.000Z"
      MWResponseTime:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00.085Z"
      ServiceCode:
        type: string
        example: QW700003
      ResponseStatus:
        $ref: '#/definitions/ResponseStatus'
  Get700EstablishmentsRequest:
    type: object
    properties:
      Get700EstablishmentsRq:
        type: object
        required:
        - Header
        - Body
        properties:
          Header:
            $ref: '#/definitions/RequestHeader'
          Body:
            $ref: '#/definitions/Get700EstablishmentsReqBody'
  Get700EstablishmentsReqBody:
    type: object
    required:
    - EntityNumber
    - PageIndex
    - PageSize
    properties:
      EntityNumber:
        type: string
        description: Nitaqat entity number (from entity card)
        example: 9-144862-460
      PageIndex:
        type: integer
        minimum: 1
        description: 1-based page number
        example: 1
      PageSize:
        type: integer
        minimum: 5
        maximum: 15
        description: Number of establishment rows per page (5–15)
        example: 10
  Get700EstablishmentsResponse:
    type: object
    properties:
      Get700EstablishmentsRs:
        type: object
        properties:
          Header:
            $ref: '#/definitions/ResponseHeader'
          Body:
            $ref: '#/definitions/Get700EstablishmentsRsBody'
  Get700EstablishmentsRsBody:
    type: object
    properties:
      TotalEstablishmentCount:
        type: integer
        description: Total number of establishments across all pages
        example: 91
      Establishments:
        type: array
        items:
          $ref: '#/definitions/EstablishmentCard'
  EstablishmentCard:
    type: object
    properties:
      EstablishmentName:
        type: string
        description: Name of the establishment
        example: Riyadh Branch
      EconomicActivity:
        type: string
        description: Economic activity sector
        example: Transportation
      EstablishmentID:
        type: integer
        description: Establishment identifier (LaborOffice-Sequence format)
        example: 597936
      LaborOfficeId:
        type: integer
        description: Labor Office Id
        example: 3
      SequenceNumber:
        type: integer
        description: Sequence Number
        example: 33660
paths:
  /establishments:
    post:
      tags:
      - Establishment Cards
      summary: Get Paginated Establishment List under an Entity
      description: |
        Returns a paginated list of establishments under the given EntityNumber.
        Called lazily when the user expands an entity card (not on page load).
      operationId: get700Establishments
      parameters:
      - name: body
        in: body
        required: true
        description: Get700EstablishmentsRq message
        schema:
          $ref: '#/definitions/Get700EstablishmentsRequest'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/Get700EstablishmentsResponse'
          examples:
            application/json: |
              {
                "Get700EstablishmentsRs": {
                  "Header": {
                    "TransactionId": "1234436",
                    "ChannelId": "Qiwa",
                    "SessionId": "212",
                    "RequestTime": "2026-01-01T00:00:00.000Z",
                    "MWRequestTime": "2026-01-01T00:00:00.000Z",
                    "MWResponseTime": "2026-01-01T00:00:00.085Z",
                    "ServiceCode": "QW700003",
                    "ResponseStatus": {
                      "Status": "Success",
                      "Code": "00000000",
                      "ArabicMsg": "تمت العملية بنجاح",
                      "EnglishMsg": "Success"
                    }
                  },
                  "Body": {
                    "TotalEstablishmentCount": 91,
                    "Establishments": [
                      {
                        "EstablishmentName": "Riyadh Branch",
                        "EconomicActivity": "Transportation",
                        "EstablishmentID": 597936,
                        "LaborOfficeId": 11,
                        "SequenceNumber": 3659814
                      },
                      {
                        "EstablishmentName": "Jeddah Branch",
                        "EconomicActivity": "Transportation",
                        "EstablishmentID": 597855,
                        "LaborOfficeId": 11,
                        "SequenceNumber": 3659813
                      },
                      {
                        "EstablishmentName": "Madinah Branch",
                        "EconomicActivity": "Transportation",
                        "EstablishmentID": 562254,
                        "LaborOfficeId": 11,
                        "SequenceNumber": 3659812
                      }
                    ]
                  }
                }
              }
        "400":
          description: Bad Request – missing or invalid EntityNumber
        "500":
          description: Internal Server Error
