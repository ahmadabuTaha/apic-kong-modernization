    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - in: header
      name: X-Request-Id
      description: X-Request-Id returned in the response header
      required: false
      type: string
    post:
      tags:
      - QWallet Cashout Request
      description: Service to to approve the transfer of QWallet balance to bank account.
      operationId: qwalletcashoutrequestapproval
      parameters:
      - name: body
