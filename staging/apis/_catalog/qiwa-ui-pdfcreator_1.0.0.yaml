swagger: "2.0"
info:
  title: Qiwa_UI_PDFCreator
  x-ibm-name: qiwa-ui-pdfcreator
  version: 1.0.0
  description: PDFCreator
schemes:
- https
basePath: /invoicesmanagement
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-uim-unifiedinvoices)/invoicesmanagement/pdfcreator
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
definitions:
  PDFCreatorRq_MessageType:
    type: object
    properties:
      PDFCreatorRq:
        $ref: '#/definitions/PDFCreatorRq_Type'
  PDFCreatorRs_MessageType:
    type: object
    properties:
      PDFCreatorRs:
        $ref: '#/definitions/PDFCreatorRs_Type'
  PDFCreatorRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/PDFCreatorRq_BodyType'
  PDFCreatorRq_BodyType:
    type: object
    properties:
      Invoice:
        $ref: '#/definitions/InvoiceModel'
    required:
    - Invoice
  InvoiceModel:
    type: object
    properties:
      QRTags:
        type: array
        items:
          $ref: '#/definitions/itemModel'
      Lang:
        type: string
      InvoiceNumber:
        type: string
      InvoiceIssueDate:
        type: string
      DateOfSupply:
        type: string
      Seller:
        $ref: '#/definitions/SellerModel'
      Buyer:
        $ref: '#/definitions/BuyerModel'
      LineItems:
        type: array
        items:
          $ref: '#/definitions/LineItemsModel'
      TotalEV:
        type: string
      Discount:
        type: string
      TotalTaxAmount:
        type: string
      TotalVAT:
        type: string
      TotalAmountDue:
        type: string
    required:
    - QRTags
    - Lang
    - InvoiceNumber
    - InvoiceIssueDate
    - DateOfSupply
    - Seller
    - Buyer
    - LineItems
    - TotalEV
    - Discount
    - TotalTaxAmount
    - TotalVAT
    - TotalAmountDue
  itemModel:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  SellerModel:
    type: object
    properties:
      Name:
        type: string
      BuildingNo:
        type: string
      StreetName:
        type: string
      District:
        type: string
      City:
        type: string
      Country:
        type: string
      AdditionalNumber:
        type: string
      VATNumber:
        type: string
      OtherSellerID:
        type: string
    required:
    - Name
    - BuildingNo
    - StreetName
    - District
    - City
    - Country
    - AdditionalNumber
    - VATNumber
    - OtherSellerID
  BuyerModel:
    type: object
    properties:
      Name:
        type: string
      BuildingNo:
        type: string
      StreetName:
        type: string
      District:
        type: string
      City:
        type: string
      Country:
        type: string
      AdditionalNumber:
        type: string
      VATNumber:
        type: string
      OtherBuyerID:
        type: string
    required:
    - Name
    - BuildingNo
    - StreetName
    - District
    - City
    - Country
    - AdditionalNumber
    - VATNumber
    - OtherBuyerID
  LineItemsModel:
    type: object
    properties:
      ItemSubtotal:
        type: string
      TaxAmount:
        type: string
      TaxRate:
        type: string
      Discount:
        type: string
      TaxableAmount:
        type: string
      Quantity:
        type: string
      UnitPrice:
        type: string
      Services:
        type: string
    required:
    - ItemSubtotal
    - TaxAmount
    - TaxRate
    - Discount
    - TaxableAmount
    - Quantity
    - UnitPrice
    - Services
  PDFCreatorRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/PDFCreatorRs_BodyType'
  PDFCreatorRs_BodyType:
    type: object
    properties:
      PDFObjectResult:
        type: string
    required:
    - PDFObjectResult
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  UDF_Type:
    type: object
    properties:
      KeyValueArr:
        type: array
        items:
          $ref: '#/definitions/KeyValueArr_Type'
  KeyValueArr_Type:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  Tmstmp_Type:
    type: object
  UserInfo_Type:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: integer
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Code
    - Status
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
paths:
  /pdfcreator:
    post:
      operationId: PDFCreator
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/PDFCreatorRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: PDFCreator
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/PDFCreatorRq_MessageType'
        description: 'PDFCreator '
        required: true
