swagger: "2.0"
info:
  title: BI Dashboard GetAllDasboards
  x-ibm-name: bi-dashboard-getalldasboards
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: GET
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-rept-bidashboard)/bidashboard/dashboardmgmt/getAllDasboards
        follow-redirects: false
        inject-proxy-headers: true
    - set-variable:
        version: 2.0.0
        title: set-variable
        actions:
        - set: message.headers.content-type
          value: application/json
          type: string
    catch: []
    finally: []
  properties: {}
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
  application-authentication:
    certificate: false
  catalogs: {}
paths:
  /getAllDasboards:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
