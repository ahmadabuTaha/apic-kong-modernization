          \   if (value !== undefined &&\r\n        value !== null &&\r\n        value
          !== '') {\r\n\r\n        query.push(name + '=' + encodeURIComponent(value));\r\n
          \   }\r\n}\r\n\r\naddParam('page');\r\naddParam('limit');\r\naddParam('occupation');\r\naddParam('nationality');\r\n\r\n//
