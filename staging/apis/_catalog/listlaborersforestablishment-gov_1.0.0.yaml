          appconnectrequest.ListLaborersforEstablishmentRq,\r\n\t\t\"ListLaborersforEstablishmentRs\":
          APIRes,\r\n\t}\r\n}\r\nsession.output.write(jsonData);\r\napim.output('application/json');"
    - invoke:
        version: 2.3.0
