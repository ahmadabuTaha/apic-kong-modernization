swagger: "2.0"
info:
  title: TIPMockService
  x-ibm-name: tipmockservice
  version: 1.0.0
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - switch:
        version: 2.1.0
        title: switch
        case:
        - condition: ($operationPath() = '/tip-mock-service')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\r\nvar externalURL = apim.getvariable('request.headers.ExtUrl');\r\nvar
                uri = apim.getvariable('request.headers.URI');\r\n\r\nvar targetURL;\r\n\r\nif
                (externalURL !== '') {\r\n    targetURL = '$(ace-tip-internal)/mock-service/'
                + externalURL + '/' + uri;\r\n} else {\r\n    targetURL = '$(ace-tip-internal)/mock-service/*/'
                + uri;\r\n}\r\napim.setvariable('message.target-url', targetURL);\r\n"
          - invoke:
              version: 2.0.0
              title: invoke
              backend-type: detect
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: keep
              chunked-uploads: true
              persistent-connection: true
              target-url: $(message.target-url)
              follow-redirects: false
              inject-proxy-headers: true
        - condition: ($operationPath() = '/tip-mock-service/insert')
          execute:
          - invoke:
              version: 2.3.0
              title: invoke
              backend-type: detect
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: keep
              chunked-uploads: true
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              graphql-send-type: detect
              target-url: $(ace-tip-internal)/mockservice/insert
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
basePath: /api/v1
paths:
  /tip-mock-service:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    delete:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    head:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    patch:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
  /tip-mock-service/insert:
    parameters:
    - name: isenabled
      in: header
      type: boolean
    - name: uri
      in: header
      type: string
    - name: description
      in: header
      type: string
schemes:
- https
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: false
    type: string
  uri:
    in: header
    name: URI
    description: URI
    required: false
    type: string
  externalurl:
    in: header
    name: ExtUrl
    description: ExtUrl
    required: false
    type: string
