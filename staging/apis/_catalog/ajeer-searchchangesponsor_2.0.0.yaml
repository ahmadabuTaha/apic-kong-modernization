      DestEstablishmentTypeId:
        type: integer
      DestSevenHundredNo:
        type: integer
      DestUseUnifiedNationalNoFlag:
        type: integer
      RequestNumber:
        type: string
    required:
    - LaborerDetails
    - RequestDetails
    - SponsorId
    - SourceDetails
    - TransferType
    - Status
    - NICRejectionId
    - RejectionDescription
    - CSRelatedContractId
    - ReleaseDate
    - ReleaseDateType
    - RemainingDays
    - CurrentContractId
    - RequestNumber
  Status_Type:
    type: object
    properties:
      StatusId:
        type: integer
      StatusEn:
        type: string
      StatusAr:
        type: string
