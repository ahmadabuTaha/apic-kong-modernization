swagger: "2.0"
info:
  title: OpenUnifiedEstablishmentByCRv2V2
  version: 1.0.0
  description: |
    This service is used to open a unified establishment by CR number.
  x-ibm-name: openunifiedestablishmentbycrv2v2
basePath: /estabmanagement
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
schemes:
- https
paths:
  /openuniestbycrv2:
    post:
      operationId: OpenUnifiedEstablishmentByCRv2V2
      summary: Open Unified Establishment By CR V2
      description: Creates a new unified establishment record using a CR number.
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        description: OpenUnifiedEstablishmentByCRv2Rq
        required: true
        schema:
          $ref: '#/definitions/OpenUnifiedEstablishmentByCRv2Rq_MessageType'
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/OpenUnifiedEstablishmentByCRv2Rs_MessageType'
