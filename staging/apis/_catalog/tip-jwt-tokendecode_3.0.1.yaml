swagger: "2.0"
info:
  title: TIP-JWT-TokenDecode
  x-ibm-name: tip-jwt-tokendecode
  version: 3.0.1
schemes:
- https
basePath: /jwt2
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim'); \nvar authHeader = apim.getvariable('request.headers.Authorization');\nvar
          request = apim.getvariable('request.body');\nvar reqUnifiedNationalNumber
          = request.CreateNewContractRq.Body.EstablishmentDetails.UnifiedNumberId;\nvar
          base64Url = authHeader.split('.')[1];\nvar base64 = base64Url.replace('-',
          '+').replace('_', '/');\nvar decodedData = JSON.parse(Buffer.from(base64,
          'base64'));\nvar tokenUnifiedNationalNumbers = decodedData.UnifiedNationalNumbers;\n
          \nif(tokenUnifiedNationalNumbers.includes(reqUnifiedNationalNumber)){\nsession.output.write(request);\n}else{\ncontext.reject(\"Forbidden\",
          \"UnifiedNationalId id Not valid\");\n    context.message.statusCode = 403;\n
          \   context.message.body.write({\n        error: \"UnifiedNationalId id
          Not valid\"\n    });\n    context.message.headers[\"Content-Type\"] = \"application/json\";\n}"
    - invoke:
        version: 2.2.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        graphql-send-type: detect
        websocket-upgrade: false
        target-url: $(ace-cntmv2-contractcreates)/contractmanagement/createnewcontract
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
paths:
  /decode:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
