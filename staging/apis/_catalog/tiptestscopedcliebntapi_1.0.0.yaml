swagger: "2.0"
info:
  title: TIPTestScopedCliebntAPI
  x-ibm-name: tiptestscopedcliebntapi
  version: 1.0.0
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(target-url)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: allowlist
          values: []
        header-control:
          type: blocklist
          values: []
        inject-proxy-headers: true
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
basePath: /tiptestscopedcliebntapi
paths:
  /:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    delete:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    head:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    patch:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
securityDefinitions:
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
  tipAccesCodeOauth2:
    type: oauth2
    x-ibm-oauth-provider: scopedtipoauthprovider
    flow: accessCode
    authorizationUrl: https://$(catalog.url)/tip-auth2/jwt/oauth2/authorize
    tokenUrl: https://$(catalog.url)/tip-auth2/jwt/oauth2/token
    scopes:
      client_data_read: Client can read only its own data
      client_data_write: Client can write only its own data
      all_client_data_read: Whitelisted Client can read all clients data
      all_client_data_write: Whitelisted Client can write all clients data
security:
- clientID: []
  tipAccesCodeOauth2: []
schemes:
- https
