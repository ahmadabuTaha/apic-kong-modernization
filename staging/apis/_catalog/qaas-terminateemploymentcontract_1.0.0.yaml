  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: NUN Validation
        source: "var apim = require('apim'); \r\nvar authHeader = apim.getvariable('request.headers.Authorization');\r\nvar
          request = apim.getvariable('request.body');\r\nvar param = apim.getvariable('request.headers.NationalUnifiedNumber');\r\n//
          Check if UnifiedNumberId exists in the request body\r\nif (!param) {\r\n
          \   context.reject(\"ValidationError\", \"NationalUnifiedNumber is missing
          in the request body\");\r\n    context.message.statusCode = 400; // Bad
          Request\r\n    context.message.body.write({\r\n        error: \" NationalUnifiedNumber
          is required and must be included in the request body\"\r\n    });\r\n    context.message.headers[\"Content-Type\"]
          = \"application/json\";\r\n    // Exit early as the validation failed\r\n
          \   return;\r\n}\r\n\r\n//var reqNationalUnifiedNumber = param.NationalUnifiedNumber;\r\nvar
          base64Url = authHeader.split('.')[1];\r\nvar base64 = base64Url.replace('-',
          '+').replace('_', '/');\r\nvar decodedData = JSON.parse(Buffer.from(base64,
          'base64'));\r\nvar tokenUnifiedNationalNumbers = decodedData.UnifiedNationalNumbers;\r\n\r\n//
          Check if the UnifiedNumberId exists in the token's UnifiedNationalNumbers\r\nif
          (tokenUnifiedNationalNumbers.includes(param)) {\r\n    session.output.write(request);\r\n}
          else {\r\n    context.reject(\"Forbidden\", \"NationalUnifiedNumber is not
          valid\");\r\n    context.message.statusCode = 403; // Forbidden\r\n    context.message.body.write({\r\n
          \       error: \"NationalUnifiedNumber is not valid\"\r\n    });\r\n    context.message.headers[\"Content-Type\"]
          = \"application/json\";\r\n}"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"TEC00001\",\r\n    \"channelId\" : \"Masdar\",\r\n    \"requestName\"
          : \"TerminateEmploymentContractRq\",\r\n    \"responseName\": \"TerminateEmploymentContractRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\nvar reqBody  = apim.getvariable('message.body');\r\n\r\nvar
          NUN = apim.getvariable('request.headers.NationalUnifiedNumber');\r\nreqBody.NationalUnifiedNumber
          \ = NUN;\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\"
          : {\r\n            \"TransactionId\" : millisecondsvalue,\r\n            \"ChannelId\":
          cfg.channelId,\r\n            \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\r\n
          \           \"RequestTime\" : formatDate(dt),\r\n            \"ServiceCode\":
          cfg.serviceCode,\r\n            \"DebugFlag\": \"1\",\r\n            \"UserInfo\":
          {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n        },\r\n        \"Body\" : reqBody\r\n            \r\n
          \   }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\napim.setvariable('payload',appcReq);
          \    \r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: MainBE
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-cntmv2-contractutilities)/contractmanagement/termempcontract
        follow-redirects: false
        inject-proxy-headers: true
        output: MainBERs
    - gatewayscript:
        version: 2.0.0
        title: PrepareReqForLogging
        source: "var apim=require('apim');\r\nvar appconnectrequest = apim.getvariable('payload');\r\nvar
          APIRes = apim.getvariable('MainBERs.body');\r\nvar appname = apim.getvariable('client.app.name');\r\nvar
          param = apim.getvariable('request.headers.NationalUnifiedNumber');\r\nvar
          UDFPayload = {\r\n                \"KeyValueArr\": [\r\n                    {\r\n
          \                       \"key\": \"Product\",\r\n                        \"value\":
          \"QiwaAsService\"\r\n                    },\r\n                    {\r\n
          \                       \"key\": \"Client\",\r\n                        \"value\":
          appname\r\n                    }\r\n                ]\r\n            };\t
          \r\n\r\nappconnectrequest.TerminateEmploymentContractRq.Header.UDF = UDFPayload;\r\nappconnectrequest.TerminateEmploymentContractRq.Body
          = {\r\n    \"NationalUnifiedNumber\": param\r\n};\r\nvar jsonData= {\r\n\t\"LogAPIData\":
          {\r\n\t\t\"TerminateEmploymentContractRq\": appconnectrequest.TerminateEmploymentContractRq,\r\n\t\t\"TerminateEmploymentContractRs\":
          APIRes.TerminateEmploymentContractRs\r\n\t}\r\n}\r\nsession.output.write(jsonData);\r\napim.output('application/json');"
    - invoke:
        version: 2.3.0
        title: LoggingBE
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        websocket-upgrade: false
        graphql-send-type: detect
        target-url: $(ace-tip-internal)/external/logwrapperapidata
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');
          apim.output('application/json');
          var message = apim.getvariable('MainBERs.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
          apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
          apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');
          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: |-
                var apim = require('apim');
                var message = apim.getvariable('MainBERs.body');
                var cfg = apim.getvariable('cfg');
                var body = message[cfg.responseName].Body;
                session.output.write(body);
                apim.output('application/json');
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');          \r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
    finally: []
