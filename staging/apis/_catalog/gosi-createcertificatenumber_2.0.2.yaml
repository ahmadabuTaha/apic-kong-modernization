swagger: "2.0"
info:
  title: GOSI_CreateCertificateNumber
  x-ibm-name: gosi-createcertificatenumber
  version: 2.0.2
  description: This API validates and retrieves the certificate details  from Qiwa
    platform
schemes:
- https
basePath: /gosi/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
