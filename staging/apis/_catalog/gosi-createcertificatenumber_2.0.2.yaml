      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  application-authentication:
    certificate: false
  buffering: true
  catalogs: {}
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  X-Channel-Id:
    in: header
    name: X-Channel-Id
    description: channelId
    required: false
    type: string
  requestBody:
    in: body
    name: requestBody
    required: true
    schema:
      $ref: '#/definitions/createCerrtificateRequest'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      headers:
        $ref: '#/definitions/Headers'
      establishmentId:
        type: integer
        example: 123456
      establishmentSequenceNumber:
        type: integer
        example: 123456
      establishmentName:
        type: string
        example: 123456
      dateOfIssue:
        $ref: '#/definitions/GregorianDateModel'
      dateOfExpiry:
        $ref: '#/definitions/GregorianDateModel'
      certificateNumber:
        type: string
        example: 123456
      laborOfficeId:
        type: integer
        example: 123456
      unifiedEstablishmentId:
        type: string
        example: 1-123456
      companyId:
        type: string
        example: 123456
      idNumber:
        type: string
      channelId:
        type: string
      certificateStatus:
        type: string
      commercialRegisterNumber:
        type: string
      LicenseNumber:
        type: string
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
  createCerrtificateRequest:
    type: object
    properties:
      laborOfficeId:
        type: integer
      establishmentSequenceNumber:
        type: integer
      year:
        type: integer
      userId:
        type: string
      requesterId:
        type: string
      requesterName:
        type: string
      idNumber:
        type: integer
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
paths:
  /compliance-certificate/create:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - in: header
      name: X-Request-Id
      description: X-Request-Id returned in the response header
      required: false
      type: string
    - in: body
      name: requestBody
      required: true
      schema: {}
    post:
      tags:
      - Compliance Certificate
      description: Service calculates the 12 months average of compliance rate and
        generate the certificate number, issue date and expiry date for a given year
        of an establishment.
      operationId: createCertificateNumber
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
