                \ \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n    \"ar-SA\":
                'حدث خطأ بالنظام'\n  }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.errorCode]){\n       httperror = cfg.errorMap[error.errorCode].code;\n
