                \ \"errorMessage\": {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg');  \nvar cfg={\n    \"serviceCode\" :
                \"EXGCCC01\",\n    \"channelId\" : \"Integration\",\n    \"requestName\"
                : \"createComplianceCertificateRq\",\n    \"responseName\": \"createComplianceCertificateRs\",\n
                \   \"errorMap\" :{\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"},\n       \"GOSI0147\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
                \       \"GOSI0149\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000047\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI9992\" : {\"code\"
                :500, \"msg\":\"Internal Server Error\"},\n        \"GOSI9999\" :
                {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000034\" : {\"code\"
                :409, \"msg\":\"Conflict\"},\n        \"GOSI9995\" : {\"code\" :409,
                \"msg\":\"Conflict\"},\n        \"GOSI9996\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
                \       \"GOSI9993\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI9994\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E9999998\" : {\"code\"
                :409, \"msg\":\"Conflict\"},\n        \"GOSI9991\" : {\"code\" :409,
                \"msg\":\"Conflict\"},\n        \"GOSI9990\" : {\"code\" :409, \"msg\":\"Conflict\"},\n
                \       \"GOSI9988\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"GOSI9998\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0001448\" : {\"code\"
                :409, \"msg\":\"Sorry, an active certificate already exists for the
                given Labor Office Id and Establishment Sequence Number.\"},\n        \"E0000142\"
                : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000048\" : {\"code\"
                :401, \"msg\":\"The user should request a subscription from the unified
                owner\"},\n          \"E0001579\" : {\"code\" :409, \"msg\":\"Invalid
                compliance year\"},\n        \"99999999\" : {\"code\" :500, \"msg\":\"Runtime
