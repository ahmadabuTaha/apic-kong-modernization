swagger: "2.0"
info:
  title: GOSI_GetIndividualWagePaymentStatus
  description: This API is used to inquire about the previous three months worker’s
    wage payment status
  x-ibm-name: gosi-getindividualwagepaymentstatus
  version: 1.0.0
schemes:
- https
basePath: /gosi/v1
