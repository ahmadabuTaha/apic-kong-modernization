swagger: "2.0"
info:
  title: Ethaq_EmployeeContractInformation
  description: This service is used by the consumer to get employee contract information
    from HRSD through Takamol Internal/External Integration.
  x-ibm-name: ethaq-employeecontractinformation
  version: 1.0.0
schemes:
- https
basePath: /ethaq/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /employee-contract/{contractId}:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/contractId'
    post:
      tags:
      - Employee Contract Information
      description: Service to verify employee contract information
      operationId: verifyEmployeeContractInformation
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestModel'
      produces:
      - application/json
      responses:
        "201":
          $ref: '#/responses/Response201'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
  /employee-contract/{contractId}/information:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/contractId'
    get:
      tags:
      - Employee Contract Information
      description: Service to get employee contract information
      operationId: getEmployeeContractInformation
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  RequestModel:
    type: object
    description: This request object used by the post operation
    properties:
      isAccepted:
        type: boolean
        example: true
      rejectionReason:
        type: string
        example: 'Term 1: Not accepted'
        maxLength: 250
    required:
    - isAccepted
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      contractInfo:
        $ref: '#/definitions/ContractInfoModel'
  ContractInfoModel:
    type: object
    properties:
      laborerDetails:
        $ref: '#/definitions/LaborerDetailsModel'
      templateDetails:
        $ref: '#/definitions/TemplateDetailsModel'
      establishmentDetails:
        $ref: '#/definitions/EstablishmentDetailsModel'
      requesterDetails:
        $ref: '#/definitions/RequesterDetailsModel'
      contractDetails:
        $ref: '#/definitions/ContractDetailsModel'
      termsAndConditionsAr:
        $ref: '#/definitions/TermsAndConditionsModel'
      termsAndConditionsEn:
        $ref: '#/definitions/TermsAndConditionsModel'
  LaborerDetailsModel:
    type: object
    properties:
      name:
        type: string
        example: Abdullah
      email:
        type: string
        example: email@dd.com
      mobilenumber:
        type: string
        example: "0500123456"
      passportNo:
        type: string
        example: PA29184279
      passportExpiryDate:
        $ref: '#/definitions/GregorianDateModel'
      dateOfBirth:
        $ref: '#/definitions/GregorianDateModel'
      gender:
        type: string
        example: Male
      nationality:
        type: string
        example: Pakistan
      religion:
        type: string
        example: Islam
  TemplateDetailsModel:
    type: object
    properties:
      id:
        type: string
        example: "10100"
      name:
        type: string
        example: Name of template
      description:
        type: string
        example: Description of template
  EstablishmentDetailsModel:
    type: object
    properties:
      laborOfficeId:
        type: string
        example: "10100"
      sequencenumber:
        type: string
        example: "10100"
      establishmentId:
        type: string
        example: "10100"
      entityId:
        type: string
        example: EX00000
      unifiednumberId:
        type: string
        example: "10100"
      establishmentName:
        $ref: '#/definitions/LocaleDataModel'
      establishmentEmail:
        type: string
        example: email@dd.com
  RequesterDetailsModel:
    type: object
    properties:
      userId:
        type: string
        example: "1129184279"
      name:
        type: string
        example: Abdullah
  ContractDetailsModel:
    type: object
    properties:
      contractId:
        type: string
        example: "10100"
      laborerJobnumber:
        type: string
        example: "12345"
      jobTitle:
        $ref: '#/definitions/JobTitleModel'
      contractType:
        $ref: '#/definitions/CodesTypeModel'
      contractDuration:
        $ref: '#/definitions/CodesTypeModel'
      contractPeriod:
        type: string
        example: "12"
      probationPeriod:
        type: string
        example: "12"
      workingHoursType:
        $ref: '#/definitions/CodesTypeModel'
      vacationPeriod:
        type: string
        example: "12"
      salary:
        type: number
        example: 0
      allowances:
        type: array
        items:
          $ref: '#/definitions/AllowancesModel'
      startDate:
        $ref: '#/definitions/GregorianDateModel'
      expiryDate:
        $ref: '#/definitions/GregorianDateModel'
      renewalStatus:
        $ref: '#/definitions/CodesTypeModel'
      noticePeriod:
        type: string
        example: "12"
      lastModifiedDate:
        $ref: '#/definitions/GregorianDateModel'
      creationDate:
        $ref: '#/definitions/GregorianDateModel'
      laborerAppRejDate:
        $ref: '#/definitions/GregorianDateModel'
      employerAppRejDate:
        $ref: '#/definitions/GregorianDateModel'
      rejectionDescription:
        type: string
        example: Rejection Description
      rejectionReason:
        $ref: '#/definitions/CodesTypeModel'
      updateReason:
        $ref: '#/definitions/CodesTypeModel'
      modificationReason:
        $ref: '#/definitions/CodesTypeModel'
      status:
        $ref: '#/definitions/CodesTypeModel'
      version:
        type: number
        example: 1
      addedClauses:
        type: array
        items:
          $ref: '#/definitions/AllowancesModel'
      language:
        $ref: '#/definitions/CodesTypeModel'
      relatedTo:
        $ref: '#/definitions/CodesTypeModel'
      salaryFrequency:
        $ref: '#/definitions/CodesTypeModel'
      additionalAllowancesList:
        type: array
        items:
          $ref: '#/definitions/AdditionalAllowancesModel'
      hoursPerWeek:
        type: string
        example: "40"
      daysPerWeek:
        type: string
        example: "5"
      hoursPerDay:
        type: string
        example: "8"
      optionalArticles:
        $ref: '#/definitions/OptionalModel'
      occupationDetails:
        $ref: '#/definitions/OccupationModel'
  JobTitleModel:
    type: object
    properties:
      jobTitle:
        $ref: '#/definitions/LocaleDataModel'
  CodesTypeModel:
    type: object
    properties:
      code:
        type: string
        example: "10100"
      name:
        $ref: '#/definitions/LocaleDataModel'
  AllowancesModel:
    type: object
    properties:
      key:
        type: string
        example: EXM
      value:
        type: string
        example: EXM
  AdditionalAllowancesModel:
    type: object
    properties:
      benefitName:
        $ref: '#/definitions/LocaleDataModel'
      frequencyId:
        $ref: '#/definitions/CodesTypeModel'
      amountType:
        $ref: '#/definitions/CodesTypeModel'
      amount:
        type: number
        example: 100
  OptionalModel:
    type: object
    properties:
      period:
        type: string
        example: "1"
      location:
        type: string
        example: Location
      workField:
        type: string
        example: Work Field
  OccupationModel:
    type: object
    properties:
      occupationId:
        type: string
        example: "100101"
      occupation:
        $ref: '#/definitions/LocaleDataModel'
  TermsAndConditionsModel:
    type: object
    additionalProperties:
      type: string
    example:
      job-title: terms and conditions
      start-end-terms: terms and conditions
      start-end-renewal: terms and conditions
      start-terms: terms and conditions
      probation: terms and conditions
      article-7a: terms and conditions
      article-7b: terms and conditions
      article-8: terms and conditions
      article-9-1: terms and conditions
      article-9-2: terms and conditions
      article-10: terms and conditions
      article-11: terms and conditions
      article-12: terms and conditions
      article-13: terms and conditions
      article-14: terms and conditions
      article-15: terms and conditions
      article-16: terms and conditions
      article-17a: terms and conditions
      article-17b: terms and conditions
      article-18: terms and conditions
      article-19: terms and conditions
      article-20: terms and conditions
      article-21: terms and conditions
      article-22: terms and conditions
      article-23: terms and conditions
      article-24: terms and conditions
      article-25: terms and conditions
      article-26a: terms and conditions
      article-26b: terms and conditions
      article-27: terms and conditions
      article-28: terms and conditions
      article-29: terms and conditions
      article-30: terms and conditions
      article-31: terms and conditions
      article-32: terms and conditions
      article-33: terms and conditions
      article-34: terms and conditions
      article-35: terms and conditions
      article-36: terms and conditions
      article-37: terms and conditions
      specified-contract: terms and conditions
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  contractId:
    in: path
    name: contractId
    description: Contract Id
    required: true
    type: integer
