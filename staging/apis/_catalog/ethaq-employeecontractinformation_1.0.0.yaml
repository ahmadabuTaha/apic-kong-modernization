                !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo =
                {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
                formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
                \   //get the day\r\n    //convert day to string\r\n    var day =
                d.getDate().toString();\r\n    //get the year\r\n    var year = d.getFullYear();\r\n
                \   var hour = d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
                \   var second = d.getSeconds().toString();\r\n    var millisecond
                = d.getMilliseconds().toString();\r\n    //pull the last two digits
                of the year\r\n    year = year.toString();\r\n    \r\n    //increment
                month by 1 since it is 0 indexed\r\n    //converts month to a string\r\n
                \   month = (month + 1).toString();\r\n\r\n    //if month is 1-9 pad
