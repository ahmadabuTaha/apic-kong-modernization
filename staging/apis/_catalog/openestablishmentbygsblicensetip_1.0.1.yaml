                \ },\r\n   \"MainUnifiedNationalNumber\": message[cfg.responseName].Body.MainUnifiedNationalNumber\r\n\r\n};\r\nsession.output.write(error);\r\napim.output('application/json');"
        - condition: (($header("Response-Code") = 'CMP00075' or $header("Response-Code")
            = 'CMP00171'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: ResponseModification
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');  \r\nvar body = message[cfg.responseName].Body;\r\nvar
                error = {\r\n  \"errorCode\": message[cfg.responseName].Header.ResponseStatus.Code,\r\n
                \ \"errorMessage\": {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ },\r\n  \"Body\": body\r\n  \r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n
                \   if(cfg.errorMap[error.errorCode]){\r\n       httperror = cfg.errorMap[error.errorCode].code;\r\n
                \      \r\n       //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');  \r\nif (message[cfg.responseName].Header.BackendError)\r\n{\r\nvar
                error = {\r\n  \"errorCode\": message[cfg.responseName].Header.ResponseStatus.Code,\r\n
                \ \"errorMessage\": {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ },\r\n  \"BackendError\": {\r\n                \"ErrorCode\": message[cfg.responseName].Header.BackendError.ErrorCode,\r\n
                \               \"ErrorDescription\": message[cfg.responseName].Header.BackendError.ErrorDescription
                ,\r\n                \"HRSD_BackEndError_GUID\": message[cfg.responseName].Header.BackendError.HRSD_BackEndError_GUID\r\n
                \           }\r\n  \r\n};\r\n\r\n}\r\nelse if (message[cfg.responseName].Header.ResponseStatus.Code
                == 'CMP00073')\r\n{\r\nvar error = {\r\n  \"errorCode\": message[cfg.responseName].Header.ResponseStatus.Code,\r\n
                \ \"errorMessage\": {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n  \r\n};\r\n\r\n}\r\nelse {\r\n    var error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n  \r\n};\r\n}\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n
                \   if(cfg.errorMap[error.errorCode]){\r\n       httperror = cfg.errorMap[error.errorCode].code;\r\n
                \      \r\n       //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
