swagger: "2.0"
info:
  title: MCI_GetAllCrDetails
  description: This API exposes MCI to get Commercial Registration Details services
    from Qiwa platform
  x-ibm-name: mci-getallcrdetails
  version: 2.0.0
schemes:
- https
basePath: /mci/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /commercial/{crNumber}:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/crNumber'
    get:
      tags:
      - Commercial Registration
      description: Service to Get All Commercial Registration Details
      operationId: getAllCommercialRegistrationDetails
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      crDetails:
        $ref: '#/definitions/CrDetailsModel'
  CrDetailsModel:
    type: object
    description: Commercial Registration Details
    properties:
      nationalNumber:
        type: string
        example: "7005295212"
      crType:
        type: string
        example: Main
      mainCRNumber:
        type: string
        example: "1234567890"
      crIssueDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      crExpiryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      crCity:
        $ref: '#/definitions/LocaleDataModel'
      crName:
        type: string
      crCapital:
        $ref: '#/definitions/NumberModel'
      crLegalType:
        $ref: '#/definitions/LocaleDataModel'
      crStatus:
        $ref: '#/definitions/CrStatusModel'
      crPhoneNo:
        type: string
        example: "0504221355"
      crFaxNo:
        type: string
        example: 593429021
      crAddress:
        type: string
        example: 6581 12626-2688 504
      crActivities:
        $ref: '#/definitions/CrActivityModel'
      owners:
        type: array
        items:
          $ref: '#/definitions/OwnerModel'
    required:
    - nationalNumber
    - crType
    - crIssueDate
    - crExpiryDate
    - crCity
    - crName
    - crCapital
    - crLegalType
    - crStatus
    - crFaxNo
    - crAddress
    - crActivities
  CrStatusModel:
    type: object
    properties:
      status:
        type: string
        example: Active
      crStatusDate:
        $ref: '#/definitions/HijriDateModel'
      crStatusReason:
        type: string
    required:
    - status
    - crStatusDate
    - crStatusReason
  CrActivityModel:
    type: object
    properties:
      crActivities:
        type: string
      IsicActivities:
        type: array
        items:
          $ref: '#/definitions/NameCodeModel'
  OwnerModel:
    type: object
    properties:
      ownerName:
        type: string
        example: خالد محمد دايس العجمي
      ownerId:
        $ref: '#/definitions/OwnerIdModel'
      borderNumber:
        type: string
        example: "3005295212"
      code700:
        type: string
        example: 7005295212
      crNumber:
        type: string
        example: 7005295212
      passportIdentifier:
        $ref: '#/definitions/PassportIdentifierModel'
    required:
    - ownerName
    - ownerId
    - borderNumber
    - code700
    - crNumber
    - passportIdentifier
  OwnerIdModel:
    type: object
    properties:
      personIdentifier:
        $ref: '#/definitions/PersonIdentifierModel'
  PersonIdentifierModel:
    type: object
    properties:
      nationalId:
        type: string
        example: "1012305775"
      iqamaNumber:
        type: string
        example: "3012305775"
  PassportIdentifierModel:
    type: object
    properties:
      passportNumber:
        type: string
        example: 7005295212
      passportIssuePlaceName:
        type: string
      passportIssueDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      passportExpiryDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      ownerNationality:
        $ref: '#/definitions/LocaleDataModel'
      relationType:
        type: string
        example: شــريك
    required:
    - passportNumber
    - passportIssuePlaceName
    - passportIssueDate
    - passportExpiryDate
    - ownerNationality
    - relationType
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1000
  NumberModel:
    type: object
    description: This object use for numbers
    additionalProperties:
      type: number
      example: 2000
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri and gregorian
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    properties:
      en-US:
        type: string
      ar-SA:
        type: string
  StrAllCrInfoRs_BodyType:
    type: object
    properties:
      CrDetails:
        $ref: '#/definitions/StrCrDetailsModel'
  StrCrDetailsModel:
    type: object
    properties:
      NationalNumber:
        type: string
      CRType:
        type: string
      MainCRNumber:
        type: string
      CRIssueDate:
        $ref: '#/definitions/StrCRDate_Type'
      CRExpiryDate:
        $ref: '#/definitions/StrCRDate_Type'
      CRCityAR:
        type: string
      CRCityEN:
        type: string
      CRNameAR:
        type: string
      CRCapital:
        type: string
      CRLegalTypeEN:
        type: string
      CRLegalTypeAR:
        type: string
      CRStatus:
        $ref: '#/definitions/StrCRStatus_Type'
      CRPhoneNo:
        type: string
      CRFaxNo:
        type: string
      CRAddress:
        type: string
      CRActivities:
        $ref: '#/definitions/StrCRActivities_Type'
      Owners:
        type: object
        properties:
          CROwner:
            type: array
            items:
              $ref: '#/definitions/StrCrOwners_Type'
  StrCRDate_Type:
    type: object
    properties:
      GregorianDate:
        type: string
      HijriDate:
        type: string
  StrCRStatus_Type:
    type: object
    properties:
      Status:
        type: string
      CRStatusDate:
        type: string
      CRStatusReason:
        type: string
  StrCRActivities_Type:
    type: object
    properties:
      CRActivities:
        type: string
      ListOfISICActivities:
        $ref: '#/definitions/StrListOfISICActivities_Type'
  StrListOfISICActivities_Type:
    type: object
    properties:
      ISICActivity:
        type: array
        items:
          $ref: '#/definitions/StrISICActivity_Type'
  StrISICActivity_Type:
    type: object
    properties:
      ISICCode:
        type: string
      ISICName:
        type: string
  StrCrOwners_Type:
    type: object
    properties:
      OwnerName:
        type: string
      OwnerID:
        $ref: '#/definitions/StrOwnerID_Type'
      OwnerNationalityEN:
        type: string
      OwnerNationalityAR:
        type: string
      RelationType:
        type: string
  StrOwnerID_Type:
    type: object
    properties:
      BorderNumber:
        type: string
      Code700:
        type: string
      CRNumber:
        type: string
      PersonIdentifier:
        $ref: '#/definitions/StrPersonIdentifier_Type'
      PassportIdentifier:
        $ref: '#/definitions/StrPassportIdentifier_Type'
  StrPersonIdentifier_Type:
    type: object
    properties:
      NationalID:
        type: string
      IqamaNumber:
        type: string
  StrPassportIdentifier_Type:
    type: object
    properties:
      PassportNumber:
        type: string
      PassportIssuePlaceName:
        type: string
      PassportIssueDate:
        $ref: '#/definitions/StrCRDate_Type'
      PassportExpiryDate:
        $ref: '#/definitions/StrCRDate_Type'
parameters:
  crNumber:
    in: path
    name: crNumber
    description: Commercial Resigtration Number
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
