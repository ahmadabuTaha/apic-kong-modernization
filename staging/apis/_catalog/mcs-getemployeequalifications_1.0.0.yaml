swagger: "2.0"
info:
  title: MCS_GetEmployeeQualifications
  x-ibm-name: mcs-getemployeequalifications
  version: 1.0.0
  description: GetEmployeeQualifications
schemes:
- https
basePath: /mcs/v1
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          "":
            schema:
              $ref: '#/definitions/EmployeeQualificationsRq_BodyType'
            variable: request.body
            content: application/json
        outputs:
          "":
            schema:
              $ref: '#/definitions/StrEmployeeQualificationsRq_BodyType'
            variable: message.body
            content: application/json
        actions:
        - set: .PersonID
          from: .personID
        options:
          mapEnablePostProcessingJSON: true
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapReferenceLimit: 1
          includeEmptyXMLElements: false
          namespaceInheritance: false
          inlineNamespaces: false
          mapResolveApicVariables: false
          mapOptimizeSchemaDefinition: true
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"EXGEQ00001\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"EmployeeQualificationsRq\",\n
          \   \"responseName\": \"EmployeeQualificationsRs\",\n    \"errorMap\" :{\n
          \       \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n
          \   \n};\n\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.Reference-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-tip-mcs)/external/getemployeequalifications
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "\tvar apim = require('apim');\n\t\n\tapim.output('application/json');\n\n
          \   \n    \n    var cfg = apim.getvariable('cfg');\n    \n\tvar TransactionId
          = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.TransactionId\");\n\tvar
          ChannelId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ChannelId\");\n\tvar
          RequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.RequestTime\");\n\tvar
          SessionId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.SessionId\");\n\tvar
          MWRequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWRequestTime\");\n\tvar
          MWResponseTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWResponseTime\");\n\tvar
          status = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ResponseStatus.Status\");\n\t\n\n
          \   apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\n
          \   apim.setvariable('message.headers.Channel-Id',ChannelId,'add');\n    if
          (RequestTime !== 'undefined')\n\t    apim.setvariable('message.headers.RequestTime',RequestTime,'add');\n\tif
          (SessionId !== 'undefined')\n        apim.setvariable('message.headers.Reference-Id',SessionId,'add');\n
          \    if (MWRequestTime !== 'undefined')\n        apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\n
          \   if (MWResponseTime !== 'undefined')\n        apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\n\n
          \   \n    apim.setvariable('message.headers.Response-Status',status,'add');\n
          \   "
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    $ref: '#/definitions/StrEmployeeQualificationsRs_BodyType'
                  variable: message.body
                  content: application/json
              outputs:
                "":
                  schema:
                    $ref: '#/definitions/EmployeeQualificationsRs_BodyType'
                  variable: message.body
                  content: application/json
              actions:
              - set: .employeeID
                from: .EmployeeID
              - create: .qualificationsList
                foreach: .QualificationList.Qualification
                from: .QualificationList.Qualification
                actions:
                - set: qualificationCode
                  from: QualificationCode
                - set: qualificationDescription
                  from: QualificationDescription
                - set: majorCode
                  from: MajorCode
                - set: majorDescription
                  from: MajorDescription
                - set: universityCode
                  from: UniversityCode
                - set: universityName
                  from: UniversityName
                - set: cityName
                  from: CityName
                - set: countryCode
                  from: CountryCode
                - set: countryName
                  from: CountryName
                - set: institute
                  from: Institute
                - set: grade
                  from: Grade
                - set: graduationYear
                  from: GraduationYear
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                namespaceInheritance: false
                inlineNamespaces: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n    \"ErrorResponse\":
                message[cfg.responseName].Header.ResponseStatus\n}\n\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.ErrorResponse.Code]){\n       httperror
                = cfg.errorMap[error.ErrorResponse.Code].code;\n       \n       //var
                errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n       //var
                details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
definitions:
  EmployeeQualificationsRq_MessageType:
    type: object
    properties:
      EmployeeQualificationsRq:
        $ref: '#/definitions/EmployeeQualificationsRq_Type'
  EmployeeQualificationsRs_MessageType:
    type: object
    properties:
      EmployeeQualificationsRs:
        $ref: '#/definitions/EmployeeQualificationsRs_Type'
  EmployeeQualificationsRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/EmployeeQualificationsRq_BodyType'
  EmployeeQualificationsRq_BodyType:
    type: object
    properties:
      personID:
        type: integer
    required:
    - personID
  StrEmployeeQualificationsRq_BodyType:
    type: object
    properties:
      PersonID:
        type: string
    required:
    - PersonID
  EmployeeQualificationsRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/EmployeeQualificationsRs_BodyType'
  EmployeeQualificationsRs_BodyType:
    type: object
    properties:
      employeeID:
        type: string
      qualificationsList:
        type: array
        items:
          $ref: '#/definitions/qualification_Body'
    required:
    - employeeID
  StrEmployeeQualificationsRs_BodyType:
    type: object
    properties:
      EmployeeID:
        type: string
      QualificationList:
        $ref: '#/definitions/StrQualificationList_Type'
    required:
    - EmployeeID
    - QualificationList
  qualificationlist_Type:
    type: object
    properties:
      qualification:
        type: array
        items:
          $ref: '#/definitions/qualification_Body'
  qualification_Body:
    type: object
    properties:
      qualificationCode:
        type: integer
      qualificationDescription:
        type: string
      majorCode:
        type: string
      majorDescription:
        type: string
      universityCode:
        type: string
      universityName:
        type: string
      cityName:
        type: string
      countryCode:
        type: string
      countryName:
        type: string
      institute:
        type: string
      grade:
        type: string
      graduationYear:
        type: string
    required:
    - qualificationCode
    - qualificationDescription
    - majorCode
    - majorDescription
    - universityCode
    - universityName
    - cityName
    - countryCode
    - countryName
    - institute
    - grade
    - graduationYear
  StrQualificationList_Type:
    type: object
    properties:
      Qualification:
        type: array
        items:
          $ref: '#/definitions/StrQualification_Type'
  StrQualification_Type:
    type: object
    properties:
      QualificationCode:
        type: string
      QualificationDescription:
        type: string
      MajorCode:
        type: string
      MajorDescription:
        type: string
      UniversityCode:
        type: string
      UniversityName:
        type: string
      CityName:
        type: string
      CountryCode:
        type: string
      CountryName:
        type: string
      Institute:
        type: string
      Grade:
        type: string
      GraduationYear:
        type: string
    required:
    - QualificationCode
    - QualificationDescription
    - MajorCode
    - MajorDescription
    - UniversityCode
    - UniversityName
    - CityName
    - CountryCode
    - CountryName
    - Institute
    - Grade
    - GraduationYear
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  UDF_Type:
    type: object
    properties:
      KeyValueArr:
        type: array
        items:
          $ref: '#/definitions/KeyValueArr_Type'
  KeyValueArr_Type:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  Tmstmp_Type:
    type: object
  UserInfo_Type:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: integer
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Code
    - Status
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
paths:
  /get-employee-qualifications:
    post:
      responses:
        "200":
          schema:
            type: string
          description: success
