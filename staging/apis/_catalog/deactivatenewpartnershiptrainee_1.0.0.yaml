swagger: "2.0"
info:
  title: DeactivateNewPartnershipTrainee
  description: |
    This service is used to Deactivate New Partnership Trainee
  x-ibm-name: deactivatenewpartnershiptrainee
  version: 1.0.0
schemes:
- https
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /deactivatenewpartnertrain:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    post:
      tags:
      - Nitaqat
      description: |
        This service is used to Deactivate New Partnership Trainee
      operationId: deactivatenewpartnershiptrainee
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        description: Request body
        required: true
        schema:
          $ref: '#/definitions/DeactivateRequestBody'
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "500":
          $ref: '#/responses/Response500'
definitions:
  DeactivateRequestBody:
    type: object
    description: Request payload for deactivation
    properties:
      traineeIdNumber:
        type: string
        description: Unique identifier for the trainee
      startDate:
        type: string
        description: Start date of the trainee
        example: "2024-01-01"
      establishmentNumber:
        $ref: '#/definitions/establishmentNumber_Type'
  establishmentNumber_Type:
    type: object
    properties:
      laborOfficeId:
        type: integer
        description: Identifier for the labor office
      sequenceNumber:
        type: integer
        description: Sequence number for the establishment
  DeactivateResponseModel:
    type: object
    description: Response object for deactivation
    properties:
      status:
        type: string
        example: Success
      message:
        type: string
      data:
        type: object
        properties:
          traineeIdNumber:
            type: string
          startDate:
            type: string
            format: date
          establishmentNumber:
            type: object
            properties:
              laborOfficeId:
                type: integer
              sequenceNumber:
                type: integer
          deactivatedAt:
            type: string
            format: date-time
            description: Timestamp when trainee was deactivated
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        type: string
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
responses:
  Response200:
    description: Successful deactivation response
    schema:
      $ref: '#/definitions/DeactivateResponseModel'
  Response400:
    description: Bad Request
  Response401:
    description: Unauthorized
  Response403:
    description: Forbidden
  Response404:
    description: Not Found
  Response500:
    description: Internal Server Error
    schema:
      $ref: '#/definitions/ErrorModel'
