swagger: "2.0"
info:
  title: Unified Number Establishment Entity
  x-ibm-name: get-unified-number-establishment-entity
  version: 1.0.0
  description: |
    Returns a paginated list of entities and establishments associated with a Unified Number.
  contact:
    email: S.Kolisetty-c@takamol.sa
schemes:
- https
basePath: /estabmanagement
consumes:
- application/json
produces:
- application/json
security:
- OAuth2.0:
  - IntegrationScope
  clientID: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  properties:
    target-url:
      value: http://prow-700dashboard-http-ace.apps.stg.qiwa-nonprod.local/sevenhundreddashboard
      description: ACE backend base URL
      encoded: false
  type: rest
  phase: realized
  enforced: true
  testable: true
  buffering: true
  application-authentication:
    certificate: false
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-cmpm-dashboard-profile)/estabmanagement/getuninumestent
        follow-redirects: false
        inject-proxy-headers: true
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
tags:
- name: Unified Number Entity
  description: Retrieve entities and establishments under a Unified Number
definitions:
  RequestHeader:
    type: object
    required:
    - TransactionId
    - ChannelId
    - SessionId
    - ServiceCode
    properties:
      TransactionId:
        type: string
        example: "1780820781"
      ChannelId:
        type: string
        example: ESB
      SessionId:
        type: string
        example: "212"
      RequestTime:
        type: string
        format: date-time
      MWRequestTime:
        type: string
        format: date-time
      ServiceCode:
        type: string
        example: GUNEE001
      DebugFlag:
        type: string
        example: "1"
      UserInfo:
        $ref: '#/definitions/UserInfo'
  UserInfo:
    type: object
    properties:
      IDNumber:
        type: string
        example: "1022836470"
  ResponseStatus:
    type: object
    properties:
      Status:
        type: string
        example: SUCCESS
      Code:
        type: string
        example: "00000000"
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
  ResponseHeader:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
        format: date-time
      MWRequestTime:
        type: string
        format: date-time
      MWResponseTime:
        type: string
        format: date-time
      ServiceCode:
        type: string
      DebugFlag:
        type: string
      UserInfo:
        $ref: '#/definitions/UserInfo'
      ResponseStatus:
        $ref: '#/definitions/ResponseStatus'
  GetUniNumEstEntRequest:
    type: object
    properties:
      GetUniNumEstEntRq:
        type: object
        required:
        - Header
        - Body
        properties:
          Header:
            $ref: '#/definitions/RequestHeader'
          Body:
            $ref: '#/definitions/GetUniNumEstEntReqBody'
  GetUniNumEstEntReqBody:
    type: object
    required:
    - UnifiedNumberId
    - PageSize
    - PageIndex
    properties:
      UnifiedNumberId:
        type: integer
        example: 769485
      PageSize:
        type: integer
        example: 5
      PageIndex:
        type: integer
        example: 1
  GetUniNumEstEntResponse:
    type: object
    properties:
      GetUniNumEstEntRs:
        type: object
        properties:
          Header:
            $ref: '#/definitions/ResponseHeader'
          Body:
            $ref: '#/definitions/GetUniNumEstEntRsBody'
  GetUniNumEstEntRsBody:
    type: object
    properties:
      UnifiedNumber:
        type: integer
      isUnifiedMerged:
        type: integer
      TotalCREstablishmentsUnderUnified:
        type: integer
      TotalLicensedEstablishmentsUnderUnified:
        type: integer
      EntitiesList:
        type: object
        properties:
          TotalEntitiesRecordsCount:
            type: integer
          Entity:
            type: array
            items:
              $ref: '#/definitions/Entity'
  Entity:
    type: object
    properties:
      EntityId:
        type: string
      EntityName:
        type: string
      EntitySaudis:
        type: string
      EntityForeigners:
        type: string
      EntitySaudiPercentage:
        type: string
      TotalEntityLaborersCount:
        type: integer
      EntityNitaq:
        $ref: '#/definitions/EntityNitaq'
      EntityColor:
        $ref: '#/definitions/EntityColor'
      EstablishmentsList:
        $ref: '#/definitions/EstablishmentsList'
  EntityNitaq:
    type: object
    properties:
      Code:
        type: integer
      NameAr:
        type: string
      NameEn:
        type: string
  EntityColor:
    type: object
    properties:
      Id:
        type: integer
      Name:
        type: string
  EstablishmentsList:
    type: object
    properties:
      TotalEstablishmentsRecordsCount:
        type: integer
      TotalCREstablishmentsUnderEntity:
        type: integer
      TotalLicensedEstablishmentsUnderUnified:
        type: integer
      Establishment:
        type: array
        items:
          $ref: '#/definitions/Establishment'
  Establishment:
    type: object
    properties:
      EstablishmentId:
        type: integer
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      EstablishmentNumber:
        type: string
      EstablishmentName:
        type: string
      CRNumber:
        type: string
      NationalUnifiedNumber:
        type: string
      NitaqId:
        type: integer
      Nitaq:
        type: string
      NitaqEn:
        type: string
      Isic4ActivityId:
        type: integer
      Isic4Activity:
        type: string
      Isic4ActivityEn:
        type: string
      Saudis:
        type: string
      Foreigners:
        type: string
      Status:
        $ref: '#/definitions/EstablishmentStatus'
      isEstablishmentMerged:
        type: integer
      CreationType:
        type: string
      IsRestructured:
        type: integer
      IsDefault:
        type: string
        x-nullable: true
      NickName:
        type: string
        x-nullable: true
      TotalEstablishmentLaborersCount:
        type: integer
      TotalActiveLocations:
        type: integer
  EstablishmentStatus:
    type: object
    properties:
      Code:
        type: string
      NameAr:
        type: string
      NameEn:
        type: string
paths:
  /GetUniNumEstEnt:
    post:
      tags:
      - Unified Number Entity
      summary: Get Unified Number Establishment Entity
      description: |
        Returns entities and establishments associated with the supplied Unified Number.
      operationId: GetUniNumEstEnt
      parameters:
      - name: body
        in: body
        required: true
        description: GetUniNumEstEntRq message
        schema:
          $ref: '#/definitions/GetUniNumEstEntRequest'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/GetUniNumEstEntResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
