swagger: "2.0"
info:
  title: MHRSD_SearchChangeJobDescriptionPaged
  x-ibm-name: mhrsd-searchchangejobdescriptionpaged
  version: 1.0.0
  description: This API exposes is used by the consumer to search a change of job
    description paged in HRSD from External platform
