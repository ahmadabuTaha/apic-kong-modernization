          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: |
          var apim = require('apim');
          var Response = apim.getvariable('message.body');
          var statusCode = Response.SearchPaymentRefundTransactionsRs.Header.ResponseStatus.Code ;


          if(statusCode == 'E9999998'){
