        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\nvar Response = apim.getvariable('message.body');\nvar
          statusCode = Response.CalculateDeceasedEntitlementRs.Header.ResponseStatus.Code
          ;\n\nif(statusCode == 'ESBSCHEMA' || statusCode == 'E0000004' || statusCode
          == 'E0001203' || statusCode == 'E0001202' \n|| statusCode == 'E0001201'
          \ || statusCode == 'E0001200' ){\n    var code = 400\n    apim.setvariable('message.status.code',code,'set');\n}\nelse
          if(statusCode == 'E0000747' || statusCode == 'E0000034' || statusCode ==
          'E0000046' || statusCode == 'E0000047' || statusCode == 'E0000048' ||statusCode
          == 'E0001287' || statusCode == 'E0001592'   || statusCode == 'E0000980'
          || statusCode == 'E0000131' || statusCode == 'E0000132'  || statusCode ==
          'E0000128'){\n    var code = 401\n    apim.setvariable('message.status.code',code,'set');\n}\nelse
          if(statusCode == '99999999' || statusCode == 'E0001567'){\n    var code
          = 500\n    apim.setvariable('message.status.code',code,'set');\n}\nelse
          if(statusCode == '00000000'){\n    var code = 200\n    apim.setvariable('message.status.code',code,'set');\n}else{\n
          \     var code = 409\n    apim.setvariable('message.status.code',code,'set');\n}\n"
    finally: []
