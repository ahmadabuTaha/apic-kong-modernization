swagger: "2.0"
info:
  title: Qiwa_EditEstablishmentTraining
  x-ibm-name: qiwa-editestablishmenttraining
  version: 1.0.0
  description: Service is used to update the training details of a establishment training
basePath: /qiwa/v2
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-trni-trainingmanagement)/external/edittraining/
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        stop-on-error:
        - ConnectionError
        - OperationError
        - SOAPError
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\nvar Response = apim.getvariable('message.body');\r\nvar
          statusCode = Response.EditEstablishmentTrainingRs.Header.ResponseStatus.Code
          ;\r\n\r\n\r\nif(statusCode == 'ESBSCHEMA' || statusCode == 'E0000004'){\r\n
          \   var code = 400\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '99999999'){\r\n    var code = 500\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == 'E0000046' || statusCode == 'E0000047' || statusCode ==
          'E0000048'){\r\n    var code = 401\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '00000000'){\r\n    var code = 200\r\n    apim.setvariable('message.status.code',code,'set');\r\n}else{\r\n
          \     var code = 409\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\n"
    catch:
    - errors: []
      execute:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.header.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{     "errorCode": "E000500",     "errorMessage": "Internal server
              error" }'
            type: string
          description: API failure handling
    finally: []
  properties:
    target-url:
      value: http://trni-trainingmanagement-http-ace.apps.stg.qiwa-nonprod.local/external/edittraining/
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
definitions:
  EditEstablishmentTrainingRq_MessageType:
