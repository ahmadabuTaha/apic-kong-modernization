      TrainingId:
        type: integer
      TrainingName:
        type: string
      TrainingProvider:
        type: string
      TrainerName:
        type: string
      TrainerNationality:
        type: integer
      TrainingCountry:
        type: integer
      TrainingCity:
        type: string
      TrainingType:
        type: integer
      TrainingStartDate:
