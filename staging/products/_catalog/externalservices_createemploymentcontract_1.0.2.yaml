    type: oauth2
    x-ibm-oauth-provider: externaliamprovider
    flow: application
    tokenUrl: https://hafiz.qiwa.info/realms/TIP/protocol/openid-connect/token
    scopes:
      contract:scope: allow access to contract APIs
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
security:
- OAuth2.0:
  - contract:scope
  clientIdHeader: []
