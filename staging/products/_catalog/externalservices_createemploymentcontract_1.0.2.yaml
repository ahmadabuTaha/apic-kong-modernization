        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-cntmv2-contractcreates)/contractmanagement/createempcontract
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: allowlist
          values: []
        header-control:
