swagger: "2.0"
info:
  title: ExternalServices_CreateEmploymentContract
  description: This service is used to create an employment contract with its details.
  x-ibm-name: externalservices_createemploymentcontract
  version: 1.0.2
schemes:
- https
basePath: /external/v2
securityDefinitions:
