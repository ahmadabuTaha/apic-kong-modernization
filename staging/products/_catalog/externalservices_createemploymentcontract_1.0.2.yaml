x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: UNI Validation
        source: "var apim = require('apim'); \nvar authHeader = apim.getvariable('request.headers.Authorization');\nvar
          request = apim.getvariable('request.body');\n\n// Check if UnifiedNumberId
          exists in the request body\nif (!request || !request.UnifiedNationNumber)
          {\n    context.reject(\"ValidationError\", \"UnifiedNumberId is missing
          in the request body\");\n    context.message.statusCode = 400; // Bad Request\n
          \   context.message.body.write({\n        error: \" is required and must
          be included in the request body\"\n    });\n    context.message.headers[\"Content-Type\"]
          = \"application/json\";\n    // Exit early as the validation failed\n    return;\n}\n\nvar
          reqUnifiedNationalNumber = request.UnifiedNationNumber;\nvar base64Url =
          authHeader.split('.')[1];\nvar base64 = base64Url.replace('-', '+').replace('_',
          '/');\nvar decodedData = JSON.parse(Buffer.from(base64, 'base64'));\nvar
          tokenUnifiedNationalNumbers = decodedData.UnifiedNationalNumbers;\n\n//
          Check if the UnifiedNumberId exists in the token's UnifiedNationalNumbers\nif
          (tokenUnifiedNationalNumbers.includes(reqUnifiedNationalNumber)) {\n    session.output.write(request);\n}
          else {\n    context.reject(\"Forbidden\", \"UnifiedNationNumber is not valid\");\n
          \   context.message.statusCode = 403; // Forbidden\n    context.message.body.write({\n
          \       error: \"UnifiedNationNumber is not valid\"\n    });\n    context.message.headers[\"Content-Type\"]
          = \"application/json\";\n}"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"CEC00001\",\r\n    \"channelId\" : \"Mudad\",\r\n    \"requestName\" :
          \"CreateEmploymentContractRq\",\r\n    \"responseName\": \"CreateEmploymentContractRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\nvar AppcRequest = apim.getvariable('message.body');\r\n\r\ndelete
          AppcRequest.UnifiedNationNumber;\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n
          \       \"Header\" : {\r\n            \"TransactionId\" : millisecondsvalue,\r\n
          \           \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"TIP-Wrapper\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : AppcRequest\r\n            \r\n    }\r\n};\r\n\r\nif (typeof OperatorId
          !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo = {\r\n
          \       \"IDNumber\" : OperatorId\r\n    };\r\napim.setvariable('payload',appcReq);
          \   \r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
