swagger: "2.0"
info:
  title: BayanSaudi
  x-ibm-name: bayansaudi
  version: 1.0.0
schemes:
- https
basePath: /bayan
security:
- {}
securityDefinitions:
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  properties:
    target-url:
      value: https://bayan.saudieng.sa/SCETestAPI/HRSD/Verify
      description: URL of the proxy policy
      encoded: false
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(target-url)?$(request.querystring)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
  catalogs: {}
paths:
  /verify:
    get:
      responses:
        "200":
          schema:
            type: string
          description: success
