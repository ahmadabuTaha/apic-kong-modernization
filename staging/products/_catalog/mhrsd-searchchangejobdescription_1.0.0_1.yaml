swagger: "2.0"
info:
  title: MHRSD_searchChangeJobDescription
  description: This API exposes is used by the consumer to search a change of job
    description in HRSD from External platform
  x-ibm-name: mhrsd-searchchangejobdescription
  version: 1.0.0
schemes:
- https
basePath: /mhrsd/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /labor-office/{laborOfficeId}/seq-no/{sequenceNumber}/user/{userId}/job-description:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/laborOfficeId'
    - $ref: '#/parameters/sequenceNumber'
    - $ref: '#/parameters/userId'
    get:
      tags:
      - Job Description
      description: Service to search a change of job description
      operationId: searchChangeJobDescription
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    properties:
      changeJobDescriptionRequests:
        $ref: '#/definitions/ChangeJobDescriptionRequests'
  ChangeJobDescriptionRequests:
    type: object
    properties:
      changeJobDescriptionRequestDetails:
        type: array
        items:
          $ref: '#/definitions/ChangeJobDescriptionRequestDetails'
  ChangeJobDescriptionRequestDetails:
    type: object
    properties:
      from:
        $ref: '#/definitions/LookupStructure'
      laborer:
        $ref: '#/definitions/Laborer'
      requestNumber:
        $ref: '#/definitions/RequestNumber'
      requestSubmissionDate:
        $ref: '#/definitions/HijriGregorianDateModel'
      status:
        type: string
        example: active
      to:
        $ref: '#/definitions/LookupStructure'
  LookupStructure:
    type: object
    properties:
      code:
        type: string
        example: 10
      name:
        $ref: '#/definitions/LocaleDataModel'
  Laborer:
    type: object
    properties:
      idNo:
        type: string
        example: 2526404111
      name:
        $ref: '#/definitions/LocaleDataModel'
      occupation:
        $ref: '#/definitions/LookupStructure'
  RequestNumber:
    type: object
    properties:
      laborOfficeId:
        type: integer
        format: int32
        example: 112526
      sequenceNumber:
        type: integer
        format: int64
        example: 1211
      year:
        type: integer
        format: int32
        example: 2008
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format dd/mm/yyyy
      for gregorian and yyyy/mm/dd for hijri
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format dd/mm/yyyy
      for gregorian dates only
    example: 31/12/2017
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy/mm/dd
      for hijri dates only
    example: 1439/12/25
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  laborOfficeId:
    in: path
    name: laborOfficeId
    description: Laborer office identification
    required: true
    type: integer
  sequenceNumber:
    in: path
    name: sequenceNumber
    description: Sequence number
    required: true
    type: integer
  userId:
    in: path
    name: userId
    description: user identification
    required: true
    type: string
responses:
