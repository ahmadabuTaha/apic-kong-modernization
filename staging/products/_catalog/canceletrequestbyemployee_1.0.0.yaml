swagger: "2.0"
info:
  title: CancelETRequestByEmployee
  x-ibm-name: canceletrequestbyemployee
  version: 1.0.0
  description: This service is used to cancel employee transfer request by the employee,
    if the request status is pending for current employer approval, or pending for
    notice period completion.
