openapi: 3.0.3
info:
  title: WDDS Certificate Validation API
  description: |
    Certificate validation endpoint of the Disbursement of Wage Deduction Service (WDDS),
    consumed by Knowledge Center to verify a "Disbursement of Wage Deduction" certificate.

    The caller supplies the certificate ID printed on the certificate together with the
    establishment identifier (labor office ID + sequence number) and the certificate type.
    When all three match a stored submission, the endpoint returns the certificate details;
    otherwise it returns an error response.

    Authentication is service-to-service via a static API key in the `X-API-Key` header
    (`wdds.api.key.knowledge-center`). No JWT / `QIWA_AUTH` cookie is used for this endpoint.
  version: 1.0.0
  contact:
    name: Qiwa WDDS team
  x-ibm-name: wdds-certificate-validation-api
tags:
- name: Certificate Validation
  description: Certificate validation for Knowledge Center
paths:
  /api/certificate/validate:
    post:
      tags:
      - Certificate Validation
      summary: Validate certificate
      description: |
        Validates a certificate by certificate ID and establishment details. Returns the certificate data when valid; returns an error response when the certificate is not found, the certificate type does not match, or the establishment does not match the one the certificate was issued for.
      operationId: validateCertificate
      parameters:
      - name: X-IBM-Client-Id
        in: header
        required: true
        description: Client id issued by security server
        schema:
          type: string
      - name: X-IBM-Client-Secret
        in: header
        required: true
        description: Client secret issued by security server
        schema:
          type: string
      - name: ApiKeyAuth
        in: header
        required: true
        description: Shared static API key issued to Knowledge Center
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        description: |
          Controls the language of the `certificationType` label in the response. A primary tag starting with `ar` (e.g. `ar`, `ar-SA`, `ar-SA,ar;q=0.9,en;q=0.8`) returns Arabic; anything else — including a missing or blank header — returns English.
        schema:
          type: string
          example: ar-SA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateValidationRequest'
            examples:
              valid:
                summary: Valid WDDS certificate request
                value:
                  certificateType: 8
                  certificateId: 042317-08841902
                  laborOfficeId: "9"
                  sequenceNumber: "1234"
      responses:
        "200":
          description: Certificate is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateValidationResponseMessage'
              examples:
                english:
                  summary: English response (default)
                  value:
                    data:
                      certificationType: Disbursement of Wage Deduction Certificate
                      certificateId: 042317-08841902
                      establishmentNumber: 9-1234
                      establishmentName: Takamol Holding
                      certificateIssueDate: "2026-05-14"
                      disbursementPeriod: 2025
                arabic:
                  summary: Arabic response (Accept-Language starts with "ar")
                  value:
                    data:
                      certificationType: شهادة اعتماد صرف الغرامات
                      certificateId: 042317-08841902
                      establishmentNumber: 9-1234
                      establishmentName: تكامل القابضة
                      certificateIssueDate: "2026-05-14"
                      disbursementPeriod: 2025
        "400":
          description: |
            Bad request — request body failed bean validation, was unreadable, or the certificate type / establishment did not match the stored certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateValidationErrorResponse'
              examples:
                validationFailed:
                  summary: Bean validation failure (bad certificateId format, missing
                    field)
                  value:
                    httpCode: 400
                    messageDescription: Input data validation failed
                    messageDetails: 'certificateId: certificateId must match format
                      NNNNNN-NNNNNNNN (6 digits, hyphen, 8 digits)'
                invalidBody:
                  summary: Malformed JSON body
                  value:
                    httpCode: 400
                    messageDescription: Invalid request body
                    messageDetails: 'JSON parse error: Unexpected end-of-input'
                certificateTypeMismatch:
                  summary: Certificate type is not the WDDS type (8) — WDDGE038
                  value:
                    httpCode: 400
                    messageDescription: Certificate type does not match
                    messageDetails: 'Certificate type mismatch. Expected: 8, Received:
                      3'
                establishmentMismatch:
                  summary: Establishment does not own the certificate — WDDGE037
                  value:
                    httpCode: 400
                    messageDescription: Certificate establishment does not match
                    messageDetails: 'Certificate establishment mismatch. Expected:
                      9-1234, Found: 9-9999'
        "401":
          description: API key header is missing, empty, or does not match the configured
            key (WDDGE001).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateValidationErrorResponse'
              examples:
                missingApiKey:
                  summary: Missing X-API-Key header
                  value:
                    httpCode: 401
                    messageDescription: API Key is required for this endpoint
                    messageDetails: 'Missing API Key header for request to: /api/certificate/validate'
                invalidApiKey:
                  summary: Wrong X-API-Key value
                  value:
                    httpCode: 401
                    messageDescription: Invalid API Key
                    messageDetails: 'Invalid API Key provided for request to: /api/certificate/validate'
        "404":
          description: No certificate exists with the given certificate ID (WDDGE036).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateValidationErrorResponse'
              example:
                httpCode: 404
                messageDescription: Certificate not found
                messageDetails: Certificate with ID 042317-08841902 not found
        "500":
          description: Unexpected server error. `messageDetails` is always null —
            details are logged, not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateValidationErrorResponse'
              example:
                httpCode: 500
                messageDescription: Internal server error
                messageDetails: null
components:
  securitySchemes:
    clientID:
      type: apiKey
      in: header
      name: X-IBM-Client-Id
    OAuth2.0:
      type: oauth2
      x-ibm-oauth-provider: takamol-native-oauth-porvider
      flows:
        clientCredentials:
          tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
          scopes:
            IntegrationScope: This scope for all integration services in Takamol
  schemas:
    CertificateValidationRequest:
      type: object
      required:
      - certificateType
      - certificateId
      - laborOfficeId
      - sequenceNumber
      properties:
        certificateType:
          type: integer
          format: int32
          description: |
            Certificate-type code. Must be `8` (Disbursement of Wage Deduction / WDDS); any other value is rejected with 400 / WDDGE038.
          example: 8
        certificateId:
          type: string
          pattern: ^\d{6}-\d{8}$
          description: |
            Certificate number as printed on the certificate — 6 digits, hyphen, 8 digits. Produced by the MLSD stored procedure `SP_GetCertificateSerialization`.
          example: 042317-08841902
        laborOfficeId:
          type: string
          description: |
            Labor office ID of the establishment. Combined with `sequenceNumber` as `{laborOfficeId}-{sequenceNumber}` and matched against the establishment the certificate was issued to.
          example: "9"
        sequenceNumber:
          type: string
          description: Establishment sequence number within the labor office.
          example: "1234"
    CertificateValidationResponseMessage:
      type: object
      description: Standard WDDS response envelope (`ResponseMessage<T>`).
      properties:
        data:
          $ref: '#/components/schemas/CertificateValidationResponse'
    CertificateValidationResponse:
      type: object
      properties:
        certificationType:
          type: string
          description: |
            Localized certificate-type label — "Disbursement of Wage Deduction Certificate" in English, "شهادة اعتماد صرف الغرامات" in Arabic, selected via `Accept-Language`.
          example: Disbursement of Wage Deduction Certificate
        certificateId:
          type: string
          description: Echo of the validated certificate ID.
          example: 042317-08841902
        establishmentNumber:
          type: string
          description: Establishment identifier in `{laborOfficeId}-{sequenceNumber}`
            form.
          example: 9-1234
        establishmentName:
          type: string
          description: Name of the establishment the certificate was issued to.
          example: Takamol Holding
        certificateIssueDate:
          type: string
          format: date
          description: Date the underlying submission was created (ISO-8601, `yyyy-MM-dd`).
          example: "2026-05-14"
        disbursementPeriod:
          type: integer
          format: int32
          description: Deduction year of the submission covered by the certificate.
          example: 2025
    CertificateValidationErrorResponse:
      type: object
      description: |
        Error body returned by `CertificateValidationControllerExceptionHandler`. Note that the internal error code (e.g. WDDGE036) is logged but not serialized into the response.
      properties:
        httpCode:
          type: integer
          format: int32
          description: HTTP status code, repeated in the body.
          example: 404
        messageDescription:
          type: string
          description: Short, human-readable error description.
          example: Certificate not found
        messageDetails:
          type: string
          nullable: true
          description: Additional detail about the failure. Null for 500 responses.
          example: Certificate with ID 042317-08841902 not found
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: false
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apikey = context.get('message.headers.ApiKeyAuth')\r\ncontext.set('message.headers.X-API-Key',
          'cqh0NJRx8MVyUX6ixBfzk3CwbkuPZjTNodJrTx+UwRo=');"
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: https://disbursement-wage-deduction-api.qiwa.info/api/certificate/validate
        follow-redirects: false
        inject-proxy-headers: false
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
security:
- clientID: []
servers:
- url: /
