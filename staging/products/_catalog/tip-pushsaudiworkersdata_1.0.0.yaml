        example: "1997-01-21"
      educationLevel:
        type: string
        example: Masters
      specialization:
        type: integer
        example: 0
      isStudent:
        type: integer
        example: 0
      isReleasedPrisoner:
        type: integer
        example: 0
  contractDetails_Type:
    properties:
      contractStartDate:
        type: string
        example: "2017-01-21"
      contractEndDate:
        type: string
        example: "2020-01-21"
      terminationReason:
        type: integer
        example: 0
      wage:
        type: number
        example: 0
      WPSWage:
        type: number
        example: 0
      occupationId:
        type: integer
        example: 0
      workTypeId:
        type: integer
        example: 1
      isDistanceWorker:
        type: integer
        example: 0
      isFlexibleWorker:
        type: integer
        example: 0
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      requestId:
        type: integer
        example: 101
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
