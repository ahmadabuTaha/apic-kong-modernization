swagger: "2.0"
info:
  title: SearchSC
  version: 1.0.3
  description: This api retrieves the salary certificates
  x-ibm-name: searchsc
security:
- ClientSecret: []
  OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  ClientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientIdHeader:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
paths:
  /searchsc:
    post:
      operationId: SearchSC
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/SearchSCRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: Search SC Requests
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/SearchSCRq_MessageType'
        description: SearchSCRq
        required: true
      - name: X-IBM-Client-Id
        in: header
        required: true
        type: string
      - name: X-IBM-Client-Secret
        in: header
        required: true
        type: string
basePath: /qiwa/v2
