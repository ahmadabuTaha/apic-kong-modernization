swagger: "2.0"
info:
  title: EmployeeJobsHistoryAPIWrapper
  x-ibm-name: employeejobshistoryapiwrapper
  version: 1.0.0
  description: This service is used to get the Employee Jobs History.
schemes:
- https
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(dp-qiwadp-qiwahrsdrouter)/hrsd-dev/internal-services/v1/employeeJobsHistory/inquiry/{Inquiry}?MaxRecs=$(request.parameters.MaxRecs)&Offset=$(request.parameters.Offset)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: allowlist
          values: []
        header-control:
          type: blocklist
          values: []
        inject-proxy-headers: true
        persistent-connection: true
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  Inquiry:
    in: path
    name: Inquiry
    description: Inquiry
    required: true
    type: string
  MaxRecs:
    in: query
    name: MaxRecs
    description: MaxRecs
    required: false
    type: string
  Offset:
    in: query
    name: Offset
    description: Offset
    required: false
    type: string
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      EmployeeId:
        type: string
      FirstHiringDt:
        type: string
      BAYANDetails:
        $ref: '#/definitions/BAYANDetails_Type'
      RecCtrlOut:
        $ref: '#/definitions/RecCtrlOut_Type'
      EmployeeHistInfoList:
        $ref: '#/definitions/EmployeeHistInfoList_Type'
  BAYANDetails_Type:
    type: object
    properties:
      JobBAYANNum:
        type: string
      JobBAYANDt:
        type: string
  RecCtrlOut_Type:
    type: object
    properties:
      MatchedRecs:
        type: string
      SentRecs:
        type: string
  EmployeeHistInfoList_Type:
    type: object
    properties:
      EmployeeHistInfo:
        type: array
        items:
          $ref: '#/definitions/EmployeeHistInfo_Type'
  EmployeeHistInfo_Type:
    type: object
    properties:
      JobAssignmentInfo:
        $ref: '#/definitions/JobAssignmentInfo_Type'
      Salary:
        type: string
      DecreeNatureCode:
        type: string
      DecreeNatureDescription:
        type: string
      DecreeTypeCode:
        type: string
      DecreeTypeDescription:
        type: string
      NominationReasonCode:
        type: string
      NominationReasonDescription:
        type: string
      ServiceTerminationReasonCode:
        type: string
      ServiceTerminationReasonName:
        type: string
  JobAssignmentInfo_Type:
    type: object
    properties:
      JobTitle:
        $ref: '#/definitions/JobTitle_Type'
      JobNum:
        type: string
      JobClassCode:
        type: string
      JobAction:
        $ref: '#/definitions/JobAction_Type'
      AssignmentStatus:
        $ref: '#/definitions/AssignmentStatus_Type'
      JobOrg:
        $ref: '#/definitions/JobOrg_Type'
      JobLadder:
        $ref: '#/definitions/JobLadder_Type'
      JobLoc:
        $ref: '#/definitions/JobLoc_Type'
      JobExtension:
        $ref: '#/definitions/JobExtension_Type'
  JobTitle_Type:
    type: object
    properties:
      JobTitleCode:
        type: string
      JobTitleName:
        type: string
  JobAction_Type:
    type: object
    properties:
      JobActionCode:
        type: string
      JobActionDesc:
        type: string
      JobActionDt:
        type: string
      DcsnNum:
        type: string
      DcsnDt:
        type: string
  AssignmentStatus_Type:
    type: object
    properties:
      AssignmentStatusCode:
        type: string
      AssignmentStatusDesc:
        type: string
  JobOrg_Type:
    type: object
    properties:
      OrgId:
        type: string
      FullName:
        type: string
  JobLadder_Type:
    type: object
    properties:
      JobLadderCode:
        type: string
      JobLadderDesc:
        type: string
      GradeStep:
        $ref: '#/definitions/GradeStep_Type'
  GradeStep_Type:
    type: object
    properties:
      JobGradeCode:
        type: string
      JobGradeDesc:
        type: string
      JobGradeStartDt:
        type: string
      JobStepCode:
        type: string
      JobStepStartDt:
        type: string
      ExtraStepCode:
        type: string
  JobLoc_Type:
    type: object
    properties:
      JobLocCode:
        type: string
      JobLocName:
        type: string
  JobExtension_Type:
    type: object
    properties:
      StartDt:
        type: string
      JobExtensionMonths:
        type: integer
      JobExtensionYrs:
        type: integer
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
paths:
