swagger: "2.0"
info:
  title: BI Dashboard InsertDashboards
  x-ibm-name: bi-dashboard-insertdashboards
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: POST
        target-url: $(target-url)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    catch: []
    finally: []
  properties:
    target-url:
      value: http://rept-bidashboard-http-ace.apps.stg.qiwa-nonprod.local/bidashboard/dashboardmgmt/insertDashboards
      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
  application-authentication:
    certificate: false
  catalogs: {}
paths:
  /insertDashboards:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
