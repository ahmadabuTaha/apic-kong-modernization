swagger: "2.0"
info:
  title: Kyan User Validation
  x-ibm-name: kyan-user-validation
  version: 3.0.0
  description: Kyan SSO User Validation Service
host: $(catalog.host)
schemes:
- https
basePath: /kyan
security:
- OAuth2.0:
  - IntegrationScope
securityDefinitions:
  OAuth2.0:
    type: oauth2
    description: ""
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  properties: {}
  application-authentication:
    certificate: false
  assembly:
    execute:
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: $contains(request.path, "verifydelegator")
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Build-Request
              source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
                Date()).getTime();\r\nvar dt = new Date();\r\n//var cfg = apim.getvariable('cfg');\r\nvar
                input_SevenHundred = apim.getvariable('request.parameters.sevenhundrednumber');\r\nvar
                input_NationalId = apim.getvariable('request.parameters.idno');\r\nvar
                input_isType3included = \r\napim.getvariable('request.parameters.isType3included');\r\n\r\n\r\nvar
                appcReq = {\r\n    \"KyanUserValidationReq\":{\r\n        \"Header\"
                : {\r\n            \"TransactionId\" :millisecondsvalue,\r\n            \"ChannelId\":
                \"Qiwa\",\r\n            \"SessionId\": \"1\",\r\n            \"RequestTime\"
                : formatDate(dt),\r\n\t\t\t\"MWRequestTime\" : formatDate(dt),\r\n
                \           \"ServiceCode\": \"PAKYN001\"\r\n        },\r\n        \"Body\":
                {\r\n\t\t\t \"SevenHundred\": input_SevenHundred,\r\n             \"NationalId\":
                input_NationalId,\r\n             \"IsType3included\":input_isType3included\r\n\t\t}\r\n
                \   }\r\n};\r\n \r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n
                \r\n \r\nfunction formatDate(d)\r\n{\r\n    //get the month\r\n    var
                month = d.getMonth();\r\n    //get the day\r\n    //convert day to
                string\r\n    var day = d.getDate().toString();\r\n    //get the year\r\n
                \   var year = d.getFullYear();\r\n    var hour = d.getHours().toString();\r\n
                \   var minitue = d.getMinutes().toString();\r\n    var second = d.getSeconds().toString();\r\n
                \   var millisecond = d.getMilliseconds().toString();\r\n    //pull
                the last two digits of the year\r\n    year = year.toString();\r\n
                \   //increment month by 1 since it is 0 indexed\r\n    //converts
                month to a string\r\n    month = (month + 1).toString();\r\n \r\n
                \   //if month is 1-9 pad right with a 0 for two digits\r\n    if
                (month.length === 1)\r\n        month = \"0\" + month;\r\n \r\n    //if
                day is between 1-9 pad right with a 0 for two digits\r\n    if (day.length
                === 1)\r\n        day = \"0\" + day;\r\n \r\n    if (hour.length ===
                1)\r\n        hour = \"0\" + hour;\r\n \r\n    if (minitue.length
                === 1)\r\n        minitue = \"0\" + minitue;\r\n \r\n    if (second.length
                === 1)\r\n        second = \"0\" + second;\r\n    if (millisecond.length
                == 1)\r\n        millisecond = \"00\" + millisecond;\r\n    if (millisecond.length
                == 2)\r\n        millisecond = \"0\" + millisecond;\r\n\r\n \r\n    //return
                the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\"
                \"+hour + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}\r\n"
          - invoke:
              title: invoke
              version: 2.0.0
              verb: POST
              target-url: $(ace-prow-kayan-user-validation)/qiwa-kyan-user-validation/v1/verify-delegator
              follow-redirects: false
              timeout: 60
              parameter-control:
                type: allowlist
              header-control:
                type: allowlist
                values: []
              inject-proxy-headers: false
              stop-on-error:
              - ConnectionError
              - SOAPError
              - OperationError
              persistent-connection: true
              backend-type: detect
              graphql-send-type: detect
        - condition: $contains(request.path, "verifyowner")
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Build-Request
              source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
                Date()).getTime();\r\nvar dt = new Date();\r\n//var cfg = apim.getvariable('cfg');\r\nvar
                input_SevenHundred = apim.getvariable('request.parameters.sevenhundrednumber');\r\n\r\nvar
                appcReq = {\r\n    \"KyanUserValidationReq\":{\r\n        \"Header\"
                : {\r\n            \"TransactionId\" :millisecondsvalue,\r\n            \"ChannelId\":
                \"Qiwa\",\r\n            \"SessionId\": \"1\",\r\n            \"RequestTime\"
                : formatDate(dt),\r\n\t\t\t\"MWRequestTime\" : formatDate(dt),\r\n
                \           \"ServiceCode\": \"PAKYN001\"\r\n        },\r\n        \"Body\":
                {\r\n\t\t\t \"SevenHundred\": input_SevenHundred\r\n\t\t}\r\n    }\r\n};\r\n
                \r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n
                \r\n \r\nfunction formatDate(d)\r\n{\r\n    //get the month\r\n    var
                month = d.getMonth();\r\n    //get the day\r\n    //convert day to
                string\r\n    var day = d.getDate().toString();\r\n    //get the year\r\n
                \   var year = d.getFullYear();\r\n    var hour = d.getHours().toString();\r\n
                \   var minitue = d.getMinutes().toString();\r\n    var second = d.getSeconds().toString();\r\n
                \   var millisecond = d.getMilliseconds().toString();\r\n    //pull
                the last two digits of the year\r\n    year = year.toString();\r\n
                \   //increment month by 1 since it is 0 indexed\r\n    //converts
                month to a string\r\n    month = (month + 1).toString();\r\n \r\n
                \   //if month is 1-9 pad right with a 0 for two digits\r\n    if
                (month.length === 1)\r\n        month = \"0\" + month;\r\n \r\n    //if
                day is between 1-9 pad right with a 0 for two digits\r\n    if (day.length
                === 1)\r\n        day = \"0\" + day;\r\n \r\n    if (hour.length ===
                1)\r\n        hour = \"0\" + hour;\r\n \r\n    if (minitue.length
                === 1)\r\n        minitue = \"0\" + minitue;\r\n \r\n    if (second.length
                === 1)\r\n        second = \"0\" + second;\r\n    if (millisecond.length
                == 1)\r\n        millisecond = \"00\" + millisecond;\r\n    if (millisecond.length
                == 2)\r\n        millisecond = \"0\" + millisecond;\r\n\r\n \r\n    //return
                the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\"
                \"+hour + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}\r\n"
          - invoke:
              version: 2.2.0
              title: invoke
              backend-type: detect
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: true
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              graphql-send-type: detect
              websocket-upgrade: false
              target-url: $(ace-prow-kayan-user-validation)qiwa-kyan-user-validation/v1/verify-owner
              description: The URL of the target service
        - otherwise:
          - throw:
              version: 2.1.0
              title: throw
              name: invalidoperation
              error-status-code: "503"
              error-status-reason: invalid operation
              message: invalid
    - parse:
        version: 2.0.0
        title: parse
        parse-settings-reference:
          default: apic-default-parsesettings
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (message.body.KyanUserValidationRes.Header.ResponseStatus.Status
            = 'Success')
          execute:
          - switch:
              version: 2.0.0
              title: switch
              case:
              - condition: ($contains(request.path, "verifydelegator"))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: gatewayscript
                    source: "var apim = require('apim');\r\n\r\nvar input = apim.getvariable('message.body');\r\n/*var
                      json = input.sql.row.column;\r\nfor(var i = 0; i < json.length;
                      i++) {\r\n    var item = json[i];\r\n    var name = JSON.stringify(item.name);\r\n
                      \   if(name.includes('IDNO')){\r\n        var val = JSON.stringify(item.value);\r\n
                      \       val = val.replace(/[$\":{}]/g, \"\");\r\n        apim.setvariable('idno',val);\r\n
                      \   }\r\n}*/\r\nvar outres = {\r\n    \"httpCode\": input.KyanUserValidationRes.Body.HttpCode,\r\n
                      \   \"httpMessage\": input.KyanUserValidationRes.Body.HttpMessage,\r\n
                      \   \"ValidUser\": input.KyanUserValidationRes.Body.ValidUser\r\n}\r\nsession.output.write(outres);"
              - condition: ($contains(request.path, "verifyowner"))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: gatewayscript
                    source: "var apim = require('apim');\r\n\r\nvar input = apim.getvariable('message.body');\r\n/*var
                      json = input.sql.row.column;\r\nfor(var i = 0; i < json.length;
                      i++) {\r\n    var item = json[i];\r\n    var name = JSON.stringify(item.name);\r\n
                      \   if(name.includes('IDNO')){\r\n        var val = JSON.stringify(item.value);\r\n
                      \       val = val.replace(/[$\":{}]/g, \"\");\r\n        apim.setvariable('idno',val);\r\n
                      \   }\r\n}*/\r\nvar outres = {\r\n    \"httpCode\": input.KyanUserValidationRes.Body.HttpCode,\r\n
                      \   \"httpMessage\": input.KyanUserValidationRes.Body.HttpMessage,\r\n
                      \   \"IdNo\": input.KyanUserValidationRes.Body.IdNo\r\n}\r\nsession.output.write(outres);"
              - otherwise: []
        - condition: (message.body.KyanUserValidationRes.Header.ResponseStatus.Status
            = 'Failure')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\r\n\r\nvar input = apim.getvariable('message.body');\r\n/*var
                json = input.sql.row.column;\r\nfor(var i = 0; i < json.length; i++)
                {\r\n    var item = json[i];\r\n    var name = JSON.stringify(item.name);\r\n
                \   if(name.includes('IDNO')){\r\n        var val = JSON.stringify(item.value);\r\n
                \       val = val.replace(/[$\":{}]/g, \"\");\r\n        apim.setvariable('idno',val);\r\n
                \   }\r\n}*/\r\nvar outres = {\r\n    \"httpCode\": input.KyanUserValidationRes.Body.HttpCode,\r\n
                \   \"httpMessage\": input.KyanUserValidationRes.Body.HttpMessage,\r\n
                \   \"moreInformation\": input.KyanUserValidationRes.Body.MoreInformation\r\n}\r\nsession.output.write(outres);"
        - otherwise:
          - throw:
              version: 2.0.0
              title: UnkownRespFromDatapower
              name: UnknownDPResp
              message: message.body
    catch:
    - errors:
      - OperationError
      execute:
      - map:
          version: 2.0.0
          title: map
          inputs:
            input:
              schema:
                type: object
              variable: request.body
          outputs:
            statuscode:
              schema:
                type: integer
              variable: message.status.code
            output:
              schema:
                $ref: '#/definitions/UserValidationResponse'
              variable: message.body
              content: application/json
            statusreason:
              schema:
                type: string
              variable: message.status.reason
          actions:
          - set: statuscode
            value: "404"
          - set: statusreason
            value: '''Not Found'''
          - set: output.httpCode
            value: "404"
          - set: output.httpMessage
            value: '''error'''
          - set: output.moreInformation
            value: '''Please check your backend url'''
    - errors:
      - BusinessErrorFromDatapower
      execute:
      - map:
          version: 2.0.0
          title: map
          inputs:
            input:
              schema:
                description: ""
                type: object
                properties:
                  sql:
                    type: object
                    properties:
                      message:
                        type: string
                        name: message
                      result:
                        type: string
                        xml:
                          attribute: true
                        name: '@result'
                    xml:
                      namespace: ""
                    name: sql
                xml:
                  namespace: ""
                example: "<sql result=\"error\">\r\n   <message>Incorrect syntax near
                  '='.</message>\r\n</sql>"
              variable: message.body
              content: application/xml
          outputs:
            output:
              schema:
                $ref: '#/definitions/UserValidationResponse'
              variable: message.body
              content: application/json
            statuscode:
              schema:
                type: integer
              variable: message.status.code
          actions:
          - set: statuscode
            value: "400"
          - set: output.httpCode
            value: "400"
          - set: output.httpMessage
            value: '''error'''
          - set: output.moreInformation
            from: input.sql.message
            value: '''Error occured in stored procedure GetIDNo'''
    - errors:
      - NoDataFound
      execute:
      - map:
          version: 2.0.0
          title: map
          inputs:
            input:
              schema:
                description: ""
                type: object
                properties:
                  sql:
                    type: object
                    properties:
                      message:
                        type: string
                        name: message
                      result:
                        type: string
                        xml:
                          attribute: true
                        name: '@result'
                    xml:
                      namespace: ""
                    name: sql
                xml:
                  namespace: ""
                example: "<sql result=\"error\">\r\n   <message>Incorrect syntax near
                  '='.</message>\r\n</sql>"
              variable: message.body
              content: application/xml
          outputs:
            output:
              schema:
                $ref: '#/definitions/UserValidationResponse'
              variable: message.body
              content: application/json
            statuscode:
              schema:
                type: integer
              variable: message.status.code
          actions:
          - set: statuscode
            value: "400"
          - set: output.httpCode
            value: "400"
          - set: output.httpMessage
            value: '''error'''
          - set: output.moreInformation
            value: '''No Data Found'''
    - errors:
      - UnknownDPResp
      execute:
      - map:
          version: 2.0.0
          title: map
          inputs:
            input:
              schema:
                type: object
              variable: message.body
          outputs:
            output:
              schema:
                $ref: '#/definitions/UserValidationResponse'
              variable: message.body
              content: application/json
            statuscode:
              schema:
                type: integer
              variable: message.status.code
          actions:
          - set: statuscode
            value: "500"
          - set: output.httpCode
            value: "500"
          - set: output.httpMessage
            value: '''error'''
          - set: output.moreInformation
            from: input
            value: '''Unknown Response from datapower'''
    finally: []
  catalogs: {}
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
definitions:
  UserValidationResponse:
    type: object
    additionalProperties: false
    properties:
      httpCode:
        type: integer
      httpMessage:
        type: string
        enum:
        - "0": success
          "1": error
      moreInformation:
        type: string
      IdNo:
        type: integer
      ValidUser:
        type: boolean
paths:
  /verifydelegator:
    get:
      summary: Get National ID for user-type 1 based on 700 number
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/UserValidationResponse'
        "401":
          description: Unauthorized
        "500":
          description: Target system Technical Error
          schema:
            $ref: '#/definitions/UserValidationResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/UserValidationResponse'
      produces:
      - application/json
      consumes: []
      operationId: TYPE2
    parameters:
    - name: sevenhundrednumber
      in: query
      required: true
      type: string
    - name: idno
      in: query
      required: true
      type: string
  /verifyowner:
    get:
      summary: Get National ID for user-type 1 based on 700 number
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/UserValidationResponse'
        "400":
          description: No Data Found
          schema:
            $ref: '#/definitions/UserValidationResponse'
        "401":
          description: Unauthorized
        "500":
          description: Target system Technical Error
          schema:
            $ref: '#/definitions/UserValidationResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/UserValidationResponse'
      produces:
      - application/json
      consumes: []
      operationId: TYPE1
    parameters:
    - name: sevenhundrednumber
      in: query
      required: true
      type: string
  /test:
    parameters:
    - name: Request
      in: body
      schema:
        title: req
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      produces:
      - application/json
