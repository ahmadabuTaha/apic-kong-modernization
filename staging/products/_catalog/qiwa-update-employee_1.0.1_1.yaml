swagger: "2.0"
info:
  title: QIWA Update Employee
  x-ibm-name: qiwa-update-employee
  version: 1.0.1
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientID: []
  clientSecret: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: service_config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"EXUE0001\",\n
          \   \"channelId\" : \"Qiwa\",\n\t\"SessionId\" : \"1\",\n    \"requestName\"
          : \"UpdateEmployeeRq\",\n    \"responseName\": \"UpdateEmployeeRs\",\n    \"debugFlag\"
          : \"1\",\n    \"userID\" : \"1021\",\n    \"IDNumber\" : \"\",\n    \"errorMap\"
          :{\n     \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"},\n
          \       \"E0000024\" : {\"code\" :409, \"msg\":\"Nodata\"},\n        \"NIC00232\"
          : {\"code\" :409, \"msg\":\"InvalidData\"},\n        \"TI000019\" : {\"code\"
          :409, \"msg\":\"ExceedEmployeeLimit\"},\n        \"TI000018\" : {\"code\"
          :409, \"msg\":\"DuplicateEmployee\"},\n        \"NIC00253\" : {\"code\"
          :409, \"msg\":\"Runtime_Exception\"},\n        \"E0000046\" : {\"code\"
          :401, \"msg\":\"Unauthorized\"},\n        \"E0000047\" : {\"code\" :401,
          \"msg\":\"Unauthorized\"},\n        \"E0000048\" : {\"code\" :401, \"msg\":\"Unauthorized\"},\n
          \       \"E0000562\" : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000028\"
          \ : {\"code\" :409, \"msg\":\"Conflict\"},\n        \"E0000684\"  : {\"code\"
          :409, \"msg\":\"NoEstablishmentInfo\"},\n\t\t\"E0000929\"  :{\"code\" :409,
          \"msg\":\"AllEmployeeRemovalError\"},\n\t\t\"E0000042\" : {\"code\" :409,
          \"msg\":\"Invalid/missing Parameters from Request message\"},\n\t\t\"TI000030\"
          : {\"code\" :409, \"msg\":\"Invalid/missing Parameters from Request message\"},\n\t\t\"TI000029\"
          : {\"code\" :409, \"msg\":\"Sorry, you cannot add/remove employee to this
          completed training\"}\n    }\n    \n};\n\n\n\napim.setvariable('cfg',cfg);\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: Build_Request
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\n\nvar appcReq
          = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          cfg.SessionId, //apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n\t\t\t\"MWRequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode,\n            \"DebugFlag\": cfg.debugFlag,\n            \"UserInfo\":
          {\n                \"UserId\": cfg.userID,\n                \"IDNumber\":
          cfg.IDNumber\n            }\n\t\t\n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\" :
          OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error:
        - SOAPError
        - OperationError
        - ConnectionError
        target-url: $(ace-trni-trainingmanagement)/external/UpdateEmployee
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;



          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg'); \n\nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
        - condition: ($header("Response-Status") = 'Error' or $header("Response-Status")
            = 'ERROR')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');     \n\nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \   }\n}\nif(httperror == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nif
                (error.errorCode == 'E0000042'){\n    \n    var resp = {\n        \"errorCode\":
                error.errorCode,\n        \"errorMessage\": error.errorMessage,\n
                \       \"Body\": message[cfg.responseName].Body\n    };\n    session.output.write(resp);\n}\nelse{\n
                \   session.output.write(error);    \n}\n\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');
                \   \nvar cfg = apim.getvariable('cfg'); \nvar error = {\n  \"errorCode\":
                message['Error'].Code,\n  \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n
                \   \"ar-SA\": 'System Error'\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.errorCode]){\n       httperror = cfg.errorMap[error.errorCode].code;\n
                \      \n    }\n}\nif(httperror == 0){\n   httperror = 500;\n   //
                apim.error('ERROR',400,'Bad Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\n\nif
                (error.errorCode == 'E0000042'){\n    \n    var resp = {\n        \"errorCode\":
                error.errorCode,\n        \"errorMessage\": error.errorMessage,\n
                \       \"Body\": message[cfg.responseName].Body\n    };\n    session.output.write(resp);\n}\nelse{\n
                \   session.output.write(error);    \n}\napim.output('application/json');"
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.headers.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{     "errorCode": "E000500",     "errorMessage": "Internal server
              error"              }'
            type: string
    finally: []
  properties:
    target-url:
      value: http://trni-trainingmanagement-http-ace.apps.stg.qiwa-nonprod.local/external/UpdateEmployee
      description: The URL of the target service
      encoded: false
  activity-log:
    success-content: payload
    error-content: header
    enabled: true
  buffering: true
  application-authentication:
    certificate: false
  catalogs: {}
definitions:
  updateemployeeRequest:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: string
      TrainingId:
        type: integer
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      EstablishmentId:
        type: integer
      AddEmployeeDetails:
        $ref: '#/definitions/EmployeeList'
      RemoveEmployeeDetails:
        $ref: '#/definitions/EmployeeList'
  EmployeeList:
    type: array
    items:
      $ref: '#/definitions/Employee'
  Employee:
    type: object
    properties:
      LaborerIdNo:
        type: string
      EmployeeName:
        type: string
      RequestId:
        type: string
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      headers:
        $ref: '#/definitions/Headers'
      ResponseMessage:
        type: string
        example: Employee List Updated Successfully
      AddedEmployeesList:
        type: object
        properties:
          EmployeeList:
            type: array
            items:
              properties:
                IDNumber:
                  type: string
                employeeName:
                  type: string
                StatusId:
                  type: integer
                RequestId:
                  type: integer
      DeletedEmployeesList:
        type: object
        properties:
          EmployeeList:
            type: array
            items:
              properties:
                IDNumber:
                  type: string
                employeeName:
                  type: string
                Status:
                  type: string
                RequestId:
                  type: integer
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  ErrorModel_409:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
      Body:
        $ref: '#/definitions/EmployeeList'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      HH:MM:SS.sssfor gregorian dates only
    example: "2021-12-31 22:00:00.000"
paths:
  /updateEmployee:
    post:
      tags:
      - add establishment training
      description: service adds training details to Qiwa.
      operationId: ""
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/ErrorModel_409'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
      parameters:
      - name: X-IBM-Client-Id
        in: header
        required: true
        description: Client id issued by security server
        type: string
      - name: X-IBM-Client-Secret
        in: header
        required: true
        description: Client secret issued by security server
        type: string
      - name: X-Request-Id
        in: header
        required: false
        description: X-Request-Id returned in the response header
        type: string
      - name: requestBody
        in: body
        required: true
        schema:
          type: object
      consumes:
      - application/json
      produces:
      - application/json
