swagger: "2.0"
info:
  title: MCS_GetEmployeeDetails_Rest
  description: This API exposes MCS to get Employee Details services from Qiwa platform
  x-ibm-name: mcs-getemployeedetails-rest
  version: 2.0.0
schemes:
- https
basePath: /mcs/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /employee/{personID}/details/:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/personID'
    get:
      tags:
      - GetEmployeeDetails
      description: Service to Get Employee Details
      operationId: mcsgetemployeedetails-rest
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      employeeID:
        type: string
        description: The Employee's Identification Number
      personalInfo:
        $ref: '#/definitions/personalInfoModel'
      jobAssignmentInfo:
        $ref: '#/definitions/jobAssignmentInfoModel'
      firstHiringDate:
        $ref: '#/definitions/HijriDateModel'
      salaryInfo:
        $ref: '#/definitions/salaryInfoModel'
      isSuspended:
        type: string
        enum:
        - "Yes"
        - "No"
      isUnderInvestigation:
        type: string
        enum:
        - "Yes"
        - "No"
      bayanDetails:
        $ref: '#/definitions/bayanDetailsModel'
      servicePeriodDays:
        type: integer
      employeeRemarks:
        type: string
      lastPromotedDate:
        $ref: '#/definitions/HijriDateModel'
      lastExceptionalPromotedDate:
        $ref: '#/definitions/HijriDateModel'
      isExceptional:
        type: string
        enum:
        - "Yes"
        - "No"
      jobExceptionDescription:
        type: string
        enum:
        - مستثناة
        - غير مستثناة
        - غير محدد
      seniorityDate:
        $ref: '#/definitions/HijriDateModel'
      clearanceDate:
        $ref: '#/definitions/HijriDateModel'
      isCvAvail:
        type: string
        enum:
        - "Yes"
        - "No"
      cvUrl:
        type: string
      transferType:
        $ref: '#/definitions/transferTypeModel'
    required:
    - employeeID
    - personalInfo
    - jobAssignmentInfo
    - firstHiringDate
    - isSuspended
    - isUnderInvestigation
    - servicePeriodDays
    - isCvAvail
  salaryInfoModel:
    type: object
    properties:
      salary:
        type: integer
      startDate:
        $ref: '#/definitions/HijriDateModel'
    required:
    - salary
  bayanDetailsModel:
    type: object
    properties:
      jobBayanNum:
        type: integer
      jobBayanDate:
        $ref: '#/definitions/HijriDateModel'
    required:
    - jobBayanNum
    - jobBayanDate
  transferTypeModel:
    type: object
    properties:
      transferTypeCode:
        type: integer
        enum:
        - 1
        - 2
      transferTypeDescription:
        type: string
    required:
    - transferTypeCode
    - transferTypeDescription
  personalInfoModel:
    type: object
    description: N/A
    properties:
      personName:
        $ref: '#/definitions/personalNameModel'
        description: Full Name in Arabic
      gender:
        $ref: '#/definitions/NameCodeModel'
        description: This object contains the Gender Code and Gender Description
      birthDate:
        $ref: '#/definitions/HijriDateModel'
      nicBirthDate:
        $ref: '#/definitions/HijriDateModel'
        description: Birth Date as per NIC
      birthPlace:
        $ref: '#/definitions/LocaleDataModel'
      personIdentity:
        type: integer
      personIdNum:
        type: integer
      identifierIssueDate:
        $ref: '#/definitions/HijriDateModel'
      identifierIssuePlace:
        $ref: '#/definitions/LocaleDataModel'
      hafizaNumber:
        type: integer
      nationlaity:
        $ref: '#/definitions/NameCodeModel'
    required:
    - gender
    - birthDate
    - birthPlace
    - personIdentity
    - personIdNum
    - hafizaNumber
    - nationlaity
  personalNameModel:
    type: object
    properties:
      fullName:
        $ref: '#/definitions/LocaleDataModel'
      firstName:
        $ref: '#/definitions/LocaleDataModel'
      secondName:
        $ref: '#/definitions/LocaleDataModel'
      thirdName:
        $ref: '#/definitions/LocaleDataModel'
      lastName:
        $ref: '#/definitions/LocaleDataModel'
    required:
    - firstName
    - secondName
    - lastName
  jobAssignmentInfoModel:
    type: object
    properties:
      jobTitle:
        $ref: '#/definitions/NameCodeModel'
      jobNumber:
        type: integer
      jobClassCode:
        type: integer
        description: Job Class Code in the current Job ladder - 7 digits ,the most
          2 right digit represent the grade number
      jobAction:
        $ref: '#/definitions/jobActionModel'
      assignmentStatus:
        $ref: '#/definitions/NameCodeModel'
      jobOrg:
        $ref: '#/definitions/jobOrgModel'
      internalOwner:
        $ref: '#/definitions/NameCodeModel'
      jobLadder:
        $ref: '#/definitions/jobLadderModel'
      militaryService:
        $ref: '#/definitions/militaryServiceModel'
      jobLocation:
        $ref: '#/definitions/NameCodeModel'
      jobExtension:
        $ref: '#/definitions/jobExtensionModel'
      deptSummaryInfo:
        $ref: '#/definitions/NameCodeModel'
    required:
    - jobTitle
    - jobNumber
    - jobClassCode
    - jobAction
    - assignmentStatus
    - jobOrg
    - internalOwner
    - jobLadder
  jobActionModel:
    type: object
    properties:
      jobActionCode:
        type: string
      jobActionDesc:
        type: string
      jobActionDate:
        $ref: '#/definitions/HijriDateModel'
      decisionNumber:
        type: integer
      decisionDate:
        $ref: '#/definitions/HijriDateModel'
    required:
    - decisionNumber
    - decisionDate
  jobOrgModel:
    type: object
    properties:
      orgId:
        type: integer
        description: Organization Identifier
      fullName:
        description: Full Name of the Organization
        $ref: '#/definitions/LocaleDataModel'
    required:
    - orgId
  jobLadderModel:
    type: object
    properties:
      jobLadderCode:
        type: integer
      jobLadderDescription:
        type: string
      gradeStep:
        $ref: '#/definitions/gradeStepModel'
    required:
    - jobLadderCode
  militaryServiceModel:
    type: object
    properties:
      militaryServiceYears:
        type: integer
      militaryServiceMonths:
        type: integer
      militaryServiceDays:
        type: integer
  jobExtensionModel:
    type: object
    properties:
      startDate:
        $ref: '#/definitions/HijriDateModel'
      jobExtensionMonths:
        type: integer
      jobExtensionYears:
        type: integer
  gradeStepModel:
    type: object
    properties:
      jobGradeCode:
        type: integer
      jobGradeDescription:
        type: string
      jobGradeStartDate:
        $ref: '#/definitions/HijriDateModel'
      jobStepCode:
        type: integer
      jobStepStartDate:
        $ref: '#/definitions/HijriDateModel'
      extraStepCode:
        type: integer
      prevGradeDate:
        $ref: '#/definitions/HijriDateModel'
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: 31/12/2017
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: 1439/12/25
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri and gregorian
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  ServerErrorModel:
    type: object
    required:
    - httpCode
    - httpMessage
    - moreInformation
    properties:
      httpCode:
        type: string
        example: "401"
      httpMessage:
        type: string
        example: Unauthorized
      moreInformation:
        type: string
        example: Cannot pass the security checks that are required by the target API
          or operation
  LocaleDataModel:
    type: object
    properties:
      ar-SA:
        type: string
      en-US:
        type: string
parameters:
  personID:
    in: path
    name: personID
    description: Personal Identification
    required: true
    type: integer
    maxLength: 10
    minLength: 10
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ServerErrorModel'
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ServerErrorModel'
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ServerErrorModel'
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ServerErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ServerErrorModel'
