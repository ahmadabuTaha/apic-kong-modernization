  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\nvar backendToken = apim.getvariable('message.headers.ServiceNowToken');\r\napim.setvariable('message.headers.Authorization','Bearer
          '+backendToken);\r\n// Get query string\r\nvar qs = apim.getvariable('request.querystring');
          // e.g., \"u_zendesk_ticket_number=123&u_requester_email=test@email.com\"\r\n\r\n//
          Convert to object\r\nvar params = {};\r\nif (qs) {\r\n    qs.split('&').forEach(function(pair)
          {\r\n        var parts = pair.split('=');\r\n        var key = decodeURIComponent(parts[0]);\r\n
          \       var value = parts[1] ? decodeURIComponent(parts[1]) : '';\r\n        params[key]
          = value;\r\n    });\r\n}\r\n\r\n// Mandatory parameter check\r\nif (!params.u_zendesk_ticket_number
          || params.u_zendesk_ticket_number.trim() === '') {\r\n    context.reject('BadRequest',
          'u_zendesk_ticket_number is mandatory');\r\n}\r\n\r\n// Conditional parameters\r\nvar
          conditionalParams = [\r\n    'u_requester_email',\r\n    'u_mobile_number',\r\n
          \   'u_facility_number_or_unified_national_number',\r\n    'u_id_residence_number'\r\n];\r\n\r\n//
          Count how many conditional parameters are provided\r\nvar provided = conditionalParams.filter(function(p)
          {\r\n    return params[p] && params[p].trim() !== '';\r\n});\r\n\r\nif (provided.length
          !== 1) {\r\n    context.reject(\r\n        'BadRequest',\r\n        'Exactly
          ONE of the following query parameters must be provided: ' + conditionalParams.join(',
          ')\r\n    );\r\n}\r\n"
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(dp-qiwadp-servicenow)/api/now/table/u_zendesk_tickets$(request.search)
        follow-redirects: false
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\n\r\nvar body = apim.getvariable('message.body');\r\n\r\n//
          Parse safely (string → object)\r\nwhile (typeof body === 'string') {\r\n
          \ body = JSON.parse(body);\r\n}\r\n\r\n// Auto-detect wrapper\r\nvar data
          =\r\n  body.result ? body :\r\n  body.response && body.response.result ?
          body.response :\r\n  body.data && body.data.result ? body.data :\r\n  null;\r\n\r\n//
          If result is missing, empty, or not an array, return custom error\r\nif
          (!data || !Array.isArray(data.result) || data.result.length === 0) {\r\n
          \ var errorResponse = {\r\n    Status: \"ERROR\",\r\n    ArabicMsg: \"لا
          يوجد معلومات\",\r\n    EnglishMsg: \"No Data Found\"\r\n  };\r\n  apim.setvariable('message.body',
          JSON.stringify(errorResponse));\r\n  return;\r\n}\r\n\r\n// Take FIRST object
          only\r\nvar item = data.result[0];\r\n\r\n// Map required fields into a
          SINGLE object\r\nvar mappedData = {\r\n  u_requester_email: item.u_requester_email
          || \"\",\r\n  u_mobile_number: item.u_mobile_number || \"\",\r\n  u_facility_number_or_unified_national_number:\r\n
          \   item.u_facility_number_or_unified_national_number || \"\",\r\n  u_id_residence_number:
          item.u_id_residence_number || \"\",\r\n  u_zendesk_ticket_number: item.u_zendesk_ticket_number
          || \"\",\r\n  u_created_at: item.u_created_at || \"\",\r\n  u_solved_date:
          item.u_solved_date || \"\",\r\n  u_main_services: item.u_main_services ||
          \"\",\r\n  u_sub_category: item.u_sub_category || \"\",\r\n  u_status: item.u_status
          || \"\",\r\n  u_sla_breached: item.u_sla_breached || \"\",\r\n  ineligibility_reason:
          item.ineligibility_reason || \"\"\r\n};\r\n\r\n// Set OBJECT as response
          (not array)\r\napim.setvariable('message.body', JSON.stringify(mappedData));\r\n"
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"SNA0001\",\r\n    \"channelId\" : \"Qiwa\",\r\n    \"requestName\" : \"getZendeskTicketDetailsRq\",\r\n
          \   \"responseName\": \"getZendeskTicketDetailsRs\",\r\n    \"errorMap\"
          :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\r\n
          \   }\r\n    \r\n};\r\nvar DPResponse = apim.getvariable('message.body');\r\napim.setvariable('DPResponse',DPResponse);\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare-Request
        source: "var apim = require('apim');\r\n//var millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\nvar millisecondsvalue = apim.getvariable('session.globalTransactionID');\r\napim.setvariable('TransactionID1',millisecondsvalue);\r\nvar
          appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"Servicenow\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : apim.getvariable('request.querystring')\r\n            \r\n    }\r\n};\r\n\r\nif
          (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\napim.setvariable('payload',appcReq);
          \    \r\n//session.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - gatewayscript:
        version: 2.0.0
        title: ReqForLogging
        source: "var apim=require('apim');\r\nvar appconnectrequest = apim.getvariable('payload');\r\nvar
          Body = apim.getvariable('DPResponse');\r\nvar Headers = appconnectrequest.getZendeskTicketDetailsRq.Header;\r\nvar
          transactionId1 = Math.floor(1000000000 + Math.random() * 9000000000);\r\napim.setvariable('message.headers.TransactionID',transactionId1);\r\napim.setvariable('TransactionID',transactionId1);\r\nvar
          SuccessCall =\r\n{\r\n                \"Status\": \"SUCCESS\",\r\n                \"Code\":
          \"00000000\",\r\n                \"ArabicMsg\": \"تمت العملية بنجاح\",\r\n
          \               \"EnglishMsg\": \"Success Call\"\r\n            }\r\n\r\nvar
          APIRes = {\r\n    \"Header\": Headers,\r\n     Body\r\n};\r\nAPIRes.Header.ResponseStatus
          = SuccessCall;\r\nvar jsonData= {\r\n\t\"LogAPIData\": {\r\n\t\t\"getZendeskTicketDetailsRq\":
          appconnectrequest.getZendeskTicketDetailsRq,\r\n\t\t\"getZendeskTicketDetailsRs\":
          APIRes,\r\n\t}\r\n}\r\nsession.output.write(jsonData);\r\napim.output('application/json');"
    - invoke:
        version: 2.3.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        websocket-upgrade: false
        graphql-send-type: detect
        target-url: $(ace-tip-internal)/external/logwrapperapidata
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\nvar FinalRes = apim.getvariable('DPResponse');\r\nvar
          TransId = apim.getvariable('TransactionID1');\r\n//apim.setvariable('TransactionID1',millisecondsvalue);\r\napim.setvariable('message.headers.TransactionID',TransId);\r\nsession.output.write(FinalRes);\r\napim.output('application/json');"
