        type: string
      fullName:
        type: string
      membershipStatus:
        $ref: '#/definitions/OutMembershipStatus_Type'
      membershipEndDate:
        type: string
      mpecialization:
        type: string
      error:
        type: boolean
      isMember:
        type: boolean
      isActive:
        type: boolean
