swagger: "2.0"
info:
  title: Ajeer Bulk Payments
  x-ibm-name: ajeer-bulk-payments
  version: 1.0.0
schemes:
- https
basePath: /api/v2/payments
security:
- Client Secret: []
  clientID: []
securityDefinitions:
  Client Secret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - set-variable:
        version: 2.0.0
        title: set-variable
        actions:
        - set: message.headers.php-auth-user
          value: ajeer_ibm
          type: string
        - set: message.headers.php-auth-pw
          value: j8hVNtUhytfl9mbCxtSYOMz98I6dWQeACcZAPTnX
          type: string
        - set: message.headers.clientId
          value: $(client.app.id)
          type: string
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ajeer-target-url)$(request.path)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
paths:
  /payments/{id}:
    get:
      responses:
        "200":
          schema:
            type: string
          description: success
    parameters:
    - name: id
      in: path
      required: true
      type: string
  /offline/topup:
    post:
      responses:
        "200":
          schema:
            type: string
          description: success
  /notification:
    post:
      responses:
        "200":
          schema:
            type: string
          description: success
  /:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    options:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
