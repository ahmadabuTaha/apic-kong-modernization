swagger: "2.0"
info:
  title: MCS_GetEmployeeInfo
  x-ibm-name: mcs-getemployeeinfo
  version: 1.0.0
  description: This API exposes MCS to get Employee Information services from Qiwa
    platform
schemes:
- https
basePath: /mcs/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          employeeId:
            schema:
              type: string
            variable: request.parameters.employeeId
        outputs:
          "":
            schema:
              description: ""
              type: object
              properties:
                PersonID:
                  type: string
                  name: PersonID
              example: "{\r\n      \"PersonID\":\"1037702030\"\r\n    }"
            variable: message.body
            content: application/json
        actions:
        - set: .PersonID
          from: employeeId
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"EXGEMI0001\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"EmployeeInfoRq\",\n
          \   \"responseName\": \"EmployeeInfoRs\",\n    \"errorMap\" :{\n        \"ESBSCHEMA\"
          : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n    \n};\n\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-mcs)/external/getemployeeinfo
        persistent-connection: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\n\r\napim.output('application/json');\r\n\r\nvar
          message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          Header = message[cfg.responseName].Header;\r\nvar TransactionId = Header.TransactionId;\r\nvar
          ChannelId = Header.ChannelId;\r\nvar RequestTime = Header.RequestTime;\r\nvar
          SessionId = Header.SessionId;\r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar
          MWResponseTime = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\r\n\r\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\r\nif
          (RequestTime !== 'undefined')\r\n apim.setvariable('message.headers.RequestTime',RequestTime,'add');\r\nif
          (SessionId !== 'undefined')\r\n apim.setvariable('message.headers.X-Request-Id',SessionId,'add');\r\nif
          (MWRequestTime !== 'undefined')\r\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\r\nif
          (MWResponseTime !== 'undefined')\r\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\r\n\r\napim.setvariable('message.headers.Response-Status',status,'add');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    $ref: '#/definitions/StrEmployeeInfoRs_BodyType'
                  variable: message.body
                  content: application/json
              outputs:
                "":
                  schema:
                    $ref: '#/definitions/EmployeeInfoRs_BodyType'
                  variable: message.body
                  content: application/json
              actions:
              - set: .employeeID
                from: .EmployeeID
              - set: .personalInfo.personName.firstName
                from: .PersonalInfo.PersonName.FirstName
              - set: .personalInfo.personName.secondName
                from: .PersonalInfo.PersonName.SecondName
              - set: .personalInfo.personName.thirdName
                from: .PersonalInfo.PersonName.ThirdName
              - set: .personalInfo.personName.lastName
                from: .PersonalInfo.PersonName.LastName
              - set: .personalInfo.gender
                from: .PersonalInfo.Gender
              - set: .personalInfo.birthDate
                from: .PersonalInfo.BirthDate
              - set: .personalInfo.personIdentifier
                from: .PersonalInfo.PersonIdentifier
              - set: .personalInfo.hafizaNumber
                from: .PersonalInfo.HafizaNumber
              - set: .personalInfo.identifierIssueDate
                from: .PersonalInfo.IdentifierIssueDate
              - set: .personalInfo.identifierIssuePlace
                from: .PersonalInfo.IdentifierIssuePlace
              - set: .personalInfo.nationality.nationalityCode
                from: .PersonalInfo.Nationality.NationalityCode
              - set: .personalInfo.nationality.nationalityName
                from: .PersonalInfo.Nationality.NationalityName
              - set: .jobTitle.jobTitleCode
                from: .JobTitle.JobTitleCode
              - set: .jobTitle.jobTitleName
                from: .JobTitle.JobTitleName
              - set: .jobHiringDate
                from: .JobHiringDate
              - set: .jobNumber
                from: .JobNumber
              - set: .currentJobStatus.jobStatusCode
                from: .CurrentJobStatus.JobStatusCode
              - set: .currentJobStatus.jobStatusDescriptionArabic
                from: .CurrentJobStatus.JobStatusDescriptionArabic
              - set: .currentJobStatus.jobStatusDescriptionEnglish
                from: .CurrentJobStatus.JobStatusDescriptionEnglish
              - set: .basicSalary
                from: .BasicSalary
              - set: .jobGrade.jobGradeCode
                from: .JobGrade.JobGradeCode
              - set: .jobGrade.jobGradeDescription
                from: .JobGrade.JobGradeDescription
              - set: .jobGrade.jobGradeStartDate
                from: .JobGrade.JobGradeStartDate
              - set: .currentOrganization.organizationCode
                from: .CurrentOrganization.OrganizationCode
              - set: .currentOrganization.organizationDescription
                from: .CurrentOrganization.OrganizationDescription
              - set: .isSuspended
                from: .IsSuspended
              - set: .isUnderInvestigation
                from: .IsUnderInvestigation
              - set: .jobDepartmentName
                from: .JobDepartmentName
              - set: .jobStep.jobStepCode
                from: .JobStep.JobStepCode
              - set: .jobStep.jobStepDescription
                from: .JobStep.JobStepDescription
              - set: .jobStep.jobStepStartDate
                from: .JobStep.JobStepStartDate
              - set: .jobLocation.jobLocationCityCode
                from: .JobLocation.JobLocationCityCode
              - set: .jobLocation.jobLocationCityName
                from: .JobLocation.JobLocationCityName
              - set: .currentJobAction.jobActionCode
                from: .CurrentJobAction.JobActionCode
              - set: .currentJobAction.jobActionDate
                from: .CurrentJobAction.JobActionDate
              - set: .currentJobAction.jobActionDescription
                from: .CurrentJobAction.JobActionDescription
              - set: .currentJobAction.decisionNumber
                from: .CurrentJobAction.DecisionNumber
              - set: .currentJobAction.decisionDate
                from: .CurrentJobAction.DecisionDate
              - set: .bAYANDetails.jobBAYANNumber
                from: .BAYANDetails.JobBAYANNumber
              - set: .bAYANDetails.jobBAYANDate
                from: .BAYANDetails.JobBAYANDate
              - set: .jobExtension.jobExtensionStartDate
                from: .JobExtension.JobExtensionStartDate
              - set: .jobExtension.jobExtensionMonths
                from: .JobExtension.JobExtensionMonths
              - set: .jobExtension.jobExtensionYears
                from: .JobExtension.JobExtensionYears
              - set: .jobLadder.jobLadderCode
                from: .JobLadder.JobLadderCode
              - set: .jobLadder.jobLadderDescription
                from: .JobLadder.JobLadderDescription
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                namespaceInheritance: false
                inlineNamespaces: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
parameters:
  employeeId:
    in: path
    name: employeeId
    description: Personal Identifier
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
