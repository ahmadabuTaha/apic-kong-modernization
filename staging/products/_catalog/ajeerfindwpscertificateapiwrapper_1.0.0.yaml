swagger: "2.0"
info:
  title: AjeerFindWPSCertificateAPIWrapper
  description: This API is used to get the WPS certificate
  x-ibm-name: ajeerfindwpscertificateapiwrapper
  version: 1.0.0
schemes:
- https
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /ajeerfindwpscertificate:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    get:
      tags:
      - AjeerFindWPSCertificateAPIWrapper
      description: This API is used to get the WPS certificate
      operationId: ajeerfindwpscertificateapiwrapper
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: Response object returned by the get operation
    properties:
      certfifcateExpireDate:
        type: string
      certificateIssueDate:
        type: string
      certificateNumber:
        type: integer
      establishment:
        type: object
        properties:
          laborOfficeId:
            type: integer
          sequenceNumber:
            type: integer
          establishmentName:
            type: string
          unifiedEstablishmentNumber:
            type: integer
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: object
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  UserId:
    in: header
    name: UserId
    description: UserI d
    required: false
    type: integer
  laborOfficeId:
    in: query
    name: LaborerIdNo
    description: LaborerIdNo
    required: true
    type: string
  sequenceNumber:
    in: query
    name: sequenceNumber
    description: sequenceNumber
    required: true
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
