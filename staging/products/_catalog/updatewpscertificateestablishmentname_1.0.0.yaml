swagger: "2.0"
info:
  title: UpdateWPSCertificateEstablishmentName
  description: |
    This API updates the establishment name for active WPS compliance certificates based on CertificateNumber, LaborOfficeId, and EstablishmentSequence.
  x-ibm-name: updatewpscertificateestablishmentname
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
security:
- ClientSecret: []
  OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  ClientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientIdHeader:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
paths:
  /UpdateWPSCertificateEstablishmentName:
    post:
      tags:
      - UpdateWPSCertificateEstablishmentName
      description: |
        Updates the establishment name for an active WPS compliance certificate.
      operationId: UpdateWPSCertificateEstablishmentName
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRs_MessageType'
        "400":
          description: Bad request due to missing or invalid input.
        "404":
          description: No data found.
        "500":
          description: Internal server error.
      parameters:
      - name: requestBody
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRq_MessageType'
      - name: X-IBM-Client-Id
        in: header
        required: true
        type: string
      - name: X-IBM-Client-Secret
        in: header
        required: true
        type: string
definitions:
  UpdateWPSCertificateEstablishmentNameRq_MessageType:
    type: object
    properties:
      UpdateWPSCertificateEstablishmentNameRq:
        $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRq_Type'
  UpdateWPSCertificateEstablishmentNameRs_MessageType:
    type: object
    properties:
      UpdateWPSCertificateEstablishmentNameRs:
        $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRs_Type'
  UpdateWPSCertificateEstablishmentNameRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRq_BodyType'
  UpdateWPSCertificateEstablishmentNameRq_BodyType:
    type: object
    properties:
      CertificateNumber:
        type: string
        example: "20012204000141"
      LaborOfficeId:
        type: integer
        example: 1
      EstablishmentSequence:
        type: integer
        example: 2682551
  UpdateWPSCertificateEstablishmentNameRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/UpdateWPSCertificateEstablishmentNameRs_BodyType'
  UpdateWPSCertificateEstablishmentNameRs_BodyType:
    type: object
    properties:
      Message:
        type: string
      ExistingEstablishmentName:
        type: string
      UpdatedEstablishmentName:
        type: string
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Status
    - Code
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-wps-wagesprotectionsystem)/qiwawps/UpdateWPSCertificateEstablishmentName
        follow-redirects: false
        inject-proxy-headers: true
        stop-on-error:
        - ConnectionError
        - SOAPError
        - OperationError
    - gatewayscript:
        version: 2.0.0
        title: Set Header
        source: |
          var apim = require('apim');
          var Response = apim.getvariable('message.body');
          var statusCode = Response.UpdateWPSCertificateEstablishmentNameRs.Header.ResponseStatus.Code;

          // Success
          if(statusCode == '00000000'){
            apim.setvariable('message.status.code',200,'set');
          }
          // No data found
          else if(statusCode == 'E0000024'){
            apim.setvariable('message.status.code',404,'set');
          }
          // Missing fields
          else if(statusCode == 'E0001286' || statusCode == 'E0000263'){
            apim.setvariable('message.status.code',400,'set');
          }
          // Generic error
          else if(statusCode == '99999999'){
            apim.setvariable('message.status.code',500,'set');
          }
          else {
            apim.setvariable('message.status.code',400,'set');
          }
  properties:
    target-url:
      value: http://wps-wagesprotectionsystem-http-ace.apps.stg.qiwa-nonprod.local/qiwawps/UpdateWPSCertificateEstablishmentName
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
