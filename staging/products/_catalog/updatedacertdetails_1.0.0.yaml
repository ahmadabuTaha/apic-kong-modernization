x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-sc-salary-certificate)/updateDACertDetails
        follow-redirects: false
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\nvar Response = apim.getvariable('message.body');\r\nvar
          statusCode = Response.updateDACertDetailsRs.Header.ResponseStatus.Code;\r\n\r\nif(statusCode
          == 'ESBSCHEMA' || statusCode == 'E0000004' || statusCode == 'E0001203' ||
          statusCode == 'E0001202' \r\n|| statusCode == 'E0001201'  || statusCode
          == 'E0001200' ){\r\n    var code = 400\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == 'E0000034' || statusCode == 'E0000046' || statusCode ==
          'E0000047' || statusCode == 'E0000048' ||statusCode == 'E0001287' ){\r\n
          \   var code = 401\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '99999999' || statusCode == 'E9999999' || statusCode ==
          'E9999998' || statusCode == 'E0000436'){\r\n    var code = 500\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\nelse
          if(statusCode == '00000000'){\r\n    var code = 200\r\n    apim.setvariable('message.status.code',code,'set');\r\n}else{\r\n
          \     var code = 409\r\n    apim.setvariable('message.status.code',code,'set');\r\n}\r\n"
  properties:
    target-url:
      value: http://sc-salary-certificate-http-ace.apps.stg.qiwa-nonprod.local//updateDACertDetails
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
