swagger: "2.0"
info:
  title: MCS_GetEmployeeHistoricalInfo
  x-ibm-name: mcs-getemployeehistoricalinfo
  version: 2.0.0
  description: This API exposes MCS to get Employee Historical Information services
    from Qiwa platform
schemes:
- https
basePath: /mcs/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          employeeId:
            schema:
              type: string
            variable: request.parameters.employeeId
            content: application/json
        outputs:
          "":
            schema:
              $ref: '#/definitions/StrEmployeeHistoricalInfoRq_BodyType'
            variable: message.body
            content: application/json
        actions:
        - set: .PersonID
          from: employeeId
        options:
          mapEnablePostProcessingJSON: true
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapReferenceLimit: 1
          includeEmptyXMLElements: false
          namespaceInheritance: false
          inlineNamespaces: false
          mapResolveApicVariables: false
          mapOptimizeSchemaDefinition: true
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
          : \"EXGEHI0001\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
          : \"EmployeeHistoricalInfoRq\",\r\n    \"responseName\": \"EmployeeHistoricalInfoRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\n\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-mcs)/external/getemployeehistoricalinfo
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "\tvar apim = require('apim');\n\t\n\tapim.output('application/json');\n\n
          \   \n    \n    var cfg = apim.getvariable('cfg');\n    \n\tvar TransactionId
          = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.TransactionId\");\n\tvar
          ChannelId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ChannelId\");\n\tvar
          RequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.RequestTime\");\n\tvar
          SessionId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.SessionId\");\n\tvar
          MWRequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWRequestTime\");\n\tvar
          MWResponseTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWResponseTime\");\n\tvar
          status = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ResponseStatus.Status\");\n\t\n\n
          \   apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\n
          \   apim.setvariable('message.headers.Channel-Id',ChannelId,'add');\n    if
          (RequestTime !== 'undefined')\n\t    apim.setvariable('message.headers.RequestTime',RequestTime,'add');\n\tif
          (SessionId !== 'undefined')\n        apim.setvariable('message.headers.X-Request-Id',SessionId,'add');\n
          \    if (MWRequestTime !== 'undefined')\n        apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\n
          \   if (MWResponseTime !== 'undefined')\n        apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\n\n
          \   \n    apim.setvariable('message.headers.Response-Status',status,'add');\n
          \   "
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    $ref: '#/definitions/StrEmployeeHistoricalInfoRs_BodyType'
                  variable: message.body
                  content: application/json
              outputs:
                "":
                  schema:
                    $ref: '#/definitions/EmployeeHistoricalInfoModel'
                  variable: message.body
                  content: application/json
              actions:
              - set: .employeeID
                from: .EmployeeID
              - create: .historyInfoList
                foreach: .HistoryInfoList.HistoryInfoStructure
                from: .HistoryInfoList.HistoryInfoStructure
                actions:
                - set: jobNumber
                  from: JobNumber
                - set: jobTitle.code
                  from: JobTitle.JobTitleCode
                - set: jobTitle.name
                  from: JobTitle.JobTitleName
                - set: jobLadder.code
                  from: JobLadder.JobLadderCode
                - set: jobLadder.name
                  from: JobLadder.JobLadderDescription
                - set: jobGrade.jobGradeCode
                  from: JobGrade.JobGradeCode
                - set: jobGrade.jobGradeDescription
                  from: JobGrade.JobGradeDescription
                - set: jobGrade.jobGradeStartDate
                  from: JobGrade.JobGradeStartDate
                - set: organization.code
                  from: Organization.OrganizationCode
                - set: organization.name
                  from: Organization.OrganizationDescription
                - set: jobStep.jobStepCode
                  from: JobStep.JobStepCode
                - set: jobStep.jobStepDescription
                  from: JobStep.JobStepDescription
                - set: jobStep.jobStepStartDate
                  from: JobStep.JobStepStartDate
                - set: jobAction.jobActionCode
                  from: JobAction.JobActionCode
                - set: jobAction.jobActionDate
                  from: JobAction.JobActionDate
                - set: jobAction.jobActionDescription
                  from: JobAction.JobActionDescription
                - set: jobAction.decisionNumber
                  from: JobAction.DecisionNumber
                - set: jobAction.decisionDate
                  from: JobAction.DecisionDate
                - set: jobLocation.code
                  from: JobLocation.JobLocationCityCode
                - set: jobLocation.name
                  from: JobLocation.JobLocationCityName
                - set: jobExtension.jobExtensionStartDate
                  from: JobExtension.JobExtensionStartDate
                - set: jobExtension.jobExtensionMonths
                  from: JobExtension.JobExtensionMonths
                - set: jobExtension.jobExtensionYears
                  from: JobExtension.JobExtensionYears
                - set: basicSalary
                  from: BasicSalary
                - set: isSuspended
                  from: IsSuspended
                - set: isUnderInvestigation
                  from: IsUnderInvestigation
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                inlineNamespaces: false
                namespaceInheritance: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 409;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
parameters:
  employeeId:
    in: path
    name: employeeId
    description: Employee Identification
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    additionalProperties: false
    properties:
      EmployeeHistoricalInfo:
        $ref: '#/definitions/StrEmployeeHistoricalInfoRs_BodyType'
        properties: {}
  StrEmployeeHistoricalInfoRs_BodyType:
    type: object
    properties:
      EmployeeID:
        type: string
      HistoryInfoList:
        $ref: '#/definitions/StrHistoryInfoList'
    required:
    - EmployeeID
    - HistoryInfoList
  StrHistoryInfoList:
    type: object
    properties:
      HistoryInfoStructure:
        type: array
        items:
          $ref: '#/definitions/StrHistoryInfoStructure'
  StrHistoryInfoStructure:
    type: object
    properties:
      JobNumber:
        type: string
      JobTitle:
        $ref: '#/definitions/StrJobTitle'
      JobLadder:
        $ref: '#/definitions/StrJobLadder'
      JobGrade:
        $ref: '#/definitions/StrJobGrade'
      Organization:
        $ref: '#/definitions/StrOrganization'
      JobStep:
        $ref: '#/definitions/StrJobStep'
      JobAction:
        $ref: '#/definitions/StrJobAction'
      JobLocation:
        $ref: '#/definitions/StrJobLocation'
      JobExtension:
        $ref: '#/definitions/StrJobExtension'
      BasicSalary:
        type: string
      IsSuspended:
        type: string
      IsUnderInvestigation:
        type: string
    required:
    - JobNumber
    - JobTitle
    - JobLadder
    - JobGrade
    - Organization
    - JobStep
    - JobAction
    - JobLocation
    - JobExtension
  StrJobTitle:
    type: object
    properties:
      JobTitleCode:
        type: string
      JobTitleName:
        type: string
    required:
    - JobTitleCode
    - JobTitleName
  StrJobLadder:
    type: object
    properties:
      JobLadderCode:
        type: string
      JobLadderDescription:
        type: string
    required:
    - JobLadderCode
    - JobLadderDescription
  StrJobGrade:
    type: object
    properties:
      JobGradeCode:
        type: string
      JobGradeDescription:
        type: string
      JobGradeStartDate:
        type: string
    required:
    - JobGradeCode
    - JobGradeDescription
  StrOrganization:
    type: object
    properties:
      OrganizationCode:
        type: string
      OrganizationDescription:
        type: string
    required:
    - OrganizationCode
    - OrganizationDescription
  StrJobStep:
    type: object
    properties:
      JobStepCode:
        type: string
      JobStepDescription:
        type: string
      JobStepStartDate:
        type: string
    required:
    - JobStepCode
    - JobStepDescription
  StrJobAction:
    type: object
    properties:
      JobActionCode:
        type: string
      JobActionDate:
        type: string
      JobActionDescription:
        type: string
      DecisionNumber:
        type: string
      DecisionDate:
        type: string
    required:
    - JobActionCode
    - JobActionDate
    - JobActionDescription
    - DecisionNumber
  StrJobLocation:
    type: object
    properties:
      JobLocationCityCode:
        type: string
      JobLocationCityName:
        type: string
    required:
    - JobLocationCityCode
    - JobLocationCityName
  StrJobExtension:
    type: object
    properties:
      JobExtensionStartDate:
        type: string
      JobExtensionMonths:
        type: string
      JobExtensionYears:
        type: string
    required:
    - JobExtensionMonths
    - JobExtensionYears
  StrEmployeeHistoricalInfoRq_BodyType:
    type: object
    properties:
      PersonID:
        type: string
    required:
    - PersonID
  EmployeeHistoricalInfoModel:
    type: object
    properties:
      employeeID:
        type: string
        example: "42131566566"
      historyInfoList:
        type: array
        items:
          $ref: '#/definitions/HistoryInfoListModel'
  HistoryInfoListModel:
    type: object
    properties:
      jobNumber:
        $ref: '#/definitions/IntegerNumberModel'
      jobTitle:
        $ref: '#/definitions/NameCodeModel'
      jobLadder:
        $ref: '#/definitions/NameCodeModel'
      jobGrade:
        $ref: '#/definitions/JobGradeModel'
      organization:
        $ref: '#/definitions/NameCodeModel'
      jobStep:
        $ref: '#/definitions/JobStepModel'
      jobAction:
        $ref: '#/definitions/JobActionModel'
      jobLocation:
        $ref: '#/definitions/NameCodeModel'
      jobExtension:
        $ref: '#/definitions/JobExtensionModel'
      basicSalary:
        $ref: '#/definitions/NumberModel'
      isSuspended:
        type: boolean
        example: true
      isUnderInvestigation:
        type: boolean
        example: true
  JobGradeModel:
    type: object
    properties:
      jobGradeCode:
        $ref: '#/definitions/NumberModel'
      jobGradeDescription:
        type: string
        example: التاسعة
      jobGradeStartDate:
        $ref: '#/definitions/HijriDateModel'
  JobStepModel:
    type: object
    properties:
      jobStepCode:
        $ref: '#/definitions/NumberModel'
      jobStepDescription:
        type: string
        example: الثالثة
      jobStepStartDate:
        $ref: '#/definitions/HijriDateModel'
  JobActionModel:
    type: object
    properties:
      jobActionCode:
        $ref: '#/definitions/NumberModel'
      jobActionDate:
        $ref: '#/definitions/HijriDateModel'
      jobActionDescription:
        type: string
        example: Description
      decisionNumber:
        type: string
        example: "9876543210"
      decisionDate:
        $ref: '#/definitions/HijriDateModel'
  JobExtensionModel:
    type: object
    properties:
      jobExtensionStartDate:
        $ref: '#/definitions/HijriDateModel'
      jobExtensionMonths:
        $ref: '#/definitions/IntegerNumberModel'
      jobExtensionYears:
        $ref: '#/definitions/IntegerNumberModel'
  IntegerNumberModel:
    type: integer
    description: This object use for integer numbers
    example: 1
  NumberModel:
    type: number
    description: This object use for integer numbers
    example: 200
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
paths:
  /employee/{employeeId}/historicalinformation:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/employeeId'
    - in: header
      name: X-Request-Id
      description: X-Request-Id returned in the response header
      required: false
      type: string
    get:
      tags:
      - Employee Historical Information
      description: Service to Get Employee Historical Information
      operationId: getEmployeeHistoricalInfo
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
