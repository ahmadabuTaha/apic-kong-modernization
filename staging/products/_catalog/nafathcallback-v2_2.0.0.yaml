          session.output.write(appcReq);
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(nafathcallback-url)
        follow-redirects: false
        inject-proxy-headers: true
    finally: []
    catch: []
  type: rest
  phase: realized
  enforced: true
  testable: true
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    enabled: true
    error-content: payload
    success-content: payload
  buffering: true
definitions:
  CallbackRequest:
    type: object
    additionalProperties: false
    properties:
      id:
        type: integer
      key:
        type: string
  CallbackResponse:
    type: object
    properties:
      success:
        type: string
      reason:
        type: string
paths:
  /status:
    post:
      operationId: postGetReport
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/CallbackResponse'
      consumes:
      - application/json
      produces:
      - application/json
      description: Insert a GetReport
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/CallbackRequest'
        description: The request body for the operation
        required: true
