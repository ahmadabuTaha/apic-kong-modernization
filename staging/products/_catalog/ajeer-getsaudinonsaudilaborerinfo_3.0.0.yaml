      laborerInformation:
        $ref: '#/definitions/LaborerInformationModel'
      totalRecordCount:
        type: integer
        example: 126
  LaborerInformationModel:
    type: object
    properties:
      laborerId:
        type: string
        example: "610000000"
      laborerIdNo:
        type: string
        example: "2437700000"
      firstName:
        type: string
        example: first name
      secondName:
        type: string
        example: second name
      thirdName:
        type: string
        example: third name
      fourthName:
        type: string
        example: fourth name
      gender:
        type: string
