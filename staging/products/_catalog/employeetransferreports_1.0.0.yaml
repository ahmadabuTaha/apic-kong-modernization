swagger: "2.0"
info:
  title: EmployeeTransferReports
  x-ibm-name: employeetransferreports
  version: 1.0.0
schemes:
- https
basePath: /reporting
security:
- {}
securityDefinitions:
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientId:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - set-variable:
        version: 2.0.0
        title: set-variable
        actions:
        - set: Input
          value: $(message.body)
          type: any
    - invoke:
        version: 2.0.0
        title: invoke-LogInterceptor
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-rept-rpt-reportingalllogs)/LogInterceptor
    - gatewayscript:
        version: 2.0.0
        title: setting-contentType
        source: |2+
           var apim = require('apim');
          var Input = apim.getvariable('Input');
          session.output.write(Input)
          apim.output('application/json');

    - gatewayscript:
        version: 2.0.0
        title: setting-rootTag
        source: |2-
           var apim = require('apim');
          var Input = apim.getvariable('message.body');
          var keys = Object.keys(Input);
          var root = keys[0];
          apim.setvariable('message.headers.root',root,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: ($header("root") = 'ApproveRejectChangeSponsorByCurrentEmployerRq'
            or $header("root") = 'ApproveRejectChangeSponsorByCurrentEmployerRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: http://icp-proxy.qiwa.info:30337/report/chspo/apprejchspobycurrmploy
        - condition: ($header("root") = 'CancelChangeSponsorRequestRq' or $header("root")
            = 'CancelChangeSponsorRequestRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: http://icp-proxy.qiwa.info:30337/report/chspo/cancchsporeq
        - condition: ($header("root") = 'ApproveRejectChangeSponsorByLaborerRq' or
            $header("root") = 'ApproveRejectChangeSponsorByLaborerRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: http://icp-proxy.qiwa.info:30337/report/chspo/apprejchspobylabror
        - condition: ($header("root") = 'ValidateChangeSponsorRequestRq' or $header("root")
            = 'ValidateChangeSponsorRequestRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: http://icp-proxy.qiwa.info:30337/report/chspo/valchsporeq
        - condition: ($header("root") = 'SubmitChangeSponsorRequestRq' or $header("root")
            = 'SubmitChangeSponsorRequestRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: http://icp-proxy.qiwa.info:30337/report/chspo/subchsporeq
        - condition: ($header("root") = 'GetChangeSponsorEstablishmentsListRq' or
            $header("root") = 'GetChangeSponsorEstablishmentsListRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error:
              - ConnectionError
              target-url: http://icp-proxy.qiwa.info:30337/report/getchspestblst
        - condition: ($header("root") = 'CheckandValidateTransferredEmployeeRq' or
            $header("root") = 'CheckandValidateTransferredEmployeeRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error:
              - ConnectionError
              target-url: http://icp-proxy.qiwa.info:30337/report/chkvaltrnsfrdemp
        - condition: ($header("root") = 'SubmitCSRequestsRq' or $header("root") =
            'SubmitCSRequestsRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error:
              - ConnectionError
              target-url: http://icp-proxy.qiwa.info:30337/report/sbmtcsreqs
        - condition: ($header("root") = 'SearchETRequestsRq' or $header("root") =
            'SearchETRequestsRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error:
              - ConnectionError
              target-url: http://icp-proxy.qiwa.info:30337/report/searchetrequests
        - condition: ($header("root") = 'ApproveRejectDepIndTransferRequestRq' or
            $header("root") = 'ApproveRejectDepIndTransferRequestRs')
          execute:
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blacklist
                values: []
              parameter-control:
                type: whitelist
                values: []
              timeout: 60
              verb: keep
              cache-response: protocol
              cache-ttl: 900
              stop-on-error:
              - ConnectionError
              target-url: http://icp-proxy.qiwa.info:30337/report/approverejectdepindtransferrequest
        - otherwise:
          - set-variable:
              version: 2.0.0
              title: set-variable
              actions:
              - set: message.status.code
                value: "442"
                type: string
              - set: message.content-type
                value: application/json
                type: string
              - set: message.body
                value: '{ "httpCode": "422",                  "httpMessage": "Invalid",                 "moreInformation":
                  "The request body is invalid"}'
                type: string
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
paths:
  /employyetransferreports:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
