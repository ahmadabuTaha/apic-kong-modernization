swagger: "2.0"
info:
  title: QIWA_GetStatistics
  x-ibm-name: qiwa-getstatistics
  version: 2.0.0
  description: This API retrieves the statistics from Qiwa platform
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: ServiceConfig
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"EXSTS001\",\r\n    \"channelId\" : \"Integration\",\r\n\t\"SessionId\"
          : \"1\",\r\n    \"requestName\" : \"GetStatisticsServiceRq\",\r\n    \"responseName\":
          \"GetStatisticsServiceRs\",\r\n    \"errorMap\" :{\r\n        \"ESBSCHEMA\"
          : {\"code\" :400, \"msg\":\"Invalid Request\"}\r\n    }\r\n    \r\n};\r\n\r\napim.setvariable('cfg',cfg);\r\napim.output('application/json');"
    - gatewayscript:
        version: 2.0.0
        title: PrepareHeaders
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\n\nvar appcReq
          = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          cfg.SessionId, //apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n\t\t\t\"MWRequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode\n\t\t\n        }\n        \n    }\n};\n\nif (typeof OperatorId
          !== 'undefined')\n    appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\"
          : OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: POST
        target-url: $(ace-kc-kcstatistics)/external/GetStatistics
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blocklist
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        stop-on-error:
        - OperationError
        - ConnectionError
        - SOAPError
        persistent-connection: true
    - gatewayscript:
        version: 2.0.0
        title: headers
        source: |
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');

          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg'); \nvar cfg={\n  \n    \n    \"responseName\":
                \"GetStatisticsServiceRs\",\n   \n    \n};\nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
        - condition: ($header("Response-Status") = 'Error' or $header("Response-Status")
            = 'ERROR')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\n//var
                cfg = apim.getvariable('cfg');     \nvar cfg={\n  \n    \n    \"responseName\":
                \"GetStatisticsServiceRs\",\n   \n    \n};\nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\n\nif(httperror == 0){\n   httperror =
                400;\n   // apim.error('ERROR',400,'Bad Request','Invalid request');\n}\nif(message[cfg.responseName].Header.ResponseStatus.Code
                == 'E0000047'){\n   httperror = 401;\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');
                \   \nvar cfg={\n  \n    \n    \"responseName\": \"Error\",\n   \n
                \   \n};\nvar error = {\n  \"errorCode\": message['Error'].Code,\n
                \ \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n    \"ar-SA\":
                'System Error'\n  }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 500;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "200"
            type: string
          - set: message.header.Content-Type
            value: application/json
            type: string
          - set: message.body
            value: '{ "ErrorCode": "500", "ErrorMessage": "Internal server error"
              }'
            type: string
    finally: []
  properties:
    target-url:
      value: http://kc-kcstatistics-http-ace.apps.stg.qiwa-nonprod.local/external/GetStatistics
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
  catalogs: {}
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    additionalProperties: false
    properties:
      Header:
        $ref: '#/definitions/Headers'
      Body:
        $ref: '#/definitions/ResponseBody'
  Headers:
    type: object
    additionalProperties: false
    properties:
      TransactionId:
        type: string
        example: "852369741"
      ChannelId:
        type: string
        example: Integration
      RequestTime:
        type: string
        example: "2022-01-31 13:08:00.555"
      MWResponseTime:
        type: string
        example: "2022-02-08 15:11:33.078"
      ServiceCode:
        type: string
        example: QIWA_GETSTATS
      ResponseStatus:
        $ref: '#/definitions/ResponseStatus'
        properties: {}
  ResponseStatus:
    type: object
    additionalProperties: false
    properties:
      Status:
        type: string
        example: SUCCESS
      Code:
        type: string
        example: "00000000"
      ArabicMsg:
        type: string
        example: لم يحدث خطأ
      EnglishMsg:
        type: string
        example: No Error Occured
  ResponseBody:
    type: object
    additionalProperties: false
    properties:
      OtherStatisitcs:
        $ref: '#/definitions/OtherStatistics'
      EconomicActivityStatisitcs:
        $ref: '#/definitions/EconomicActivityStatisitcs_array'
  OtherStatistics:
    type: object
    additionalProperties: false
    properties:
      Men:
        type: number
        example: 35.5
      Women:
        type: number
        example: 36.5
      LocalInv:
        type: number
        example: 59
      ForeignInv:
        type: number
        example: 60
  EconomicActivityStatisitcs_array:
    type: array
    items:
      $ref: '#/definitions/EconomicActivityStatisitcs_MsgType'
  EconomicActivityStatisitcs_MsgType:
    type: object
    additionalProperties: false
    properties:
      EconomicActivityID:
        type: number
        example: 2
      code:
        type: string
        example: AAA
      Stats:
        type: number
        multipleOf: 0.01
        example: 50
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
paths:
  /getStatistics:
    parameters:
    - name: X-IBM-Client-Id
      in: header
      required: true
      description: Client id issued by security server
      type: string
    - name: X-Request-Id
      in: header
      required: false
      description: X-Request-Id returned in the response header
      type: string
    get:
      tags:
      - Statistics
      description: View automated statistical information. This service will display
        statistical data in the following areas in terms of percentage:Women Empowerment
        - Men and Women, Nationalization - Financial, Petroleum and Natural Gas, Communication,
        Electricity-Gas-Water.Investments - Saudi, Foreign
      operationId: getStatistics
      produces:
      - application/json
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
