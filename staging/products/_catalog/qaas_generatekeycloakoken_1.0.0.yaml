swagger: "2.0"
info:
  title: QAAS_GenerateKeyCloakToken
  description: This service used to get the token from keycloak server
  x-ibm-name: qaas_generatekeycloakoken
  version: 1.0.0
schemes:
- https
basePath: /external/v1
paths:
  /keycloak/token:
    post:
      summary: Get access token (password grant)
      description: |
        Obtains an access token using the Resource Owner Password Credentials (password) grant type.
      parameters:
      - name: grant_type
        in: formData
        required: true
        type: string
        default: password
      - name: client_id
        in: formData
        required: true
        type: string
        default: STCClient
      - name: client_secret
        in: formData
        required: true
        type: string
        format: password
      - name: username
        in: formData
        required: false
        type: string
        description: User name or national ID.
      - name: password
        in: formData
        required: false
        type: string
        format: password
      responses:
        "200":
          description: Token response
          schema:
            type: object
            properties:
              access_token:
                type: string
              token_type:
                type: string
              expires_in:
                type: integer
              refresh_expires_in:
                type: integer
              refresh_token:
                type: string
              scope:
                type: string
        "400":
          description: Invalid request
        "401":
          description: Invalid client or user credentials
definitions:
  ResponseModel:
    type: object
    description: This response object is returned by the get operation
    properties:
      UnifiedNumber:
        type: string
        example: ""
      IdNumber:
        type: string
        example: ""
      IsMainBranch:
        type: string
        example: ""
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
        description: Id url encoded
  Response204:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
