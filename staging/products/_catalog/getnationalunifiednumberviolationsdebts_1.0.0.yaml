swagger: "2.0"
info:
  title: GetNationalUnifiedNumberViolationsDebts
  version: 1.0.0
  description: This service is used to retrieve violations & work permit debts for
    all establishment files under a specific national unified number (700)
  x-ibm-name: getnationalunifiednumberviolationsdebts
paths:
  /correction/getnationalunifiednumberviolationsdebts:
    post:
      operationId: GetNationalUnifiedNumberViolationsDebts
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/GetNationalUnifiedNumberViolationsDebtsRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: Get Activity License Matrix
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/GetNationalUnifiedNumberViolationsDebtsRq_MessageType'
        description: GetNationalUnifiedNumberViolationsDebtsRq
        required: true
