                {\n                \"UserId\": apim.getvariable('message.headers.UserId'),\n
                \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\n
                \           },\n            \"UDF\": {\n                \"KeyValueArr\":
                [\n                    {\n                        \"key\": \"Product\",\n
                \                       \"value\": \"ExternalServices\"\n                    },\n
                \                   {\n                        \"key\": \"Client\",\n
                \                       \"value\": appname\n                    },\n
                \                   {\n                        \"key\": \"GlobalTransactionId\",\n
                \                       \"value\": millisecondsvalue1\n                    }\t\t\t\t\t\n
                \               ]\n            }\n\n        },\n        \"Body\" :
                apim.getvariable('message.body')\n    }\n};\n\nif (typeof OperatorId
                !== 'undefined')\n    appcReq[cfg.requestName].Header.UserInfo = {\n
                \       \"IDNumber\" : OperatorId\n    };\n//delete appcReq[\"ContractType\"];\ndelete
                appcReq[cfg.requestName].Body.ContractType;\n\napim.setvariable('payload',appcReq);
                \   \nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
                formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n
                \   //get the day\n    //convert day to string\n    var day = d.getDate().toString();\n
                \   //get the year\n    var year = d.getFullYear();\n    var hour
                = d.getHours().toString();\n    var minitue = d.getMinutes().toString();\n
                \   var second = d.getSeconds().toString();\n    var millisecond =
                d.getMilliseconds().toString();\n    //pull the last two digits of
                the year\n    year = year.toString();\n    \n    //increment month
                by 1 since it is 0 indexed\n    //converts month to a string\n    month
                = (month + 1).toString();\n\n    //if month is 1-9 pad right with
                a 0 for two digits\n    if (month.length === 1)\n        month = \"0\"
                + month;\n\n    //if day is between 1-9 pad right with a 0 for two
                digits\n    if (day.length === 1)\n        day = \"0\" + day;\n\n
                \   if (hour.length === 1)\n        hour = \"0\" + hour;\n\n    if
                (minitue.length === 1)\n        minitue = \"0\" + minitue;\n\n    if
                (second.length === 1)\n        second = \"0\" + second;\n        \n
                \   if (millisecond.length == 1)\n        millisecond = \"00\" + millisecond;\n
                \       \n    if (millisecond.length == 2)\n        millisecond =
                \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
                \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue
                + \":\" + second+\".\"+millisecond;\n}"
          - invoke:
              version: 2.0.0
              title: invoke
              backend-type: detect
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: POST
              chunked-uploads: true
              persistent-connection: true
              target-url: $(ace-mofa-mofasubmits)/mofa/updatevisastatus
              follow-redirects: false
              inject-proxy-headers: true
          - gatewayscript:
