swagger: "2.0"
info:
  title: UpdateVisaStatus
  description: This API will be used to allow MOFA to push visa update details or
    status to Qiwa
  x-ibm-name: updatevisastatus
  version: 1.0.0
schemes:
- https
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /updatevisastatus:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    post:
      tags:
      - Work Visa Contracts Integration -MOFA
      description: All systems that have been called in the flow.
      operationId: updatevisastatus
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        description: Request body
        required: true
        schema:
          $ref: '#/definitions/UpdateVisaStatusRq_Type'
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  UpdateVisaStatusRq_Type:
    type: object
    description: Request object
    properties:
      contractId:
        type: integer
        format: int64
      candidateFullName:
        type: string
      candidateArabicFullName:
        type: string
      borderNumber:
        type: integer
        format: int64
      documentNumber:
        type: integer
        format: int64
      contractType:
        type: string
        enum:
        - Musaned
        - Professional
      statusCode:
        type: string
        enum:
        - PendingForContract
        - DelegationFeesPayment
        - WaitingForRatification
        - ContractRatificationRejected
        - WaitingForOffice
        - ApplyVisa
        - WaitingForEmbassyProcessing
        - VisaIssuanceUnderProcessing
        - VisaRejected
        - VisaIssued
        - VisaCancelled
        - PendingForConractCancellationFeesPayment
        - ContractCancelled
      eproName:
        type: string
      delegationPaymentDate:
        type: string
      cancelDelegationPaymentDate:
        type: string
      ratificationDate:
        type: string
      cancellationDetails:
        $ref: '#/definitions/cancellationDetails_Type'
      issuedDetails:
        $ref: '#/definitions/issuedDetails_Type'
      departurePoint:
        type: string
    required:
    - contractId
    - borderNumber
    - documentNumber
    - statusCode
    - contractType
  issuedDetails_Type:
    type: object
    properties:
      issuedVisaNo:
        type: integer
        format: int64
      embassy:
        $ref: '#/definitions/embassy_Type'
      nationalityCode:
        type: string
      passportNo:
        type: string
      occupationDetails:
        $ref: '#/definitions/occupationDetails_Type'
      establishmentName:
        type: string
      issuanceDate:
        type: string
    required:
    - issuedVisaNo
    - embassy
    - nationalityCode
    - passportNo
    - occupationDetails
    - establishmentName
    - issuanceDate
  cancellationDetails_Type:
    type: object
    properties:
      cancellationReason:
        type: string
      cancellationDate:
        type: string
    required:
    - cancellationReason
    - cancellationDate
  occupationDetails_Type:
    type: object
    properties:
      occupationId:
        type: integer
      occupationDesc:
        type: string
    required:
    - occupationId
    - occupationDesc
  embassy_Type:
    type: object
    properties:
      embassyCode:
        type: integer
      embassyDesc:
        type: string
    required:
    - embassyCode
    - embassyDesc
  ResponseModel:
    type: object
    description: Response object returned by the get operation
    properties:
      message:
        type: string
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
