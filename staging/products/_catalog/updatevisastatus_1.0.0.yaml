                UDFPayload = {\r\n                \"KeyValueArr\": [\r\n                    {\r\n
                \                       \"key\": \"Product\",\r\n                        \"value\":
                \"MOFA\"\r\n                    },\r\n                    {\r\n                        \"key\":
                \"Client\",\r\n                        \"value\": appname\r\n                    }\r\n
                \               ]\r\n            };\t \r\n\r\nappconnectrequest.UpdateVisaStatusRq.Header.UDF
                = UDFPayload;\r\nvar jsonData= {\r\n\t\"LogAPIData\": {\r\n\t\t\"UpdateVisaStatusRq\":
                appconnectrequest.UpdateVisaStatusRq,\r\n\t\t\"UpdateVisaStatusRs\":
                APIRes.UpdateVisaStatusRs\r\n\t}\r\n}\r\nsession.output.write(jsonData);\r\napim.output('application/json');\r\n"
          - invoke:
