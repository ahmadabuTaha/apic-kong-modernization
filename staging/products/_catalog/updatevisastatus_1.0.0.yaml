                appcReq = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
                : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n
                \           \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\n
