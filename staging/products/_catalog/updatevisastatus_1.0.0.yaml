                SessionId, 'add');\r\n\r\nif (MWRequestTime)\r\n    apim.setvariable('message.headers.MWRequestTime',
                MWRequestTime, 'add');\r\n\r\nif (MWResponseTime)\r\n    apim.setvariable('message.headers.MWResponseTime',
                MWResponseTime, 'add');\r\n\r\napim.setvariable('message.headers.Response-Status',
                status, 'add');\r\napim.setvariable('message.headers.Response-Code',
                code, 'add');\r\napim.setvariable('message.headers.x-user-transaction-id',
                TransactionId, 'add');\r\n\r\n// New header\r\nif (traceId)\r\n    apim.setvariable('message.headers.x-mofa-request-trace-id',
                traceId, 'add');\r\nif (requestId)\r\n    apim.setvariable('message.headers.x-mofa-request-id',
                requestId, 'add');    "
          - switch:
              version: 2.1.0
              title: switch
              case:
              - condition: (($header("Response-Status") = 'SUCCESS'))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Response
                    source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                      cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\nsession.output.write(body);\r\napim.output('application/json');"
              - otherwise:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Error
                    source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                      cfg = apim.getvariable('cfg');\r\n\r\nvar responseStatus = message[cfg.responseName].Header.ResponseStatus;\r\n\r\nvar
