                      \   // Custom response for ESBSCHEMA\r\n    if (errorCode ===
                      \"ESBSCHEMA\") {\r\n\r\n        error = {\r\n            \"errorCode\":
                      \"ESBSCHEMA\",\r\n            \"errorMessage\": {\r\n                \"en-US\":
                      \"Schema Validation Error\",\r\n                \"ar-SA\": \"حدث
                      خطأ بالنظام\"\r\n            }\r\n        };\r\n    }\r\n}\r\n\r\n//
                      Default HTTP error\r\nif (httperror === 0) {\r\n    httperror
                      = 409;\r\n}\r\n\r\napim.setvariable('message.status.code', httperror,
                      'set');\r\n\r\nsession.output.write(error);\r\n\r\napim.output('application/json');"
