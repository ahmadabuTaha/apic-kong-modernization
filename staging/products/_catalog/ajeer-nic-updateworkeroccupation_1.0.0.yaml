x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n \nvar cfg={\n    \"serviceCode\" :
          \"UWONIC01\",\n    \"channelId\" : \"Integration\",\n    \"requestName\"
          : \"UpdateWorkerOccupationRq\",\n    \"responseName\": \"UpdateWorkerOccupationRs\",\n
          \   \"errorMap\" :{\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\n    }\n\n};\n \napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\n \nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n \nvar appcReq
          = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n            \"ServiceCode\": cfg.serviceCode,\n            \"DebugFlag\":
          \"1\",\n            \"UserInfo\": {\n                \"UserId\": apim.getvariable('message.headers.UserId'),\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\n
          \           }\n        },\n        \"Body\" : apim.getvariable('message.body')\n\n\n
          \   }\n};\n \nif (typeof OperatorId !== 'undefined')\n    appcReq[cfg.requestName].Header.UserInfo
          = {\n        \"IDNumber\" : OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n
          \n\nfunction formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n
          \   //get the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n\n    //increment month
          by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n \n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n
          \n    //if day is between 1-9 pad right with a 0 for two digits\n    if
          (day.length === 1)\n        day = \"0\" + day;\n \n    if (hour.length ===
          1)\n        hour = \"0\" + hour;\n \n    if (minitue.length === 1)\n        minitue
          = \"0\" + minitue;\n \n    if (second.length === 1)\n        second = \"0\"
          + second;\n\n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n\n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n\n \n    //return the string \"MMddyy\"\n    return
          year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\" + second+\".\"+millisecond;\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-nic-post)/external/updateworkeroccupation
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n \nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n
                \n\nsession.output.write(body);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n \nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n \nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n\n       //var
                errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n       //var
                details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n
                \nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
