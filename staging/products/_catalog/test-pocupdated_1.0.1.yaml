swagger: "2.0"
info:
  title: Test-POCUpdated
  x-ibm-name: test-pocupdated
  version: 1.0.1
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\r\nvar urlopen = require ('urlopen');\r\nvar
          appname = apim.getvariable('client.app.name');\r\nvar request = apim.getvariable('message.body');\r\nvar
          val = request.CreateNewContractRq.Body.EstablishmentDetails.UnifiedNumberId;\r\nvar
          propertyFileName = \"http://qiwadp8017-dp.apps.stg.qiwa-nonprod.local/getPropertiesUtility/Properties/json\";\r\n
          \   urlopen.open(propertyFileName, function(error,response) {\r\n    if
          (error) {\r\n        console.alert(\"error reading property file \" + propertyFileName
          + \" \" + error);\r\n     } else {\r\nresponse.readAsJSON(function (error,
          data) {\r\n       var array =data.config.applications[appname].UnifiedNumberId;\r\n
          \    var Response =array.includes(val);\r\n\t\tif (Response == true)\r\n\t\t{\r\n\t\tsession.output.write(request);\r\n\t\t}\r\n\t\telse
          {\r\n\t\tsession.reject('UnifiedNumberId is not matched');\r\n\t\t}\r\n
          \     });\r\n      }\r\n    });"
    - invoke:
        version: 2.2.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        graphql-send-type: detect
        websocket-upgrade: false
        target-url: $(ace-cntmv2-contractcreates)/contractmanagement/createnewcontract
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
    status:
      value: working
    privateKey:
      value: 
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
  categories: []
basePath: /testv1
paths:
  /uni:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
schemes:
- https
securityDefinitions:
  clientId:
    type: apiKey
    x-key-type: client_id
    name: X-IBM-Client-Id
    in: header
security:
- clientId: []
