swagger: "2.0"
info:
  title: Test API
  x-ibm-name: test-api
  version: 1.0.0
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: ($httpVerb() = 'GET' and $operationPath() = '/')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: gatewayscript
              source: "var out = {\"message\":\"Greeting! Hello World\"};\r\nout.whoami
                = apim.getContext('api.endpoint.address');\r\nsession.output.write(JSON.stringify(out));\r\napim.output(\"application/json\");"
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
  application-authentication: {}
basePath: /v1/test/api
paths:
  /:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    delete:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    head:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    patch:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    options:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
schemes:
- https
