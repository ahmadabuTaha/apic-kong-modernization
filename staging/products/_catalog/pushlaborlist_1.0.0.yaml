swagger: "2.0"
info:
  title: PushLaborList
  version: 1.0.0
  description: This service is used to push the labor result from PACC team
  x-ibm-name: pushlaborlist
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /pushlaborlist:
    post:
      operationId: pushlaborlist
      description: This service is used to push the labor result from PACC team
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        description: pushLaborListRq
        schema:
          $ref: '#/definitions/pushLaborListRq_BodyType'
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/pushLaborListRs_BodyType'
definitions:
  pushLaborListRq_BodyType:
    type: object
    required:
    - passportNumber
    - nationality
    - dateOfBirth
    - occupationCode
    - programType
    - status
    properties:
      passportNumber:
        type: string
      nationality:
        type: string
        description: Nationality code based on ISO 3166-1 country codes alpha-3
      dateOfBirth:
        type: string
        format: date
        description: yyyy-mm-dd (Gregorian)
      iqamaNumber:
        type: integer
        description: In case the labor did the test in KSA
      occupationCode:
        type: integer
      programType:
        type: integer
        enum:
        - 1
        - 2
        description: 1-SVP, 2-QVP
      status:
        type: integer
        enum:
        - 1
        - 2
        description: 1-Passed, 2-Failed
      certificateValidUntil:
        type: string
        format: date
        description: yyyy-mm-dd (Gregorian). In case the program is SVP
  pushLaborListRs_BodyType:
    type: object
    required:
    - message
    properties:
      message:
        type: string
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
    policy:
    - allow-origin:
      - $(cors-allowed-origin)
      allow-credentials: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: |-
          var apim = require('apim');

          var cfg={
              "serviceCode" : "PLLP0001",
              "channelId" : "Qiwa",
              "requestName" : "pushLaborListRq",
              "responseName": "pushLaborListRs",
              "errorMap" :{
                  "ESBSCHEMA" : {"code" :400, "msg":"Invalid Request"}
              }

          };
          apim.setvariable('cfg',cfg);
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: |-
          var apim = require('apim');
          var millisecondsvalue = ""+(new Date()).getTime();
          var dt = new Date();
          var cfg = apim.getvariable('cfg');
          var OperatorId=apim.getvariable('message.headers.Operator-Id');
          var appname = apim.getvariable('client.app.name');

          var appcReq = {
              [cfg.requestName]:{
                  "Header" : {
                      "TransactionId" : millisecondsvalue,
                      "ChannelId": cfg.channelId,
                      "SessionId": apim.getvariable('message.headers.X-Request-Id'),
                      "RequestTime" : formatDate(dt),
                      "ServiceCode": cfg.serviceCode,
                      "DebugFlag": "1",
                      "UserInfo": {
                          "UserId": apim.getvariable('message.headers.UserId'),
                          "IDNumber": apim.getvariable('message.headers.IDNumber')        
                      },
                      "UDF": {
                          "KeyValueArr": [
                              {
                                  "key": "Product",
                                  "value": "PushLaborList"
                              },
                              {
                                  "key": "Client",
                                  "value": appname
                              }
                          ]
                      }      
                  },
                  "Body" : apim.getvariable('message.body')

              }
          };

          if (typeof OperatorId !== 'undefined')
              appcReq[cfg.requestName].Header.UserInfo = {
                  "IDNumber" : OperatorId
              };
          session.output.write(appcReq);
          apim.output('application/json');


          function formatDate(d)
          {
              //get the month
              var month = d.getMonth();
              //get the day
              //convert day to string
              var day = d.getDate().toString();
              //get the year
              var year = d.getFullYear();
              var hour = d.getHours().toString();
              var minitue = d.getMinutes().toString();
              var second = d.getSeconds().toString();
              var millisecond = d.getMilliseconds().toString();
              //pull the last two digits of the year
              year = year.toString();

              //increment month by 1 since it is 0 indexed
              //converts month to a string
              month = (month + 1).toString();

              //if month is 1-9 pad right with a 0 for two digits
              if (month.length === 1)
                  month = "0" + month;

              //if day is between 1-9 pad right with a 0 for two digits
              if (day.length === 1)
                  day = "0" + day;

              if (hour.length === 1)
                  hour = "0" + hour;

              if (minitue.length === 1)
                  minitue = "0" + minitue;

              if (second.length === 1)
                  second = "0" + second;

              if (millisecond.length == 1)
                  millisecond = "00" + millisecond;

              if (millisecond.length == 2)
                  millisecond = "0" + millisecond;



              //return the string "MMddyy"
              return year+"-"+month+"-"+day+" "+hour + ":" + minitue + ":" + second+"."+millisecond;
          }
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-musaned)/external/pushlaborlist
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');
          apim.output('application/json');
          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
          apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
          apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');
          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: |-
                var apim = require('apim');
                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');
                var body = message[cfg.responseName].Body;
                session.output.write(body);
                apim.output('application/json');
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: |-
                var apim = require('apim');

                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');

                var responseStatus = message[cfg.responseName].Header.ResponseStatus;

                var errorCode = responseStatus.Code;

                var error = {
                    "errorCode": errorCode,
                    "errorMessage": {
                        "en-US": responseStatus.EnglishMsg,
                        "ar-SA": responseStatus.ArabicMsg
                    }
                };

                var httperror = 0;

                // Handle mapped errors
                if (cfg.errorMap && cfg.errorMap[errorCode]) {

                    httperror = cfg.errorMap[errorCode].code;

                    // Custom response for ESBSCHEMA
                    if (errorCode === "ESBSCHEMA") {

                        error = {
                            "errorCode": "ESBSCHEMA",
                            "errorMessage": {
                                "en-US": "Schema Validation Error",
                                "ar-SA": "حدث خطأ بالنظام"
                            }
                        };
                    }
                }

                // Default HTTP error
                if (httperror === 0) {
                    httperror = 409;
                }

                apim.setvariable('message.status.code', httperror, 'set');
                session.output.write(error);
                apim.output('application/json');
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
schemes:
- https
