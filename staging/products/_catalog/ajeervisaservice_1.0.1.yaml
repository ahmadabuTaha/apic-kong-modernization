                Ensure array form\r\nif (!Array.isArray(visaList)) {\r\n    visaList
                = [visaList];\r\n}\r\n\r\n// Map Visa fields safely\r\nvar visaDetailsArray
                = visaList.map(v => ({\r\n    BorderNumber: v[\"ser:BorderNumber\"]?.$
                || v[\"BorderNumber\"]?.$ || null,\r\n    Gender: {\r\n        Code:
                v.Gender?.Code?.$ || null,\r\n        Name: v.Gender?.Name?.$ || null\r\n
                \   },\r\n    Job: {\r\n        Code: v.Job?.Code?.$ || null,\r\n
                \       Name: v.Job?.Name?.$ || null\r\n    },\r\n    Nationality:
