                \   || soapBody[\"submitVisaTransactionResponseObject\"];\r\n\r\n//
                Extract root simple fields safely\r\nvar isSucc = (responseObj[\"ser:IsSuccceded\"]
                || responseObj[\"IsSuccceded\"])?.$ || null;\r\nvar outgoingNumber
                = (responseObj[\"ser:OutgoingNumber\"] || responseObj[\"OutgoingNumber\"])?.$
