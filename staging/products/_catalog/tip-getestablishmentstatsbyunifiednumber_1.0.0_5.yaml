definitions:
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      establishmentName:
        type: string
        example: شركة القمم للانشاءات والصيانه المحدوده
      establishmentType:
        type: string
        example: شركة
      establishmentStatus:
        type: string
        example: قائمة
      economicActivity:
        type: string
        example: مقاولات التشييد والبناء
      city:
        type: string
        example: جدة
      size:
        type: string
        example: متوسطة (فئة ج)
      sizeRange:
        type: string
        example: From [200] To [499]
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
parameters:
  unifiedNationalNumber:
    in: path
    name: unifiedNationalNumber
    description: Unified National Number
    required: true
    type: string
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
