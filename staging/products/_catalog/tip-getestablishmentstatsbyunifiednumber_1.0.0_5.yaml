swagger: "2.0"
info:
  title: TIP_GetEstablishmentStatsByUnifiedNumber
  description: This API is used to get establishment basic info status by unified
    number
  x-ibm-name: tip-getestablishmentstatsbyunifiednumber
  version: 1.0.0
schemes:
- https
basePath: /tip/v1
security:
