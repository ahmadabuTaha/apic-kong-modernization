              - set: .ownerInfo.ownerId.sevenHundredNum
                from: .OwnerInfo.OwnerIdentifier.SevenHundredNum
              - create: .licenseInfoList
                foreach: .LicenseInfoList.LicenseInfo
                from: .LicenseInfoList.LicenseInfo
                actions:
                - set: unifiedLicenseNumber
                  from: UnifiedLicenseNumber
                - set: amanah.amanahCode
                  from: Amanah.AmanahCode
                - set: amanah.amanahName
                  from: Amanah.AmanahName
                - set: baladiaName
                  from: BaladiaName
                - set: issueDate
                  from: IssueDate
                - set: expiryDate
                  from: ExpiryDate
                - set: licenseStatus
                  from: LicenseStatus
                - create: activitiesList
                  foreach: ActivitiesList.Activity
                  from: ActivitiesList.Activity
                  actions:
                  - set: activityISICCode
                    from: ActivityISICCode
                  - set: activityISICDescription
                    from: ActivityISICDescription
                  - set: activityAmanahDescription
                    from: ActivityAmanahDescription
                  - set: activityArea
                    from: ActivityArea
                  - create: boardsList
                    foreach: BoardsList.Board
                    from: BoardsList.Board
                    actions:
                    - set: boardType
                      from: BoardType
                    - set: boardArea
                      from: BoardArea
                  - set: commercialName
                    from: CommercialName
                  - set: shopArea
                    from: ShopArea
                  - set: doorsCount
                    from: DoorsCount
                  - set: shopAddress
                    from: ShopAddress
                  - set: locationCoordinates.longitude
                    from: LocationCoordinates.Longitude
                  - set: locationCoordinates.latitude
                    from: LocationCoordinates.Latitude
                - set: shopArea
                  from: ShopArea
                - set: commericalName
                  from: CommericalName
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                inlineNamespaces: false
                namespaceInheritance: false
                includeEmptyXMLElements: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n    \"ErrorResponse\":
                message[cfg.responseName].Header.ResponseStatus\n}\n\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.ErrorResponse.Code]){\n       httperror
                = cfg.errorMap[error.ErrorResponse.Code].code;\n       \n       //var
                errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n       //var
                details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
    finally: []
  properties:
