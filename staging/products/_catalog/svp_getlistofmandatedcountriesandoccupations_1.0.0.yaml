          i = 0; i < Header.UDF.KeyValueArr.length; i++) {\r\n\r\n            var
          item = Header.UDF.KeyValueArr[i];\r\n\r\n            if (item.key === \"x-svp-request-id\")
          {\r\n                requestId = item.value;\r\n            }            \r\n
          \       }\r\n    }\r\n\r\n    // Handle single object response (safety check)\r\n
          \   else {\r\n        if (Header.UDF.KeyValueArr.key === \"x-svp-request-id\")
          {\r\n            requestId = Header.UDF.KeyValueArr.value;\r\n        }\r\n
          \   }\r\n}\r\n\r\n// Existing headers\r\napim.setvariable('message.headers.Transaction-Id',
