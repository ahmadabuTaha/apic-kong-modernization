    properties:
      firstName:
        type: string
        example: mohamed
      secondName:
        type: string
        example: saeed
      thirdName:
        type: string
        example: ahmed
      lastName:
        type: string
        example: elshafi
  applicantInfo:
    type: object
    description: This object will be used across the model
    properties:
      nationalID:
        type: string
        example: "1000071021"
      fullName:
        $ref: '#/definitions/fullName'
      birthDate:
        type: string
        example: "1995-02-11"
      nationality:
        type: string
        example: "1"
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
