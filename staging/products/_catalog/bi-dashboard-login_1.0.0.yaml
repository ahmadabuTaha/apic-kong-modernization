swagger: "2.0"
info:
  title: BI Dashboard Login
  x-ibm-name: bi-dashboard-login
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
produces:
- application/json
consumes:
- application/json
securityDefinitions:
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-rept-bidashboard)/bidashboard/usermgmt/userlogin
        follow-redirects: false
        inject-proxy-headers: true
    catch: []
    finally: []
  properties: {}
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
  catalogs: {}
paths:
  /login:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
      parameters:
      - name: body
        in: body
        required: true
        schema:
          type: object
