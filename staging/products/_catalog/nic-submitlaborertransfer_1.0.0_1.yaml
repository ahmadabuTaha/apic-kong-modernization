    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"ABC1234\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"SubmitLaborerTransferRequestNICRq\",\n
