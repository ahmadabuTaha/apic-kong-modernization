swagger: "2.0"
info:
  title: MOMRA_GetEstablishmentSites
  x-ibm-name: momra-getestablishmentsites
  version: 2.0.0
  description: This API exposes MOMRA to get Establishment Sites Service from Qiwa
    platform
schemes:
