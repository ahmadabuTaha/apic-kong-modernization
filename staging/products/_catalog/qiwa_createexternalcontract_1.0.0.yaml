swagger: "2.0"
info:
  title: Qiwa_CreateExternalContract
  version: 1.0.0
  description: This service is used to Create External Contract
  x-ibm-name: qiwa_createexternalcontract
schemes:
- https
basePath: /workinsaudi
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /createexternalcontract:
    post:
      operationId: CreateExternalContract
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/CreateExternalContractRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: This service is used to Create External Contract
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/CreateExternalContractRq_MessageType'
        description: CreateExternalContract
        required: true
definitions:
  CreateExternalContractRq_MessageType:
    type: object
    properties:
      CreateExternalContractRq:
        $ref: '#/definitions/CreateExternalContractRq_Type'
  CreateExternalContractRs_MessageType:
    type: object
    properties:
      CreateExternalContractRs:
        $ref: '#/definitions/CreateExternalContractRs_Type'
  CreateExternalContractRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/CreateExternalContractRq_BodyType'
  CreateExternalContractRq_BodyType:
    type: object
    properties:
      EstablishmentDetails:
        $ref: '#/definitions/Establishment_Type'
      RequesterDetails:
        $ref: '#/definitions/Requester_Type'
      CandidateId:
        type: string
      ContractDetails:
        $ref: '#/definitions/ContractDetails_Type'
    required:
    - EstablishmentDetails
    - RequesterDetails
    - CandidateId
    - ContractDetails
  Establishment_Type:
    type: object
    properties:
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      PhoneNo:
        type: string
      MobileNo:
        type: string
      Email:
        type: string
      NationalAddress:
        type: string
    required:
    - LaborOfficeId
    - SequenceNumber
    - PhoneNo
    - MobileNo
    - Email
    - NationalAddress
  Requester_Type:
    type: object
    properties:
      RequesterName:
        type: string
      RequesterIdNo:
        type: integer
      RequesterType:
        type: integer
      RequesterRoleEn:
        type: string
      RequesterRoleAr:
        type: string
    required:
    - RequesterName
    - RequesterIdNo
    - RequesterType
    - RequesterRoleEn
    - RequesterRoleAr
  ContractDetails_Type:
    type: object
    properties:
      OccupationId:
        type: integer
      JobTitle:
        $ref: '#/definitions/JobTitle_Type'
      ContractTypeId:
        type: integer
        description: 1- Full time, 2- Part time
      ExecutionLocation:
        type: integer
      WorkLocationId:
        type: integer
      ContractDurationId:
        type: integer
        description: 1- Fixed-term Contract, 2- Open-ended
      ContractPeriod:
        type: integer
      StartDate:
        type: string
        format: date-time
      EndDate:
        type: string
        format: date-time
      WorkHoursTypeId:
        type: integer
      DaysPerWeek:
        type: integer
      HoursPerDay:
        type: integer
      HoursPerWeek:
        type: integer
      RestingDays:
        type: integer
      Salary:
        type: number
        format: decimal
      SalaryDueDay:
        type: integer
      ProbationPeriod:
        type: integer
      VacationPeriod:
        type: integer
      NoticePeriod:
        type: integer
      RenewalStatusId:
        type: integer
      RenewalTimes:
        type: integer
      RenewalPeriod:
        type: integer
      Allowances:
        type: array
        items:
          type: object
          properties:
            AllowanceType:
              type: integer
            NameEn:
              type: string
            NameAr:
              type: string
            Amount:
              type: number
          required:
          - AllowanceType
          - Amount
      InKindBenefits:
        type: array
        items:
          type: object
          properties:
            NameEn:
              type: string
            NameAr:
              type: string
            DescriptionEn:
              type: string
            DescriptionAr:
              type: string
            Frequency:
              type: integer
            DueDate:
              type: string
              format: date-time
          required:
          - NameEn
          - NameAr
          - DescriptionEn
          - DescriptionAr
          - Frequency
          - DueDate
      Commission:
        type: array
        items:
          type: object
          properties:
            CommissionBaseEng:
              type: string
            CommissionBaseAr:
              type: string
            Percentage:
              type: integer
            Frequency:
              type: integer
          required:
          - CommissionBaseEng
          - CommissionBaseAr
          - Percentage
          - Frequency
      OptionalClauses:
        type: array
        items:
          type: object
          properties:
            OptionalClausesType:
              type: integer
            Period:
              type: integer
            Field:
              type: string
            Location:
              type: string
            FirstParty:
              type: string
            SecondParty:
              type: string
          required:
          - OptionalClausesType
      Terms:
        type: array
        items:
          type: object
          properties:
            TermId:
              type: integer
          required:
          - TermId
      AdditionalTerms:
        type: array
        items:
          type: object
          properties:
            NameEn:
              type: string
            NameAr:
              type: string
          required:
          - NameEn
          - NameAr
    required:
    - OccupationId
    - JobTitle
    - ContractTypeId
    - ExecutionLocation
    - WorkLocationId
    - ContractDurationId
    - ContractPeriod
    - StartDate
    - EndDate
    - WorkHoursTypeId
    - DaysPerWeek
    - HoursPerDay
    - HoursPerWeek
    - RestingDays
    - Salary
    - SalaryDueDay
    - ProbationPeriod
    - VacationPeriod
    - NoticePeriod
    - RenewalStatusId
    - RenewalTimes
    - RenewalPeriod
  JobTitle_Type:
    type: object
    properties:
      JobTitleAr:
        type: string
      JobTitleEng:
        type: string
    required:
    - JobTitleAr
    - JobTitleEng
  CreateExternalContractRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/CreateExternalContractRs_BodyType'
  CreateExternalContractRs_BodyType:
    type: object
    properties:
      ContractId:
        type: integer
      ContractStatus:
        $ref: '#/definitions/ContractStatus_Type'
    required:
    - ContractId
    - ContractStatus
  ContractStatus_Type:
    type: object
    properties:
      StatusId:
        type: integer
      NameEn:
        type: string
      NameAr:
        type: string
    required:
    - StatusId
    - NameEn
    - NameAr
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  UDF_Type:
    type: object
    properties:
      KeyValueArr:
        type: array
        items:
          $ref: '#/definitions/KeyValueArr_Type'
  KeyValueArr_Type:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  Tmstmp_Type:
    type: object
  UserInfo_Type:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: integer
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Code
    - Status
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-ws-externalcontractsubmit)$(request.path)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: allowlist
          values: []
        header-control:
          type: blocklist
          values: []
        inject-proxy-headers: true
        chunked-uploads: true
        persistent-connection: true
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
