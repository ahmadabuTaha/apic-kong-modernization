swagger: "2.0"
info:
  title: MHRSD_ActivateDeactivateIndustrialEstablishmentV1
  x-ibm-name: mhrsd-activatedeactivateindustrialestablishmentv1
  version: 1.0.0
schemes:
- https
basePath: /mim/v3
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: DatesComparison
        source: "var apim = require('apim');\nvar request = apim.getvariable('request.body');\nvar
          startDate = request.startDate;\nvar endDate = request.endDate;\nvar operation
          = request.operation;\nvar dateFlag = true;\nvar currentDate = new Date().toJSON().slice(0,
          10);\nif (startDate==currentDate){ if(endDate>currentDate)\n{\napim.setvariable('api.dateFlag',dateFlag);
          \n} }\nif (operation == \"Deactivate\"){\napim.setvariable('api.dateFlag',dateFlag);
          \n}\napim.output('application/json');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (api.dateFlag=true)
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Service_Config
              source: "var apim = require('apim');\r\nvar request = apim.getvariable('message.body');\r\nvar
                act =request.operation;\r\nvar actived  ='http://icp-proxy.qiwa.info:30376/external/activateindustriaestablishment';\r\nvar
                deactived ='http://icp-proxy.qiwa.info:30376/external/deactivateindustriaestablishment';\r\nif(act
                === 'Activate'){\r\n apim.setvariable('URL',actived);\r\n \r\nvar
                cfg={\r\n    \"serviceCode\" : \"EXAIE0001\",\r\n    \"channelId\"
                : \"Integration\",\r\n    \"requestName\" : \"activateEstabIndustrialRq\",\r\n
                \   \"responseName\": \"activateEstabIndustrialRs\",\r\n    \"errorMap\"
                :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\r\n
                \   }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);\r\n\r\n }\r\n
                else if(act === 'Deactivate')\r\n {\r\n     var cfg={\r\n    \"serviceCode\"
                : \"EXDIE0001\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
                : \"deactivateEstabIndustrialRq\",\r\n    \"responseName\": \"deactivateEstabIndustrialRs\",\r\n
                \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"}\r\n    }\r\n    \r\n};\r\n\r\n apim.setvariable('cfg',cfg);\r\n
                \ apim.setvariable('URL',deactived);\r\n }\r\n \r\n else{\r\n  apim.error('MyError',
                400, 'Internal Error', 'Invalid Input');\r\n  \r\n}"
          - gatewayscript:
              version: 2.0.0
              title: MapScript
              source: "var apim = require('apim');\r\nvar request = apim.getvariable('request.body');\r\nvar
                act =request.operation;\r\nvar reqPar = apim.getvariable('request.parameters');\r\nvar
                crNumber = reqPar.crNumber;\r\nvar laborOfficeId_key = \"laborOfficeId\";\r\nvar
                laborOfficeId_value = reqPar.laborOfficeId;\r\nvar sequenceNum_key
                = \"sequenceNum\";\r\nvar sequenceNum_value = reqPar.sequenceNum;\r\nvar
                startDate_key = \"startDate\";\r\nvar startDate_value = request.startDate;\r\nvar
                endDate_key = \"endDate\";\r\nvar endDate_value = request.endDate;\r\nvar
                numberOfEmployees_key = \"numberOfEmployees\";\r\nvar numberOfEmployees_value
                = request.numberOfEmployees;\r\nif(act === 'Activate'){\r\n            var
                Body = {\"crNumber\": crNumber}\r\n            if(laborOfficeId_value
                != null)   {\r\n            Body[laborOfficeId_key] = laborOfficeId_value\r\n
                \           }\r\n            if(sequenceNum_value != null)   {\r\n
                \           Body[sequenceNum_key] = sequenceNum_value\r\n            }\r\n
                \           if(startDate_value != null)   {\r\n            Body[startDate_key]
                = startDate_value\r\n            }\r\n            if(endDate_value
                != null)   {\r\n            Body[endDate_key] = endDate_value\r\n
                \           }\r\n            if(numberOfEmployees_value != null)   {\r\n
                \           Body[numberOfEmployees_key] = numberOfEmployees_value\r\n
                \           }            \r\n        }\r\n        else if (act ===
                'Deactivate')\r\n        {\r\n            var Body = {\"crNumber\":
                crNumber}\r\n            if(sequenceNum_value != null)   {\r\n            Body[sequenceNum_key]
                = sequenceNum_value\r\n            }\r\n            if(laborOfficeId_value
                != null)   {\r\n            Body[laborOfficeId_key] = laborOfficeId_value\r\n
                \           }\r\n        }\r\n        else {}\r\nsession.output.write(Body);\r\napim.output('application/json');"
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Request
              source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue =
                \"\"+(new Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg =
                apim.getvariable('cfg');\r\nvar OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar
                appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n
                \           \"TransactionId\" : millisecondsvalue,\r\n            \"ChannelId\":
                cfg.channelId,\r\n            \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\r\n
                \           \"RequestTime\" : formatDate(dt),\r\n            \"ServiceCode\":
                cfg.serviceCode\r\n        },\r\n        \"Body\" : apim.getvariable('message.body')\r\n
                \           \r\n        \r\n    }\r\n};\r\n\r\nif (typeof OperatorId
                !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo =
                {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
                formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
                \   //get the day\r\n    //convert day to string\r\n    var day =
                d.getDate().toString();\r\n    //get the year\r\n    var year = d.getFullYear();\r\n
                \   var hour = d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
                \   var second = d.getSeconds().toString();\r\n    var millisecond
                = d.getMilliseconds().toString();\r\n    //pull the last two digits
                of the year\r\n    year = year.toString();\r\n    \r\n    //increment
                month by 1 since it is 0 indexed\r\n    //converts month to a string\r\n
                \   month = (month + 1).toString();\r\n\r\n    //if month is 1-9 pad
                right with a 0 for two digits\r\n    if (month.length === 1)\r\n        month
                = \"0\" + month;\r\n\r\n    //if day is between 1-9 pad right with
                a 0 for two digits\r\n    if (day.length === 1)\r\n        day = \"0\"
                + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\" +
                hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
                + minitue;\r\n\r\n    if (second.length === 1)\r\n        second =
                \"0\" + second;\r\n        \r\n    if (millisecond.length == 1)\r\n
                \       millisecond = \"00\" + millisecond;\r\n        \r\n    if
                (millisecond.length == 2)\r\n        millisecond = \"0\" + millisecond;\r\n
                \   \r\n    \r\n\r\n    //return the string \"MMddyy\"\r\n    return
                year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\" +
                second+\".\"+millisecond;\r\n}"
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: POST
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: $(URL)
              persistent-connection: true
          - gatewayscript:
              version: 2.0.0
              title: Set_Headers
              source: "var apim = require('apim');\r\napim.output('application/json');\r\nvar
                message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\nvar
                Header = message[cfg.responseName].Header;\r\nvar TransactionId =
                Header.TransactionId;\r\nvar ChannelId = Header.ChannelId;\r\nvar
                RequestTime = Header.RequestTime;\r\nvar SessionId = Header.SessionId;
                \r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar MWResponseTime
                = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\nvar
                code = Header.ResponseStatus.Code;\r\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\r\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\r\nif
                (RequestTime !== 'undefined')\r\napim.setvariable('message.headers.RequestTime',RequestTime,'add');\r\nif
                (SessionId !== 'undefined')\r\napim.setvariable('message.headers.X-Request-Id',SessionId,'add');\r\nif
                (MWRequestTime !== 'undefined')\r\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\r\nif
                (MWResponseTime !== 'undefined')\r\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\r\napim.setvariable('message.headers.Response-Status',status,'add');\r\napim.setvariable('message.headers.Response-Code',code,'add');"
          - switch:
              version: 2.0.0
              title: switch
              case:
              - condition: ((($header("Response-Status") = 'SUCCESS')))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Response
                    source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                      cfg = apim.getvariable('cfg');          \r\nvar body = message[cfg.responseName].Body;\r\nsession.output.write(body);\r\napim.output('application/json');"
              - otherwise:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Error
                    source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                      cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                      message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                      {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                      \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                      \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                      \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                      \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                      \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                      \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                      == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad
                      Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: ErrorResponse
              source: "var apim = require('apim');\r\n\r\nvar body = {\r\n    \"errorMsg\"
                : \"schema error , please check the start and end dates\"\r\n}\r\n\r\n\r\nsession.output.write(body);\r\napim.output('application/json');"
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
parameters:
  laborOfficeId:
    name: laborOfficeId
    in: query
    type: string
  sequenceNum:
    name: sequenceNum
    in: query
    type: string
  X-IBM-Client-Id:
    name: X-IBM-Client-Id
    required: true
    in: header
    type: string
  X-IBM-Client-Secret:
    name: X-IBM-Client-Secret
    in: header
    type: string
  X-Request-Id:
    name: X-Request-Id
    in: header
    type: string
  crNumber:
    name: crNumber
    required: true
    in: path
    type: string
definitions:
  RequestModel:
    type: object
    additionalProperties: false
    properties:
      startDate:
        $ref: '#/definitions/GregorianDateModel'
        properties: {}
      endDate:
        $ref: '#/definitions/GregorianDateModel'
        properties: {}
      operation:
        type: string
      numberOfEmployees:
        type: string
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: 31/12/2017
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
paths:
  /establishment/crNumber/{crNumber}/industrial-status:
    patch:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces:
      - application/json
      parameters: []
    parameters:
    - name: laborOfficeId
      in: query
      required: false
      type: string
    - name: sequenceNum
      in: query
      required: false
      type: string
    - name: X-IBM-Client-Id
      in: header
      required: true
      type: string
    - name: X-IBM-Client-Secret
      in: header
      required: false
      type: string
    - name: X-Request-Id
      in: header
      required: false
      type: string
    - name: crNumber
      in: path
      required: true
      type: string
