swagger: "2.0"
info:
  title: NIC_OpenEstablishmentFile
  description: This service is used by the consumer to open an establishment file
    from HRSD through Takamol Internal/External Integration.
  x-ibm-name: nic-openestablishmentfile
  version: 1.0.0
schemes:
- https
basePath: /nic/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /establishment-file:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    post:
      tags:
      - Establishment File
      description: Service to open establishment file
      operationId: addEstablishmentFile
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestModel'
        description: open establishment file request body
      produces:
      - application/json
      responses:
        "201":
          $ref: '#/responses/Response201'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  RequestModel:
    type: object
    properties:
      referenceNumber:
        type: string
        example: 86977351-d99c-4bf5-8f19-58bbca4281f1
      transactionType:
        $ref: '#/definitions/NameCodeModel'
      crNumber:
        $ref: '#/definitions/IntegerNumberModel'
      nationalNumber:
        $ref: '#/definitions/IntegerNumberModel'
      isMain:
        type: boolean
        example: "false"
      mainCr:
        $ref: '#/definitions/IntegerNumberModel'
      businessType:
        $ref: '#/definitions/NameCodeModel'
      location:
        $ref: '#/definitions/NameCodeModel'
      crName:
        type: string
        example: Name of CR
      issueDate:
        $ref: '#/definitions/HijriDateModel'
      expiryDate:
        $ref: '#/definitions/HijriDateModel'
      nationality:
        $ref: '#/definitions/NameCodeModel'
      zipCode:
        type: string
        example: "41000"
      poBox:
        type: string
        example: P.O.Box One
      city:
        $ref: '#/definitions/NameCodeModel'
      street:
        type: string
        example: Murabba
      building:
        $ref: '#/definitions/IntegerNumberModel'
      crOfficeNumber:
        $ref: '#/definitions/IntegerNumberModel'
      fiscalYear:
        $ref: '#/definitions/NameCodeModel'
      molOfficeNumber:
        $ref: '#/definitions/IntegerNumberModel'
      mainActivityId:
        $ref: '#/definitions/IntegerNumberModel'
      branchActivityId:
        $ref: '#/definitions/IntegerNumberModel'
      crParties:
        type: array
        items:
          $ref: '#/definitions/CrParties'
      crRepresentative:
        $ref: '#/definitions/CrRepresentative'
      crActivities:
        type: array
        items:
          $ref: '#/definitions/NameCodeModel'
  CrParties:
    type: object
    description: This object will be used across the model
    properties:
      name:
        type: string
        example: Name of the party
      relationType:
        $ref: '#/definitions/NameCodeModel'
      nationality:
        $ref: '#/definitions/NameCodeModel'
      partyId:
        $ref: '#/definitions/IntegerNumberModel'
      birthDate:
        $ref: '#/definitions/GregorianDateModel'
  CrRepresentative:
    type: object
    description: This object will be used across the model
    properties:
      name:
        type: string
        example: Name of the party representative
      nationality:
        $ref: '#/definitions/NameCodeModel'
      partyId:
        $ref: '#/definitions/IntegerNumberModel'
      partyIdType:
        type: string
        example: Type of party
      mobile:
        type: string
        example: "0512356125"
      email:
        type: string
        example: a@b.com
      birthDate:
        $ref: '#/definitions/GregorianDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      id:
        type: string
        example: "1"
      name:
        type: string
        example: name
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  IntegerNumberModel:
    type: integer
    description: This object use for integer numbers
    additionalProperties:
      type: integer
      example: 1
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: "2017-12-31"
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: "1439-12-25"
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
responses:
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
        description: Company Id
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
