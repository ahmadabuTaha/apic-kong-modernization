swagger: "2.0"
info:
  title: QAAS_GetEmploymentContractsList
  description: This service is used to Get Employment Contract List from Qiwa.
  x-ibm-name: qaas_getemploymentcontractslist
  version: 1.0.0
schemes:
- https
basePath: /external/v1
securityDefinitions:
  OAuth2.0:
    type: oauth2
    x-ibm-oauth-provider: externaliamprovider
    flow: application
    tokenUrl: $(keycloak-token)/realms/TIP/protocol/openid-connect/token
    scopes:
      contract:scope: allow access to contract APIs
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
security:
- OAuth2.0:
  - contract:scope
  clientIdHeader: []
paths:
  /qaas/contract/getemploymentcontractslist:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    get:
      tags:
      - QiwaAsAService
      description: This service is used to Get Establishment Details from Qiwa DB
        and provide it to Service Now
      operationId: getemploymentcontractslist
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
