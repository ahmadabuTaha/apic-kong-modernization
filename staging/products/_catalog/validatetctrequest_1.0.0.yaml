swagger: "2.0"
info:
  title: ValidateTCTRequest
  version: 1.0.0
  description: ValidateTCTRequest
  x-ibm-name: validatetctrequest
paths:
  /valtctreq:
    post:
      operationId: ValidateTCTRequest
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ValidateTCTRequestRs_MessageType'
      consumes:
      - application/json
      produces:
      - application/json
      description: This service will be used to validate the TCT request in terms
        of contract, reason and trainee
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/ValidateTCTRequestRq_MessageType'
        description: ValidateTCTRequestRq
        required: true
basePath: /trncntr
definitions:
  ValidateTCTRequestRq_MessageType:
    type: object
    properties:
      ValidateTCTRequestRq:
        $ref: '#/definitions/ValidateTCTRequestRq_Type'
  ValidateTCTRequestRs_MessageType:
    type: object
    properties:
      ValidateTCTRequestRs:
        $ref: '#/definitions/ValidateTCTRequestRs_Type'
  ValidateTCTRequestRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/ValidateTCTRequestRq_BodyType'
  ValidateTCTRequestRq_BodyType:
    type: object
    properties:
      LaborOfficeId:
        type: integer
        description: Labor Office ID. Mandatory if RequesterTypeId = 1 (Employer),
          otherwise return error E0001231.
      SequenceNumber:
        type: integer
        description: Sequence Number. Mandatory if RequesterTypeId = 1 (Employer),
          otherwise return error E0001231.
      TraineeIdNo:
        type: integer
        description: Trainee Identification Number.
      RequesterTypeId:
        type: integer
        description: Requester type. 1 = Employer, 2 = Trainee.
        enum:
        - 1
        - 2
      TCTReasonId:
        type: integer
        description: Termination reason ID. Allowed values from 1 to 6.
        minimum: 1
        maximum: 6
    required:
    - TraineeIdNo
    - RequesterTypeId
    - TCTReasonId
  ValidateTCTRequestRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/ValidateTCTRequestRs_BodyType'
  ValidateTCTRequestRs_BodyType:
    type: object
    properties:
      TrainingContractId:
        type: integer
        description: Training Contract ID.
      ContractExpiryDate:
        type: string
        format: date
        description: Contract expiry date.
      NoticePeriod:
        type: integer
        description: Notice period in days.
      LaborOfficeId:
        type: integer
        description: Labor Office ID.
      SequenceNumber:
        type: integer
        description: Sequence number.
      NationalUnifiedNumber:
        type: integer
        description: National Unified Number.
      TraineeName:
        type: string
        description: Trainee full name.
      TraineeMobileNumber:
        type: string
        description: Trainee mobile number.
    required:
    - TrainingContractId
    - ContractExpiryDate
    - NoticePeriod
    - LaborOfficeId
    - SequenceNumber
    - NationalUnifiedNumber
    - TraineeName
    - TraineeMobileNumber
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
    required:
    - TransactionId
    - ChannelId
    - RequestTime
    - ServiceCode
  UDF_Type:
    type: object
    properties:
      KeyValueArr:
        type: array
        items:
          $ref: '#/definitions/KeyValueArr_Type'
  KeyValueArr_Type:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
  Tmstmp_Type:
    type: object
  UserInfo_Type:
    type: object
    properties:
      UserId:
        type: integer
      IDNumber:
        type: integer
  MWResponseStatus_Type:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
    required:
    - Code
    - Status
    - ArabicMsg
    - EnglishMsg
  BackendError_Type:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
