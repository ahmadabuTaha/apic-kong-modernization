                - set: sectionName
                  from: SectionName
                - set: majorName
                  from: MajorName
                - set: minorName
                  from: MinorName
                - set: saudiSpeciality
                  from: SaudiSpeciality
                - set: studyPeriod
                  from: StudyPeriod
                - set: studyModeName
                  from: StudyModeName
                - set: gpaTypeName
                  from: GPATypeName
                - set: gpa
                  from: GPA
                - set: ratingName
                  from: RatingName
                - set: graduationDate.gregorianDate
                  from: GraduationDate.GregorianDate
                - set: graduationDate.hijriDate
                  from: GraduationDate.HijriDate
                - set: degree
                  from: Degree
                - set: degreeName
                  from: DegreeName
              - set: .qualificationsDetails.personDetails.personName.fullNameEn
                from: .QualificationsDetailsResponse.PersonDetails.PersonName.FullNameEn
              - set: .qualificationsDetails.personDetails.personName.fullNameAr
                from: .QualificationsDetailsResponse.PersonDetails.PersonName.FullNameAr
              - set: .qualificationsDetails.personDetails.emailAddress
