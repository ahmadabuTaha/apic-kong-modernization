              - set: .abroadQualifications.responseStatus
                from: .AbroadQualiffcationResponse.ResponseStatus
              - set: .abroadQualifications.errorDescription
                from: .AbroadQualiffcationResponse.ErrorDescrption
              - create: .abroadQualifications.qualificationsList
                foreach: .AbroadQualiffcationResponse.AbroadQualificationList.AbroadQualification
                from: .AbroadQualiffcationResponse.AbroadQualificationList.AbroadQualification
                actions:
                - set: instituteName.instituteNameAr
                  from: InstituteName.InstituteNameAr
                - set: instituteName.instituteNameEn
                  from: InstituteName.InstituteNameEn
                - set: collegeNameAr
                  from: CollegeNameAr
                - set: collegeNameEn
                  from: CollegeNameEn
                - set: sectionName
                  from: SectionName
                - set: majorNameAr
                  from: MajorNameAr
                - set: majorNameEn
                  from: MajorNameEn
                - set: certificateTitleAr
                  from: CertificateTitleAr
                - set: certificateTitleEn
                  from: CertificateTitleEn
                - set: minorName
                  from: MinorName
                - set: saudiSpeciality
                  from: SaudiSpeciality
                - set: studyPeriod
                  from: StudyPeriod
                - set: studyModeNameAr
                  from: StudyModeNameAr
                - set: studyModeNameEn
                  from: StudyModeNameEn
                - set: gpaTypeName
                  from: GPATypeName
                - set: gpa
                  from: GPA
                - set: ratingName
                  from: RatingName
                - set: gradutionYear
                  from: GradutionYear
                - set: equationDecision
                  from: EquationDecision
                - set: equationdegreeName
                  from: EquationdegreeName
                - set: equationDecisionText
                  from: EquationDecisionText
                - set: degreeName.degreeNameAr
                  from: DegreeName.DegreeNameAr
                - set: degreeName.degreeNameEn
                  from: DegreeName.DegreeNameEn
                - set: degreeName.degree
                  from: DegreeName.Degree
                - set: graduationDate.gregorianDate
                  from: GraduationDate.GregorianDate
                - set: graduationDate.hijriDate
                  from: GraduationDate.HijriDate
                - set: countryOfStudy.countryOfStudyAr
                  from: CountryOfStudy.countryOfStudyAr
                - set: countryOfStudy.countryOfStudyEn
                  from: CountryOfStudy.countryOfStudyEn
              - set: .localHighQualifications.errorDescription
                from: .LocalHighQualificationsResponse.ErrorDescrption
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                namespaceInheritance: false
                inlineNamespaces: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n    \"ErrorResponse\":
                message[cfg.responseName].Header.ResponseStatus\n}\n\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.ErrorResponse.Code]){\n       httperror
                = cfg.errorMap[error.ErrorResponse.Code].code;\n       \n       //var
                errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n       //var
                details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
  properties:
