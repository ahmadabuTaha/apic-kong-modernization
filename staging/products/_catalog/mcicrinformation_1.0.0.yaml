x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          yeFIMessageId:
            schema:
              type: string
            variable: request.parameters.yeFIMessageId
          customCRNationalNumber:
            schema:
              type: string
            variable: request.parameters.customCRNationalNumber
          customVersionNo:
            schema:
              type: string
            variable: request.parameters.customVersionNo
          customCRNumber:
            schema:
              type: string
            variable: request.parameters.customCRNumber
        outputs:
          "":
            schema:
              type: object
              properties:
                customCRNationalNumber:
                  type: string
                  name: customCRNationalNumber
                customVersionNo:
                  type: number
                  name: customVersionNo
                customCRNumber:
                  type: string
                  name: customCRNumber
                yeFIMessageId:
                  type: string
                  name: yeFIMessageId
              example: '{"customCRNationalNumber":"7001720002","customVersionNo":2,"customCRNumber":"1010101010","yeFIMessageId":"84b07f4d-c081-4e4c-a962-27540384fb19"}'
            variable: message.body
            content: application/json
        actions:
        - set: .customCRNationalNumber
          from: customCRNationalNumber
        - set: .customVersionNo
          from: customVersionNo
        - set: .customCRNumber
          from: customCRNumber
        - set: .yeFIMessageId
          from: yeFIMessageId
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"MCCD0001\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
          : \"MCICRInformationRq\",\r\n    \"responseName\": \"MCICRInformationRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n
          \       \"Header\" : {\r\n            \"TransactionId\" : millisecondsvalue,\r\n
          \           \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"External-MCI-Product\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : apim.getvariable('message.body')\r\n            \r\n    }\r\n};\r\n\r\nif
          (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.2.0
        title: MainBE
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        graphql-send-type: detect
        websocket-upgrade: false
        target-url: $(ace-tip-mci)/external/mcicrinformation
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\napim.output('application/json');\r\nvar
          message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          Header = message[cfg.responseName].Header;\r\nvar TransactionId = Header.TransactionId;\r\nvar
          ChannelId = Header.ChannelId;\r\nvar RequestTime = Header.RequestTime;\r\nvar
          SessionId = Header.SessionId;\r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar
          MWResponseTime = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\nvar
          code = Header.ResponseStatus.Code;\r\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\r\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\r\nif
          (RequestTime !== 'undefined')\r\napim.setvariable('message.headers.RequestTime',RequestTime,'add');\r\nif
          (SessionId !== 'undefined')\r\napim.setvariable('message.headers.X-Request-Id',SessionId,'add');\r\nif
          (MWRequestTime !== 'undefined')\r\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\r\nif
          (MWResponseTime !== 'undefined')\r\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\r\napim.setvariable('message.headers.Response-Status',status,'add');\r\napim.setvariable('message.headers.Response-Code',code,'add');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\nsession.output.write(body);\r\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');          \r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
