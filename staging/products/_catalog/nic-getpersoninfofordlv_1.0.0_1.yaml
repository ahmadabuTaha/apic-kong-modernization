swagger: "2.0"
info:
  title: NIC - GetPersonInfoForDLV
  x-ibm-name: nic-getpersoninfofordlv
  version: 1.0.0
  description: This service is used by the consumer to get Person information for
    DLV from NIC through Takamol Internal/External Integration.
schemes:
- https
basePath: /nic/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          id:
            schema:
              type: integer
            variable: request.parameters.id
          birthDateH:
            schema:
              type: string
            variable: request.parameters.birthDateH
          iqamaExpiryDateH:
            schema:
              type: string
            variable: request.parameters.iqamaExpiryDateH
        outputs:
          output:
            schema:
              description: ""
              type: object
              properties:
                id:
                  type: string
                  name: id
                birthDateH:
                  type: string
                  name: birthDateH
                iqamaExpiryDateH:
                  type: string
                  name: iqamaExpiryDateH
              example: '{"id":"1121696452","birthDateH":"1424-12-29","iqamaExpiryDateH":"1424-12-29"}'
            variable: message.body
            content: application/json
        actions:
        - set: output.id
          from: id
        - set: output.birthDateH
          from: birthDateH
        - set: output.iqamaExpiryDateH
          from: iqamaExpiryDateH
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: |-
          var apim = require('apim');


          var cfg={
          "serviceCode" : "NICGPI01",
          "channelId" : "Integration",
          "requestName" : "GetPersonInfoForDLVRq",
          "responseName": "GetPersonInfoForDLVRs",
          "errorMap" :{
          "ESBSCHEMA" : {"code" :400, "msg":"Invalid Request"}
          }

          };
          apim.setvariable('cfg',cfg);
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n\r\n                \"IDNumber\":
          apim.getvariable('message.headers.IDNumber')\r\n            }\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-tip-nic-get)/external/getpersoninfofordlv
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "var apim = require('apim');\r\napim.output('application/json');\r\nvar
          message = apim.getvariable('message.body');\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          Header = message[cfg.responseName].Header;\r\nvar TransactionId = Header.TransactionId;\r\nvar
          ChannelId = Header.ChannelId;\r\nvar RequestTime = Header.RequestTime;\r\nvar
          SessionId = Header.SessionId; \r\nvar MWRequestTime = Header.MWRequestTime;\r\nvar
          MWResponseTime = Header.MWResponseTime;\r\nvar status = Header.ResponseStatus.Status;\r\nvar
          code = Header.ResponseStatus.Code;\r\napim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\r\napim.setvariable('message.headers.Channel-Id',ChannelId,'add');\r\nif
          (RequestTime !== 'undefined')\r\napim.setvariable('message.headers.RequestTime',RequestTime,'add');\r\nif
          (SessionId !== 'undefined')\r\napim.setvariable('message.headers.X-Request-Id',SessionId,'add');\r\nif
          (MWRequestTime !== 'undefined')\r\napim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\r\nif
          (MWResponseTime !== 'undefined')\r\napim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\r\napim.setvariable('message.headers.Response-Status',status,'add');\r\napim.setvariable('message.headers.Response-Code',code,'add');"
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: |-
                var apim = require('apim');
                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');
                var body = message[cfg.responseName].Body;
                session.output.write(body);
                apim.output('application/json');
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: |-
                var apim = require('apim');



                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');
                var error = {
                "errorCode": message[cfg.responseName].Header.ResponseStatus.Code,
                "errorMessage": {
                "en-US": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,
                "ar-SA": message[cfg.responseName].Header.ResponseStatus.ArabicMsg
                }
                };



                var httperror=0;
                if(cfg.errorMap){
                if(cfg.errorMap[error.errorCode]){
                httperror = cfg.errorMap[error.errorCode].code;

                //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;
                //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;
                //apim.error('ERROR',httperror,errmgs,details);
                }
                }
                if(httperror == 0){
                httperror = 400;
                // apim.error('ERROR',400,'Bad Request','Invalid request');
                }
                apim.setvariable('message.status.code',httperror,'set');



                session.output.write(error);
                apim.output('application/json');
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  cors:
    enabled: true
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  id:
    name: id
    in: path
    required: true
    type: integer
    format: int32
  birthDateH:
    name: birthDateH
    in: path
    required: true
    type: string
  iqamaExpiryDateH:
    name: iqamaExpiryDateH
    in: query
    required: false
    type: string
definitions:
  ResponseModel:
    type: object
    additionalProperties: false
    properties:
      getpersonInfoForDLVResult:
        $ref: '#/definitions/getpersonInfoForDLVResult_MessageType'
        properties: {}
  getpersonInfoForDLVResult_MessageType:
    type: object
    additionalProperties: false
    properties:
      requestTimeStamp:
        type: string
        example: "00:00:00.000"
      responseTimeStamp:
        type: string
        example: "00:00:00.000"
      birthDateH:
        type: string
        example: "2021-12-31"
      familyName:
        type: string
