      familyNameT:
        type: string
        example: TName of family
      fatherName:
        type: string
        example: Name of father
      fatherNameT:
        type: string
        example: TName of father
      grandfatherName:
        type: string
        example: Name of grand father
      grandfatherNameT:
        type: string
        example: TName of grand father
      hasSaudiDependents:
        type: boolean
        example: true
      id:
        type: integer
        example: 1
      maritalStatus:
        type: string
        example: Single
      nationality:
        type: string
        example: Abc
      occupation:
        type: string
        example: Labour
      sex:
        type: string
        example: Male
      status:
        type: string
        example: Xyz
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
