      crNationalNumber:
        type: string
      entityFullNameAr:
        type: string
      entityFullNameEn:
        type: string
      crTimeLineActionList:
        type: array
        items:
          $ref: '#/definitions/crTimeLineActionList'
  Metadata:
    description: Contains metadata about responses with lists
    type: object
