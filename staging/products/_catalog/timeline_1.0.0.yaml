    type: object
    properties:
      actionDateGregorian:
        type: string
      actionDateHijri:
        type: string
  ActionType:
    type: object
    properties:
      actionTypeID:
        type: integer
      actionTypeDescAr:
        type: string
      actionTypeDescEn:
        type: string
  ActorType:
    description: ActorType
    type: object
    properties:
      actorTypeID:
        type: integer
      actorTypeDescAr:
        type: string
      actorTypeDescEn:
        type: string
  crTimeLineActionList:
    type: object
    properties:
      versionNo:
        type: integer
      actionType:
        $ref: '#/definitions/ActionType'
      actionDate:
        $ref: '#/definitions/ActionDate'
      crStatus:
        $ref: '#/definitions/CRStatus'
      actorType:
        $ref: '#/definitions/ActorType'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
