  YeFI-Message-Id:
    in: query
    name: YeFI-Message-Id
    description: YeFI-Message-Id
    required: true
    type: string
  Custom-CRNationalNumber:
    in: query
    name: Custom-CRNationalNumber
    description: Custom-CRNationalNumber
    required: true
    type: string
    minLength: 10
    maxLength: 10
  limit:
    in: query
    name: limit
    description: limit
    required: false
    type: integer
    minLength: 1
    maxLength: 10
    default: 25
  offset:
    in: query
    name: offset
    description: offset
    required: false
    type: integer
    minLength: 1
    maxLength: 10
    default: 0
