swagger: "2.0"
info:
  title: EditandresubmitWorkPlan-Gov
  description: this service is used to Edit and resubmit Work Plan for an Etimad Contract.
  x-ibm-name: editandresubmitworkplan-gov
  version: 1.0.0
schemes:
- https
basePath: /external/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /reworkplancontract/{contractNumber}:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/contractNumber'
    put:
      tags:
      - EditandresubmitWorkPlan
      description: this service is used to Edit and resubmit Work Plan for an Etimad
        Contract.
      operationId: editandresubmitworkplan
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestBody'
        description: Request body
        required: true
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  RequestBody:
    type: object
    properties:
      etimad_contract:
        $ref: '#/definitions/etimad_contract_Type'
      representative:
        $ref: '#/definitions/representative_Type'
      positions:
        type: array
        items:
          $ref: '#/definitions/positions_Type'
  etimad_contract_Type:
    type: object
    properties:
      contract_number:
        type: string
        description: Optional, not always provided
      contract_name:
        type: string
        example: Cleaning services
      contract_description:
        type: string
        example: Janitorial services for HQ
      project_name:
        type: string
        example: HQ-2026
      project_number:
        type: string
        example: 1-8739-098
      industry:
        type: string
        example: Cleaning services
      contract_type:
        type: string
        example: services
      contract_value:
        $ref: '#/definitions/contract_value_Type'
      duration_start:
        type: string
        format: date
        example: "2026-01-01"
      duration_end:
        type: string
        format: date
        example: "2026-12-31"
      region:
        type: string
        example: Riyadh Region
      city:
        type: string
        example: Riyadh
  contract_value_Type:
    type: object
    properties:
      amount:
        type: string
        example: "100000"
      currency:
        type: string
        example: SAR
  representative_Type:
    type: object
    properties:
      name:
        type: string
        example: Mohammed Al-Saudi
      email:
        type: string
        format: email
        example: rep@example.com
  positions_Type:
    type: object
    properties:
      occupation:
        type: string
        example: cleaner
      nationality:
        type: string
        example: saudi
      gender:
        type: string
        enum:
        - male
        - female
        example: male
      laborer_count:
        type: integer
        example: 5
  ResponseModel:
    type: object
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  contractNumber:
    in: path
    name: contractNumber
    description: contractNumber
    required: true
    type: string
responses:
  Response200:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ResponseModel'
  Response201:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
      Location:
        type: string
        description: Id url encoded
  Response204:
    description: Response
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response400:
    description: The request was rejected by the server due to malformed syntax. Bad
      Request.
  Response401:
    description: The request could not be completed due to lack of valid credentials.
      Authentication.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response403:
    description: The request could not be completed because it is not authorized.
      Authorization
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response404:
    description: The server has not found anything matching the Request-URI.
  Response408:
    description: The client did not produce a request within the time that the server
      was prepared to wait.
  Response409:
    description: The request could not be completed due to a conflict with the current
      state of the resource. Usually business validation errors will be returned in
      the body
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response429:
    description: The request was sent too many times in a given amount of time
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
  Response500:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response501:
    description: The server does not support the functionality required and does not
      recognize the request
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response503:
    description: The server encountered an unexpected condition which prevented it
      from fulfilling the request.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
  Response510:
    description: Extensions to the request are required for the server to fulfil it.
    headers:
      X-Request-Id:
        type: string
        description: Trace Id for the request.
    schema:
      $ref: '#/definitions/ErrorModel'
