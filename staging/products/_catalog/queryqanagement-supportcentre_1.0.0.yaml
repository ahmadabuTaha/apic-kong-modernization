swagger: "2.0"
info:
  title: QueryManagement SupportCentre
  x-ibm-name: queryqanagement-supportcentre
  version: 1.0.0
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - operation-switch:
        version: 2.0.0
        title: Qiwa Support Centre - Query Management
        case:
        - operations:
          - verb: post
            path: /cardsData
          execute:
          - invoke:
              version: 2.0.0
              title: get cards data
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: POST
              chunked-uploads: true
              persistent-connection: true
              target-url: $(ace-qiwa-support-center)$(getCardsData)
              follow-redirects: false
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /queryById
          execute:
          - invoke:
              version: 2.3.0
              title: query by id
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(queryById)
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /activateDeactivateQuery
          execute:
          - invoke:
              version: 2.3.0
              title: Activate Deactivate Query
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(actDeactQuery)
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /queriesByModuleId
          execute:
          - invoke:
              version: 2.3.0
              title: Queries By Module Id
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(queriesByModId)
              inject-proxy-headers: true
        - operations:
          - verb: get
            path: /queryModules
          execute:
          - invoke:
              version: 2.3.0
              title: Query Modules
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: GET
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(modules)
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /queries/all
          execute:
          - invoke:
              version: 2.3.0
              title: get all queries
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(queries)
              inject-proxy-headers: true
        - operations:
          - verb: get
            path: /getDSN
          execute:
          - invoke:
              version: 2.3.0
              title: get DSN
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: GET
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(dsn)
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /customQuery
          execute:
          - invoke:
              version: 2.3.0
              title: custom Query
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(custQry)
              inject-proxy-headers: true
        - operations:
          - verb: post
            path: /utilityQuery
          execute:
          - invoke:
              version: 2.3.0
              title: utility Query
              backend-type: json
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              http-version: HTTP/1.1
              timeout: 60
              verb: POST
              chunked-uploads: false
              persistent-connection: true
              cache-response: protocol
              cache-ttl: 900
              websocket-upgrade: false
              target-url: $(ace-qiwa-support-center)$(utilQry)
              inject-proxy-headers: true
        otherwise: []
  properties:
    getCardsData:
      value: /qc_querymanagement/v1/getCardsData
      description: The URL of the target service
      encoded: false
    queryById:
      value: /qc_querymanagement/v1/getQueryByQueryId
    actDeactQuery:
      value: /qc_querymanagement/v1/ActiveDeactivequery
    queriesByModId:
      value: /qc_querymanagement/v1/getQueriesByModuleId
    modules:
      value: /qc_querymanagement/v1/getModules
    queries:
      value: /qc_querymanagement/v1/GetAllQueries
    dsn:
      value: /qc_querymanagement/v1/getDSNData
    custQry:
      value: /qc_querymanagement/v1/getCustomQueryData
    utilQry:
      value: /qc_querymanagement/v1/UtilityQuery
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
basePath: /qiwa/v2/querymanagement
paths:
  /cardsData:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
  /queryById:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
  /activateDeactivateQuery:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
  /queriesByModuleId:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
  /queryModules:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
  /queries/all:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
  /getDSN:
    get:
      responses:
        "200":
          description: success
          schema:
            type: string
  /customQuery:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
  /utilityQuery:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
securityDefinitions:
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
    x-key-type: client_id
  clientSecret:
    type: apiKey
    x-key-type: client_secret
    name: X-IBM-Client-Secret
    in: header
  OAuth2.0:
    type: oauth2
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    flow: application
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
schemes:
- https
security:
- clientID: []
  clientSecret: []
  OAuth2.0:
  - IntegrationScope
