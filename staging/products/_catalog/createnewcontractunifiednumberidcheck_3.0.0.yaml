swagger: "2.0"
info:
  title: CreateNewContractUnifiedNumberIdCheck
  x-ibm-name: createnewcontractunifiednumberidcheck
  version: 3.0.0
schemes:
- https
basePath: /external
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim'); \r\nvar authHeader = apim.getvariable('request.headers.Authorization');\r\nvar
          request = apim.getvariable('request.body');\r\nvar reqUnifiedNationalNumber
          = request.CreateNewContractRq.Body.EstablishmentDetails.UnifiedNumberId;\r\nvar
          base64Url = authHeader.split('.')[1];\r\nvar base64 = base64Url.replace('-',
          '+').replace('_', '/');\r\nvar decodedData = JSON.parse(Buffer.from(base64,
          'base64'));\r\nvar tokenUnifiedNationalNumbers = decodedData.UnifiedNationalNumbers;\r\n
          \r\nif(tokenUnifiedNationalNumbers.includes(reqUnifiedNationalNumber)){\r\nsession.output.write(request);\r\n}else{\r\ncontext.reject(\"Forbidden\",
          \"UnifiedNationalId id Not valid\");\r\n    context.message.statusCode =
          403;\r\n    context.message.body.write({\r\n        error: \"UnifiedNationalId
          id Not valid\"\r\n    });\r\n    context.message.headers[\"Content-Type\"]
          = \"application/json\";\r\n}"
    - invoke:
        version: 2.2.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        http-version: HTTP/1.1
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        graphql-send-type: detect
        websocket-upgrade: false
        target-url: $(ace-cntmv2-contractcreates)/contractmanagement/createnewcontract
    catch: []
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
