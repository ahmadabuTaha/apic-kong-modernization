        title: Service_Config
        source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
          : \"GEPRUN01\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
          : \"GetEstablishmentPerfRptByEstNumRq\",\r\n    \"responseName\": \"GetEstablishmentPerfRptByEstNumRs\",\r\n
