swagger: "2.0"
info:
  title: NIC_IssueSeasonalVisa
  x-ibm-name: nic-issueseasonalvisa
  version: 2.0.0
  description: This API exposes NIC to Issue Seasonal Visa service from Qiwa platform
schemes:
- https
basePath: /nic/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          "":
            schema:
              description: ""
              type: object
              properties:
                laborOfficeId:
                  type: integer
                  name: laborOfficeId
                sequenceNumber:
                  type: integer
                  name: sequenceNumber
                unifiedNationalNumber:
                  type: integer
                  name: unifiedNationalNumber
                requesterIdNo:
                  type: integer
                  name: requesterIdNo
                requestSequence:
                  type: integer
                  name: requestSequence
                requestYear:
                  type: integer
                  name: requestYear
                reasonAddActivity:
                  type: integer
                  name: reasonAddActivity
                reasonExtendedActivity:
                  type: integer
                  name: reasonExtendedActivity
                reasonFinalExit:
                  type: integer
                  name: reasonFinalExit
                reasonGovernmentContract:
                  type: integer
                  name: reasonGovernmentContract
                reasonNewCompany:
                  type: integer
                  name: reasonNewCompany
                reasonPrivateContract:
                  type: integer
                  name: reasonPrivateContract
                reasonSeasonalEmployee:
                  type: integer
                  name: reasonSeasonalEmployee
                reasonVisaNotUsed:
                  type: integer
                  name: reasonVisaNotUsed
                visaType:
                  type: integer
                  name: visaType
                visaDetails:
                  type: object
                  properties:
                    visa:
                      type: array
                      items:
                        properties:
                          gender:
                            type: integer
                            name: gender
                          job:
                            type: integer
                            name: job
                          nationality:
                            type: integer
                            name: nationality
                          origin:
                            type: integer
                            name: origin
                          religion:
                            type: integer
                            name: religion
                          numberOfVisas:
                            type: integer
                            name: numberOfVisas
                        type: object
                      name: visa
                  name: visaDetails
            variable: request.body
            content: application/json
        outputs:
          "":
            schema:
              description: ""
              type: object
              properties:
                LaborOfficeId:
                  type: string
                  name: LaborOfficeId
                SequenceNumber:
                  type: string
                  name: SequenceNumber
                UnifiedNationalNumber:
                  type: string
                  name: UnifiedNationalNumber
                RequesterIdNo:
                  type: string
                  name: RequesterIdNo
                RequestSequence:
                  type: string
                  name: RequestSequence
                RequestYear:
                  type: string
                  name: RequestYear
                ReasonAddActivity:
                  type: string
                  name: ReasonAddActivity
                ReasonExtendedActivity:
                  type: string
                  name: ReasonExtendedActivity
                ReasonFinalExit:
                  type: string
                  name: ReasonFinalExit
                ReasonGovernmentContract:
                  type: string
                  name: ReasonGovernmentContract
                ReasonNewCompany:
                  type: string
                  name: ReasonNewCompany
                ReasonPrivateContract:
                  type: string
                  name: ReasonPrivateContract
                ReasonSeasonalEmployee:
                  type: string
                  name: ReasonSeasonalEmployee
                ReasonVisaNotUsed:
                  type: string
                  name: ReasonVisaNotUsed
                VisaType:
                  type: string
                  name: VisaType
                VisaRequestList:
                  type: object
                  properties:
                    Visa:
                      type: array
                      items:
                        properties:
                          Gender:
                            type: string
                            name: Gender
                          Job:
                            type: string
                            name: Job
                          Nationality:
                            type: string
                            name: Nationality
                          Origin:
                            type: string
                            name: Origin
                          Religion:
                            type: string
                            name: Religion
                          NumberOfVisas:
                            type: string
                            name: NumberOfVisas
                        type: object
                      name: Visa
                  name: VisaRequestList
            variable: message.body
        actions:
        - set: .LaborOfficeId
          from: .laborOfficeId
        - set: .SequenceNumber
          from: .sequenceNumber
        - set: .UnifiedNationalNumber
          from: .unifiedNationalNumber
        - set: .RequesterIdNo
          from: .requesterIdNo
        - set: .RequestSequence
          from: .requestSequence
        - set: .RequestYear
          from: .requestYear
          default: 0
        - set: .ReasonAddActivity
          from: .reasonAddActivity
          default: 0
        - set: .ReasonExtendedActivity
          from: .reasonExtendedActivity
          default: 1
        - set: .ReasonFinalExit
          from: .reasonFinalExit
          default: 0
        - set: .ReasonGovernmentContract
          from: .reasonGovernmentContract
          default: 0
        - set: .ReasonNewCompany
          from: .reasonNewCompany
          default: 0
        - set: .ReasonPrivateContract
          from: .reasonPrivateContract
          default: 0
        - set: .ReasonSeasonalEmployee
          from: .reasonSeasonalEmployee
          default: 1
        - set: .ReasonVisaNotUsed
          from: .reasonVisaNotUsed
          default: 0
        - set: .VisaType
          from: .visaType
          default: 3
        - create: .VisaRequestList.Visa
          foreach: .visaDetails.visa
          from: .visaDetails.visa
          actions:
          - set: Gender
            from: gender
          - set: Job
            from: job
          - set: Nationality
            from: nationality
          - set: Origin
            from: origin
          - set: Religion
            from: religion
          - set: NumberOfVisas
            from: numberOfVisas
        options:
          mapEnablePostProcessingJSON: true
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapReferenceLimit: 1
          inlineNamespaces: false
          namespaceInheritance: false
          includeEmptyXMLElements: false
          mapResolveApicVariables: false
          mapOptimizeSchemaDefinition: true
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\n\nvar cfg={\n    \"serviceCode\" : \"NSVR0001\",\n
          \   \"channelId\" : \"Integration\",\n    \"requestName\" : \"SubmitVisaRequestNICRq\",\n
          \   \"responseName\": \"SubmitVisaRequestNICRs\",\n    \"errorMap\" :{\n
          \       \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid Request\"}\n    }\n
          \   \n};\n\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar appcReq
          = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n            \"TransactionId\"
          : millisecondsvalue,\r\n            \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode\r\n        },\r\n
          \       \"Body\" : apim.getvariable('message.body')\r\n            \r\n
          \       \r\n    }\r\n};\r\n\r\nif (typeof OperatorId !== 'undefined')\r\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\r\n        \"IDNumber\"
          : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        header-control:
          type: blacklist
          values: []
        parameter-control:
          type: whitelist
          values: []
        timeout: 60
        verb: POST
        cache-response: protocol
        cache-ttl: 900
        stop-on-error: []
        target-url: $(ace-nic-nicsubmit)/common/subvisareqnic
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: "\tvar apim = require('apim');\n\t\n\tapim.output('application/json');\n\n
          \   \n    \n    var cfg = apim.getvariable('cfg');\n    \n\tvar TransactionId
          = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.TransactionId\");\n\tvar
          ChannelId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ChannelId\");\n\tvar
          RequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.RequestTime\");\n\tvar
          SessionId = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.SessionId\");\n\tvar
          MWRequestTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWRequestTime\");\n\tvar
          MWResponseTime = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.MWResponseTime\");\n\tvar
          status = \"\"+apim.getvariable(\"message.body.\"+cfg.responseName+\".Header.ResponseStatus.Status\");\n\t\n\n
          \   apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');\n
          \   apim.setvariable('message.headers.Channel-Id',ChannelId,'add');\n    if
          (RequestTime !== 'undefined')\n\t    apim.setvariable('message.headers.RequestTime',RequestTime,'add');\n\tif
          (SessionId !== 'undefined')\n        apim.setvariable('message.headers.X-Request-Id',SessionId,'add');\n
          \    if (MWRequestTime !== 'undefined')\n        apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');\n
          \   if (MWResponseTime !== 'undefined')\n        apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');\n\n
          \   \n    apim.setvariable('message.headers.Response-Status',status,'add');\n
          \   "
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    description: ""
                    type: object
                    properties:
                      LaborOfficeId:
                        type: string
                        name: LaborOfficeId
                      NicVisaDate:
                        type: string
                        name: NicVisaDate
                      NicVisaNumber:
                        type: string
                        name: NicVisaNumber
                      RequestYear:
                        type: string
                        name: RequestYear
                      RequestSequence:
                        type: string
                        name: RequestSequence
                      VisaList:
                        type: object
                        properties:
                          Visa:
                            type: object
                            properties:
                              BorderNumber:
                                type: string
                                name: BorderNumber
                              Job:
                                type: string
                                name: Job
                              Nationality:
                                type: string
                                name: Nationality
                              Religion:
                                type: string
                                name: Religion
                              Gender:
                                type: string
                                name: Gender
                              Origin:
                                type: string
                                name: Origin
                            name: Visa
                        name: VisaList
                  variable: message.body
                  content: application/json
              outputs:
                output:
                  schema:
                    $ref: '#/definitions/ResponseModel'
                  variable: message.body
                  content: application/json
              actions:
              - set: output.laborOfficeId
                from: .LaborOfficeId
              - set: output.requestSequence
                from: .RequestSequence
              - set: output.requestYear
                from: .RequestYear
              - set: output.nICVisaDate
                from: .NicVisaDate
              - set: output.nICVisaNumber
                from: .NicVisaNumber
              - create: output.visaList
                foreach: .VisaList.Visa.BorderNumber
                from: .VisaList.Visa.BorderNumber
                actions:
                - set: borderNumber
                  from: $item
              - create: output.visaList
                foreach: .VisaList.Visa.Job
                from: .VisaList.Visa.Job
                actions:
                - set: job
                  from: $item
              - create: output.visaList
                foreach: .VisaList.Visa.Nationality
                from: .VisaList.Visa.Nationality
                actions:
                - set: nationality
                  from: $item
              - create: output.visaList
                foreach: .VisaList.Visa.Religion
                from: .VisaList.Visa.Religion
                actions:
                - set: religion
                  from: $item
              - create: output.visaList
                foreach: .VisaList.Visa.Gender
                from: .VisaList.Visa.Gender
                actions:
                - set: gender
                  from: $item
              - create: output.visaList
                foreach: .VisaList.Visa.Origin
                from: .VisaList.Visa.Origin
                actions:
                - set: origin
                  from: $item
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                inlineNamespaces: false
                namespaceInheritance: false
                includeEmptyXMLElements: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad Request','Invalid
                request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
    catch: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    error-content: header
    success-content: activity
  application-authentication:
    certificate: false
parameters:
  X-IBM-Client-Id:
    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
definitions:
  RequestModel:
    type: object
    description: This is the request object for the post operation
    properties:
      visaRequest:
        $ref: '#/definitions/visaRequestModel'
  visaRequestModel:
    type: object
    properties:
      laborOfficeId:
        type: integer
      sequenceNumber:
        type: integer
        format: int64
      requesterIdNo:
        type: integer
      unifiedNationalNumber:
        type: integer
        format: int64
      requestYear:
        type: integer
      requestSequence:
        type: integer
      visaDetails:
        type: array
        items:
          $ref: '#/definitions/visaDetailsRequestModel'
  visaDetailsRequestModel:
    type: object
    properties:
      job:
        type: integer
      nationality:
        type: integer
      religion:
        type: integer
      gender:
        type: integer
      origin:
        type: integer
      numberOfVisas:
        type: integer
  ResponseModel:
    type: object
    description: This response object returned by the post operation
    properties:
      laborOfficeId:
        type: integer
      requestYear:
        $ref: '#/definitions/HijriDateModel'
      requestSequence:
        type: integer
      nICVisaDate:
        $ref: '#/definitions/HijriDateModel'
      nICVisaNumber:
        type: integer
        format: int64
      visaList:
        type: array
        items:
          $ref: '#/definitions/visaModel'
  visaModel:
    type: object
    properties:
      borderNumber:
        type: integer
        format: int64
      job:
        type: integer
      nationality:
        type: integer
      religion:
        type: integer
      gender:
        type: integer
      origin:
        type: integer
  NameCodeModel:
    type: object
    description: 'This object will be used across the model '
    properties:
      code:
        type: string
        example: "1"
      name:
        type: string
        example: name
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for gregorian dates only
    example: 31/12/2017
  HijriDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri dates only
    example: 1439/12/25
  HijriGregorianDateModel:
    type: object
    description: This date object will be used across the model with format yyyy-MM-dd
      for hijri and gregorian
    properties:
      hijriDate:
        $ref: '#/definitions/HijriDateModel'
      gregorianDate:
        $ref: '#/definitions/GregorianDateModel'
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  ServerErrorModel:
    type: object
    required:
    - httpCode
    - httpMessage
    - moreInformation
    properties:
      httpCode:
        type: string
        example: "401"
      httpMessage:
        type: string
        example: Unauthorized
      moreInformation:
        type: string
        example: Cannot pass the security checks that are required by the target API
          or operation
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
