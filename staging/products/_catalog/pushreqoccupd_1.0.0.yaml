  pushReqOccUpdRq_BodyType:
    type: object
    required:
    - programType
    - activeInactive
    properties:
      occupationCode:
        type: integer
      countryId:
        type: integer
      programType:
        type: integer
        enum:
        - 1
        - 2
      activeInactive:
        type: integer
        enum:
        - 1
        - 0
  pushReqOccUpdRs_BodyType:
    type: object
    required:
    - message
    properties:
      message:
        type: string
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
responses:
