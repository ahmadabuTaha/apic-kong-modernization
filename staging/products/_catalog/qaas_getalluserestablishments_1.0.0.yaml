  pageSize:
    in: query
    name: pageSize
    description: pageSize
    required: true
    type: integer
  orderDirection:
    in: query
    name: orderDirection
    description: orderDirection
    required: false
    type: string
  searchTerm:
    in: query
    name: searchTerm
    description: searchTerm
    required: false
    type: string
  diplayOnlyDisabled:
    in: query
    name: diplayOnlyDisabled
    description: diplayOnlyDisabled
    required: false
    type: boolean
