swagger: "2.0"
info:
  title: QAAS_GetAllUserEstablishments
  description: This service takes in a user id as input and returns all the establishments
    which the user is subscribed to, is a unified owner of, or a manger in.
  x-ibm-name: qaas_getalluserestablishments
  version: 1.0.0
schemes:
- https
basePath: /external/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
