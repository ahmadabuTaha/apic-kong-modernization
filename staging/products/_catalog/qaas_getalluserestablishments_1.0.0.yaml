x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        inputs:
          idNumber:
            schema:
              type: integer
              format: int32
            variable: request.parameters.idNumber
          serviceProviderId:
            schema:
              type: string
            variable: request.parameters.serviceProviderId
          orderDirection:
            schema:
              type: string
            variable: request.parameters.orderDirection
          searchTerm:
            schema:
              type: string
            variable: request.parameters.searchTerm
          pageSize:
            schema:
              type: integer
              format: int32
            variable: request.parameters.pageSize
          pageIndex:
            schema:
              type: integer
              format: int32
            variable: request.parameters.pageIndex
          diplayOnlyDisabled:
            schema:
              type: boolean
            variable: request.parameters.diplayOnlyDisabled
        outputs:
          output:
            schema:
              type: object
              properties:
                idNumber:
                  type: number
                serviceProviderId:
                  type: string
                orderDirection:
                  type: string
                searchTerm:
                  type: string
                pageSize:
                  type: number
                pageIndex:
                  type: number
                diplayOnlyDisabled:
                  type: boolean
            variable: message.body
        actions:
        - set: output.idNumber
          from: idNumber
        - set: output.serviceProviderId
          from: serviceProviderId
        - set: output.orderDirection
          from: orderDirection
        - set: output.searchTerm
          from: searchTerm
        - set: output.pageSize
          from: pageSize
        - set: output.pageIndex
          from: pageIndex
        - set: output.diplayOnlyDisabled
          from: diplayOnlyDisabled
        version: 2.1.0
        title: map
        options:
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapEnablePostProcessingJSON: false
          mapReferenceLimit: 1
    - gatewayscript:
        version: 2.0.0
        title: Service_Config
        source: "var apim = require('apim');\r\nvar cfg={\r\n    \"serviceCode\" :
          \"GICD0001\",\r\n    \"channelId\" : \"Qiwa\",\r\n    \"requestName\" :
          \"qaasGetAllUserEstRq\",\r\n    \"responseName\": \"qaasGetAllUserEstRs\",\r\n
          \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
          Request\"}\r\n    }\r\n    \r\n};\r\napim.setvariable('cfg',cfg);"
    - gatewayscript:
        version: 2.0.0
        title: Prepare_Request
        source: "var apim = require('apim');\r\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg = apim.getvariable('cfg');\r\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\r\nvar appname
          = apim.getvariable('client.app.name');\r\n\r\nvar appcReq = {\r\n    [cfg.requestName]:{\r\n
          \       \"Header\" : {\r\n            \"TransactionId\" : millisecondsvalue,\r\n
          \           \"ChannelId\": cfg.channelId,\r\n            \"SessionId\":
          apim.getvariable('message.headers.X-Request-Id'),\r\n            \"RequestTime\"
          : formatDate(dt),\r\n            \"ServiceCode\": cfg.serviceCode,\r\n            \"DebugFlag\":
          \"1\",\r\n            \"UserInfo\": {\r\n                \"UserId\": apim.getvariable('message.headers.UserId'),\r\n
          \               \"IDNumber\": apim.getvariable('message.headers.IDNumber')\t\t\t\t\r\n
          \           },\r\n            \"UDF\": {\r\n                \"KeyValueArr\":
          [\r\n                    {\r\n                        \"key\": \"Product\",\r\n
          \                       \"value\": \"QiwaAsService\"\r\n                    },\r\n
          \                   {\r\n                        \"key\": \"Client\",\r\n
          \                       \"value\": appname\r\n                    }\r\n
          \               ]\r\n            }\t\t\t\r\n        },\r\n        \"Body\"
          : apim.getvariable('message.body')\r\n            \r\n    }\r\n};\r\n\r\nif
          (typeof OperatorId !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo
          = {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
          formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
          \   //get the day\r\n    //convert day to string\r\n    var day = d.getDate().toString();\r\n
          \   //get the year\r\n    var year = d.getFullYear();\r\n    var hour =
          d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
          \   var second = d.getSeconds().toString();\r\n    var millisecond = d.getMilliseconds().toString();\r\n
          \   //pull the last two digits of the year\r\n    year = year.toString();\r\n
          \   \r\n    //increment month by 1 since it is 0 indexed\r\n    //converts
          month to a string\r\n    month = (month + 1).toString();\r\n\r\n    //if
          month is 1-9 pad right with a 0 for two digits\r\n    if (month.length ===
          1)\r\n        month = \"0\" + month;\r\n\r\n    //if day is between 1-9
          pad right with a 0 for two digits\r\n    if (day.length === 1)\r\n        day
          = \"0\" + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\"
          + hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
          + minitue;\r\n\r\n    if (second.length === 1)\r\n        second = \"0\"
          + second;\r\n        \r\n    if (millisecond.length == 1)\r\n        millisecond
          = \"00\" + millisecond;\r\n        \r\n    if (millisecond.length == 2)\r\n
          \       millisecond = \"0\" + millisecond;\r\n    \r\n    \r\n\r\n    //return
          the string \"MMddyy\"\r\n    return year+\"-\"+month+\"-\"+day+\" \"+hour
          + \":\" + minitue + \":\" + second+\".\"+millisecond;\r\n}"
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(ace-tip-qiwaasas)/external/qaasgetalluserest
        follow-redirects: false
        inject-proxy-headers: true
    - gatewayscript:
        version: 2.0.0
        title: Set_Headers
        source: |-
          var apim = require('apim');
          apim.output('application/json');
          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;
          var code = Header.ResponseStatus.Code;
          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
          apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
          apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');
          apim.setvariable('message.headers.Response-Status',status,'add');
          apim.setvariable('message.headers.Response-Code',code,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (($header("Response-Status") = 'SUCCESS'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Response
              source: "var apim = require('apim');\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');\r\nvar body = message[cfg.responseName].Body;\r\n\r\nsession.output.write(body);\r\napim.output('application/json');"
          - map:
              inputs:
                input:
                  schema:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                      email:
                        type: string
                      establishmentInfo:
                        type: array
                        items:
                          type: object
                          properties:
                            establishmentName:
                              type: string
                            nationalUnifiedNumber:
                              type: string
                            establishmentId:
                              type: integer
                            isEnabled:
                              type: boolean
                            OTPSessionStatusCode:
                              type: number
                            ServiceProviderId:
                              type: string
                      TotalRecordCount:
                        type: number
                  variable: message.body
              outputs:
                output:
                  schema:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                      email:
                        type: string
                      establishmentInfo:
                        type: array
                        items:
                          type: object
                          properties:
                            establishmentName:
                              type: string
                            nationalUnifiedNumber:
                              type: string
                            establishmentId:
                              type: integer
                            isEnabled:
                              type: boolean
                            OTPSessionStatusCode:
                              type: number
                            ServiceProviderId:
                              type: string
                      TotalRecordCount:
                        type: number
                  variable: message.body
              actions:
              - set: output.phoneNumber
                from: input.phoneNumber
              - set: output.email
                from: input.email
              - create: output.establishmentInfo
                foreach: input.establishmentInfo
                from: input.establishmentInfo
                actions:
                - set: establishmentName
                  from: establishmentName
                - set: nationalUnifiedNumber
                  from: nationalUnifiedNumber
                - set: establishmentId
                  from: establishmentId
                - set: isEnabled
                  from: isEnabled
              - set: output.TotalRecordCount
                from: input.TotalRecordCount
              version: 2.1.0
              title: map
              options:
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapEnablePostProcessingJSON: false
                mapReferenceLimit: 1
                mapNullValue: true
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Error
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');          \r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 409;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\nsession.output.write(error);\r\napim.output('application/json');"
    finally: []
  properties:
    target-url:
      value: http://example.com/operation-name
      description: The URL of the target service
      encoded: false
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
