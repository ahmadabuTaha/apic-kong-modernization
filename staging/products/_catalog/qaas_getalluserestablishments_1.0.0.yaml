    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/idNumber'
    - $ref: '#/parameters/serviceProviderId'
    - $ref: '#/parameters/pageSize'
    - $ref: '#/parameters/pageIndex'
    - $ref: '#/parameters/orderDirection'
    - $ref: '#/parameters/searchTerm'
    - $ref: '#/parameters/diplayOnlyDisabled'
    get:
      tags:
      - qaas
      description: This service takes in a user id as input and returns all the establishments
        which the user is subscribed to, is a unified owner of, or a manger in.
      operationId: getAllUserEstablishments
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object is returned by the get operation
    properties:
      phoneNumber:
        type: string
        example: 966123456733
      email:
        type: string
        example: test1@test.net
      establishmentInfo:
        type: array
        items:
          $ref: '#/definitions/data_Type'
      totalRecordCount:
        type: integer
        example: 100
  data_Type:
    type: object
    properties:
      establishmentName:
        type: string
        example: شركة عالم الأثاث الزاهر للتجارة شركة الشخص الواحد
      nationalUnifiedNumber:
        type: integer
        example: 7011050957
      establishmentId:
        type: string
        example: 2-316363
      isEnabled:
        type: boolean
        example: true
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
