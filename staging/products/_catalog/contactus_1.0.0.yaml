    - parse:
        version: 2.0.0
        title: parse
        parse-settings-reference:
          default: apic-default-parsesettings
    - validate:
        version: 2.0.0
        title: validate
        input: message
        validate-against: definition
        definition: '#/definitions/ContactUsRq'
    - gatewayscript:
        version: 2.0.0
        title: gatewayscript
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg={\n    \"serviceCode\"
          : \"DPCU0001\",\n    \"channelId\" : \"Qiwa\",\n    \"requestName\" : \"ContactUsRq\",\n
          \   \"responseName\": \"ContactUsRes\",\n    \"errorMap\" :{\n        \"ESBSCHEMA\"
          : {\"code\" :400, \"msg\":\"Invalid Request\"\n            \n        }\n
          \   }\n    \n};\n\nvar appcReq = {\n    [cfg.requestName]:{\n        \"Header\"
          : {\n            \"TransactionId\" : millisecondsvalue,\n            \"ChannelId\":
          cfg.channelId,\n            \"RequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode,\n     \n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(ace-prow-dataportalservices)/external/ContactUs
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
    - parse:
        version: 2.0.0
        title: parse
        parse-settings-reference:
          default: apic-default-parsesettings
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: (message.status.code = 201)
          execute:
          - map:
              version: 2.0.0
              title: map
              inputs:
                input:
                  schema:
                    description: ""
                    type: object
                    properties:
                      ContactUsRes:
                        type: object
                        properties:
                          Header:
                            type: object
                            properties:
                              TransactionId:
                                type: string
                                name: TransactionId
                              ChannelId:
                                type: string
                                name: ChannelId
                              RequestTime:
                                type: string
                                name: RequestTime
                              MWResponseTime:
                                type: string
                                name: MWResponseTime
                              ServiceCode:
                                type: string
                                name: ServiceCode
                              ResponseStatus:
                                type: object
                                properties:
                                  Status:
                                    type: string
                                    name: Status
                                  Code:
                                    type: string
                                    name: Code
                                  ArabicMsg:
                                    type: string
                                    name: ArabicMsg
                                  EnglishMsg:
                                    type: string
                                    name: EnglishMsg
                                name: ResponseStatus
                            name: Header
                        name: ContactUsRes
                    example: |-
                      {"ContactUsRes": {"Header": {
                         "TransactionId": "1669223602034",
                         "ChannelId": "Qiwa",
                         "RequestTime": "2022-11-23 17:13:22.034",
                         "MWResponseTime": "2022-11-23 17:13:22.119",
                         "ServiceCode": "DPCU0001",
                         "ResponseStatus":    {
                            "Status": "ERROR",
                            "Code": "",
                            "ArabicMsg": "خطأ غير معرف",
                            "EnglishMsg": "Runtime Technical Error"
                         }
                      }}}
                  variable: message.body
                  content: application/json
              outputs:
                output:
                  schema:
                    description: ""
                    type: object
                    properties:
                      TransactionId:
                        type: string
                        name: TransactionId
                      RequestTime:
                        type: string
                        name: RequestTime
                      MWResponseTime:
                        type: string
                        name: MWResponseTime
                      ServiceCode:
                        type: string
