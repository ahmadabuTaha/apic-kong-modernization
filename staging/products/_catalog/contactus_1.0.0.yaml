definitions:
  ContactUsRq:
    type: object
    additionalProperties: false
    properties:
      request:
        type: object
        properties:
          FullName:
            type: string
          Email:
            type: string
          CompanyName:
            type: string
          UserRequestText:
            type: string
        required:
        - Email
        - FullName
    required:
    - request
  HeaderType:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      ResponseStatus:
        $ref: '#/definitions/ResponseStatusType'
      BackendError:
        $ref: '#/definitions/BackendErrorType'
  ResponseStatusType:
    type: object
    properties:
      Status:
        type: string
      Code:
        type: string
      ArabicMsg:
        type: string
      EnglishMsg:
        type: string
  BackendErrorType:
    type: object
    properties:
      ErrorCode:
        type: string
      ErrorDescription:
        type: string
  NameValuePair:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
      item:
