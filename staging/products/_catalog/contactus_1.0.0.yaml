  NameValuePairType:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
      item:
        $ref: '#/definitions/NameValuePair'
  ContactUsResponse:
    type: object
    properties:
      Header:
        $ref: '#/definitions/HeaderType'
paths:
  /contactus:
    post:
      operationId: postcontactus
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ContactUsResponse'
      consumes:
      - application/json
      produces:
      - application/json
      description: Insert a contactus
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/ContactUsRq'
        description: The request body for the operation
        required: true
