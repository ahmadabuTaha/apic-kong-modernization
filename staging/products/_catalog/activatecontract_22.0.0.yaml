      value: http://datapower.qiwa.info:9076/MusandService/MusanedService.svc
      description: URL of the proxy policy
      encoded: false
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: 'ActivateContract: input'
        inputs:
          input:
            schema:
              type: object
              properties:
                ContractId:
                  type: integer
                  format: int32
                  name: ContractId
            variable: request.body
            content: application/json
        outputs:
          body:
            schema:
              $ref: '#/x-ibm-configuration/targets/MusanedService/definitions/ActivateContractInput'
            variable: message.body
            content: application/xml
          content-type:
            schema:
              type: string
            variable: message.headers.content-type
          SOAPAction:
            schema:
              type: string
            variable: message.headers.SOAPAction
        actions:
        - set: content-type
          default: text/xml
        - set: SOAPAction
          default: http://tempuri.org/IMusanedService/ActivateContract
        - set: body.Envelope.Body.G2gActivateContractRequestMessage.ContractId
          from: input.ContractId
    - invoke:
        version: 2.0.0
        title: 'ActivateContract: invoke'
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: blocklist
          values: []
        timeout: 60
        verb: POST
        chunked-uploads: true
        persistent-connection: true
        target-url: $(dp-musanedservices)/MusandService/MusanedService.svc
        cache-response: protocol
        cache-ttl: 900
        output: ActivateContractOut
        stop-on-error:
        - SOAPError
        - OperationError
    - map:
        version: 2.0.0
        title: 'ActivateContract: output'
        inputs:
          input:
            schema:
              $ref: '#/x-ibm-configuration/targets/MusanedService/definitions/ActivateContractOutput'
            variable: ActivateContractOut.body
            content: application/xml
        outputs:
          output:
            schema:
              type: object
              properties:
                IsSucceeded:
                  type: boolean
                  name: IsSucceeded
                ResponseCode:
                  type: string
                  name: ResponseCode
                ResponseMessage:
                  type: string
                  name: ResponseMessage
                  x-nullable: true
            variable: message.body
        actions:
        - set: output.IsSucceeded
          from: input.Envelope.Body.G2gActivateContractResponseMessage.IsContractActivated
        - set: output.ResponseCode
          from: input.Envelope.Header.ResponseResult.ResponseCode
        - set: output.ResponseMessage
          from: input.Envelope.Header.ResponseResult.ResponseMessage
          value: |-
            var res = "";
            if($(input.Envelope.Body.G2gActivateContractResponseMessage.IsContractActivated))
            {res = "Success";}
            else
            {res = $(input.Envelope.Header.ResponseResult.ResponseMessage);}
            res
        options:
          mapEnablePostProcessingJSON: false
          mapEmulateV4EmptyJSONObject: false
          mapEmulateV4DefaultRequiredProps: false
          mapReferenceLimit: 1
          mapXMLEmptyElement: "null"
    catch:
    - errors:
      - RuntimeError
      - SOAPError
      - OperationError
      execute:
      - gatewayscript:
          version: 2.0.0
          title: gatewayscript
          source: |-
            var apim = require('apim');
            apim.setvariable("message.status.reason","Internal Server Error")
            var resmsg ={
                    "IsSucceeded": false,
                    "ResponseCode": 500,
                    "ResponseMessage": "MOFA service Error - Internal Error"
            }
            apim.setvariable('message.body', resmsg);
            apim.setvariable("message.status.code",500)
            apim.output('application/json');
