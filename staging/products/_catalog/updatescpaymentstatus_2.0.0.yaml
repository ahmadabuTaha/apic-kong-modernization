swagger: "2.0"
info:
  title: UpdateSCPaymentStatus
  description: This API Updates the payment status of the salary certificate created.
  x-ibm-name: updatescpaymentstatus
  version: 2.0.0
schemes:
- https
basePath: /qiwa/v3
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /salary-certificates/{certificateId}/payment:
    patch:
      tags:
      - UpdateSCPaymentStatus
      description: This API Updates the payment status of the salary certificate created.
      operationId: UpdateSCPaymentStatus
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/UpdateSCPaymentStatusRs_MessageType'
      parameters:
      - name: requestBody
        in: body
        schema:
          $ref: '#/definitions/UpdateSCPaymentStatusRq_MessageType'
      - name: certificateId
        in: path
        required: true
        type: string
definitions:
  UpdateSCPaymentStatusRq_MessageType:
    type: object
    properties:
      UpdateSCPaymentStatusRq:
        $ref: '#/definitions/UpdateSCPaymentStatusRq_Type'
  UpdateSCPaymentStatusRs_MessageType:
    type: object
    properties:
      UpdateSCPaymentStatusRs:
        $ref: '#/definitions/UpdateSCPaymentStatusRs_Type'
  UpdateSCPaymentStatusRq_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLRequestHeader_Type'
      Body:
        $ref: '#/definitions/UpdateSCPaymentStatusRq_BodyType'
  UpdateSCPaymentStatusRq_BodyType:
    type: object
    properties:
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      LaborerIdNo:
        type: integer
      CertificateId:
        type: string
      PaymentStatus:
        type: string
        enum:
        - SUCCESS
        - FAILED
        - CANCELED
        - EXPIRED
        - PENDING
      PaymentReferenceNumber:
        type: string
      PaymentTransactionId:
        type: string
      InvoiceId:
        type: string
    required:
    - LaborOfficeId
    - SequenceNumber
    - LaborerIdNo
    - CertificateId
    - PaymentStatus
  UpdateSCPaymentStatusRs_Type:
    type: object
    properties:
      Header:
        $ref: '#/definitions/ESBXMLResponseHeader_Type'
      Body:
        $ref: '#/definitions/UpdateSCPaymentStatusRs_BodyType'
  UpdateSCPaymentStatusRs_BodyType: {}
  ESBXMLRequestHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
    required:
    - ServiceCode
    - ChannelId
    - TransactionId
    - RequestTime
  ESBXMLResponseHeader_Type:
    type: object
    properties:
      TransactionId:
        type: string
      ChannelId:
        type: string
      SessionId:
        type: string
      RequestTime:
        type: string
      MWRequestTime:
        type: string
      MWResponseTime:
        type: string
      ServiceCode:
        type: string
      DebugFlag:
        type: integer
      UserInfo:
        $ref: '#/definitions/UserInfo_Type'
      UDF:
        $ref: '#/definitions/UDF_Type'
      ResponseStatus:
        $ref: '#/definitions/MWResponseStatus_Type'
      BackendError:
        $ref: '#/definitions/BackendError_Type'
