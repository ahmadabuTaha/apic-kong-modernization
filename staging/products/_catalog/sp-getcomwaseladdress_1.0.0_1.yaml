      districtAreaEn:
        type: string
      streetNameAr:
        type: string
      streetNameEn:
        type: string
      cityAr:
        type: string
      cityEn:
        type: string
      longitude:
        type: string
      latitude:
        type: string
      fullName:
        type: string
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      waselAddress:
        type: array
        items:
          $ref: '#/definitions/WaselAddressModel'
    required:
    - waselAddress
  WaselAddressModel:
    type: object
    properties:
      buildingNo:
        type: string
        example: "3661"
      additionalNo:
        type: string
        example: "6768"
      zipCode:
        $ref: '#/definitions/IntegerNumberModel'
      unitNo:
        $ref: '#/definitions/IntegerNumberModel'
      districtArea:
        $ref: '#/definitions/LocaleDataModel'
      streetName:
        $ref: '#/definitions/LocaleDataModel'
      city:
        $ref: '#/definitions/LocaleDataModel'
    required:
