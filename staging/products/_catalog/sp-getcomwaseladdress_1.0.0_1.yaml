swagger: "2.0"
info:
  title: SP_GetComWaselAddress
  x-ibm-name: sp-getcomwaseladdress
  version: 1.0.0
  description: This API exposes NIC to validate runaway request service from Qiwa
    platform
schemes:
- https
basePath: /sp/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
