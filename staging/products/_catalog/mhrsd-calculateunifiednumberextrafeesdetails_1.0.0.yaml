        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
definitions:
  ResponseModel:
    type: object
    description: This response object returned by the post operation
    properties:
      averageSaudis:
        type: integer
        example: 10
      dueExtraFeesUnits:
        type: integer
        example: 5
      dueReducedExtraFeesUnits:
        type: integer
        example: 6
      exemptedForeigners:
        type: integer
        example: 49
      extraFeesCalculationForeigners:
        type: number
        example: 51
      extraFeesCalculationSaudis:
        type: number
        example: 32
      foreignerLaborersCount:
        type: integer
        example: 18
      paidExtraFeesUnits:
        type: integer
        example: 13
      paidReducedExtraFeesUnits:
        type: integer
        example: 14
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
