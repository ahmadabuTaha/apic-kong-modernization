swagger: "2.0"
info:
  title: MHRSD-CalculateUnifiedNumberExtrafeesDetails
  description: This API exposes  is used by the consumer to calculate unified number
    extra fees details in HRSD from External platform
  x-ibm-name: mhrsd-calculateunifiednumberextrafeesdetails
  version: 1.0.0
schemes:
- https
basePath: /mhrsd/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /labor-office/{laborOfficeId}/seq-no/{sequenceNumber}/unified-number/fee-details:
