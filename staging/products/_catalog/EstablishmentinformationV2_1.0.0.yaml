- name: Establishment
  description: Establishment APIs
paths:
  /establishment/information:
    get:
      tags:
      - Establishment
      summary: Get Comprehensive Establishment Data
      description: Retrieves all detailed information for a specific establishment,
        including status, address, and account details.
      operationId: getAllEstablishmentsData_1
      parameters:
      - name: laborOfficeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: establishmentSequenceNumber
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: establishmentId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: entityNumber
        in: query
        required: false
        schema:
          type: string
      - name: noteStatusId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: TransactionId
        in: header
        description: |
          **Unique id for tracing purposes.**
        required: true
        schema:
          type: string
      - name: ChannelId
        in: header
        description: |
          **Define the request made from any channel, such as Qiwa, ESB etc...**
        schema:
          type: string
      - name: SessionId
        in: header
        description: |
          **Unique Id for Auditing and Logginggit purposes.**
        schema:
          type: string
      - name: ServiceCode
        in: header
        description: |
          **Represents the requested service code.**
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QiwaResponseEstablishmentDetailsResponse'
        "400":
          description: Bad Request - Validation or logic error
          content:
            application/json:
              examples:
                Invalid Parameters:
                  description: Invalid Parameters
                  value:
                    status: -1
                    errorCode: E0000042
                    englishMessage: Invalid / missing parameters from the request
                      message.
                    arabicMessage: معايير الطلب ناقصة أو غير صحيحة
                Schema Validation Error:
                  description: Schema Validation Error
                  value:
                    status: -1
                    errorCode: ESBSCHEMA
                    englishMessage: Schema Validation Error
                    arabicMessage: حدث خطأ بالنظام
        "401":
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              examples:
                Unauthorized:
                  description: Unauthorized
                  value:
                    httpCode: "401"
                    httpMessage: Unauthorized
        "500":
          description: Internal Server Error
          content:
            application/json:
              examples:
                System Error:
                  description: System Error
                  value:
                    status: -1
                    errorCode: E0000436
                    englishMessage: Sorry, something went wrong, please try again.
                    arabicMessage: عفواً, حدث خطأ ما , يرجى المحاولة من جديد
