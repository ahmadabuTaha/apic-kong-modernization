swagger: "2.0"
info:
  title: Zendesk UpdateTicketByTicketNumber
  x-ibm-name: zendesk-updateticketbyticketnumber
  version: 1.0.0
schemes:
- https
basePath: /qiwa/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientID: []
  clientSecret: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: ""
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        version: 2.2.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values: []
        parameter-control:
          type: allowlist
          values: []
        timeout: 60
        verb: PUT
        chunked-uploads: true
        persistent-connection: true
        http-version: HTTP/1.1
        cache-response: protocol
        stop-on-error: []
        websocket-upgrade: false
        target-url: $(ace-zen-zendesk)/zendesk/ticketing/v1/updateticket
        cache-ttl: 60
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.header.content-type
            value: application/json
            type: string
          - set: message.body
            value: '{     "ErrorCode": "500",     "Description": "Internal Server
              Error" }'
            type: string
    finally: []
  properties: {}
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    success-content: payload
    error-content: header
    enabled: true
  buffering: true
paths:
  /updateticket:
    put:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
    parameters:
    - name: ticketnumber
      in: query
      required: true
      type: string
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
