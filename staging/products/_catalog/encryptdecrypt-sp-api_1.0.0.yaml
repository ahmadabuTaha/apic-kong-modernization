swagger: "2.0"
info:
  title: EncryptDecrypt SP API
  x-ibm-name: encryptdecrypt-sp-api
  version: 1.0.0
schemes:
- https
basePath: /encryptdecrypt
security:
- {}
securityDefinitions:
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  properties:
    target-url:
      value: http://icp-proxy.qiwa.info:32599/encryptdecrypt/sp
      description: URL of the proxy policy
      encoded: false
  cors:
    enabled: true
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  assembly:
    execute:
    - invoke:
        title: invoke
        version: 2.0.0
        verb: keep
        target-url: $(target-url)
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
  application-authentication:
    certificate: false
paths:
  /sp:
    post:
      responses:
        "200":
          description: success
          schema:
            type: string
      consumes: []
      produces: []
