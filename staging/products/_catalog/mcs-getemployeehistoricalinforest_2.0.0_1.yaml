                :\"Integer\",\r\n        \"pageOffSet\" :\"Integer\",\r\n        \"organizationId\"
                :\"Integer\",\r\n        \"fromDate\" :\"Integer\",\r\n        \"toDate\"
                :\"Integer\",\r\n        \"jobGradeCode\" :\"Integer\",\r\n        \"jobChainCode\"
                :\"Integer\",\r\n        \"jobTitleCode\" :\"Integer\"\r\n}"
