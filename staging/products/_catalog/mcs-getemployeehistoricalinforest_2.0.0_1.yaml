            variable: request.parameters.toDate
          jobGradeCode:
            schema:
              type: string
            variable: request.parameters.jobGradeCode
          jobChainCode:
            schema:
              type: string
            variable: request.parameters.jobChainCode
          jobTitleCode:
            schema:
              type: string
            variable: request.parameters.jobTitleCode
        outputs:
          "":
            schema:
              description: ""
              type: object
              properties:
                personID:
                  type: string
                  name: personID
                pageSize:
                  type: string
                  name: pageSize
                pageOffSet:
                  type: string
                  name: pageOffSet
                organizationId:
                  type: string
                  name: organizationId
                fromDate:
                  type: string
                  name: fromDate
                toDate:
                  type: string
                  name: toDate
                jobGradeCode:
                  type: string
                  name: jobGradeCode
                jobChainCode:
                  type: string
                  name: jobChainCode
                jobTitleCode:
                  type: string
                  name: jobTitleCode
