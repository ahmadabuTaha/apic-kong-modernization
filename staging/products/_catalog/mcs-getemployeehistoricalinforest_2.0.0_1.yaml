swagger: "2.0"
info:
  title: MCS_GetEmployeeHistoricalInfoRest
  x-ibm-name: mcs-getemployeehistoricalinforest
  version: 2.0.0
  description: This API exposes MCI to get Employee Historical Information services
    from Qiwa platform
schemes:
- https
basePath: /mcs/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - map:
        version: 2.0.0
        title: map
        inputs:
          personID:
            schema:
              type: string
            variable: request.parameters.personID
          pageSize:
            schema:
              type: string
            variable: request.parameters.pageSize
          pageOffSet:
            schema:
              type: string
            variable: request.parameters.pageOffSet
          organizationId:
            schema:
