swagger: "2.0"
info:
  title: NIC_PRTIssueSpecialPermit
  description: This API exposes nic  service is used to prt issue special permit from
    External platform
  x-ibm-name: nic-prtissuespecialpermit
  version: 1.0.0
schemes:
- https
basePath: /nic/v1
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
paths:
  /special-permit:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    post:
      tags:
      - Special Permit
      description: Service to PRT Issue Special Permit
      operationId: addSpecialPermit
      parameters:
      - name: body
        in: body
        schema:
          $ref: '#/definitions/RequestModel'
        description: prt issue special permit request body
        required: true
      produces:
      - application/json
      responses:
        "201":
          $ref: '#/responses/Response201'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
  /special-permit/{permitNo}:
    parameters:
    - $ref: '#/parameters/X-IBM-Client-Id'
    - $ref: '#/parameters/X-IBM-Client-Secret'
    - $ref: '#/parameters/permitNo'
    get:
      tags:
      - Special Permit
      description: Service to PRT Issue Special Permit
      operationId: getSpecialPermit
      produces:
      - application/json
      responses:
        "200":
          $ref: '#/responses/Response200'
        "400":
          $ref: '#/responses/Response400'
        "401":
          $ref: '#/responses/Response401'
        "403":
          $ref: '#/responses/Response403'
        "404":
          $ref: '#/responses/Response404'
        "408":
          $ref: '#/responses/Response408'
        "409":
          $ref: '#/responses/Response409'
        "429":
          $ref: '#/responses/Response429'
        "500":
          $ref: '#/responses/Response500'
        "501":
          $ref: '#/responses/Response501'
        "503":
          $ref: '#/responses/Response503'
        "510":
          $ref: '#/responses/Response510'
    delete:
      tags:
      - Special Permit
      description: Service to PRT Delete Special Permit
      operationId: deleteSpecialPermit
      parameters:
      - $ref: '#/parameters/personId'
      produces:
