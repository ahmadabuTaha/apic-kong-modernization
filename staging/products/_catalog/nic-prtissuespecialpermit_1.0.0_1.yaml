    in: header
    name: X-IBM-Client-Id
    description: Client id issued by security server
    required: true
    type: string
  X-IBM-Client-Secret:
    in: header
    name: X-IBM-Client-Secret
    description: Client secret issued by security server
    required: true
    type: string
  X-Request-Id:
    in: header
    name: X-Request-Id
    description: X-Request-Id returned in the response header
    required: false
    type: string
  permitNo:
    in: path
    name: permitNo
    description: Id returned for the special permit issues
    required: true
    type: string
  personId:
    in: query
    name: personId
    description: person identification
    required: true
    type: string
