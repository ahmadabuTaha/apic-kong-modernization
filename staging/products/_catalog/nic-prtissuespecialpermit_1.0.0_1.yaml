        type: integer
        example: 0
      firmLaborOfficeId:
        type: integer
        example: 0
      firmName:
        type: string
        example: "512457800"
      firmSequenceNumber:
        type: integer
        example: 5
      mobileNo:
        type: integer
        example: 0
      nationalityCode:
        type: integer
        example: 0
      occupationCode:
        type: integer
        example: 85
      permitCreatedAt:
        type: string
        example: "512457800"
      permitDays:
        type: object
        properties:
          permisDaysLst:
            type: array
            items:
              $ref: '#/definitions/PermissionDaysListType'
      permitNo:
        type: integer
        example: 0
      permitReason:
        type: string
        example: ""
      permitSource:
        type: integer
        example: 85
      permitType:
        type: integer
        example: 5
      personDoB:
        type: string
        example: ""
      personID:
        type: integer
        example: 0
      plateNumber:
        type: string
        example: 0
      startingDate:
        type: string
        example: "512457800"
      startingHour:
        type: string
        example: ""
      startingLocationLatitude:
        type: integer
        example: 0
      startingLocationLongitude:
        type: integer
        example: 0
      workMovmentType:
        type: integer
        example: 0
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      permitNo:
        type: string
        example: wGhd6f3rtWDvt892
      plateNumber:
        type: integer
        example: 0
      permitSeqNo:
        type: integer
        example: 0
      permitSource:
        type: integer
        example: 8
      permitType:
        type: integer
        example: 55
      personID:
        type: integer
        example: 66
      requestTimeStamp:
        type: string
        example: 10-04-19 12:00:17
      responseMessage:
        type: string
        example: special issue permit
      responseTimeStamp:
        type: string
        example: 10-04-19 12:00:17
  EndingLocationListType:
    type: object
    properties:
      endLocationLatitude:
        type: integer
      endLocationLongitude:
        type: integer
  PermissionDaysListType:
    type: object
    properties:
      permitDay:
        type: integer
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
parameters:
