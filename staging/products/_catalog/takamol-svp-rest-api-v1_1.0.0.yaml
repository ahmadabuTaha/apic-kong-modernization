swagger: "2.0"
info:
  title: Takamol SVP - Rest API V1
  x-ibm-name: takamol-svp-rest-api-v1
  version: 1.0.0
  description: This API is provided for getting info for FE services
  contact:
    name: SVP Team
host: $(catalog.host)
schemes:
- https
basePath: /api/v1
security:
- clientID: []
  clientSecret: []
securityDefinitions:
  clientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  cors:
    enabled: true
  gateway: datapower-api-gateway
  properties: {}
  assembly:
    execute:
    - invoke:
        version: 2.0.0
        title: invoke
        backend-type: detect
        header-control:
          type: blocklist
          values:
          - ^X-IBM-Client-Id$
        parameter-control:
          type: blocklist
        timeout: 60
        verb: keep
        chunked-uploads: true
        persistent-connection: true
        target-url: $(svp-international-api)$(request.path)
        follow-redirects: false
        inject-proxy-headers: true
        username: ibm-connect-user
        password: fcxUmYI
    catch: []
  type: rest
  phase: realized
  enforced: true
  testable: true
  application-authentication:
    certificate: false
  catalogs: {}
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
parameters:
  id:
    name: id
    in: query
    type: integer
    description: Identifier of the resource (i.e. Legislator ID)
  user_id:
    name: user_id
    in: query
    type: integer
    description: Identifier of the user
  payment_id:
    name: payment_id
    in: path
    type: integer
    required: true
    description: Identifier of the payment
  loggable_id:
    name: loggable_id
    in: query
    type: integer
    description: Identifier of loggable resource
  loggable_type:
    name: loggable_type
    in: query
    type: string
    minLength: 8
    maxLength: 16
    description: Type of loggable resource
  loggable_name:
    name: loggable_name
    in: query
    type: string
    description: Name of loggable resource
  log_in_params:
    name: log_in_params
    in: body
    required: true
    schema:
      type: object
      properties:
        user:
          type: object
          properties:
            email:
              type: string
              minLength: 1
              maxLength: 255
              description: User email address
            password:
              type: string
              minLength: 1
              maxLength: 255
              description: 'Length should be 8-16 characters and include at least:
                1 uppercase, 1 lowercase, 1 digit and 1 special character'
            otp_attempt:
              type: string
              minLength: 1
              maxLength: 255
              description: two-factor authentication code
            recaptcha_response:
              type: string
              minLength: 1
              maxLength: 255
              description: The user response token provided by the reCAPTCHA client-side
                integration on your site
            fe_app:
              type: string
              description: User role name
          required:
          - email
          - password
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
      required:
      - user
  set_password_params:
    name: set_password_params
    in: body
    required: true
    schema:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 16
          description: 'Length should be 8-16 characters and include at least: 1 uppercase,
            1 lowercase, 1 digit and 1 special character'
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 16
          description: Should be exactly the same as password
        password_token:
          type: string
          description: Token generated by the system to reset existing password
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
      required:
      - password
      - password_confirmation
  reset_password_params:
    name: reset_password_params
    in: body
    required: true
    schema:
      type: object
      properties:
        email:
          type: string
          description: User email address
  change_password_params:
    name: change_password_params
    in: body
    required: true
    schema:
      type: object
      properties:
        current_password:
          type: string
          minLength: 8
          maxLength: 16
          description: 'Length should be 8-16 characters and include at least: 1 uppercase,
            1 lowercase, 1 digit and 1 special character'
        password:
          type: string
          minLength: 8
          maxLength: 16
          description: 'Length should be 8-16 characters and include at least: 1 uppercase,
            1 lowercase, 1 digit and 1 special character'
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 16
          description: Should be exactly the same as password
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
      required:
      - current_password
      - password
      - password_confirmation
  email:
    name: email
    in: query
    type: string
    minLength: 1
    maxLength: 255
    description: User email address
  locale:
    name: locale
    in: query
    type: string
    minLength: 2
    maxLength: 2
    description: Locale identifier
  page_number:
    name: page
    in: query
    type: integer
    description: Number of page
  per_page:
    name: per_page
    in: query
    type: integer
    description: Number of records per page
  name:
    name: name
    in: query
    type: string
    description: 'English name of the Resource (Usage: method::search_string. Methods:
      contains, starts_with, ends_with)'
  english_name:
    name: english_name
    in: query
    type: string
    description: 'English name of the Resource (Usage: method::search_string. Methods:
      contains, starts_with, ends_with)'
  arabic_name:
    name: arabic_name
    in: query
    type: string
    description: 'Arabic name of the Resource (Usage: method::search_string. Methods:
      contains, starts_with, ends_with)'
  test_center_name:
    name: test_center_name
    in: query
    type: string
    description: 'Arabic name of the Resource (Usage: method::search_string. Methods:
      contains, starts_with, ends_with)'
  request_date:
    name: request_date
    in: query
    type: string
    description: Request date of creation
  published:
    name: published
    in: query
    type: boolean
    minLength: 1
    description: Category status
  occupations_count:
    name: occupations_count
    in: query
    type: integer
    description: Count of Occupations related to current Category
  status:
    name: status
    in: query
    type: string
    description: Status of the resource
  address:
    name: address
    in: query
    type: string
    description: Address string
  city:
    name: city
    in: query
    type: string
    description: City name
  category_id:
    name: category_id
    in: query
    type: integer
    description: Id of the category
  country_id:
    name: country_id
    in: query
    type: integer
    description: ID of the country
  country:
    name: country
    in: query
    type: string
    description: Name of the country
  postal_code:
    name: postal_code
    in: query
    type: string
    description: Postal code
  country_code:
    name: country_code
    in: query
    type: string
    description: Country code
  phone_number:
    name: phone_number
    in: query
    type: string
    description: Phone number name
  occupation_id:
    name: occupation_id
    in: query
    type: integer
    description: Unic Id of occupation
  file:
    name: file
    in: formData
    type: file
    description: CSV file to import
  password_token:
    name: password_token
    in: query
    type: string
    minLength: 1
    maxLength: 255
    description: Token generated by the system to reset existing password
  passport_number:
    name: passport_number
    in: query
    type: string
    description: Passport number of the Labor
  exam_result:
    name: exam_result
    in: query
    type: string
    description: Result of the exam (Could be passed, pendind, failed, rejected, expired)
  exam_score:
    name: exam_score
    in: query
    type: string
    description: Score received by completing exam
  exam_date:
    name: exam_date
    in: query
    type: string
    minLength: 1
    maxLength: 10
    description: Date of exam in format yyyy-mm-dd
  test_center:
    name: test_center
    in: query
    type: string
    description: ID of the test center
  category:
    name: category
    in: query
    type: integer
    description: Id of the category
  group_id:
    name: group_id
    in: query
    type: integer
    description: Id of the group
  reset_2fa_token:
    name: reset_2fa_token
    in: query
    type: string
    minLength: 1
    maxLength: 255
    description: Token generated by the system to reset 2FA
  file_name:
    name: file_name
    in: query
    type: string
    description: Name of the uploaded file
  upload_date:
    name: upload_date
    in: query
    type: string
    description: Date when file was uploaded in format yyyy-mm-dd
  total_labors:
    name: total_labors
    in: query
    type: string
    description: Total number of labors
  passed_labors:
    name: passed_labors
    in: query
    type: string
    description: Number of labors that pass the exam
  payment_status:
    name: upload_date
    in: query
    type: string
    description: Payment status (paid, pending, canceled)
  positive_amount:
    name: positive_amount
    in: query
    type: string
    description: Show only groups with amount > 0
  owner_full_name:
    name: owner_full_name
    in: query
    type: string
    description: Test Center's owner full name
  transaction_date:
    name: transaction_date
    in: query
    type: string
    description: Transaction date
  transaction_status:
    name: transaction_status
    in: query
    type: string
    description: Transaction status
  amount:
    name: amount
    in: query
    type: integer
    description: Amount of the Transaction
  merchant_transaction_id:
    name: merchant_transaction_id
    in: query
    type: string
    description: Transaction reference number
  category_params:
    name: category_params
    in: body
    required: true
    schema:
      type: object
      properties:
        category:
          type: object
          properties:
            english_name:
              type: string
              minLength: 1
              maxLength: 255
              description: English name of the Category
              example: Electrician
            arabic_name:
              type: string
              minLength: 1
              maxLength: 255
              description: Arabic name of the Category
              example: سباكة
            published:
              type: boolean
              minLength: 1
              description: Category status
              example: "true"
            occupation_key:
              type: string
              minLength: 1
              maxLength: 255
              description: Occupation key
              example: "123"
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  checkout_params:
    name: checkout_params
    in: body
    required: true
    schema:
      type: object
      properties:
        payment:
          type: object
          properties:
            payment_method:
              type: string
              minLength: 1
              maxLength: 255
              description: The way of payment
              example: card
            labor_ids:
              type: array
              items:
                type: integer
              description: IDs of the labors to be paid for
              example: '[1, 2, 5]'
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  legislator_params:
    name: legislator_params
    in: body
    required: true
    schema:
      type: object
      properties:
        legislator:
          type: object
          properties:
            english_name:
              type: string
              minLength: 1
              maxLength: 255
              description: English name of the legislator
              example: National Skill Development Corporation
            arabic_name:
              type: string
              minLength: 1
              maxLength: 255
              description: Arabic name of the legislator
              example: المؤسسة الوطنية لتطوير المهارات
            country_id:
              type: integer
              description: ID of the country
            address:
              type: string
              minLength: 1
              maxLength: 255
              description: Address of the legislator
              example: 301, 3rd World Mark 1, 306, Northern Access Rd
            postal_code:
              type: string
              minLength: 1
              maxLength: 255
              description: Postal code
              example: "4564"
          required:
          - english_name
          - arabic_name
          - address
          - postal_code
        contact:
          type: object
          properties:
            email:
              type: string
              minLength: 1
              maxLength: 255
              description: User email address
              example: freddie@nsdc.com.in
            full_name:
              type: string
              minLength: 1
              maxLength: 255
              description: Legislator's contact name
              example: Freddie Buenviaje
            phone_number:
              type: string
              minLength: 1
              maxLength: 255
              description: Legislator's contact phone number (only numbers)
              example: "5643343378"
            country_code:
              type: string
              minLength: 2
              maxLength: 4
              description: Legislator's contact phone number country code in format
                `+<1-3 digits code>`
              example: "+91"
          required:
          - email
          - full_name
          - phone_number
          - country_code
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
      required:
      - legislator
      - contact
  legislator_status_params:
    name: legislator_status_params
    in: body
    required: true
    schema:
      type: object
      properties:
        legislator:
          type: object
          properties:
            rejection_reason:
              type: string
              minLength: 1
              maxLength: 255
              description: Reason for suspending Legislator
              example: Need to be suspended
            status:
              type: string
              minLength: 1
              maxLength: 255
              description: Status of Legislator
              example: Suspended
          required:
          - status
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
      required:
      - legislator
      - contact
  settings_params:
    name: settings_params
    in: body
    schema:
      type: object
      properties:
        min_score:
          type: integer
          description: Minimum score to pass the exam
          example: "50"
        expiry_years:
          type: integer
          description: Number of years after which the exam results are considered
            expired
          example: 5
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  new_test_center_params:
    name: new_test_center_params
    in: body
    required: true
    schema:
      type: object
      properties:
        test_center:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 255
              description: Name of the Test Center
              example: Adani Skill Development Centre - Tiroda
            country:
              type: string
              description: Name of the country
            city:
              type: string
              minLength: 1
              maxLength: 255
              description: Name of the city
              example: Ranchi
            address:
              type: string
              minLength: 1
              maxLength: 255
              description: Address of the Test Center
              example: 301, 3rd World Mark 1, 306, Northern Access Rd
            postal_code:
              type: string
              minLength: 1
              maxLength: 255
              description: Postal code
              example: "11564"
            country_code:
              type: string
              minLength: 1
              maxLength: 255
              description: Country code
              example: "+380"
            phone_number:
              type: string
              minLength: 1
              maxLength: 255
              description: Phone number name
              example: "9128376"
            status:
              type: string
              description: Status of the Test Centsr
              example: active
            legislator_id:
              type: integer
              description: Unic ID of Legislator
            category_ids:
              type: array
              items:
                type: integer
              description: IDs of the categories related to the current Test Center
              example: '[1, 2, 5]'
          required:
          - name
          - address
          - country
          - city
          - status
          - country_code
          - phone_number
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  update_test_center_params:
    name: update_test_center_params
    in: body
    required: true
    schema:
      type: object
      properties:
        test_center:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 255
              description: Name of the Test Center
              example: Adani Skill Development Centre - Tiroda
            city:
              type: string
              minLength: 1
              maxLength: 255
              description: Name of the city
              example: Ranchi
            address:
              type: string
              minLength: 1
              maxLength: 255
              description: Address of the Test Center
              example: 301, 3rd World Mark 1, 306, Northern Access Rd
            postal_code:
              type: string
              minLength: 1
              maxLength: 255
              description: Postal code
              example: "11564"
            country_code:
              type: string
              minLength: 1
              maxLength: 255
              description: Country code
              example: "+380"
            phone_number:
              type: string
              minLength: 1
              maxLength: 255
              description: Phone number name
              example: "9128376"
            legislator_id:
              type: integer
              description: Unic ID of Legislator
            category_ids:
              type: array
              items:
                type: integer
              description: IDs of the categories related to the current Test Center
              example: '[1, 2, 5]'
          required:
          - name
          - address
          - city
          - status
          - country_code
          - phone_number
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  test_center_status_request_params:
    name: test_center_status_request_params
    in: body
    schema:
      type: object
      properties:
        status:
          type: string
          description: Status of the Request
          example: pending
        test_center_status:
          type: string
          description: Status of related Test Center
          example: active
        expires_date:
          type: string
          description: Expiration date of the Request,
          example: 10/11/2020 14:30
  test_center_params:
    name: test_center_params
    in: body
    required: true
    schema:
      type: object
      properties:
        status:
          type: string
          description: Status of the Test Centsr
          example: active
        locale:
          type: string
          minLength: 2
          maxLength: 2
          description: Locale identifier
          example: en
  permissions_params:
    name: permissions_params
    in: body
    required: true
    schema:
      type: object
      properties:
        country_id:
          type: integer
          description: ID of the country
        permissions:
          type: object
          properties:
            legislator:
              type: object
              properties:
                test_centers:
                  type: object
                  properties:
                    create:
                      type: boolean
                      description: Flag that shows if legislator can create test centers
                    create_owner:
                      type: boolean
                      description: Flag that shows if legislator can create test center
                        owners
                    edit:
                      type: boolean
                      description: Flag that shows if legislator can edit test centers
                    view:
                      type: boolean
                      description: Flag that shows if legislator can view information
                        about test centers
                    delete:
                      type: boolean
                      description: Flag that shows if legislator can delete test centers
                labors:
                  type: object
                  properties:
                    create:
                      type: boolean
                      description: Flag that shows if legislator can create labors
                    create_group:
                      type: boolean
                      description: Flag that shows if legislator can create a labors
                        group
                    view_uploaded_files:
                      type: boolean
                      description: Flag that shows if legislator can view uploaded
                        files
                    view:
                      type: boolean
                      description: Flag that shows if legislator can view information
                        about labors
                payment:
                  type: object
                  properties:
                    make_payment:
                      type: boolean
                      description: Flag that shows if legislator can make payments
                    view_transaction_history:
                      type: boolean
                      description: Flag that shows if legislator can view transactions
                        history
                    view_certificate:
                      type: boolean
                      description: Flag that shows if legislator can view certificate
            test_center_owner:
              type: object
              properties:
                test_centers:
                  type: object
                  properties:
                    edit:
                      type: boolean
                      description: Flag that shows if test center owner can edit test
                        centers
                    view:
                      type: boolean
                      description: Flag that shows if test center owner can view information
                        about test centers
                labors:
                  type: object
                  properties:
                    create:
                      type: boolean
                      description: Flag that shows if test center owner can create
                        labors
                    create_group:
                      type: boolean
                      description: Flag that shows if test center owner can create
                        a labors group
                    view_uploaded_files:
                      type: boolean
                      description: Flag that shows if test center owner can view uploaded
                        files
                    view:
                      type: boolean
                      description: Flag that shows if test center owner can view information
                        about labors
  legislator_permission_name:
    name: legislator_permission_name
    in: query
    type: string
    description: Name of the permission to set (i.e. view, create, make_payment, etc.)
  legislator_permission_group:
    name: legislator_permission_group
    in: query
    type: string
    description: Name of the permissions group to set (i.e. labors, test_centers,
      payment)
  test_center_owner_permission_name:
    name: test_center_owner_permission_name
    in: query
    type: string
    description: Name of the permission to set (i.e. view, create, make_payment, etc.)
  test_center_owner_permission_group:
    name: test_center_owner_permission_group
    in: query
    type: string
    description: Name of the permissions group to set (i.e. labors, test_centers,
      payment)
definitions:
  ResponseError:
    type: object
    required:
    - error
    properties:
      error:
        type: string
        minLength: 1
        maxLength: 255
        description: Human readable message explaining the error
  ResponseErrors:
    type: object
    required:
    - errors
    properties:
      errors:
        type: object
        description: Human readable message explaining the error
  RecaptchaNeed:
    type: object
    required:
    - show_recaptcha
    properties:
      show_recaptcha:
        type: boolean
        description: Flag which shows whether reCaptcha should be solved
  TwoFAQRCode:
    type: object
    required:
    - qrcode
    properties:
      qrcode:
        type: string
        description: 2FA QRCode to scan
  TwoFANeed:
    type: object
    required:
    - required_2fa
    properties:
      required_2fa:
        type: boolean
        description: Flag to inform FE that 2FA code from Google Authenticator is
          needed
  LoginResponse:
    type: object
    required:
    - access_payload
    - user
    properties:
      access_payload:
        type: object
        required:
        - csrf
        - access
        - access_expires_at
        properties:
          csrf:
            type: string
            minLength: 1
            maxLength: 255
            description: 'translation missing: en.login.csrf'
          access:
            type: string
            minLength: 1
            maxLength: 255
            description: 'translation missing: en.login.access'
          access_expires_at:
            type: string
            description: 'translation missing: en.login.access_expires_at'
      user:
        type: object
        required:
        - id
        - email
        - roles
        properties:
          id:
            type: integer
            description: Unique number that identifies a user
          email:
            type: string
            minLength: 1
            maxLength: 255
            description: User email address
          full_name:
            type: string
            minLength: 1
            maxLength: 255
            description: User full name
          country_code:
            type: string
            minLength: 1
            maxLength: 4
            x-nullable: true
            description: Country code for User phone number in format `+<1-3 digits
              code>`
          phone_number:
            type: string
            minLength: 6
            maxLength: 14
            x-nullable: true
            description: User phone number (only numbers)
          roles:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                  description: Unique number that identifies a role
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 'translation missing: en.roles.properties.role'
                  example: admin
  RefreshResponse:
    type: object
    required:
    - csrf
    - access
    - access_expires_at
    properties:
      csrf:
        type: string
        minLength: 1
        maxLength: 255
        description: 'translation missing: en.login.csrf'
      access:
        type: string
        minLength: 1
        maxLength: 255
        description: 'translation missing: en.login.access'
      access_expires_at:
        type: string
        description: 'translation missing: en.login.access_expires_at'
  User:
    type: object
    required:
    - id
    - email
    - roles
    properties:
      id:
        type: integer
        description: Unique number that identifies a user
      email:
        type: string
        minLength: 1
        maxLength: 255
        description: User email address
      full_name:
        type: string
        minLength: 1
        maxLength: 255
        description: User full name
      country_code:
        type: string
        minLength: 1
        maxLength: 4
        x-nullable: true
        description: Country code for User phone number in format `+<1-3 digits code>`
      phone_number:
        type: string
        minLength: 6
        maxLength: 14
        x-nullable: true
        description: User phone number (only numbers)
      roles:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Unique number that identifies a role
            name:
              type: string
              minLength: 1
              maxLength: 255
              description: 'translation missing: en.roles.properties.role'
              example: admin
  Legislator:
    type: object
    required:
    - english_name
    - arabic_name
    - address
    - postal_code
    properties:
      id:
        type: integer
        description: Unique number that identifies a legislator
      english_name:
        type: string
        minLength: 1
        maxLength: 255
        description: English name of the legislator
        example: National Skill Development Corporation
      arabic_name:
        type: string
        minLength: 1
        maxLength: 255
        description: Arabic name of the legislator
        example: المؤسسة الوطنية لتطوير المهارات
      address:
        type: string
        minLength: 1
        maxLength: 255
        description: Address of the legislator
        example: 301, 3rd World Mark 1, 306, Northern Access Rd
      postal_code:
        type: string
        minLength: 1
        maxLength: 255
        description: Postal code
        example: "4564"
      user_id:
        type: integer
        description: ID of the related User
      created_at:
        type: string
        description: When record was created
      updated_at:
        type: string
        description: Last time when record was updated
      country:
        type: object
        properties:
          id:
            type: integer
            description: Unique number that identifies a country
          name:
            type: string
            description: Name of the country
  Category:
    type: object
    required:
    - english_name
    - arabic_name
    - published
    - occupations_count
    properties:
      id:
        type: integer
        description: Unique number that identifies a Category
      english_name:
        type: string
        minLength: 1
        maxLength: 255
        description: English name of the Category
      arabic_name:
        type: string
        minLength: 1
        maxLength: 255
        description: Arabic name of the Category
      published:
        type: boolean
        minLength: 1
        description: Category status
      occupations_count:
        type: integer
        description: Count of Occupations related to current Category
  TestCenter:
    type: object
    required:
    - name
    - address
    - country
    - city
    - status
    - categories
    properties:
      id:
        type: integer
        description: ID of the Test Center
      name:
        type: string
        minLength: 1
        maxLength: 255
        description: Name of the Test Center
      city:
        type: string
        minLength: 1
        maxLength: 255
        description: Name of the city
      address:
        type: string
        minLength: 1
        maxLength: 255
        description: Address of the Test Center
      postal_code:
        type: string
        minLength: 1
        maxLength: 255
        description: Postal code
      country_code:
        type: string
        minLength: 1
        maxLength: 255
        description: Country code
      phone_number:
        type: string
        minLength: 1
        maxLength: 255
        description: Phone number name
      status:
        type: string
        description: Status of the Test Centsr
      country:
        type: object
        properties:
          id:
            type: integer
            description: Unique number that identifies a country
          name:
            type: string
            description: Name of the country
      categories:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Unique number that identifies a Category
            english_name:
              type: string
              minLength: 1
              maxLength: 255
              description: English name of the Category
            arabic_name:
              type: string
              minLength: 1
              maxLength: 255
              description: Arabic name of the Category
            published:
              type: boolean
              minLength: 1
              description: Category status
        description: IDs of the categories related to the current Test Center
