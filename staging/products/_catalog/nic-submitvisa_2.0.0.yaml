swagger: "2.0"
info:
  title: NIC_SubmitVisa
  x-ibm-name: nic-submitvisa
  version: 2.0.0
  description: This API exposes nic to get submit visa status  services from Qiwa
    platform
schemes:
- https
basePath: /nic/v2
security:
- OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://$(catalog.url)/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: ($operationID() = 'addVisa')
          execute:
          - map:
              version: 2.0.0
              title: map
              inputs:
                "":
                  schema:
                    $ref: '#/definitions/RequestModel'
                  variable: request.body
                establishmentId:
                  schema:
                    type: integer
                  variable: request.parameters.establishmentId
              outputs:
                "":
                  schema:
                    description: ""
                    type: object
                    properties:
                      LaborOfficeId:
                        type: string
                        name: LaborOfficeId
                      SequenceNumber:
                        type: string
                        name: SequenceNumber
                      UnifiedNationalNumber:
                        type: string
                        name: UnifiedNationalNumber
                      RequesterIdNo:
                        type: string
                        name: RequesterIdNo
                      RequestSequence:
                        type: string
                        name: RequestSequence
                      RequestYear:
                        type: string
                        name: RequestYear
                      ReasonAddActivity:
                        type: string
                        name: ReasonAddActivity
                      ReasonExtendedActivity:
                        type: string
                        name: ReasonExtendedActivity
                      ReasonFinalExit:
                        type: string
                        name: ReasonFinalExit
                      ReasonGovernmentContract:
                        type: string
                        name: ReasonGovernmentContract
                      ReasonNewCompany:
                        type: string
                        name: ReasonNewCompany
                      ReasonPrivateContract:
                        type: string
                        name: ReasonPrivateContract
                      ReasonSeasonalEmployee:
                        type: string
                        name: ReasonSeasonalEmployee
                      ReasonVisaNotUsed:
                        type: string
                        name: ReasonVisaNotUsed
                      VisaType:
                        type: string
                        name: VisaType
                      VisaRequestList:
                        type: object
                        properties:
                          Visa:
                            type: array
                            items:
                              properties:
                                Gender:
                                  type: string
                                  name: Gender
                                Job:
                                  type: string
                                  name: Job
                                Nationality:
                                  type: string
                                  name: Nationality
                                Origin:
                                  type: string
                                  name: Origin
                                Religion:
                                  type: string
                                  name: Religion
                                NumberOfVisas:
                                  type: string
                                  name: NumberOfVisas
                              type: object
                            name: Visa
                        name: VisaRequestList
                    example: "{\r\n            \"LaborOfficeId\": \"1\",\r\n            \"SequenceNumber\":
                      \"2133\",\r\n            \"UnifiedNationalNumber\": \"1011209903\",\r\n
                      \           \"RequesterIdNo\": \"1011209903\",\r\n            \"RequestSequence\":
                      \"1211574\",\r\n            \"RequestYear\": \"1442\",\r\n            \"ReasonAddActivity\":
                      \"1\",\r\n            \"ReasonExtendedActivity\": \"1\",\r\n
                      \           \"ReasonFinalExit\": \"1\",\r\n            \"ReasonGovernmentContract\":
                      \"1\",\r\n            \"ReasonNewCompany\": \"1\",\r\n            \"ReasonPrivateContract\":
                      \"1\",\r\n            \"ReasonSeasonalEmployee\": \"1\",\r\n
                      \           \"ReasonVisaNotUsed\": \"1\",\r\n            \"VisaType\":
                      \"2\",\r\n            \"VisaRequestList\": {\r\n                \"Visa\":
                      [{\r\n                    \"Gender\": \"1\",\r\n                    \"Job\":
                      \"2133031\",\r\n                    \"Nationality\": \"311\",\r\n
                      \                   \"Origin\": \"1\",\r\n                    \"Religion\":
                      \"1\",\r\n                    \"NumberOfVisas\": \"1\"\r\n                },\r\n
                      \               {\r\n                    \"Gender\": \"1\",\r\n
                      \                   \"Job\": \"1217311\",\r\n                    \"Nationality\":
                      \"325\",\r\n                    \"Origin\": \"1\",\r\n                    \"Religion\":
                      \"1\",\r\n                    \"NumberOfVisas\": \"1\"\r\n                }]\r\n
                      \           }\r\n        \r\n}"
                  variable: message.body
                  content: application/json
              actions:
              - set: .SequenceNumber
                from: .sequenceNumber
              - set: .UnifiedNationalNumber
                from: .unifiedNationalNumber
              - set: .RequesterIdNo
                from: .requesterId
              - set: .RequestSequence
                from: .requestSequence
              - set: .RequestYear
                from: .requestYear
              - set: .ReasonAddActivity
                from: .reasonAddActivity
              - set: .ReasonExtendedActivity
                from: .reasonExtendedActivity
              - set: .ReasonFinalExit
                from: .reasonFinalExit
              - set: .ReasonGovernmentContract
                from: .reasonGovernmentContract
              - set: .ReasonNewCompany
                from: .reasonNewCompany
              - set: .ReasonPrivateContract
                from: .reasonPrivateContract
              - set: .ReasonSeasonalEmployee
                from: .reasonSeasonalEmployee
              - set: .ReasonVisaNotUsed
                from: .reasonVisaNotUsed
              - set: .VisaType
                from: .visaType
              - create: .VisaRequestList.Visa
                foreach: .visaRequestList.visa
                from: .visaRequestList.visa
                actions:
                - set: Gender
                  from: gender
                - set: Job
                  from: job
                - set: Nationality
                  from: nationality
                - set: Origin
                  from: origin
                - set: Religion
                  from: religion
                - set: NumberOfVisas
                  from: numberOfVisas
              - set: .LaborOfficeId
                from: establishmentId
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                includeEmptyXMLElements: false
                namespaceInheritance: false
                inlineNamespaces: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
          - gatewayscript:
              version: 2.0.0
              title: Service_Config
              source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
                : \"NSVR0001\",\r\n    \"channelId\" : \"Integration\",\r\n    \"requestName\"
                : \"SubmitVisaRequestNICRq\",\r\n    \"responseName\": \"SubmitVisaRequestNICRs\",\r\n
                \   \"errorMap\" :{\r\n        \"ESBSCHEMA\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"}\r\n    }\r\n    \r\n};\r\n\r\napim.setvariable('cfg',cfg);"
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Request
              source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue =
                \"\"+(new Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg =
                apim.getvariable('cfg');\r\nvar OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar
                appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n
                \           \"TransactionId\" : millisecondsvalue,\r\n            \"ChannelId\":
                cfg.channelId,\r\n            \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\r\n
                \           \"RequestTime\" : formatDate(dt),\r\n            \"ServiceCode\":
                cfg.serviceCode\r\n        },\r\n        \"Body\" : apim.getvariable('message.body')\r\n
                \           \r\n        \r\n    }\r\n};\r\n\r\nif (typeof OperatorId
                !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo =
                {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
                formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
                \   //get the day\r\n    //convert day to string\r\n    var day =
                d.getDate().toString();\r\n    //get the year\r\n    var year = d.getFullYear();\r\n
                \   var hour = d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
                \   var second = d.getSeconds().toString();\r\n    var millisecond
                = d.getMilliseconds().toString();\r\n    //pull the last two digits
                of the year\r\n    year = year.toString();\r\n    \r\n    //increment
                month by 1 since it is 0 indexed\r\n    //converts month to a string\r\n
                \   month = (month + 1).toString();\r\n\r\n    //if month is 1-9 pad
                right with a 0 for two digits\r\n    if (month.length === 1)\r\n        month
                = \"0\" + month;\r\n\r\n    //if day is between 1-9 pad right with
                a 0 for two digits\r\n    if (day.length === 1)\r\n        day = \"0\"
                + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\" +
                hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
                + minitue;\r\n\r\n    if (second.length === 1)\r\n        second =
                \"0\" + second;\r\n        \r\n    if (millisecond.length == 1)\r\n
                \       millisecond = \"00\" + millisecond;\r\n        \r\n    if
                (millisecond.length == 2)\r\n        millisecond = \"0\" + millisecond;\r\n
                \   \r\n    \r\n\r\n    //return the string \"MMddyy\"\r\n    return
                year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\" +
                second+\".\"+millisecond;\r\n}"
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: POST
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: $(ace-nic-nicsubmit)/common/subvisareqnic
              persistent-connection: true
          - gatewayscript:
              version: 2.0.0
              title: Set_Headers
              source: |-
                var apim = require('apim');

                apim.output('application/json');

                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');
                var Header = message[cfg.responseName].Header;
                var TransactionId = Header.TransactionId;
                var ChannelId = Header.ChannelId;
                var RequestTime = Header.RequestTime;
                var SessionId = Header.SessionId;
                var MWRequestTime = Header.MWRequestTime;
                var MWResponseTime = Header.MWResponseTime;
                var status = Header.ResponseStatus.Status;
                apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
                apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
                if (RequestTime !== 'undefined')
                 apim.setvariable('message.headers.RequestTime',RequestTime,'add');
                if (SessionId !== 'undefined')
                 apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
                if (MWRequestTime !== 'undefined')
                apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
                if (MWResponseTime !== 'undefined')
                apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

                apim.setvariable('message.headers.Response-Status',status,'add');
          - switch:
              version: 2.0.0
              title: switch
              case:
              - condition: (($header("Response-Status") = 'SUCCESS'))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Response
                    source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                      cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
                - map:
                    version: 2.0.0
                    title: map
                    inputs:
                      "":
                        schema:
                          description: ""
                          type: object
                          properties:
                            LaborOfficeId:
                              type: string
                              name: LaborOfficeId
                            NICVisaDate:
                              type: string
                              name: NICVisaDate
                            NICVisaNumber:
                              type: string
                              name: NICVisaNumber
                            RequestYear:
                              type: string
                              name: RequestYear
                            RequestSequence:
                              type: string
                              name: RequestSequence
                            VisaList:
                              type: object
                              properties:
                                Visa:
                                  type: object
                                  properties:
                                    BorderNumber:
                                      type: string
                                      name: BorderNumber
                                    Job:
                                      type: string
                                      name: Job
                                    Nationality:
                                      type: string
                                      name: Nationality
                                    Religion:
                                      type: string
                                      name: Religion
                                    Gender:
                                      type: string
                                      name: Gender
                                    Origin:
                                      type: string
                                      name: Origin
                                  name: Visa
                              name: VisaList
                          example: "{\r\n    \"LaborOfficeId\": \"5\",\r\n    \"NICVisaDate\":
                            \"14420521\",\r\n    \"NICVisaNumber\": \"1\",\r\n    \"RequestYear\":
                            \"1441\",\r\n    \"RequestSequence\": \"1111111\",\r\n
                            \   \"VisaList\": {\r\n        \"Visa\": {\r\n            \"BorderNumber\":
                            \"4123190107\",\r\n            \"Job\": \"1112031\",\r\n
                            \           \"Nationality\": \"1\",\r\n            \"Religion\":
                            \"1\",\r\n            \"Gender\": \"1\",\r\n            \"Origin\":
                            \"1\"\r\n        }\r\n    }\r\n}"
                        variable: message.body
                        content: application/json
                    outputs:
                      "":
                        schema:
                          $ref: '#/definitions/ResponseModel'
                        variable: message.body
                        content: application/json
                    actions:
                    - set: .laborOfficeId
                      from: .LaborOfficeId
                    - set: .nicVisaDate.hijriDate
                      from: .NICVisaDate
                    - set: .nicVisaDate.gregorianDate
                      from: .NICVisaDate
                    - set: .nicVisaNumber
                      from: .NICVisaNumber
                    - set: .requestYear
                      from: .RequestYear
                    - set: .requestSequence
                      from: .RequestSequence
                    - create: .visaRequestList.visa
                      foreach: .VisaList.Visa.BorderNumber
                      from: .VisaList.Visa.BorderNumber
                      actions:
                      - set: borderNumber
                        from: $item
                    - create: .visaRequestList.visa
                      foreach: .VisaList.Visa.Job
                      from: .VisaList.Visa.Job
                      actions:
                      - set: job
                        from: $item
                    - create: .visaRequestList.visa
                      foreach: .VisaList.Visa.Nationality
                      from: .VisaList.Visa.Nationality
                      actions:
                      - set: nationality
                        from: $item
                    - create: .visaRequestList.visa
                      foreach: .VisaList.Visa.Religion
                      from: .VisaList.Visa.Religion
                      actions:
                      - set: religion
                        from: $item
                    - create: .visaRequestList.visa
                      foreach: .VisaList.Visa.Gender
                      from: .VisaList.Visa.Gender
                      actions:
                      - set: gender
                        from: $item
                    options:
                      mapEnablePostProcessingJSON: true
                      mapEmulateV4EmptyJSONObject: false
                      mapEmulateV4DefaultRequiredProps: false
                      mapReferenceLimit: 1
                      includeEmptyXMLElements: false
                      namespaceInheritance: false
                      inlineNamespaces: false
                      mapResolveApicVariables: false
                      mapOptimizeSchemaDefinition: true
              - otherwise:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Error
                    source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                      cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                      message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                      {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                      \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                      \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                      \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                      \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                      \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                      \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
                      == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad
                      Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\nsession.output.write(error);\napim.output('application/json');"
        - condition: ($operationID() = 'deleteVisa')
          execute:
          - map:
              version: 2.0.0
              title: map
              inputs:
                sequenceNumber:
                  schema:
                    type: string
                  variable: request.parameters.sequenceNumber
                establishmentId:
                  schema:
                    type: integer
                  variable: request.parameters.establishmentId
                borderNumber:
                  schema:
                    type: string
                  variable: request.parameters.borderNumber
              outputs:
                "":
                  schema:
                    description: ""
                    type: object
                    properties:
                      LaborOfficeId:
                        type: string
                        name: LaborOfficeId
                      SequenceNumber:
                        type: string
                        name: SequenceNumber
                      BorderNumber:
                        type: string
                        name: BorderNumber
                  variable: message.body
              actions:
              - set: .SequenceNumber
                from: sequenceNumber
              - set: .LaborOfficeId
                from: establishmentId
              - set: .BorderNumber
                from: borderNumber
              options:
                mapEnablePostProcessingJSON: true
                mapEmulateV4EmptyJSONObject: false
                mapEmulateV4DefaultRequiredProps: false
                mapReferenceLimit: 1
                inlineNamespaces: false
                namespaceInheritance: false
                includeEmptyXMLElements: false
                mapResolveApicVariables: false
                mapOptimizeSchemaDefinition: true
          - gatewayscript:
              version: 2.0.0
              title: Service_Config
              source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
                : \"CIV00001\",\r\n    \"channelId\" : \"Qiwa\",\r\n    \"requestName\"
                : \"CancelIssuedVisaRq\",\r\n    \"responseName\": \"CancelIssuedVisaRs\",\r\n
                \   \"errorMap\" :{\r\n        \"E0000104\" : {\"code\" :400, \"msg\":\"Invalid
                Request\"}\r\n    }\r\n    \r\n};\r\n\r\napim.setvariable('cfg',cfg);"
          - gatewayscript:
              version: 2.0.0
              title: Prepare_Request
              source: "var apim = require('apim');\r\n\r\nvar millisecondsvalue =
                \"\"+(new Date()).getTime();\r\nvar dt = new Date();\r\nvar cfg =
                apim.getvariable('cfg');\r\nvar OperatorId=apim.getvariable('message.headers.Operator-Id');\r\n\r\nvar
                appcReq = {\r\n    [cfg.requestName]:{\r\n        \"Header\" : {\r\n
                \           \"TransactionId\" : millisecondsvalue,\r\n            \"ChannelId\":
                cfg.channelId,\r\n            \"SessionId\": apim.getvariable('message.headers.X-Request-Id'),\r\n
                \           \"RequestTime\" : formatDate(dt),\r\n            \"ServiceCode\":
                cfg.serviceCode\r\n        },\r\n        \"Body\" : apim.getvariable('message.body')\r\n
                \           \r\n        \r\n    }\r\n};\r\n\r\nif (typeof OperatorId
                !== 'undefined')\r\n    appcReq[cfg.requestName].Header.UserInfo =
                {\r\n        \"IDNumber\" : OperatorId\r\n    };\r\nsession.output.write(appcReq);\r\napim.output('application/json');\r\n\r\n\r\nfunction
                formatDate(d)\r\n{\r\n    //get the month\r\n    var month = d.getMonth();\r\n
                \   //get the day\r\n    //convert day to string\r\n    var day =
                d.getDate().toString();\r\n    //get the year\r\n    var year = d.getFullYear();\r\n
                \   var hour = d.getHours().toString();\r\n    var minitue = d.getMinutes().toString();\r\n
                \   var second = d.getSeconds().toString();\r\n    var millisecond
                = d.getMilliseconds().toString();\r\n    //pull the last two digits
                of the year\r\n    year = year.toString();\r\n    \r\n    //increment
                month by 1 since it is 0 indexed\r\n    //converts month to a string\r\n
                \   month = (month + 1).toString();\r\n\r\n    //if month is 1-9 pad
                right with a 0 for two digits\r\n    if (month.length === 1)\r\n        month
                = \"0\" + month;\r\n\r\n    //if day is between 1-9 pad right with
                a 0 for two digits\r\n    if (day.length === 1)\r\n        day = \"0\"
                + day;\r\n\r\n    if (hour.length === 1)\r\n        hour = \"0\" +
                hour;\r\n\r\n    if (minitue.length === 1)\r\n        minitue = \"0\"
                + minitue;\r\n\r\n    if (second.length === 1)\r\n        second =
                \"0\" + second;\r\n        \r\n    if (millisecond.length == 1)\r\n
                \       millisecond = \"00\" + millisecond;\r\n        \r\n    if
                (millisecond.length == 2)\r\n        millisecond = \"0\" + millisecond;\r\n
                \   \r\n    \r\n\r\n    //return the string \"MMddyy\"\r\n    return
                year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\" +
                second+\".\"+millisecond;\r\n}"
          - invoke:
              version: 2.0.0
              title: invoke
              header-control:
                type: blocklist
                values: []
              parameter-control:
                type: allowlist
                values: []
              timeout: 60
              verb: POST
              cache-response: protocol
              cache-ttl: 900
              stop-on-error: []
              target-url: $(ace-vstv-vvsubmits)/common/cancelissuedvisa
              persistent-connection: true
          - gatewayscript:
              version: 2.0.0
              title: Set_Headers
              source: |-
                var apim = require('apim');

                apim.output('application/json');

                var message = apim.getvariable('message.body');
                var cfg = apim.getvariable('cfg');
                var Header = message[cfg.responseName].Header;
                var TransactionId = Header.TransactionId;
                var ChannelId = Header.ChannelId;
                var RequestTime = Header.RequestTime;
                var SessionId = Header.SessionId;
                var MWRequestTime = Header.MWRequestTime;
                var MWResponseTime = Header.MWResponseTime;
                var status = Header.ResponseStatus.Status;
                apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
                apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
                if (RequestTime !== 'undefined')
                 apim.setvariable('message.headers.RequestTime',RequestTime,'add');
                if (SessionId !== 'undefined')
                 apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
                if (MWRequestTime !== 'undefined')
                apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
                if (MWResponseTime !== 'undefined')
                apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

                apim.setvariable('message.headers.Response-Status',status,'add');
          - switch:
              version: 2.0.0
              title: switch
              case:
              - condition: (($header("Response-Status") = 'SUCCESS'))
                execute:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Response
                    source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                      cfg = apim.getvariable('cfg');          \nvar body = message[cfg.responseName].Body;\n\n\nsession.output.write(body);\napim.output('application/json');"
              - otherwise:
                - gatewayscript:
                    version: 2.0.0
                    title: Prepare_Error
                    source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                      cfg = apim.getvariable('cfg');          \nvar error = {\n  \"errorCode\":
                      message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                      {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                      \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                      \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                      \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                      \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\n
                      \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\n
                      \      //apim.error('ERROR',httperror,errmgs,details);\n    }\n}\nif(httperror
