swagger: "2.0"
info:
  title: Qiwa_ValidateEmployeeTraining
  x-ibm-name: qiwa-validateemployeetraining
  version: 1.0.1
  description: This API to Validate employees for Training Overlap for an establishment
    from Qiwa platform
schemes:
- https
basePath: /qiwa/v2
security:
- ClientSecret: []
  OAuth2.0:
  - IntegrationScope
  clientIdHeader: []
securityDefinitions:
  ClientSecret:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
    x-key-type: client_secret
  clientIdHeader:
    type: apiKey
    name: X-IBM-Client-Id
    in: header
    x-key-type: client_id
  OAuth2.0:
    type: oauth2
    flow: application
    x-ibm-oauth-provider: takamol-native-oauth-porvider
    tokenUrl: https://gw-apic.qiwa.info/takamol/staging/takamol-oauth/oauth2/token
    scopes:
      IntegrationScope: This scope for all integration services in Takamol
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
    - gatewayscript:
        version: 2.0.0
        title: service_config
        source: "var apim = require('apim');\r\n\r\nvar cfg={\r\n    \"serviceCode\"
          : \"EXVET001\",\r\n    \"channelId\" : \"Qiwa\",\r\n\t\"SessionId\" : \"1\",\r\n
          \   \"requestName\" : \"ValidateEmployeeTrainingRq\",\r\n    \"responseName\":
          \"ValidateEmployeeTrainingRs\",\r\n    \"debugFlag\": \"1\",\r\n    \"UserId\":
          \"1021\",\r\n    \"IDNumber\": \"1158407\",\r\n    \"errorMap\" :{\r\n                             \"ESBSCHEMA\"
          : {\"code\" :400, \"msg\":\"Invalid Request\"},\r\n                              \"E0000024\"
          \ : {\"code\" :409, \"msg\":\"Nodata\"},\r\n                              \"E0000004\"
          \ : {\"code\" :400, \"msg\":\"Missing\"},\r\n                              \"TI000009\"
          \ : {\"code\" :409, \"msg\":\"InvalidTrainingHours\"},\r\n                              \"TI000014\"
          \ : {\"code\" :409, \"msg\":\"TrainingCityCountryRequired\"},\r\n                              \"E0000042\"
          \ : {\"code\" :409, \"msg\":\"InvalidData\"},\r\n                              \"E0000684\"
          \ : {\"code\" :409, \"msg\":\"NoEstablishmentInfo\"},\r\n                              \"E0000046\"
          \ : {\"code\" :401, \"msg\":\"AuthenticationFailed\"},\r\n                              \"E0000047\"
          \ : {\"code\" :401, \"msg\":\"AuthenticationFailed\"},\r\n                              \"E0000048\"
          \ : {\"code\" :401, \"msg\":\"AuthenticationFailed\"},\r\n                              \"NIC00253\"
          \ : {\"code\" :409, \"msg\":\"Runtime_Exception\"},\r\n                              \"E10003\"
          \   : {\"code\" :409, \"msg\":\"StartEndDateWrong\"},\r\n                              \"TI000018\"
          \ : {\"code\" :409, \"msg\":\"DuplicateEmployee\"},\r\n                              \"TI000019\"
          \ : {\"code\" :409, \"msg\":\"ExceedsEmployeeLimit\"},\r\n                              \"E0000028\"
          \ : {\"code\" :409, \"msg\":\"Conflict\"},\r\n                              \"E0000828\"
          \ : {\"code\" :200, \"msg\":\"TrainingOverlap\"},\r\n\t\t\t\t\t\t\t  \"E0000929\"
          \ :{\"code\" :409, \"msg\":\"AllEmployeeRemovalError\"},\r\n\t\t\t\t\t\t\t
          \ \"E0000919\"  :{\"code\" :409, \"msg\":\"Sorry, you cannot add/remove
          employee to this completed training\"},\r\n                              \"E0000562\"
          \ :{\"code\" :409, \"msg\":\"Invalid Input Parametres\"},\r\n                              \"TI000029\"
          \ :{\"code\" :409, \"msg\":\" Sorry, you cannot add/remove employee to this
          completed training\"},\r\n                              \"TI000030\"  :{\"code\"
          :409, \"msg\":\" Only employee with pending status is allowed to be removed\"}\r\n
          \                             \r\n    }\r\n    \r\n};\r\n\r\n\r\napim.setvariable('cfg',
          cfg);\r\napim.output('application/json');\r\n\r\n"
    - gatewayscript:
        version: 2.0.0
        title: Build_Headers
        source: "var apim = require('apim');\n\nvar millisecondsvalue = \"\"+(new
          Date()).getTime();\nvar dt = new Date();\nvar cfg = apim.getvariable('cfg');\nvar
          OperatorId=apim.getvariable('message.headers.Operator-Id');\n\n\nvar appcReq
          = {\n    [cfg.requestName]:{\n        \"Header\" : {\n            \"TransactionId\"
          : millisecondsvalue,\n            \"ChannelId\": cfg.channelId,\n            \"SessionId\":
          cfg.SessionId, //apim.getvariable('message.headers.X-Request-Id'),\n            \"RequestTime\"
          : formatDate(dt),\n\t\t\t\"MWRequestTime\" : formatDate(dt),\n            \"ServiceCode\":
          cfg.serviceCode,\n            \"DebugFlag\": cfg.debugFlag,\n            \"UserInfo\":
          {\n                \"UserId\": cfg.UserId,\n                \"IDNumber\":
          cfg.IDNumber\n            }\n\t\t\n        },\n        \"Body\" : apim.getvariable('message.body')\n
          \           \n        \n    }\n};\n\nif (typeof OperatorId !== 'undefined')\n
          \   appcReq[cfg.requestName].Header.UserInfo = {\n        \"IDNumber\" :
          OperatorId\n    };\nsession.output.write(appcReq);\napim.output('application/json');\n\n\nfunction
          formatDate(d)\n{\n    //get the month\n    var month = d.getMonth();\n    //get
          the day\n    //convert day to string\n    var day = d.getDate().toString();\n
          \   //get the year\n    var year = d.getFullYear();\n    var hour = d.getHours().toString();\n
          \   var minitue = d.getMinutes().toString();\n    var second = d.getSeconds().toString();\n
          \   var millisecond = d.getMilliseconds().toString();\n    //pull the last
          two digits of the year\n    year = year.toString();\n    \n    //increment
          month by 1 since it is 0 indexed\n    //converts month to a string\n    month
          = (month + 1).toString();\n\n    //if month is 1-9 pad right with a 0 for
          two digits\n    if (month.length === 1)\n        month = \"0\" + month;\n\n
          \   //if day is between 1-9 pad right with a 0 for two digits\n    if (day.length
          === 1)\n        day = \"0\" + day;\n\n    if (hour.length === 1)\n        hour
          = \"0\" + hour;\n\n    if (minitue.length === 1)\n        minitue = \"0\"
          + minitue;\n\n    if (second.length === 1)\n        second = \"0\" + second;\n
          \       \n    if (millisecond.length == 1)\n        millisecond = \"00\"
          + millisecond;\n        \n    if (millisecond.length == 2)\n        millisecond
          = \"0\" + millisecond;\n    \n    \n\n    //return the string \"MMddyy\"\n
          \   return year+\"-\"+month+\"-\"+day+\" \"+hour + \":\" + minitue + \":\"
          + second+\".\"+millisecond;\n}"
    - invoke:
        title: invoke
        version: 2.0.0
        verb: POST
        target-url: $(ace-trni-trainingmanagement)/training-indicators/establishment/trainings/Validate
        follow-redirects: false
        timeout: 60
        parameter-control:
          type: blacklist
        header-control:
          type: blacklist
          values:
          - ^X-IBM-Client-Id$
        inject-proxy-headers: true
        cache-ttl: 90
    - gatewayscript:
        version: 2.0.0
        title: Set_headers
        source: |-
          var apim = require('apim');

          apim.output('application/json');

          var message = apim.getvariable('message.body');
          var cfg = apim.getvariable('cfg');
          var Header = message[cfg.responseName].Header;
          var TransactionId = Header.TransactionId;
          var ChannelId = Header.ChannelId;
          var RequestTime = Header.RequestTime;
          var SessionId = Header.SessionId;
          var MWRequestTime = Header.MWRequestTime;
          var MWResponseTime = Header.MWResponseTime;
          var status = Header.ResponseStatus.Status;



          apim.setvariable('message.headers.Transaction-Id',TransactionId,'add');
          apim.setvariable('message.headers.Channel-Id',ChannelId,'add');
          if (RequestTime !== 'undefined')
           apim.setvariable('message.headers.RequestTime',RequestTime,'add');
          if (SessionId !== 'undefined')
           apim.setvariable('message.headers.X-Request-Id',SessionId,'add');
          if (MWRequestTime !== 'undefined')
          apim.setvariable('message.headers.MWRequestTime',MWRequestTime,'add');
          if (MWResponseTime !== 'undefined')
          apim.setvariable('message.headers.MWResponseTime',MWResponseTime,'add');

          apim.setvariable('message.headers.Response-Status',status,'add');
    - switch:
        version: 2.0.0
        title: switch
        case:
        - condition: ($header("Response-status") = 'SUCCESS')
          execute:
          - gatewayscript:
              source: var apim = require('apim');
              version: 2.0.0
              title: |-
                SUCCESS var message = apim.getvariable('message.body'); var cfg = apim.getvariable('cfg'); var body = message[cfg.responseName].Body;

                session.output.write(body); apim.output('application/json');
        - condition: ($header("Response-Status") = 'Error' or ($header("Response-Status")
            = 'ERROR'))
          execute:
          - gatewayscript:
              version: 2.0.0
              title: ERROR
              source: "var apim = require('apim');\r\n\r\nvar message = apim.getvariable('message.body');\r\nvar
                cfg = apim.getvariable('cfg');     \r\n\r\nvar error = {\r\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\r\n  \"errorMessage\":
                {\r\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\r\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\r\n
                \ }\r\n};\r\n\r\nvar httperror=0;\r\nif(cfg.errorMap){\r\n    if(cfg.errorMap[error.errorCode]){\r\n
                \      httperror = cfg.errorMap[error.errorCode].code;\r\n       \r\n
                \      //var errmgs = cfg.errorMap[error.ErrorResponse.Code].msg;\r\n
                \      //var details = error.ErrorResponse.Code + ':' + error.ErrorResponse.EnglishMsg;\r\n
                \      //apim.error('ERROR',httperror,errmgs,details);\r\n    }\r\n}\r\nif(httperror
                == 0){\r\n   httperror = 400;\r\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\r\n}\r\napim.setvariable('message.status.code',httperror,'set');\r\n\r\n
                if(message[cfg.responseName].Body==null){\r\nvar resp = {\r\n        \"errorCode\":
                error.errorCode,\r\n        \"errorMessage\": error.errorMessage\r\n
                \           \r\n    };\r\n }\r\n else{\r\n     var resp = {\r\n        \"errorCode\":
                error.errorCode,\r\n        \"errorMessage\": error.errorMessage,\r\n
                \       \"Body\": message[cfg.responseName].Body\r\n            \r\n
                \   };\r\n }\r\n    \r\nsession.output.write(resp);\r\napim.output('application/json');"
        - condition: ($header("Response-Status") = 'WARNING')
          execute:
          - gatewayscript:
              version: 2.0.0
              title: WARNING
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');     \n\nvar error = {\n  \"errorCode\":
                message[cfg.responseName].Header.ResponseStatus.Code,\n  \"errorMessage\":
                {\n    \"en-US\": message[cfg.responseName].Header.ResponseStatus.EnglishMsg,\n
                \   \"ar-SA\": message[cfg.responseName].Header.ResponseStatus.ArabicMsg\n
                \ }\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n    if(cfg.errorMap[error.errorCode]){\n
                \      httperror = cfg.errorMap[error.errorCode].code;\n       \n
                \   }\n}\nif(httperror == 0){\n   httperror = 400;\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\n
                \nvar resp = {\n        \"errorCode\": error.errorCode,\n        \"errorMessage\":
                error.errorMessage,\n        \"Body\": message[cfg.responseName].Body\n
                \   };\n    \nsession.output.write(resp);\napim.output('application/json');"
        - otherwise:
          - gatewayscript:
              version: 2.0.0
              title: ELSE
              source: "var apim = require('apim');\n\nvar message = apim.getvariable('message.body');\nvar
                cfg = apim.getvariable('cfg');     \n\nvar error = {\n  \"errorCode\":
                message['Error'].Code,\n  \"errorMessage\": {\n    \"en-US\": message['Error'].Detail,\n
                \   \"ar-SA\": 'System Error'\n};\n\nvar httperror=0;\nif(cfg.errorMap){\n
                \   if(cfg.errorMap[error.errorCode]){\n       httperror = cfg.errorMap[error.errorCode].code;\n
                \   }\n}\nif(httperror == 0){\n   httperror = 500;\n   // apim.error('ERROR',400,'Bad
                Request','Invalid request');\n}\napim.setvariable('message.status.code',httperror,'set');\n\n
                session.output.write(error); \napim.output('application/json');"
    catch:
    - default:
      - set-variable:
          version: 2.0.0
          title: set-variable
          actions:
          - set: message.status.code
            value: "500"
            type: string
          - set: message.headers.Content-Type
            value: application/json
            type: string
          - set: message.body
            value: '{      "errorCode": "E000500",      "errorMessage": "Internal
              server error"  }'
            type: string
    finally: []
  properties:
    target-url:
      value: http://trni-trainingmanagement-http-ace.apps.stg.qiwa-nonprod.local/training-indicators/establishment/trainings/Validate
      description: The URL of the target service
      encoded: false
  application-authentication:
    certificate: false
  activity-log:
    success-content: payload
    error-content: payload
    enabled: true
  buffering: true
  catalogs: {}
definitions:
  GregorianDateModel:
    type: string
    description: This date object will be used across the model with format yyyy-MM-dd
      HH:MM:SS.sssfor gregorian dates only
    example: "2021-12-31 22:00:00.000"
  ResponseModel:
    type: object
    description: This response object returned by the get operation
    properties:
      headers:
        $ref: '#/definitions/Headers'
      EmployeeList:
        type: array
        items:
          $ref: '#/definitions/TrainingOverlapEmployees'
  TrainingOverlapEmployees:
    type: object
    properties:
      TrainingId:
        type: integer
        example: "123456"
      TrainingName:
        type: string
        example: Sample
      IDNumber:
        type: string
        example: Sample
      EmployeeName:
        type: string
        example: Sample
      Status:
        type: string
        example: P
  ErrorModel:
    type: object
    required:
    - errorCode
    - errorMessage
    properties:
      headers:
        $ref: '#/definitions/Headers'
      errorCode:
        type: string
        example: EXXXX000
      errorMessage:
        $ref: '#/definitions/LocaleDataModel'
  LocaleDataModel:
    type: object
    additionalProperties:
      type: string
    example:
      en-US: English Value
      ar-SA: Arabic Value
  Headers:
    type: object
    properties:
      X-Request-Id:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
  HeadersErrorModel:
    type: object
    properties:
      headers:
        $ref: '#/definitions/Headers'
  ValidateEmployeeTrainingRq:
    type: object
    properties:
      EstablishmentId:
        type: integer
      UserId:
        type: integer
      IDNumber:
        type: string
      LaborOfficeId:
        type: integer
      SequenceNumber:
        type: integer
      TrainingId:
        type: integer
        example: "123456"
      TrainingLocation:
        type: integer
      TrainingCountry:
        type: integer
      TrainingCity:
        type: integer
      TrainingStartDate:
        $ref: '#/definitions/GregorianDateModel'
        properties: {}
      TrainingEndDate:
        $ref: '#/definitions/GregorianDateModel'
        properties: {}
      TrainingHours:
        type: integer
      EmployeeDetails:
        type: object
        properties:
          EmployeeList:
            type: array
            items:
              properties:
                LaborerIdNo:
                  type: string
paths:
  /training-indicator/validate:
    post:
      tags:
      - Trainings
      operationId: qiwavalidateemployeetraining
      summary: This API to Validate employees for Training Overlap for an establishment
        from Qiwa platform
      responses:
        "200":
          description: The operation was successful.
          schema:
            $ref: '#/definitions/ResponseModel'
        "400":
          description: The request was rejected by the server due to malformed syntax.
            Bad Request.
        "401":
          description: The request could not be completed due to lack of valid credentials.
            Authentication.
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "403":
          description: The request could not be completed because it is not authorized.
            Authorization
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "404":
          description: The server has not found anything matching the Request-URI.
        "408":
          description: The client did not produce a request within the time that the
            server was prepared to wait.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Usually business validation errors will
            be returned in the body
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "429":
          description: The request was sent too many times in a given amount of time
          schema:
            $ref: '#/definitions/HeadersErrorModel'
        "500":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "501":
          description: The server does not support the functionality required and
            does not recognize the request
          schema:
            $ref: '#/definitions/ErrorModel'
        "503":
          description: The server encountered an unexpected condition which prevented
            it from fulfilling the request.
          schema:
            $ref: '#/definitions/ErrorModel'
        "510":
          description: Extensions to the request are required for the server to fulfil
            it.
          schema:
            $ref: '#/definitions/ErrorModel'
      consumes:
      - application/json
      produces:
      - application/json
      description: This API to Validate employees for Training Overlap for an establishment
        from Qiwa platform
      parameters:
      - name: X-IBM-Client-Id
        in: header
        required: true
        description: Client id issued by security server.
        type: string
      - name: X-IBM-Client-Secret
        in: header
        required: true
        description: Client secret issued by security server
        type: string
      - name: X-Request-Id
        in: header
        required: false
        description: X-Request-Id returned in the response header
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ValidateEmployeeTrainingRq'
